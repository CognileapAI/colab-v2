<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체 화면 디자인 검수</title><style>body{margin:0;padding:20px;background:#e5e7eb;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;margin-bottom:20px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}figure{margin:0;background:#fff;padding:8px}img{width:100%;height:1000px;object-fit:contain;object-position:top}figcaption{padding:8px}select{padding:8px}</style><nav><strong>전체 화면 디자인 검수</strong><select aria-label="장면"></select><span>375 / 768 / 1440 · 밝게 / 어둡게</span></nav><main></main><script>const scenes=["catalog", "lab", "empty", "projects", "project-table", "project-detail", "project-dialog", "project-close", "detail", "settings", "members", "lab-dialog", "search", "search-empty", "search-down", "search-degraded", "preview", "preview-done", "preview-expired", "access", "pending", "approval", "approval-dialog", "lineage-picker", "login", "not-found", "upload", "upload-classify", "upload-metadata", "upload-link"];const chosen=new URLSearchParams(location.search).get('scene')||scenes[0];const sel=document.querySelector('select');for(const scene of scenes){const o=new Option(scene,scene);sel.add(o)}sel.value=chosen;sel.onchange=()=>location.search='?scene='+sel.value;for(const theme of ['light','dark'])for(const width of [375,768,1440]){const f=document.createElement('figure');f.innerHTML=`<figcaption>${chosen} / ${theme} / ${width}</figcaption><a href="screens/${chosen}-${theme}-${width}.png"><img src="screens/${chosen}-${theme}-${width}.png"></a>`;document.querySelector('main').append(f)}</script></html>
