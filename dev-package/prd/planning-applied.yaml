# 기획 입력물 적용 상태 매니페스트 — `40 COLAB-기획` 생애주기의 레포측 정본
#
# 왜 레포에 두는가 —
#   `10_적용전/` 은 읽기 전용이고 파일명·내용을 고치지 않는다(`.claude/rules/colab-rules.md §7`).
#   그래서 「이 문서가 적용됐는가」를 기획 폴더 쪽에 표식으로 남길 자리가 없다. 그 표식을
#   여기에 둔다. **적용 상태의 원본은 이 파일이고, `30_적용완료/` 는 그 사본 보관소다.**
#
# 무엇이 이것을 강제하는가 —
#   게이트 `planning-freshness`(`dev-package/tools/check-package-freshness.py`)가
#   ㈎ status: merged 인 항목의 `copy` 가 `30_적용완료/` 에 **원본과 바이트 동일한 사본**으로
#      있는지 ㈏ `30_적용완료/` 아래 모든 파일이 이 매니페스트에 등재돼 있는지를 판정한다.
#   사본 만들기는 `dev-package/tools/planning-applied.py --sync --apply` 가 한다(기본 dry-run).
#
# 필드 —
#   id           식별자(사본 경로와 무관, 인용용)
#   source       `40 COLAB-기획` 기준 상대 경로. **이 파일은 읽기 전용이다 — 옮기지도 고치지도 않는다**
#   author       작성자(기획 충돌 판정 입력 — rules §7)
#   received     기획자에게 받은 날
#   rounds       이 문서를 소비한 라운드 전부
#   applied_round  사본이 들어가는 라운드 폴더 이름(merged 일 때 필수)
#   status       merged | in_progress | pending — merged 만 사본을 요구한다
#   applied_date 그 라운드가 `main` 에 병합된 날(merged 일 때 필수)
#   decisions    `PLAN-SoT §9` 결정 번호(사후 재번호되므로 인용은 참고값이다)
#   prd / intent / spec  요구사항·발의·명세 문서 경로(레포 기준 상대). 없으면 null
#   copy         `40 COLAB-기획` 기준 사본 경로. 생략 시 `30_적용완료/<applied_round>/<원파일명>` 으로 파생
#   copied_at    사본을 만든 날(`--apply` 가 기록)
#   note         한 줄 근거

