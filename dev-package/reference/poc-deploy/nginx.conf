server {
    listen 80;
    server_name _;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2048m;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 60s;
    }

    # Health check proxy
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # E018 — viz-service reverse proxy (Wave C 이후 활성)
    # viz-service 는 포트 8100 에서 `/viz` 경로 하위 응답.
    # 메인·부 파일 합산 1GB + 디코더 60s + buffer 120s
    location /viz/ {
        proxy_pass http://viz:8100/viz/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1g;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # #b112 (replaces #b047): MinIO reverse proxy for browser-facing
    # presigned URLs — bucket-name root path, NO `/minio/` prefix.
    #
    # WHY THE CHANGE FROM b047:
    # b047 used `MINIO_PUBLIC_ENDPOINT=https://www.colab-hydro.com/minio`
    # and `location /minio/` + `proxy_pass http://minio:9000/;` (the
    # trailing slash strips the `/minio/` prefix). The boto3 presign
    # client signs SigV4 with **canonical path = `/minio/<bucket>/<key>`**
    # because the endpoint base path is part of the canonical request.
    # Nginx strips the prefix on forward → MinIO receives `/<bucket>/
    # <key>` and re-derives canonical path = `/<bucket>/<key>` → mismatch
    # → `AccessDenied (HTTP 400)`. Confirmed via prod dogfood
    # 2026-04-26 (`scripts/diag-b112.sh`).
    #
    # FIX: drop the `/minio` base path entirely. Backend signs with
    # `MINIO_PUBLIC_ENDPOINT=https://www.colab-hydro.com` (root). Boto3
    # path-style presigned URL becomes `https://<host>/<bucket>/<key>`.
    # Nginx routes `/<bucket>/...` directly to MinIO **without rewriting
    # the URI** (note: `proxy_pass http://minio:9000;` has NO trailing
    # slash → nginx forwards the original URI unchanged). MinIO sees the
    # same path the browser sent → SigV4 path matches → 200 OK.
    #
    # Bucket name is part of the URL path, so the location must stay
    # in sync with `S3_BUCKET` in `.env.prod`. If we ever introduce a
    # second bucket we move to a subdomain (b112 follow-up `chore/
    # minio-subdomain` — option C in the b112 triage).
    #
    # `Host` header MUST be preserved so MinIO sees the same host the
    # signature was calculated for (SigV4 SignedHeaders=host).
    #
    # Dev/CI (docker-compose.yml only, no `minio` service) is unaffected:
    # the upstream name is resolved lazily via the Docker embedded DNS
    # (127.0.0.11) at request time — not at startup — so nginx starts fine
    # even when `minio` is not in DNS. Dev leaves `MINIO_PUBLIC_ENDPOINT`
    # unset so no URL is ever served via this path.
    location /colab-data/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_upstream minio;
        # NO trailing slash — preserve the request URI (including the
        # `/colab-data/` bucket prefix) so SigV4 canonical path matches
        # what the backend signed.
        proxy_pass http://$minio_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large object downloads — disable buffering so the browser
        # receives bytes as MinIO streams them.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 60s;
        client_max_body_size 0;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
