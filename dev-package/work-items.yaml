    completion_def: "2026-08-27 확장(`〈167〉-㉱`) — ⓐ `ts_config` 한국어 재작성 ＋ 전 행 재생성 ⓑ 온톨로지 어휘·관계 확장을 같은 회차에 ⓒ public 밖 객체 재측정 ⓓ 검색 평가셋 A층 실패 8건 재측정·보수 ／ ⟨개정 2026-08-28 · Ted 판정 `PLAN-SoT §9 〈182〉`⟩ **ⓐ = `deferred`(하지 않기로 한 것)** — 형태소 분석기가 이미지에 없고(실측) 형태소 교체로 확실히 닫히는 평가셋 실패가 0건이다. **ⓒ 는 ⓐ 에 딸린 것이라 함께 사라진다.** **ⓑ = 다음 회차**(의미 기반 AI 검색과 함께 · 이번 stage 2 범위 밖). ⚠ **ⓐ 의 `deferred` 와 ⏸(지금 열지 않는 것)를 뒤섞지 않는다.** ⓓ 의 거취는 이번 판정 범위 밖 — `[미확인]`"
    evidence: "근거 산출 `sessions/SEARCH-DIRECTION.md` · 판정 `PLAN-SoT §9 〈182〉`"
    deadline: null
    note: "⭑ **⟨단계 이동 2026-08-30 (4회차) · 근거 실측⟩ `stage2` → `after_stage2`(＝ stage 3). 종전 값 ~~stage2~~ 를 지우지 않고 여기 남긴다.** ⭑ **직전 회차가 「덜 빼는 쪽으로 남기고 보고한다」로 판정 대기에 뒀던 자리이고, 이번에 근거가 갈리지 않아 닫았다.** 근거 넷이 같은 방향을 가리킨다 — **ⓐ 카탈로그 화면은 글자 맞추기를 한 곳도 하지 않는다(실측)** = 조회 모델이 `types.ts:21` 축자 `CatalogQuery = { sort, filters }` 뿐이라 **낱말을 담는 필드가 없고**, 맞추기는 `localEngine.ts:32-39` `matches()` 의 **값 같음 비교**(`picked.some((p) => p === v)`)뿐이며, 서버로 가는 조건도 `catalogSource.ts:12-26` 축자 `queryParams` 가 정렬 둘 ＋ 다섯 열 조건만 실어 **낱말 인자가 0건**이다. **ⓑ 색인을 쓰는 자리는 검색 실행 쪽 하나뿐이다** — `services/core-api/src/colab_core/domains/d3_catalog.py:400` `search_datasets()` 가 `tsvector` 로 도는데, 이는 카탈로그 목록 경로(`/datasets`)와 **다른 함수**이고 카탈로그는 이 함수를 부르지 않는다. **ⓒ 이 항목을 선행으로 걸던 것은 정확히 둘(`P4` 검색 화면 · `K4` 자연어 검색 서비스)이고 3회차로 둘 다 stage 3 이다.** **ⓓ ⭑ 결정적 — 완료 정의 네 조항이 stage 2 에 남긴 것이 0건이다**: `〈182〉` 로 **ⓐ = `deferred`** · **ⓒ 는 ⓐ 에 딸려 함께 사라짐** · **ⓑ = 다음 회차(축자 「이번 stage 2 범위 밖」)** · **ⓓ(평가셋 A층 재측정)는 `〈208〉` 로 `P4` 에 갔다가 3회차에 `K4`(stage 3)로 넘어가 되돌아오지 않는다.** ⟹ **stage 2 에 두면 판정할 조항이 하나도 없어 영영 닫히지 않는다 — stage 2 를 닫지 못하게 만드는 항목이 된다.** ⚠ **반대 증거도 적는다 — 삭제하지 않는다** — `ts_config='simple'` 은 `[정본 무근거]` 로 남아 있고(`db/platform/schema.sql:246-247` · `versions/0005_s1_search_index.py:39-43`), 그 한계를 붙잡는 시험(`db/platform/tests/0005-assertions.sql:167`)은 계속 돈다. **이 이동은 그 한계를 지우지 않고 단만 옮긴다.** ⚠ `F-2.evidence` 는 문구 정합의 판정을 이 항목에 건다고 적지만, **그 문구(`SearchHero`)는 3회차로 stage 3 이고 `F-2.depends_on` 은 실측 `[]` 다** — 산문과 대장이 갈린 자리이고 값은 대장이 원본이다. ／ ⭑ **⟨미결 종결 2026-08-30 · Ted 판정(오늘)⟩ 「AI 는 전부 다음 단계」 판정이 이 항목을 건드리지 않는다 — `stage2` 확정.** 사유 = **형태소 검색 설정이지 자연어 생성이 아니다.** 낱말을 어떻게 쪼개 색인하느냐는 조건 검색·키워드 검색이 똑같이 쓰는 바닥이고, 260826 결정 `§2-5` 가 이번 릴리즈에 남긴 「**표·필터·정렬 기반 조건 검색**」이 그 바닥 위에 선다. ／ ⚠ **직전 회차의 「stage 2 유지 · 판정 대기」가 이 판정으로 닫혔다 — 값은 그대로이고 미결 표시만 걷힌다.** ／ ⚠ **남은 `[미확인]` 은 그대로다** — 완료 정의 ⓐⓒ 는 `〈182〉` 로 `deferred` 이고 ⓓ(평가셋 A층 재측정)의 귀속은 `〈208〉` 로 `P4` 에 갔다가 **오늘 그 자연어 몫이 `K4`(stage 3)로 넘어갔다** — 이 항목에 되돌아오지 않는다. ／ K4·P4 의 완료 판정이 T-1 에 걸린다 — 둘의 오라클이 「평가셋 대비」인데 잴 회차가 없었다. ⚠ `03-HANDOFF §1` 에는 행이 없고 본문 참조로만 나온다. ⭑ **2026-08-28 — 완료 정의 ⓐⓒ 가 「하지 않기로 한 것」이 되고 ⓑ 가 다음 회차로 갔다**(`〈182〉`). **항목 자체의 status 는 Ted 판정 범위 밖이라 `open` 을 유지한다** — 남은 것이 ⓓ 뿐인지, 그렇다면 K4·P4 오라클을 어디에 거는지는 `[미확인]`."
    sources: ["WORK-UNITS §10.2", "WORK-UNITS §10.3"]

