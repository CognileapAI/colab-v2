    evidence: "⭑ **⟨결함 해소 2026-09-02 · 워크트리 `lane-fmt` · 초안 `dev-package/notes/FMT-LEDGER-PENDING.md` ⟨초안 A⟩⟩ 닫힌 이 항목 위에 열려 있던 블로커 `#58`(선언 여섯 · 처리 넷)을 집행했다 — `〈271〉`-㉯ 대로 **줄이는 쪽이 아니라 채우는 쪽**.** 파서 `NumPy`·`GRIB` 신설(`d5/parse.py`) · 그릴 수 없는 포맷이 좌표 단계에서 실패하던 자리 수정(`d5/pipeline.py` — 「그릴 수 없는 것과 등록할 수 없는 것은 다르다」) · **거짓 문면 정정**(선언 안인데 파서가 없으면 「목록 밖」이 아니라 「구현 결함」이라 말한다). **항구 픽스 = 선언↔구현 대조를 기계가 본다** — `tests/test_format_declaration_parity.py` 네 자리(파서 표↔`SUPPORTED_FORMATS` · COG 표↔`RENDERABLE_FORMATS` · viz-render 목록↔`RENDERABLE_FORMATS` · 게이트 정본↔`RENDERABLE_FORMATS`), 양방향 대조. **완료 정의 ④(실데이터 E2E 4종)는 이 회차에 다시 재지 않았다** — 범위는 파서와 대조다. 시험 pipeline-worker **222 → 238**. 계약·마이그레이션·배포 **0건**. ／ 이전 2026-08-23 — 완료조건 ①~④ 전부 로컬 green. D5 모듈 6종 + 테스트 32건 green, red 선행 확인. 실물 62건 전수 재판정이 SEED-DATA 실측(6/16/40)과 일치. HSR 헤더 오프셋 실측. + 2026-08-25 staging 배포됨(`c5a2fbf`·`974cf9f`), 시험 118/0. ⭑ **⟨재실측 2026-08-30 · `sessions/D5-CLOSE-MEASURE-20260830.md`⟩ 완료 정의 ①~④ 전건 충족 — 닫는다.** **①** 감지·파싱 fail-closed — `test_detect.py` 확장자 스왑 정정·`.hdf`→HDF4·미상 바이트 fail-closed green ＋ 음성 둘(`test_axis_detect.py` 거부 파일은 행을 안 만든다 · `test_internal_grid_real.py` 투영 부재는 실패이지 지어낸 격자가 아니다). **소스 `linspace` 0건**(`services/pipeline-worker/src` 전수). **②** 이미-COG 3부류 — `test_tiff_classes_pipeline_real.py` **5건 전건 green**(코호트 6·16·40 분할 ＋ 음성 둘 ＋ 양성 하나). **③** `banned-import`·`import-boundary`·`boundary-selftest` green · `services/core-api` 의 `requirements.in`·`src` 전수에서 `rasterio`·`gdal`·`xarray`·`pyhdf` **0건**. **④** `test_e2e_real.py` 7건 green — `NetCDF`·`Binary`·`HDF4`·`GeoTIFF`(이미-COG ＋ 스트립→COG) **4종 각 1건 이상 완주**. **전 시험 = 196 passed / 0 failed**(원천 마운트 ＋ DB 선언 상태). ⚠ 원천·DB 미선언이면 같은 명령이 26 failed · 15 errors 다 — **green-by-skip 하지 않는다.** 게이트 `bash gates/run.sh all` = **green 29 / red(판정) 0 / red(준비) 4**(넷 다 입력 미선언·원천 미마운트)."
    deadline: null
    note: "🟧 사유 = 저장 배치 회귀 시험 0건(`§4` #26) · `/healthz` 가 실이미지인데 `implemented:false`(`§4` #23) — ⚠ 둘 다 `§4` 에서는 ✅ 해소로 표기돼 진행도 근거가 낡았다. stage 는 실제로 stage 1 과 stage 2 에 걸쳐 있으나(파싱·좌표계·COG 가 stage 2) 스키마 값이 하나뿐이라 `stage1` 로 적고 여기 남긴다. ⚠ `WORK-UNITS §11` 에 독립 행이 없고 「경계」줄 괄호 주석으로만 존재한다. ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈189〉`⟩ 그 stage 2 파트가 독립 항목 `PV-1`(미리보기 뒷단)로 섰다** — `WORK-UNITS §10.2` 표 행 ＋ `§11` 체크리스트 줄. **원문은 지우지 않는다** — 이 항목(`D5`)의 완료 정의는 여전히 stage 1 판이고 상태도 그대로 `partial` 이다. ⚠ **이 단계를 「가공」이라 부르지 않는다 — 「미리보기」다**(`〈189〉`-㉰). ⭑ **⟨개정 2026-08-30 · 재실측⟩ 상태값을 `partial` → `done` 으로 갈았다.** **위 🟧 사유 둘은 실물에서 이미 해소돼 있었다** — `#23` 은 **실이미지가 `implemented: true` 를 낸다**(운영 중 staging 컨테이너 직접 조회 · 이미지 `pipeline-worker:cfc98e302ae4` · 회귀 시험 `test_health_endpoint.py` 2건 green), `#26` 은 **배치 시험 24건 실재**(core-api 11 · viz-render 7 · pipeline-worker 6)이고 세 배포 단위 `kernel/storage_layout.py` **md5 동일**(`5996f605…`)이다. **낡은 쪽은 이 note 와 `03-HANDOFF §1 T-D` 행이었다** — 같은 문서 `§4` 는 둘 다 ✅ 해소로 적고 있었고 `P2` 에서 한 번 일어난 것과 같은 무늬다(`WORK-UNITS.md:583`). **원문은 지우지 않았다.** ⚠ **stage 2 파트(파싱 ⑶ · 좌표계 ⑷ · COG ⑸)는 이 항목의 완료 정의가 아니다** — `PV-1` 소유이고, 닫는 근거로도 막는 근거로도 쓰지 않았다."
