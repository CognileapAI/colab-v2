    evidence: "⭑ **⟨2026-09-02 · 워크트리 `lane-a1b` · 갈래 B 단계 4~10 · 등재 `PLAN-SoT §9 〈272〉`⟩ 완료 정의 여덟 중 **일곱이 섰다. ⑻ 만 남고 항목은 열려 있다.** **㉮ ⑴⑵⑸ = 게이트 `artifact-ownership` 신설** — 사이드카 `sources`(fileId) → `d3_file.dataset_id` 대조로 **네 등급**(살아 있다/접수분에만 닿는다/고아/판정 불가)을 내고 **회수 전 전수 스냅숏**(키·확장자·크기·`source`·등급)을 남긴다. 이음 = `d5_upload_file.id = d3_file.id`(`NB-A`) · 선례 `autometa-loss.sh:14`. **Port 0 · 계약 0 · 마이그레이션 0 · 동결 해제 0 · 배포 0.** 판정 규칙의 정본은 `d7_visualization/ownership.py` **한 자리**이고 게이트는 그 파일을 **경로로 그대로 실어** 쓴다(그래서 그 모듈은 표준 라이브러리만 쓴다) — 규칙을 두 곳에 적으면 게이트와 런타임이 다른 답을 낸다. **㉯ ⑶⑷ = `invalidation.reclaim_plan()`** — 계획을 새로 계산하지 않고 **같은 계산기 `plan()`** 에 「고아가 아닌 키」를 `keep_keys` 로 넘긴다 ⟹ `tile-` 은 `kept` · 미리보기 루트 밖(접수분 루트)은 `OutOfScope` · 집행은 **`apply()` 한 자리**. **게이트는 아무것도 지우지 않는다.** **㉰ ⑺(개정판) = `tests/test_cross_target_reuse.py`** — ⛔ **전제 정정**: 「대상 간 재사용」은 두 갈래다. **지도 타일 키(D5)는 대상과 무관**하고(`MAP_TILE_KEY_FIELDS` 에 `targetId` 없음) **그것이 `PV-1` ⑵ 가 실측한 갈래**다. **렌더 키(D7)는 색범위 단계 토큰을 통해 이미 대상 범위에 딸려 있다**(`cache.py:50` · `scale.py:72`) — 안 ⑷ 이 만든 손실이 아니라 `〈74〉`-㉴ 가 요구한 무효화 장치다(승격이 키로 무효화되려면 범위의 출처가 키에 있어야 한다). 회귀는 셋을 잠근다 — 자리가 평평하다 · 지도 타일 키가 대상과 무관하다 · 같은 대상·같은 범위면 다시 굽지 않는다. **㉱ ⚠ 덫 둘을 코드 경로로 막았다.** ⑴ `baked_for` 는 **판정 입력이 아니다** — `grade()` 본문에 그 이름이 없고, 시험이 변이로(아무 값으로 바꿔도 등급 불변) · selftest ⓟ 가 「낡은 uploadId ＋ 등록된 fileId」를 **살아 있다**로 판정해 증명한다. ⑵ 구판(`sidecarVersion`·`baked_for` 부재)은 **「고아」가 아니라 「판정 보류」** — selftest **변이②**가 그 판정을 떼면 구판이 **고아로 떠 회수 후보가 되는 것**을 재현한다(오삭제의 음성 증명). **㉲ 실측(staging 실물 · 읽기 전용)** — 대상 **49 벌** · 살아 있다 0 · 접수분 0 · 고아 **0** · **판정 불가 49** · 지도 타일 1 · 스냅숏 **80 줄** · **삭제 0건**. 자리의 사이드카가 전건 구판이라 전부 보류다(판 2 병합 뒤 재굽기 0회). **㉳ 음성 시험(⑷)** — selftest ⓠ(`tile-` 만 있는 자리 → 대상 0건 red · 타일 무접촉) · ⓡ(회차 뒤 접수분 루트와 자리의 바이트가 그대로) · pytest 3건(접수분 루트 `OutOfScope` · 루트 밖 집행 거절 · `tile-` `kept`). **㉴ 실측** — 게이트 `all` **green 37 / red 0**(35 → 37) · viz-render **232**(209 ＋ 23) · pipeline-worker 222 · core-api 516 · ai-service 145 · staging DB 쓰기 0건 · 배포 **0건**. **㉵ ⛔ ⑻ 만 남는다** — 전 게이트 green 은 섰고 **staging 배포 green 은 이 회차에 못 잰다**: `main` 이 staging 보다 앞서 있고(릴리스 `14d3136aa55a` 는 `A-1` 1→3 병합 이전) **배포는 Ted 승인 자리**다. 부분 완료로 닫지 않는다(`CLAUDE.md §5`).** ／ 종전 등재문 ↓ ⭑ **⟨2026-09-02 · Ted 판정 「안 ⑷ 사이드카 판정」 · `PLAN-SoT §9 〈270〉` · 워크트리 `lane-a1` · 최소 묶음 1→3⟩ 완료 정의 여덟 중 ⑹ 이 섰다. 항목은 열려 있다.** **㉮ 안(案)이 ⑴ 경로 종속 전환에서 ⑷ 사이드카 판정으로 번복됐다 — 매몰비용 0.** ⑴ 이 혼자 가져오던 편익(근거 5)은 **완료 정의 ⑹ 이 이미 낸다**(⑹ 은 전 안 공통 요구항). 편익이 겹치면 ⑴ 에는 **고유 비용 `#56` 만 남는다** ⟹ 고를 이유가 없다. 번복 시점에 ⑴ 로 쓴 생산 코드·계약·마이그레이션 **0건**(`〈263〉` 회차가 등재까지만 하고 멈췄다). **㉯ 집행 = 세 단계** ⑴ 사이드카 `source` 를 **`fileId` 로 규약화**(종전 문면은 「파일명」이었고 실배포에서만 우연히 같았다 · 시험 픽스처는 사람 이름을 넣고 있었다) ⑵ 사이드카를 **세 층 전부**로 확장(썸네일 `.webp` · 비지도형 `.png` · 지도형) ⑶ **`baked_for`(구운 시점의 소유 대상 · `target_id`·`is_upload`)** 기록 ＋ `sidecarVersion: 2`. 실물 = `preview.py`(`BakeOwner`·`sidecar_document`·`_sidecar_for`·`build_value_layers` 4-튜플) · `jobs.py`(`PreviewArtifacts` 에 `thumbnail_sidecar`·`detail_sidecar`). **㉰ Port 신설 0 · 계약 개정 0 · 마이그레이션 0 · 동결 해제 0차** — 실은 값이 **`job.spec.target` 에 이미 있었고**, `contracts/storage/layout.json` 은 `.json` 을 지도형 전용으로 좁히는 문면이 **없다**(`why.미리보기 산출물 ④` 축자 · `contentKeys.렌더 산출물.extensions` 에 `.json` 이미 있음). **㉱ 하위 호환 = 관용(tolerate)** — 구판 사이드카를 **옮겨 적지도 거부하지도 않는다**(산출물은 원장에 행이 없는 부산물 · 읽는 생산 코드는 `frontend/.../datasetPreviewSource.ts` 한 곳이고 `width`/`height` 만 본다 · 캐시 키 무변이라 다음 재굽기에 덮인다). **기계가 갈라 보는 수단 = `sidecarVersion`** — 없거나 `baked_for` 가 없으면 **「고아」가 아니라 「구판(판정 보류)」** 등급이다. **없는 필드를 근거로 지우면 그것이 오삭제다.** **㉲ ⑴⑵ 는 *전제* 만 섰다** — 디스크만 보고 「어느 대상 것으로 구웠는가」를 읽을 수 있게 됐을 뿐, **판정 자체(`fileId` → `d3_file.dataset_id` 대조)는 없다.** ⑶⑷⑸⑺⑻ **무접촉.** **㉳ 회귀** = `services/viz-render/tests/test_sidecar_ownership.py` ＋ `test_preview_layers.py`·`test_e2e_real.py` 갱신. 병합 후 `main` 실측 viz-render **209 passed**(`lane-59` 5 ＋ 이 레인 5) · 게이트 `all` **green 35 / red 0** · 배포 **0건**.⭑ **⟨2026-09-02 닫힘 · `PLAN-SoT §9 〈273〉`⟩ 완료 정의 여덟 전건 충족 — 남아 있던 ⑻ 이 섰다.** ⑻ 은 두 조각이고 둘 다 실측이다 — **전 게이트 green** = `./gates/run.sh all` **green 37 / red(판정) 0 / red(준비) 0**(배포 전·배포 후 두 번 다) · **staging 배포 green** = 릴리스 `e935db203b07`(＝ 커밋 SHA · 워킹트리 변경 0건) · `verify-deploy.sh` **GREEN 통과 15건 · SKIP 0**. ⚠ **⑴~⑺ 은 이 회차에 다시 재지 않았다 — `〈272〉` 의 실측을 그대로 승계한다**(그 회차 뒤 `A-1` 관련 코드·게이트 변경 0건). ⭑ **배포 후 네 등급 계수는 배포 전과 같다** — 대상 한 벌 **49** · 살아 있다 **0** · 접수분에만 닿는다 **0** · 고아 **0** · 판정 불가 **49** · 지도 타일 1 벌(kept · 대상 아님) · 스냅숏 80 줄 · **삭제 0건**. **배포가 이 값을 바꾸지 않은 이유는 실측으로 설명된다** — 판정 불가의 원인은 사이드카 구판이고(완료 정의 ⑹), 구판을 판 2 로 바꾸는 것은 **재굽기**인데 이 배포는 재굽기를 하지 않는다(이미지 교체 · 산출물 무접촉). ⟹ **재굽기 0회면 계수도 그대로다.** ⛔ **그러므로 「판정 불가 49」는 이 항목의 미충족이 아니다** — 완료 정의 ⑸ 축자 「회수 대상은 고아 등급뿐」이고 고아는 0 이다. 구판 49 벌의 처분은 `〈263〉`-Ted 판정 ② 대로 **새 구조가 선 뒤**의 자리다."
