    note: "⭑ **2026-09-01 신설 · 등재 `PLAN-SoT §9 〈263〉`** — 범위 판정은 `〈260〉`(stage 2 안), 안(案) 판정은 Ted 2026-09-01 ③(**안 ⑴ 데이터셋 종속 전환**), 실측 근거는 `sessions/ARTIFACT-OWNER-DESIGN-20260831.md`(§2.1-R·§8-R 이 정정본). ／ ⚠ **후행 셋을 막는다** — `V-1`·`V-2`·`J-1` 이 전부 자리의 산출물을 읽거나 지운다. 대장에는 `blocks` 필드가 없으므로 **그 셋의 `depends_on` 에 `A-1` 을 넣는 것**으로 표현했다(초안의 `blocks: [V-1, V-2, J-1]` 은 실물 스키마에 없는 필드라 등재하지 않았다). ／ ⚠ **초안의 `title:` 도 실물 스키마에 없어 `name:` 으로 옮겼다.** ／ ⚠ **id 접두사 충돌 = 0건**(대장 전수 실측 2026-09-01 — `A-` 접두사 항목 없음 · `work-item-consistency` ㈎ green). ／ ⛔ **1회차(2026-09-01 · 워크트리 `lane-a1`)는 등재까지만 했다** — 계약·생성물·생산 코드 **무접촉**, 산출물 삭제 **0건**, staging DB 쓰기 **0건**. 멈춘 이유는 진입조건 둘째 줄(등록 전환 시 산출물 자리 이동의 소유)이고 그것은 `CLAUDE.md §4`「경계를 넘어야 할 때」의 **멈추고 보고한다** 자리다. ／ ⭑ **⟨2026-09-02 · `〈270〉`⟩ 그 멈춤이 풀렸다 — 다만 「판정이 나와서」가 아니라 「물을 것이 없어져서」다**(안 ⑷ 아래 `#56` **소멸**). ／ ⛔ **남은 몫은 갈래 B(게이트 대조) 레인이다** — `fileId` → `d3_file.dataset_id` 대조(선례 `gates/tools/autometa-loss.sh` 의 같은 조인 · `gates/tools/preview-tile-slot.sh` 가 산출물 자리와 platform DB 를 한 게이트에서 본다) · **네 등급 계수 ＋ 회수 전 전수 스냅숏**(⑸) · 회수 집행(⑶ · `invalidation.apply()` 한 자리) · 음성 시험(⑷) · 회귀(⑺ 개정판) · 배포(⑻). **Port 0 · 계약 0 · 배포 0** 으로 선다. ／ ⚠⚠ **갈래 B 가 반드시 읽을 것 — `baked_for` 는 등록 전환(`createDataset`) 뒤 낡는다.** 필드 이름이 그것을 말한다(「구울 때의 대상」이지 「지금 소유」가 아니다). **게이트가 이 값을 「현재 소유」로 읽으면 등록 전환된 대상이 전부 「불일치」로 뜬다.** 최신 소유는 **원장 대조가 답한다.** ／ ⚠ `sources`(전 조각 `fileId` 배열)를 최소 묶음 문면 밖으로 함께 실었다 — 한 렌더가 조각 여럿을 병합할 수 있어(`_build_artifacts` `merged`) `source` 하나로는 나머지 조각의 소유를 못 묻는다. **대조를 나중에 다시 굽지 않으려고 지금 실었다**; 불필요 판정이면 필드 하나를 지우면 된다(계약 표면이 아니다). ／ ⚠ **계약 문면 명료화 제안 1건은 집행하지 않았다** — `layout.json` `why ④` 의 괄호가 층 이름과 파일 종류를 섞어 적어 「사이드카는 지도형만」으로 오독될 여지가 남는다. **문면 개정이라 동결 해제 ＋ Ted 판정 자리다.** ⭑ **⟨2026-09-02⟩ 닫혔다** — 등재 `PLAN-SoT §9 〈273〉`."
