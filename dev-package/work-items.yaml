    note: "⭑ **⟨선행 절단 2026-08-31 · Ted 판정 `PLAN-SoT §9 〈244〉`⟩ `depends_on` 을 `[P1, P6]` → `[P1]` 로 줄였다. 종전 값 ~~[P1, P6]~~ 과 위 `P6` 사유 문단을 지우지 않고 남긴다.** 근거 셋 — ⓐ **정본 다섯 조항 어디에도 승인 처리가 선행으로 걸리지 않는다**(`:111`·`:115`·`:117`·`:152`·`:170` 은 전부 표의 표시·조건·정렬 규칙이고, 승인 처리를 가리키는 `:130` 의 괄호가 정하는 것은 **접근 요청의 범위**이지 카탈로그 행의 표시 규칙이 아니다). ⓑ **`note` 가 든 전제(「참이 되는 행이 0건」)가 실물과 다르다** — 판정 대상은 표가 그런 행을 만났을 때 무엇을 그리는가이고, 그 대조는 픽스처 1건으로 끝나며 **그 픽스처는 이미 있다**(`fixture.ts:104`). ⓒ **`completion_def` 자신이 「화면 실물과 1:1 대조」라 적는다** — 실물 대조에 승인 처리 런타임이 들어가지 않는다. ⚠ **진입조건은 처음부터 `P1` 하나였다 — 이 절단으로 대장 안의 모순 1건이 사라진다.** ／ ⭑ **그러면서도 `status` 는 `open` 그대로다.** 다섯 조항은 충족이지만 **「권한 있는 행의 다운로드가 실제로 열리는가」 한 칸이 저장소 구현(`downloadDataset` 501) 뒤로 넘어갔다.** 남은 조건을 `evidence` 에 이름으로 적고 **열어 둔다 — 부분 충족으로 닫지 않는다**(`CLAUDE.md §5`). ／ ⭑ **⟨신설 2026-08-30 · Ted 판정(오늘)⟩ 「카탈로그 화면의 세목을 지는 항목을 만든다」.** 직전 회차(`sessions/STAGE3-AI-SPLIT.md §8-5`)가 **항목 신설을 제품 판정이라 보고 멈춘 자리**를 Ted 가 오늘 닫았다. **완료 정의는 정본에 이미 있는 조항을 옮긴 것이고 새 요건은 0건이다.** ／ ⭑ **왜 필요했나** = 오늘 판정으로 **카탈로그 화면이 이번 릴리즈의 데이터 찾는 길**이 됐는데, 그 화면의 유일한 항목(`P1`)은 **stage 1 에서 이미 닫혀 있고**(✅ 2026-08-23) 그 완료 정의는 **모든 P 에 공통인 절차 4항**뿐이라 **열 구성·조건 다섯 열·기본 정렬·잠긴 행·0건 문구를 한 조항도 이름으로 걸지 않는다.** 즉 **위상을 지는 열린 항목이 대장에 0건**이었다. ／ ⚠ **`F-2`(카탈로그 키워드 입력 제거)와 겹치지 않는다** — `F-2` 의 범위는 키워드 입력 제거 ＋ 문구 정합이고, 이 항목의 범위는 위 다섯 세목이다. **같은 화면이지만 조항이 갈린다.** ／ ⭑ **`depends_on` 을 정직하게 적는다 — `P1` ＋ `P6`.** `P1` = 판정 대상 화면이 존재해야 한다(✅ done). **`P6`(승인 처리) = 조항 ⑵ 와 ⑷ 의 판정에 필요하다** — `P1.note` 실측 축자 「`accessRequestPending`·`canApproveVerification` 이 항상 `false`」라 **잠긴 행도 `Verified` 값도 지금은 화면에서 참이 되는 행이 0건**이고, 그 상태로는 두 조항을 판정할 수 없다. ⚠ **`P6` 를 걸어도 임계 경로는 늘지 않는다** — `P6` 는 최장 사슬의 3홉째이고 이 항목은 그 뒤 4홉째라 기존 5홉보다 짧다(`sessions/STAGE3-AI-SPLIT.md §9-4`). ／ ⭑ **`Verified` 다섯 열 유지 = Ted 판정(2026-08-30)으로 닫혔다.** 근거 셋 = ⓐ `_재검토_E02-E03_260826.md`(2026-08-26)가 **가장 나중**이고 `〈129〉` 지정 정본 13건에 든다 ⓑ 그 문서 `:49` 축자 「**다섯 열 유지가 정답**」 ⓒ 지어진 실물이 이미 다섯이다(`columns.ts:17`). **앞선 두 읽기는 지우지 않고 「뒤집혔으나 보존」으로 남긴다** — ~~`Policy_데이터_찾기.md`(2026-08-18) `Verified` 8곳~~ 은 **다섯 열 유지와 같은 방향이라 뒤집힌 것이 아니라 재확인됐다** ／ ~~`Co-Lab_ver2_업로드_계보_260825_이태헌.html`(2026-08-25) `Verified` 0건·`카탈로그` 0건~~ 은 **배제 근거로 읽지 않는다** — 그 문서는 업로드·계보 단일 주제라 카탈로그를 겨냥한 침묵인지 문서 자체로 판별되지 않는다(`sessions/STAGE3-AI-SPLIT.md §8-7` 실측). **두 읽기 모두 원문 무삭제 · 날짜와 함께 보존.** ⭑ **⟨2026-09-02 · `PLAN-SoT §9 〈275〉`-㉯⟩ `open` 을 유지하고, 남은 한 칸의 **판정 대기**를 여기 적는다.** **남은 한 칸** = 「권한 있는 행의 빠른 작업 `다운로드` 를 눌렀을 때 실제로 파일이 열리는가」 — `downloadDataset` 이 아직 **501 `NOT_IMPLEMENTED_NO_STORE`** 다(`services/core-api/src/colab_core/app/routes/not_implemented.py` · 실측 2026-09-02). ⛔ **판정 대기(Ted) = `downloadDataset` ＋ 파일 저장처의 소유를 어느 WU 가 지는가.** **지금 상태 = 소유 WU 가 0건이다** — 대장 96 항목 중 「저장처를 세운다」를 이름·완료 정의로 가진 항목이 없다(실측). ⚠ **`CT-1` 이 그것을 흡수하면 요건 신설이다** — 이 항목의 `completion_def` 축자 「정본이 이미 카탈로그에 배정한 조항을 옮긴 것이고 **새 요건은 0건**」이라, 저장소 구현을 넣는 순간 그 문장이 거짓이 된다(`CLAUDE.md §5` 범위 늘리기 금지). ⟹ **지어내지 않고 판정을 기다린다.** 선택지는 둘로 보인다 — ⓐ 새 WU 를 세운다 ⓑ 기존 항목(`P` 계열 또는 D3 소유 항목) 하나에 붙인다. **어느 쪽도 이 회차가 고르지 않았다 `[미확인]`.** ／ ⭑ **⟨선행 추가 2026-09-02 · Ted 판정 · `PLAN-SoT §9 〈278〉`-㉰⟩ `depends_on` 을 `[P1]` → `[P1, ST-1]` 로 늘렸다. 종전 값 ~~[P1]~~ 을 지우지 않는다.** 남은 한 칸(**권한 있는 행의 다운로드가 실제로 열리는가**)이 `downloadDataset` **501 `NOT_IMPLEMENTED_NO_STORE`** ＋ **파일 저장처 부재**에 걸려 있다(실측 2026-09-02). ⛔ **`CT-1` 이 저장처를 흡수하지 않는다** — 그러면 이 항목 `completion_def` 축자 「새 요건은 **0건**」이 거짓이 된다(`CLAUDE.md §5`). ⟹ **별도 항목 `ST-1` 을 신설했다.** `status` 는 `open` 그대로다. ⭑ **⟨재확인 2026-09-02 · `PLAN-SoT §9 〈279〉`-㉳⟩ `status: open` 유지 — 부분 충족으로 닫지 않는다.** 남은 한 칸(「권한 있는 행의 다운로드가 실제로 열리는가」)은 **양성·음성 둘 다 닫혔다**(`〈279〉`). **닫지 않는 사유는 다른 자리다** — 완료 정의 안의 `[미확인]` ㈎(**승인 처리 도착 전 `Verified` 열 문구**)가 **제품 판정 대기**이고 그 판정은 Ted 몫이다. ⭑ **⟨닫힘 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉮ · 워크트리 `lane-loop-b` · advisor 권고대로 집행 · Ted 사전 위임 2026-09-03⟩ `status: open` → `done`.** 위 사유(`[미확인]` ㈎)는 `〈282〉` 로 닫혔고, 마지막으로 남아 있던 **조항 ⑴ 의 헤더 고정 시험 부재**가 이번에 **계산값 실측**으로 닫혔다. **막던 것은 jsdom 이 아니라 vitest 의 css stub 이었다** — `DatasetsPage.tsx:12` 가 `catalog.css` 를 import 하는데 기본값이 그것을 빈 것으로 만든다. `vite.config.ts` `test.css.include` 에 **그 파일 하나만** 넣어 풀었다(전역 확장 아님 · TDD 2 red 선확인). **부분 충족으로 닫은 것이 아니다 — 조항 ⑴~⑸ 전건 ＋ `[미확인]` 전건이 값으로 찼다.** ⚠ **완료 판정 절차 4항은 이 항목이 다시 세우지 않는다**(`completion_def` 축자 — `P1` 이 이미 통과했다) ⟹ **staging 배포는 이 항목의 칸이 아니다.**"
    sources: ["sessions/STAGE3-AI-SPLIT.md §8-5", "sessions/STAGE3-AI-SPLIT.md §9", "Policy_데이터_찾기.md", "_재검토_E02-E03_260826.md"]

