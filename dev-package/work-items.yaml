-v2` · 코드 무접촉⟩ 착수했으나 계약 동결 해제 없이는 진행할 수 없다 — 멈추고 보고했다.** ⑴ **막는 것 ① = op 신설.** 값 조회가 화면까지 닿을 계약 경로가 `contracts/seams/fe-core.yaml`·`core-viz.yaml` 양쪽에 **0건**(전수 확인 — fe-core 는 `createPreviewRender`·`getPreviewRender`·`createPreviewScreenshot` 까지, core-viz 는 `createRender`·`getRender`·`getRenderTile`·`listPalettes`·`createScreenshot`). 완료 정의 권한 ⓑ 가 「값 조회는 언제나 `datasetId` 로 들어와 경계 판정을 지난 뒤 산출물에 닿는다」를 못 박으므로 **중계 op 1 ＋ 조회 op 1 신설이 최소값**이다. `sessions/X2-FREEZE-PROTOCOL.md §5-㉯` 축자 「**op 신설** — 501 표·op 총계가 움직인다」 ⟹ **등급 ㉯ · Ted 승인 필수**(선례 11차 `PLAN-SoT §9 〈231〉`). ⑵ **막는 것 ② = 자리의 COG 를 `datasetId` 로 찾을 길이 D7 에 없다.** 자리 키는 내용 주소이고 **대상↔키 표가 없다**(`contracts/storage/layout.json` 축자 · `gates/tools/preview-tile-slot.sh` 도 표가 아니라 자리를 본다). 키 재료 여섯 중 셋(`conversionKind`·`overviewResampling`·`compression`)이 **D5 의 변환 설정**(`services/pipeline-worker/src/colab_pipeline/d5/cog.py` `OVERVIEW_RESAMPLING` · `d5/pipeline.py` `COG_COMPRESSION`)이라 D7 이 그것을 다시 적으면 규칙이 세 곳이 된다(`CLAUDE.md §3` 불변규칙 1 · 경계에서 멈춘다). 푸는 길 셋 = ⓐ 저장 규약(`contracts/storage/layout.json`)에 변환 설정을 올려 세 단위가 같은 생성물에서 읽는다(**13차 해제 대상** — `〈264〉` 가 이번에 열지 않기로 한 그 자리) · ⓑ D5 가 자리에 사이드카를 남겨 대상↔키를 잇는다(D5 코드 개정 ＋ 재굽기) · ⓒ Port 신설. **셋 다 설계 판단이라 `§5-㉯` 에 걸린다.** ⑶ **집행 없는 신설 금지(`§5-㉰-4`)** — 계약만 열고 구현을 다음 회차로 미룰 수 없으므로 ⑴·⑵ 는 **한 회차에 함께** 열려야 한다. ⑷ **본 회차 실적 = 코드·계약·생성물·DB·staging 무접촉 · 시험 0건 추가 · 게이트 0회 실행 · 배포 0건.** `status: open` 유지 · 완료 정의 여덟 중 충족 **0건**. ⑸ **선행 재확인** — `P3`·`A-1` 둘 다 `done`(대장 실측) · `〈254〉` 이후 `V-2` 를 이연·재범위한 결정 **0건**(§9 전수) · `〈275〉`-㉰ 로 `#54` 대상에서 빠졌다. ⭑ **⟨이월 2026-09-02 · Ted 판정 · `PLAN-SoT §9 〈278〉`-㉱⟩ 이번 회차에 열지 않는다 — 다음 회차 이월. `completion_def` 는 `〈254〉` 확정본 그대로이고 수정 0건이다.** 사유 = **미판정 둘.** ⑴ **값 조회 op 신설** — 계약에 값 조회 op 가 0건이고 신설은 **계약 동결 해제 등급 ㉯**(`X2-FREEZE-PROTOCOL §5-㉯` 「op 신설」)라 Ted 승인이 선행이다. ⑵ **자리의 COG 를 어느 경로로 읽는가 — 후보 셋 중 택일이 미판정이다**: ⓐ **사이드카** ⓑ **저장 규약 승격**(`contracts/storage/layout.json` 에 조회용 키를 정식 종류로) ⓒ **Port 신설**. ⟹ `status: open` · `stage: stage2` 유지. ⭑ **⟨착수 시도 2026-09-03 · 워크트리 `lane-v2b` · 계약·코드 무접촉⟩ 15차 해제 지시를 받았으나 **전달받은 값 경로가 실물에 없어** 멈추고 보고했다 — 근거 산출 `sessions/V-2-STOP-20260903.md`.** ⑴ 지시 = 「`A-1` 의 사이드카(`sidecarVersion:2`·`source=fileId`)를 훑어 자리의 COG 를 찾는다」. ⑵ **실측으로 성립하지 않는다** — 그 사이드카를 쓰는 자리는 **viz-render 의 렌더 산출물뿐**이고(`preview.py:270`·`:315`·`:318`·`:333`), **COG 는 D5 가 `tile-` 키로 굽되 사이드카를 0건 쓴다**(`d5/pipeline.py:232-236` · `grep -i sidecar services/pipeline-worker/src` 0건). 두 키는 서로 다른 규칙이라(`d5/pipeline.py:104-107` 축자 「렌더 키 규칙을 부르지 않는다」) **렌더 사이드카가 가리키는 한 벌에 `.tif` 가 없다.** `layout.json` `contentKeys.지도 타일.extensions` 도 `.tif` 하나다. ⟹ 그대로 구현하면 **모든 조회가 「없다」로 떨어지는 죽은 경로**이고 그것이 `X2-FREEZE-PROTOCOL §5-㉰-4`(집행 없는 신설)다 — **계약을 열지 않았다.** ⑶ **오전달로 보인다** — 대장 「푸는 길 셋」·`〈278〉`-㉱ 와 대조하면 Ted 가 채택한 「사이드카」는 **D5 가 타일 옆에 새로 남기는 것**(대장 ⓑ)으로 읽어야 기각 둘(저장 규약 승격·Port)과 앞뒤가 맞는다. 다만 그 독법은 「저장 규약 변경 없음」과 충돌한다(타일 벌에 `.json` 을 더하면 `layout.json` 개정 ＋ 생성물 3개 재생성 ＋ **재굽기**). ⑷ **네 번째 길 = 키 재계산** — `map_tile_content_key` 는 **viz-render 에 이미 생성돼 있다**(`colab_viz/kernel/storage_layout.py:146` · `invalidation.py:148` 이 이미 호출). ⛔ 관문 = 재료 여섯 중 셋(`OVERVIEW_RESAMPLING`·`COG_COMPRESSION`·`conversionKind`)이 **D5 안에만 있어** 저장 규약 승격이 선행이고, **그 승격이 이번에 기각된 것과 같은 물건인지 문면으로 갈리지 않는다.** ⑸ **Ted 판정 대기 1건** = `sessions/V-2-STOP-20260903.md §5`. ⑹ **본 회차 실적 = 계약·코드·생성물·DB·staging 무접촉 · 시험 0건 추가 · 배포 0건 · op 총계 54 그대로.** `status: open` · `stage: stage2` 유지 · 완료 정의 여덟 중 충족 **0건**. ⚠ **`X2-FREEZE-PROTOCOL §1` 에 14→15 행을 세우지 않았다** — 열지 않은 회차에 행을 세우면 이력이 거짓이 된다. ⭑ **⟨착수 2026-09-03 · 워크트리 `lane-v2c` · 15차 동결 해제 · 등재 `PLAN-SoT §9 〈294〉`⟩ `open` → `in_progress`. Ted 판정 = 후보 넷 중 **읽는 쪽 키 재계산**(route ⓑ) — 기각은 D5 사이드카(재굽기)와 Port 신설이다.** ⑴ **저장 규약 승격 3값**(`layout.json` `contentKeys.지도 타일.conversionSettings`) — 승격 전후로 **키가 비트 동일**임을 `test_map_tile_key.py` 가 고정값으로 못 박았다. ⑵ **op 2 신설** — `fe-core` **54 → 55**(`lookupDatasetValue`) · `core-viz` **5 → 6**(`lookupValue`). **seam 마다 따로 센다** — 합쳐 「54 → 56」으로 읽지 않는다. `contract-breaking` ERR 0 · WARN 0(순수 가산) · 생성물 4벌 재생성 · **마이그레이션 0**. ⑶ **구현은 같은 회차에** — core-api 중계(내려받기와 **같은 두 줄**의 접근 판정) · viz-render 조회(창 1×1 · Port 0 · 재굽기 0) · 화면 소비자(데이터셋 상세 미리보기 구역) · 시험 20건 신설. ⑷ **완료 정의 여덟 중 충족 6** — ⑴⑵⑶⑷⑸⑹⑺ 중 ⑺ 는 「S-08 에 자리 부재」로 성립하고, **미충족은 ⑻(응답 p95 1초·상한 5초 실측)과 staging 배포 green** 이다. ⑸ **다음 회차 진입조건** = 응답 눈금 실측 자리(게이트든 시험이든)를 세우고 staging 에 배포한다. ⚠ **`〈290〉` 은 결번이다** — 앞 회차가 계약을 열지 않아 회차가 성립하지 않았고 번호를 되쓰지 않는다. ⭑ **⟨마감 실측 2026-09-03 · 워크트리 `lane-v2close` · 등재 `PLAN-SoT §9 〈304〉`⟩ `〈294〉` 가 남긴 둘을 쟀다 — **staging 배포 green 은 충족**(`merge-base` 종료 코드 0), **⑻ 은 값을 얻었으나 닫지 않았다.** 따뜻한 상태 합산 p95 **261 ms** · max **280 ms** 로 눈금 안이지만, **유휴 후 첫 실행에서 데이터셋 둘의 p95 가 1 초를 넘었다**(1,164 · 2,111 ms · 상한 5 초는 미초과). 완료 정의 ⑻ 이 **데이터셋별/합산 · 따뜻한 상태/유휴 후 첫 접촉**을 안 적어 읽는 법에 따라 판정이 뒤집힌다 ⟹ **Ted 판정 대기 1건** · `status: in_progress` 유지. ⚠ 착수 전제(「`E-2` 5종에 타일이 있다」)가 **거짓**이었다 — 자리 산출물은 **14건 중 3건**뿐이다. **값·근거·선택지는 `evidence` 와 `sessions/V-2-CLOSE-20260903.md`.**⭑ **⟨2026-09-03 · `PLAN-SoT §9 〈305〉`⟩ 무엇이 이 항목을 닫는가 — 한 줄로 못 박는다.** **남은 것은 ⑻ 하나이고**(나머지 일곱은 `〈294〉`·`〈304〉` 로 충족), **재측정 하나로 닫힌다.** 다만 **지금 다시 재도 같은 값이 나온다** — 오늘 값이 미충족인 것은 측정 방법이 아니라 **첫 접촉이 실제로 느리기 때문**이다. ⟹ **닫는 순서 = ⑴ 신설 항목 `VL-1`(값 조회 초기화 지연)이 원인을 실측하고 개선을 집행한다 → ⑵ 그 뒤 유휴 30분 후 첫 접촉을 포함해 다시 잰다(3 데이터셋 × 첫 접촉 각 5회 이상 · 표본 원값 보존) → ⑶ 개정된 ⑻ 로 재판정한다.** ⚠ **`VL-1` 이 `depends_on: [V-2]` 인 것과 순서가 어긋나 보이지만 어긋나지 않는다** — `V-2` 의 나머지 일곱이 이미 서 있어 `VL-1` 이 잴 대상(값 조회 경로)이 실재하고, `V-2` 를 **닫는 것**만 `VL-1` 뒤로 간다.⭑ **⟨2026-09-04 · `PLAN-SoT §9 〈308〉` · 워크트리 `lane-window-b3`⟩ `〈294〉`·`〈304〉` 의 구현이 **staging 서빙 회차 `64791f910f49` 에 실려 섰다**(배포는 앞선 레인이 집행 · 원장 `2026-09-03T23:27:43 deploy … green` · 이 창이 `verify-deploy.sh` 를 다시 돌려 `배포 판정: GREEN (통과 15건 · SKIP 0)` · 앱 5종 이미지 태그 실측 일치 · 8 healthy). **값 조회 현물 3건 전건 200 · `available true`** — `01M0YWDXN7CA13KB7MQC9PGEW5` `0.4836253468321484` · `01M1JM3JTQSSTKR9A2QQ67QN81` `0.31521356105804443` · `01M19RENXAANZ2HDWM4Z46C37Y` `0.4836253468321484`(점 36.75, 127.40 · 경계 안). ⟹ 엣지 → core-api → viz-render → 자리가 한 줄로 이어지고 테넌트 경계 헤더 중계가 실물에서 성립한다. ⛔ **⑻ 은 이 회차가 재지 않았고 닫지 않는다 — `VL-1` 대기 그대로다**(`〈305〉` 의 닫는 순서). `status: in_progress` 유지.⭑ ⟨헤더 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`done` 유지 — ⑻ 의 판정을 바꾸지 않는다.** `〈311〉`-㉳⑴ 이 「서버 단독 p95 의 헤더 실측 `[미확인]`(계측은 섰으나 배포 전)」으로 남긴 자리가 배포 뒤 채집으로 닫혔다 — 배포 직후 첫 접촉 4건 전건에서 `Server-Timing` 이 **공개 엣지를 통과해 도착**했고 `coreTotal`·`vizTotal` 구간이 읽힌다. **데이터셋별 첫 접촉 벽시계 = 315 · 327 · 205 · 203 ms** 로 `〈305〉` 의 읽는 법(㈀ 첫 접촉 포함 · ㈁ 데이터셋별) 아래 **전건 ≤ 1,000 ms** 를 배포 직후 조건에서도 만족한다. ⛔ **성능을 고친 것은 이 회차도 0건이다** — 값이 좋아진 것이 아니라 **재기동 직후에도 나빠지지 않았다**는 관측이다. 근거 `sessions/WINDOW-20260904-B4.md §2`·`§7`."
    sources: ["WORK-UNITS §10.2", "WORK-UNITS §10.3", "PLAN-SoT §9 〈294〉", "PLAN-SoT §9 〈304〉", "PLAN-SoT §9 〈305〉", "sessions/V-2-CLOSE-20260903.md"]

  - id: V-3
    name: "지도 타일(`tile-` 벌)이 소유·회수 규율 밖에 있다"
    status: done
    stage: stage2
    owner: "D7 / viz-render"
    entry_conditions: ["없음 — `V-2` 착수 회차(`PLAN-SoT §9 〈294〉`)가 실측으로 세웠다"]
    depends_on: [A-1]
    completion_def: 완료 정의 미작성
    evidence: "**닫혔다 2026-09-03** (Ted 판정 · 등재 `PLAN-SoT §9 〈302〉` · 워크트리 `lane-close`). **이 행은 「무엇을 고칠까」가 아니라 「어느 길로 풀까」를 묻는 판정 항목이었고, 그 물음이 답을 받았다.** Ted 판정 = `note` ⑷ 의 후보 ⓐ(소유 판정이 키를 다시 계산)·ⓑ(D5 가 동반 기록)·ⓒ(원장에 대상↔키 열) **셋 다 아니다 — `ownership.scan()` 을 넓히지 않고 별도 생존 판독기를 세운다**(`〈296〉`-㉶ 와 같은 선). ⟹ **집행을 지는 항목 `TL-1` 을 같은 회차에 신설했다**(`stage2` · `open` · `owner` D7 · 판정 규칙 「살아 있는 데이터셋 파일 또는 보류 업로드가 하나라도 가리키면 산다」). ⚠ **`done` 의 뜻을 좁혀 적는다 — 「타일이 소유·회수 규율 안으로 들어왔다」가 아니다.** 실물 결손(타일 고아가 세어지지 않는다)은 **`TL-1` 이 열린 채 진다.** 이 행을 근거로 「타일 고아가 회수된다」고 적지 않는다. **이 회차는 코드 0줄** — 판정을 대장에 옮겨 적었을 뿐이다."
    deadline: null
    note: "⭑ **⟨2026-09-03 등재 · 워크트리 `lane-v2c` · `PLAN-SoT §9 〈294〉`⟩ 이 회차가 고치지 않았다 — 별건이라 대장에 세운다.** ⑴ **사실** = `d7_visualization/ownership.py` 의 `scan()`·`grade()` 가 **`tile-` 접두 벌을 판정 대상에서 제외**한다(실측 `ownership.py:51`·`:88`·`:154` — 앞 회차 정지 보고 `sessions/V-2-STOP-20260903.md` §2 표 7항). ⑵ **뜻하는 것** = 값 조회가 붙어 그 COG 를 **읽는 경로가 생겼는데도**, 그 산출물은 소유 판정(살아 있다/고아)과 회수(`invalidation.apply()`)의 **밖에 남는다.** 원본이 지워져도 타일은 자리에 남고, 아무도 그것을 고아로 세지 않는다. ⑶ **왜 여기서 안 고쳤나** = `A-1` 의 판정 규칙은 **렌더 사이드카의 `sources` ＋ 원장 대조**인데 `tile-` 벌에는 사이드카가 0건이다(D5 가 사이드카를 쓰지 않는다 · `grep -i sidecar services/pipeline-worker/src` 0건). 즉 판정 입력이 없어 **규칙을 넓히는 것이 아니라 새로 정하는 일**이고, 그것은 설계 판정 자리다(`CLAUDE.md §4` 「경계를 넘어야 할 때」). ⑷ **푸는 길 후보** = ⓐ 소유 판정이 **키를 다시 계산해** 원장의 본체와 잇는다(`〈294〉` 가 읽기 쪽에 세운 그 계산을 판정 쪽도 쓴다 — Port 0) · ⓑ D5 가 타일 옆에 동반 기록을 남긴다(재굽기가 따라온다) · ⓒ 원장에 대상↔키 열을 둔다(마이그레이션 ≥ 1). **셋 다 판정 자리라 착수 회차가 Ted 에게 한 건으로 묻는다.** ⑸ **범위 밖** = 값 조회 자체(`V-2`) · 렌더 산출물의 소유(`A-1` 에서 이미 닫혔다) ⭑ **⟨판정·대체 2026-09-03 · Ted 판정 · 등재 `PLAN-SoT §9 〈302〉` · 워크트리 `lane-close`⟩ Ted 판정 = ⑷ 후보 셋 중 **어느 것도 아니다 — 별도 생존 판독기로 세운다.** `ownership.scan()` 을 넓히지 **않는다**(`〈296〉`-㉶ 와 같은 선). ⟹ **이 항목은 판정 항목으로서 닫히고 집행은 신설 항목 `TL-1` 이 진다.** `status` 를 `done` 으로 올린 것은 「타일이 규율 안으로 들어왔다」는 뜻이 **아니다** — **이 행이 물었던 것(어느 길로 푸는가)이 판정됐다**는 뜻이고, 실물 결손은 `TL-1` 이 열린 채 진다. ⚠ 그러므로 **이 행을 근거로 「타일 고아가 회수된다」고 적지 않는다.**"
