  - id: V-2
    name: 값 조회
    status: done
    stage: stage2
    owner: "D7 / viz-render"
    entry_conditions: ["P3"]
    depends_on: [P3, A-1]
    completion_def: >-
      ⭑ **⟨확정 2026-08-31 · Ted RULING ㉘ · `PLAN-SoT §9 〈254〉` · 정본 `Policy_데이터셋_상세` v2.8 `§8`
      「값 조회」 블록⟩ 초안이 아니라 확정본이다.** ／ 종전 표기 ~~완료 정의 미작성~~ (`〈213〉`·`〈250〉`).
      **정본이 오라클이다 — 아래는 그 반영본이고, 축자가 갈리면 정본이 이긴다.**
      **값의 출처 = ⓒ 자리에 구워 둔 미리보기용 산출물(COG)에서 창을 읽는다.** 기각 = ⓐ 원본 재조회
      (포맷 5종에 창 읽기를 새로 짜야 하고 지금 경로의 하한이 렌더 1회다) · ⓑ 렌더 부산물
      (**블록 평균이라 실측값이 아니다** — 연구 데이터 플랫폼에서 인용되면 틀린 값이 퍼진다).
      **닫는 조건 여덟 — 전건 충족해야 닫는다(정본 `§8` 표와 같은 말이다).**
      ⑴ 미리보기가 그려진 뒤 지도의 한 점을 누르면 **그 자리의 값**이 뜬다
      ⑵ **다시 그리지 않는다** — 값 조회 중 새 렌더 작업 생성 **0건** · 조회 전후 범례·배율 불변
      ⑶ 답하는 수가 **평균이 아니라 그 칸의 값**이다 — 같은 좌표를 원본에서 연 값과 대조하고,
      **좌표를 가진 격자(tif 계열)에서는 완전히 같다**
      ⑷ **약속하지 못하는 것을 화면이 먼저 말한다** — 좌표를 따로 입힌 격자에서는 「가장 가까운 격자
      칸의 값」임을, 답하는 단위가 **한 칸**임을 알린다(**원본 해상도 이상은 약속하지 않는다**)
      ⑸ **값이 없는 칸에서는 「없다」고 말한다** — 0 으로 바꾸지 않는다(음성 시험)
      ⑹ **좌표가 없는 자료에는 기능이 없다** — 조회 자리 부재(음성 시험)
      ⑺ **등록 전에는 제공하지 않는다** — S-08 에 조회 자리 부재(음성 시험)
      ⑻ ⭑ **⟨개정 2026-09-03 · Ted 판정 · `PLAN-SoT §9 〈305〉`⟩ 눈금의 읽는 법을 문면에 박는다 — 값은 그대로다.**
      종전 표기 ~~⑻ **응답 p95 1초 · 상한 5초**(넘으면 실패)~~ (`〈254〉` · 정본 `Policy_데이터셋_상세 v2.8 §8`).
      **⑻ 응답 p95 ≤ 1초 · 상한 ≤ 5초** — 그리고 그것을 **아래 두 규칙으로 읽는다.**
      ㈀ **유휴 후 첫 접촉을 포함해 읽는다** — 따뜻한 상태만 재고 판정하지 않는다.
      **판정 사실(Ted 축자 채택) = 「사용자는 유휴 후 처음 누른다」** ⟹ 첫 접촉이 사용자가 겪는 값이다.
      ㈁ **합산이 아니라 데이터셋별로 읽는다** — 한 데이터셋이라도 넘으면 미충족이다.
      ⚠ **둘 다 더 엄한 쪽을 골랐고, 그렇게 골랐음을 여기 적는다** — 읽는 법이 갈릴 때
      집행 레인이 자기 편한 쪽을 고르지 않게 하려는 것이 이 개정의 목적이다(`〈304〉`-㉱).
      **오늘 값으로는 미충족이다** — 유휴 후 첫 접촉 p95 **1,164 ms · 2,111 ms**(데이터셋 둘)로 ㈀㈁ 아래 1초 초과.
      **상한 5초는 미초과**(다섯 실행 통틀어 관측 최대 **2,448 ms**) · 따뜻한 상태 합산 p95 **261 ms**.
      **권한 — 음성 조건 둘.** ⓐ **잠긴 데이터셋에는 서지 않는다** — 값은 **내용**이고, 확대(보기 권한만)와
      다른 자리다. 정본 1.3 규칙 6 을 우회하지 않는다 ⓑ **자리 이름(내용 키)만으로 값을 내주는 길을
      만들지 않는다** — 키에 연구실이 없어(실측 `MAP_TILE_KEY_FIELDS`) 이름을 아는 것이 권한이 되면
      경계가 무너진다. **값 조회는 언제나 `datasetId` 로 들어와 경계 판정을 지난 뒤 산출물에 닿는다**
      **staging 배포 green**(`CLAUDE.md §0`).
      ⚠ **명시적 범위 밖** = 굽는 경로를 넓히는 일(자리에 산출물이 서지 않는 자료에 값 조회를 세우는 것) ·
