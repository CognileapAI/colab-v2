      **㉱ `[미확인]` ⓐ — 완료를 막지 않는다.** 화면에 팔레트 갱신이 보이는가 = **팔레트 선택 UI 가 없다**(`J-6` 미착수 · **완료 정의 ⑺ 이 명시로 범위 밖에 뺀 자리** ⟹ 결함이 아니라 범위).
      간접 근거만 섰다 — 재렌더 전 화면 DOM 범례 6줄이 렌더 응답 `classes` 6쌍과 글자 대조로 일치.
      ／ 종전 문면(2026-09-05 창 5b 단계 B 시점 · 지우지 않는다) ↓
      ⭑ **⟨부분 실측 2026-09-05 · staging 단독 창 5b 단계 B · 등재 `PLAN-SoT §9 〈318〉` · 근거 `sessions/WINDOW-20260905-A5b.md §10` ㉡·10.11⟩ `status` 는 `open` 그대로 — 완료 정의 ⑹ 만 섰다.**
      **선 것 = ⑹ staging 배포 green** — `〈317〉` 의 수정이 실린 릴리스 **`e37808cace69`** 가 배포 GREEN(통과 15 · SKIP 0 · red 0 · 롤백 미발동 · 8/8 healthy)으로 서 있고,
      `service-tests-viz-render` 는 단독 3회 ＋ 전수 1회 = **합 9회 연속 green** 이다(⛔ 「간헐이 사라졌다」가 아니라 「9회 표본에서 안 났다」).
      **안 선 것 = staging 실물 증명** — `§6(vii)㉡`(같은 데이터셋에 다른 팔레트로 1회 재렌더 → 색만 바뀌고 구간 경계·`bounds` 불변 ＋ 옛 벌이 자리에서 사라진다)이 **집행되지 않았다** `[미확인]`.
      ⛔ **미집행은 판단이 아니라 경계다** — 그 창의 인가된 staging 쓰기는 `§6(iv)` 선기재 목록에 대한 `POST /api/v1/previews` 하나뿐이었고 ㉡ 은 그 목록 밖의 추가 쓰기라 **좁은 쪽을 따라 집행하지 않고 보고했다.**
      ⟹ **`〈317〉` 의 staging 실물 증명도 함께 비어 있다**(시험 green · 실물 판 `[미확인]`).
      **푸는 법 = ㉡ 에 대한 명시 쓰기 승인 1건**(대상 데이터셋 · 팔레트 · 1회). 그러면 다음 창이 **배포 없이도** 잰다 — ㉡ 은 배포당 한 번뿐인 창이 아니다.
    deadline: null
    note: "⭑ **⟨2026-08-29 · Ted 판정 `PLAN-SoT §9 〈213〉`⟩ 완료 정의를 이번에 쓰지 않는다 — 지도 타일 단계가 서기 전에 쓰면 추측이 섞인다.** `완료 정의 미작성` 을 그대로 둔다. 푸는 법 = 지도 타일 단계(`PV-1`→`P3`) 산출물 형태가 확정된 회차가 기재한다. ／ 범위 = 서버측 재렌더 경로까지 — 팔레트 선택 UI(`§J-6`)는 J-1 묶음에 남는다. 둘을 한 WU 로 합치지 않는다. `03-HANDOFF §1` 에는 행이 없다. ⭑ **⟨2026-08-31 · `PLAN-SoT §9 〈250〉`⟩ 실측 위에 초안을 썼다(`completion_def_draft`) — `completion_def` 는 그대로 `완료 정의 미작성` 이다.** 실측 요지 = 팔레트는 이미 `render_cache_key` 의 입력이라 **무효화 코드가 없고 필요도 없다**(키가 갈린다) · XYZ 타일은 요청 때마다 메모리 배열에서 굽고 **디스크에 구워 둔 조각이 0건**이다 · 자리의 COG 는 **값**을 담아 팔레트와 무관하다. **Ted 확정 전에는 착수 가능이 아니다**(`03-HANDOFF §4 #54`). ⭑ **⟨개정 2026-08-31 · Ted RULING ㉙ · `PLAN-SoT §9 〈259〉`⟩ 초안 ⑷ 가 뒤집혔다 — `completion_def` 는 여전히 `완료 정의 미작성` 이고 고친 것은 초안뿐이다.** Ted 축자 = 「**바뀌면 삭제하는 게 원칙. 데이터 가공이 아니기 때문.**」 **옛 산출물은 남기지 않고 지운다** — 렌더 산출물은 가공물이 아니라 부산물이고, 새 데이터셋도 계보 노드도 되지 않으며 `d3_file.kind` 에 담길 자리 자체가 없다(`〈247〉` 과 같은 선). **재실측으로 종전 진술 하나를 바로잡았다** — 「회수 장치 0건」이 **사실이 아니다**: `Y-1` 병합으로 지우는 기구(`invalidation.plan`·`apply`)가 이미 서 있고 **없는 것은 호출 한 자리**다(`apply` 호출 전수 **1건** — `regenerate()` 자동 경로뿐이라, 사람이 다시 그리는 경로에서는 범위가 계산만 되고 집행되지 않는다). **순서·경계는 이미 코드가 지킨다** — 새 것이 선 뒤에 옛 것을 치우고, 미리보기 루트 밖이면 `OutOfScope` 로 멈추며(하나라도 밖이면 아무것도 안 지운다) `tile-` COG 는 `kept` 로 살린다. ⚠ **이미 쌓인 80건 11 MB 는 `V-1` 이 서도 정리되지 않는다** — 후보 목록이 **이 프로세스가 구운 것만** 세고 디렉터리를 훑지 않아서다. **별도 작업이고 소유가 정해지지 않았다** `[미확인]`. ／ ⭑ **⟨증보 2026-09-01 · `PLAN-SoT §9 〈263〉`⟩ 선행에 `A-1`(산출물 소유 구조)이 붙었다** — 이 항목이 미리보기 자리의 산출물을 읽거나 지우므로 자리의 배치가 정해진 뒤에 선다. ⭑ **⟨확정 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉰ · advisor 권고대로 집행 · Ted 사전 위임 2026-09-03⟩ 초안 ⑴~⑺ 을 `completion_def` 로 승격했다 — 조항 신설·수정 0건.** 열린 슬롯 둘의 거처 = **ⓐ 값 재사용은 요구에서 제외**(팔레트가 이미 `render_cache_key` 입력 · ⑴ 은 재사용 여부와 무관하게 성립 · 성능은 `〈233〉` **p95 2.081 s ≪ 10 s**) · **ⓑ 옛 키 파일 청소는 `RC-1` 로 분리**(초안 ⓒ 축자 「별도 작업」). ⟹ **`#54` 에서 `V-1` 을 내린다 — 착수 가능이다.** ⛔ **`status` 는 `open` 그대로 — 열린 것과 착수한 것은 다르다.** ⭑ **⟨간헐 red 종결 2026-09-05 · 등재 `PLAN-SoT §9 〈317〉` · 워크트리 `lane-v1fix`⟩ 창 5 의 `NO-GO` 사유였던 `service-tests-viz-render` 간헐 red(4회 중 3회 · 케이스 `test_팔레트_재렌더는_새_키를_세우고_옛_벌을_지운다`)를 닫았다 — 원인은 **「완료」가 회수보다 먼저 발행되던 순서**(`jobs.py:567` vs `:684~701` · 실측 창 ≈15 ms)이고 고친 것은 시험이 아니라 그 순서다. **완료 정의 ⑷ 는 좁아지지 않았다**(⑷-b·⑷-c 무변 · 계약 개정 0). 값·근거는 `〈317〉` 에 있다.**"
