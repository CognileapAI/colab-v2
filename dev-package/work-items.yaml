    evidence: >-
      **닫혔다 2026-09-03** (워크트리 `lane-qd` · `PLAN-SoT §9 〈299〉` · 등재문 `notes/QD-LEDGER-PENDING.md`).
      완료 정의 4항 전건 충족 —
      ⑴ `detail/UsageSection.tsx` 가 `id="sec-usage"` 로 서고 차례는 기본 정보 → 계보 → 미리보기 →
      활용이다 (`Policy_데이터셋_상세 §4` 판단 순서). `LineageSection.tsx` 의 `href="#sec-usage"` 가
      **더 이상 죽은 앵커가 아니다**.
      ⑵ 카드는 **새 op 없이** `DatasetDetail.projects`(계약 `DatasetProjectUse`)를 전건 나열한다 —
      서버도 이미 채우고 있었다 (`routes/catalog.py` `uses_of`). **계약 개정 0건 · Ted 판정 불요.**
      다운로드는 기존 `api/download.ts`(ST-1)를 그대로 부르고 `actions.canDownload` 로만 뜬다 (P-7·P-12).
      ⑶ 접근 요청은 **새로 만들지 않았다** — `LockedContent` → `LockedNotice` → `AccessRequestPanel`
      (WU-P6) 경로 그대로다. 활용 섹션은 잠기면 서지 않아 **두 번째 요청 버튼이 생기지 않는다**.
      ⑷ `파일` 칸의 `보기` → `detail/FileList.tsx` · `filesSource.ts`(`listDatasetFiles`).
      **누르기 전 호출 0회**를 시험이 세고, CSS 에 `overflow`·`max-height` 0건이며, 기준 격자 0건이면
      「기준 격자 파일이 없어요」를 적는다 (122행 축자).
      ⭑ 함께 닫은 둘 — **#6** 상세 404 를 중립 문구(`Policy_공통_기반 §2.4`)로 바꿨고,
      **#9** 주제 열 메뉴를 고정 4목록으로 세웠다 (`catalog/columns.ts` `menuValues`).
      곁가지 1건 — 픽스처가 열린 데이터에도 `canDownload: false` 라 **실서버와 어긋나 있었다**
      (서버 축자 `canDownload = body_accessible`). 고치고 전건 대조 시험을 걸었다.
      ⚠ **재지 않은 것** — staging 실물 대조 0건(**배포 필요**) · 활용 배지 N ↔ 카드 수 동일 출처 미대조 ·
      `listDatasetFiles` 403(P-34) 실경로 미실측. 목록은 `notes/QD-LEDGER-PENDING.md §5`.
    deadline: null
    note: >-
      **신설 2026-09-03** — `PLAN-SoT §9 〈296〉`-㉳. 착수 자리는 `notes/QA-STRATEGY-20260903.md §4` 순 6.
      ⭑ **QA 검수 #4(파일 목록)를 여기로 합류시켰다.** 종전 분류 「진짜 결함 · 판정 선행 — op 없음, 계약」이
      **틀렸다** — op 는 있고 화면이 안 부르는 것이라 **계약 공백이 아니라 화면 결함**이다.
      **계약 개정 0건 · Ted 판정 불요.** 정정 근거는 `notes/QA-STRATEGY-20260903.md §2` 정정 주석.
      ⚠ **이 항목은 `contracts/` 를 열지 않는다** — 여는 순간 성질이 달라지므로 그때 다시 판정한다.
      ⭑ **⟨닫으며 2026-09-03 · `〈299〉`⟩ 계약을 열지 않았다.** 활용 프로젝트도 op 신설이 아니라
      `DatasetDetail.projects` 였다 — **17차 물음 0건.** 다만 후속 둘을 남긴다(레인 밖) —
      ㈎ `Policy_데이터셋_상세 §5` 활용 프로젝트 행이 적는 **「담당」이 계약 `DatasetProjectUse` 에 없다**
      (정본 델타 또는 계약 확장 판정 · 화면은 없는 값을 지어내지 않고 넷만 낸다).
      ㈏ 서버가 묘비·경계 밖·미존재를 한 404 로 접는 것은 **의도이고 결함이 아니다**
      (`routes/catalog.py` 축자 「구분해 주면 그 자체가 존재의 누설이다」 · P-9·P-10) —
      그래서 **core-api 후속 항목을 만들지 않았다.** 남는 것은 그 접힘의 결과로 `§9` 의 묘비 문구가
      **상세 화면에서 도달 불가**가 됐다는 사실이고, 그 행의 적용 자리를 좁히는 **정본 판정 1건**이다.
      ⭑ **⟨판정 2026-09-03 · Ted 판정 · 등재 `PLAN-SoT §9 〈302〉` · 워크트리 `lane-close`⟩ 위 후속 둘이 판정됐다 —
      **둘 다 계약 17차 동결 해제 대상이고, 집행은 별도 레인 `lane-r17` 이 진다(이 회차는 코드·계약 무접촉).**
      ㈎ **「담당」 = 계약에 추가한다** — 정본 델타(문면을 지우는 쪽)가 아니라 계약 `DatasetProjectUse` 에
      담당 필드를 신설한다. **정본 `Policy_데이터셋_상세 §5` 가 이기고 계약이 따라온다.**
      ㈏ **묘비 문구 = 자기 연구실 묘비만 구분한다** — **같은 연구실의 지워진 데이터셋에만** 구분 응답을 내고
      **타 연구실·미존재는 404 그대로** 접는다. 경계 밖 존재 누설은 그대로 막히고(P-9·P-10 유지),
      `§9` 묘비 문구의 도달 자리가 생겨 **정본 개정도 불요**가 된다. 서버 ＋ 계약 응답 코드 변경이라
      ㈎ 와 **같은 17차 회차에 묶는다.**
      ⚠ **이 회차는 기재만 했다** — 계약 파일·서버 코드 **0줄** 변경. 17차 등재문·동결 해제 등급은 `lane-r17` 이 쓴다(`〈303〉`).
    sources: ["PLAN-SoT §9 〈296〉", "notes/QA-STRATEGY-20260903.md §2", "notes/QA-STRATEGY-20260903.md §4-6", "notes/QA-SCREENS-20260903.md #4", "PLAN-SoT §9 〈299〉", "notes/QD-LEDGER-PENDING.md"]

  - id: R-17
    name: "계약 동결 해제 17차 — 자기 연구실 묘비만 구분 (`getDataset` 410)"
    status: done
    stage: stage1
    owner: "D3 catalog (core-api + frontend)"
    entry_conditions:
      - "Ted 판정 2026-09-03 ② — `X2-FREEZE-PROTOCOL §5-㉯`(소비자 ≥ 1 · 정본 개정 1건)"
    depends_on: [Q-D]
    completion_def: >-
      ⑴ 계약 `fe-core.yaml#getDataset` 에 `410` 응답이 서고 그 산문이 **넷의 표**(내 연구실 묘비 ·
      남의 연구실 묘비 · 남의 연구실 생존 · 없는 id)를 그대로 싣는다.
      ⑵ 서버가 **내 연구실 · `deleted_at IS NOT NULL`** 한 칸에서만 410 을 내고 나머지 셋은
      **응답 본문까지 같은** 404 다.
      ⑶ 화면이 410 에서만 `Policy_데이터셋_상세 §9` 묘비 문구를 축자로 내고 404 는
      `Policy_공통_기반 §2.4` 중립 문구 그대로다.
      ⑷ 시험이 **넷을 한 벌로** 재고 ⑵⑶⑷ 의 응답 동일성을 직접 대조한다.
      ⑸ 정본 `Policy_데이터셋_상세` 가 좁혀진 규칙을 적고 `planning-freshness` 가 green 이다.
    evidence: >-
      **닫혔다 2026-09-03** (워크트리 `lane-r17` · `PLAN-SoT §9 〈303〉` · 등재문
      `notes/R17-LEDGER-PENDING.md` · 회차 행 `sessions/X2-FREEZE-PROTOCOL.md §1` 17차).
      완료 정의 5항 전건 충족 —
      ⑴ 응답 컴포넌트 `Gone` 신설 ＋ `getDataset` 에 `"410"`. **스키마 무변 · op 총계 55 그대로.**
      `contract-breaking` **ERR 0 · WARN 0 · INFO 1**(`response-non-success-status-added` · 순수 가산).
      ⑵ `d3_catalog.is_own_lab_tombstone` ＋ `routes/catalog.py` 의 한 갈래. **판정의 전부는
      그 질의에 `lab_id` 조건을 적지 않는 것**이다 — 경계는 RLS `lab_boundary` 가 걸고, 그래서
      남의 연구실 묘비는 「묘비 아님」이 아니라 **「행 없음」**으로 떨어진다. **마이그레이션 0**
      (`d3_dataset.deleted_at` 이 P0 부터 실재).
      ⑶ `DatasetTombstone`(410) 을 `DatasetGone`(404) 과 **다른 종류**로 세웠다. 상태 `tombstone`
      ＋ 패널 `data-testid="detail-tombstone"`. 404 자리의 문구는 한 글자도 안 바뀌었다.
      ⑷ core-api 신규 5건(넷 ＋ 동일성 대조) · frontend 신규 7건. red 선확인 = core-api 1/6 ·
      frontend 5/7 — **404 쪽이 처음부터 green 이라는 사실 자체가 「누설 면적이 안 늘었다」의 오라클**이다.
      기존 1건은 오라클이 바뀌어 정정했다(`test_tombstone_has_no_detail_screen` → `test_own_lab_tombstone_is_410`) —
      **느슨화가 아니다**: 종전에는 남의 연구실 묘비를 재는 시험이 **0건**이었고 이 회차가 그것을 세웠다.
      ⑸ `Policy_데이터셋_상세` **v2.8 → 2.9**(§9 행 분리 ＋ 근거 블록 ＋ §12 이력) · 백업
      `_backup_260903_R17/` · 패키지 재동기 · `planning-freshness` **green 15/15**.
      ⚠ **재지 않은 것** — staging 실물 대조 0건(**배포 필요 · 서버·프런트 둘 다**). staging 에
      **묘비 데이터셋이 0건**이라 410 경로는 값을 심기 전에는 실물에서 도달 불가다.
    deadline: null
    note: >-
      **신설 2026-09-03.** Ted 는 같은 날 **두 건**을 판정했고 이 항목은 **② 만** 담는다.
      ⛔ **①(`DatasetProjectUse` 에 「담당」 추가)은 열지 않았다** — 불복이 아니라 **전제 붕괴 보고**다:
      조인할 열이 없고(`d6_project` 에 담당·owner·created_by 0건 · `db/platform/schema.sql:706-719`),
      따를 관례가 없고(`ProjectDetail` 에 담당 0건 · `fe-core.yaml:3372`), 정본에 정의가 없다
      (`Policy_프로젝트`·`DataModel_공통_기반` 0건 · 적은 한 줄은 `[가정]` 표지).
      기획(PRD·목업)에는 「담당 호랑이」로 **1인 계정**이 실재하므로 「기획 누락」이 아니라
      **DataModel·DB 로 내려오지 않은 것**이다. 갈래 둘(정본 델타 / D6 속성 신설)은
      `notes/SPEC-DELTA-PENDING.md §2-ⓕ` 에 물음으로 세웠다 — **Ted 판정 대기.**
      ⚠ **생산자 없는 필드를 계약에 박지 않았다** — 항상 `null` 인 필드는 시험할 수 없고,
      `〈299〉` 가 같은 자리에서 세운 「없는 값을 지어내지 않는다」를 이번 회차가 스스로 깨게 된다.
    sources: ["PLAN-SoT §9 〈303〉", "sessions/X2-FREEZE-PROTOCOL.md §1", "notes/R17-LEDGER-PENDING.md", "notes/QD-LEDGER-PENDING.md §5", "PLAN-SoT §9 〈299〉"]
  - id: CR-1
    name: "코드리뷰 개선 회차 — 경계·검증·정직한 빈 상태·검사기 판정 (레인 6 ＋ 후속 2)"
    status: done
    stage: stage2
    owner: "dev-package / gates ＋ core-api · viz-render · pipeline-worker · frontend"
    entry_conditions:
      - "`/code-review` xhigh 산출이 실재 — `sessions/CODE-REVIEW-20260903.md`(15건 ＋ 부록 · CONFIRMED 69)"
      - "계약 동결 유지 — `contracts/**` 무접촉으로 설 수 있다(계약 델타는 초안으로만 남긴다)"
    depends_on: []
    completion_def: >-
      `sessions/CODE-REVIEW-20260903-PLAN.md` `§2` 레인표 ＋ `§3` 병합·검증 순서 그대로 —
      ⑴ 레인 A~E 가 각자의 완료 정의를 충족한다(결함마다 **실패 시험 먼저** · 기준선 계수를 먼저 기록 ·
      서비스별 suite green · 경계 게이트 `import-boundary`·`banned-import`·`ai-no-lineage-write`·`db-boundary` green ·
      **스키마 변경 0** · 계약이 필요하면 멈추고 보고).
      ⑵ 병합 D → C → B → E → A 후 최신 `main` 을 병합하고, **병합 트리에서** `./gates/run.sh all -j 1` ＋
      서비스 pytest 4종 ＋ `tsc --noEmit` ＋ `vitest` 를 재실행해 계수를 기록한다
      (`run.sh all` 은 pytest/vitest 를 돌리지 않으므로 따로 센다).
      ⑶ draft PR 로 **GitHub Actions 실제 실행**을 확인한다 — 로컬 green 은 CI green 이 아니다.
      ⑷ 전부 green 일 때만 레인 G(커널 codegen 통일)를 연다.
    evidence: >-
      **닫혔다 2026-09-03** — 값·근거는 `PLAN-SoT §9 〈307〉` 에 있다(이 대장은 상태만 진다).
      병합 커밋 **`a1ff6af`**(Ted 명시 지시 · 로컬 `main` `--no-ff`) ·
      기록 `sessions/CODE-REVIEW-20260903{,-PLAN,-A,-B,-C,-D,-E,-F,-G2}.md` · 병합 지도 `notes/REFACTOR-MERGE-MAP-20260903.md`.
      완료 정의 4항 중 **⑴⑵⑶ 충족 · ⑷ 미착수** — 레인 G 는 열지 않았고 다음 회차 작업항목 1번으로 남았다(`-PLAN.md §4`).
      최종 트리 실측 — core-api **624** · viz-render **269** · pipeline-worker **231** · ai-service **130**(`not dictdb`) ·
      vitest **36파일 / 570건** · `tsc --noEmit` **0** · `./gates/run.sh all -j 1` **green 50 · red(판정) 0 · red(준비) 0** ·
      게이트 총수 **43 → 50** · CI 에 실리는 서비스 pytest 케이스 **69 → 1070**.
      GitHub Actions 수동 실행 **success 10 / failure 2**(`schema-gates`·`planning-gates` — **둘 다 main 사전존재**).
      ⚠ **재지 않은 것** — staging 무접촉·배포 0 이라 실물 대조 **0건** · e2e·perf·dbint·dictdb 미실행 ·
      업로드 스트리밍 RSS `[미확인]`.
    deadline: null
    note: >-
      **신설 2026-09-03** — `PLAN-SoT §9 〈307〉`. 이 항목은 **품질·검사기 회차**이고 제품 범위를 늘리지 않았다
      (`contracts/**` 무접촉 · 마이그레이션 0 · 스키마 무변). ⚠ **이 회차가 만든 후속은 `CR-2` 가 진다** —
      특히 **캐시 키 변경은 배포 전까지 아무 효과가 없고**, 배포 뒤에는 기존 산출물이 전량 미스가 되므로
      「바뀌지 않은 것이 정상이다」라고 적어 둔 종전 문면이 그 시점부터 **참이 아니다**.
    sources: ["PLAN-SoT §9 〈307〉", "sessions/CODE-REVIEW-20260903.md", "sessions/CODE-REVIEW-20260903-PLAN.md", "notes/REFACTOR-MERGE-MAP-20260903.md"]

  - id: CR-2
    name: "코드리뷰 회차 후속 — Ted 판정 5건 ＋ 배포 뒤 재굽기·소유 재실측 ＋ CI 인프라 red 둘"
    status: open
    stage: stage2
    owner: "Ted 판정 (계약 델타 · 배포 · CI 인프라)"
    entry_conditions:
      - "없음 — `CR-1` 병합(`a1ff6af`)으로 판정 대상이 전부 실물로 서 있다. 판정만 있으면 착수한다"
      - "⑶ 재굽기·소유 재실측만 **staging 배포 선행**을 요구한다(배포 전에는 잴 대상이 생기지 않는다)"
    depends_on: [CR-1]
    completion_def: >-
      2026-09-03 기재(`PLAN-SoT §9 〈307〉`-㉷ · 정본 목록 = `sessions/CODE-REVIEW-20260903-PLAN.md §5-5`).
      **요구를 새로 만들지 않았다** — 코드로 결정하지 않고 남긴 것을 항목으로 세운 것이다.
      ⑴ **계약 델타 판정** — `fe-core.yaml` `createPreviewRender`·`listPalettes`·`lookupDatasetValue` 의 410/413/415/422 선언 ＋
      `core-viz.yaml` 경계 헤더 선언 ＋ `getRender` 400 ＋ `ScreenshotRequest.layers maxItems 8`.
      **코드는 이미 그렇게 동작하므로 계약이 뒤따르는 자리**이고, 되돌릴 자리는 `relay.py:PASS_THROUGH_STATUSES` 다.
      동결 해제 회차로 묶을지 판정한다.
