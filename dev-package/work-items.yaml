    note: "⭑ **⟨단계 이동 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ `stage2` → `after_stage2`(＝ Ted 가 이름 붙인 **stage 3**).** **종전 값 ~~stage2~~ 를 지우지 않고 여기 남긴다.** 판정 = **「검색 화면은 자연어와 AI 를 지닌 채 통째로 stage 3 으로 간다」·「카탈로그 화면이 이번 릴리즈의 데이터 찾는 길이다」.** ⭑ **정본은 개정되지 않았다 — 이 판정이 정본 문언(`Policy_데이터_찾기.md:38`·`:40`·`:45`)을 그대로 따른다.** 딸린 이유 = **AI 없이도 제품이 완결이라는 성질을 지킨다.** ／ ⚠ **`after_stage2` 를 쓴 이유는 1회차와 같다** — 검사기 허용값 5종에 `stage3` 이 없고(`gates/tools/work_item_consistency.py:87`) **검사기를 고치지 않는다.** ／ ⭑ **이 항목을 선행으로 걸던 둘의 재지정** — ⑴ **승인 처리(`P6` · stage 2)** = `depends_on` 에서 이 항목을 빼고 **카탈로그 화면(`P1` · ✅ done)** 에 붙는다. 근거 축자 = 정본 `:177` 「적용 지점 표의 \"검색 결과 카드\"·\"검색 잠긴 카드\"·\"**카탈로그 행**\" 인용」 — 셋 중 **카탈로그 행 하나만 이번 릴리즈에 남는다**(`:130` 「카탈로그 행은 자물쇠 + `잠김` 칩」 · `:152`). 나머지 둘은 이 항목을 따라 stage 3 으로 간다. ⑵ **목업·화면 최신성(`G1b`)** = **이미 `after_stage2` 라 같은 단이므로 간선을 그대로 둔다** — 끊을 이유가 없다. ／ ⚠ **`T-1`(형태소 검색 설정) 종속은 끊지 않았다.** 다만 실측 = **`T-1` 의 종속자는 `P4`·`K4` 둘뿐이고 오늘로 둘 다 stage 3 이다** — 2회차가 `T-1` 을 stage 2 에 둔 근거(「조건 검색의 바닥」)는 조건 검색이 카탈로그의 것이고 **카탈로그에는 키워드 입력이 없다**(정본 `:45`·`:53` · `F-2` 실측)는 점에서 성립하지 않는다. **그래도 `T-1` 을 옮기지 않는다 — 덜 빼는 쪽으로 남기고 보고한다.** ／ **아래는 2회차 본문 — 지우지 않는다.** ⭑ **⟨선행 간선 절단 2026-08-30 (2회차) · Ted 판정⟩ `depends_on` 과 진입조건에서 `K4`(자연어 검색 서비스)를 뺐다.** 근거 = 오늘 판정 **「검색 화면을 자연어 검색이 아니라 조건 검색 위에 세운다」**, 그 바탕은 260826 결정 `§2-5` 축자 「이번 릴리즈: **표·필터·정렬 기반 조건 검색만**. **자연어 검색은 넣지 않는다**」 — **조건 검색은 이번 릴리즈에 남았고 자연어 검색만 미뤄졌다.** ⭑ **끊지 않으면 `P4` 가 stage 3 항목을 선행으로 걸고, 그 뒤 승인 처리(`P6`) → 연구실 대시보드(`P7`) → E-01 적용 지점 표(`P8`) 사슬 전체가 stage 3 뒤로 밀려 stage 2 가 닫히지 않는다.** ／ ⚠ **종전 선행을 지우지 않는다 — 개정으로 남긴다.** 이전 `entry_conditions` = ~~P1 · G2 · K4~~ · 이전 `depends_on` = ~~[P1, G2, K4, T-1]~~. 그 간선의 사유(화면 품질 오라클이 자연어 평가셋이었다 — `〈208〉`)는 **틀렸던 것이 아니라 stage 3 으로 옮겨 간 것**이다. `T-1` 종속은 남긴다(형태소 검색 설정이지 자연어가 아니다). ／ ⭑ **⟨합격선 재배치 2026-08-30⟩ `〈217〉` 이 `K4`·`P4` 둘에 걸어 둔 검색 품질 합격선을 두 단으로 갈랐다.** **조건 검색 몫 = 이 항목(stage 2)** — 「미판정 0건 ＋ 판정 후 전건 통과 ＋ 판정마다 사유 기록」의 **형식은 그대로 물려받고, 재는 대상만 평가셋 A층 18건에서 위 `completion_def` ⑴~⑸ 의 정본 축자 5항으로 바뀐다.** **자연어 몫 = `K4`(stage 3)** — 평가셋 A층 대비 화면 층 대조 · `AI 근거` · 자연어 질문. **어느 쪽도 버리지 않았다.** ⚠ **`〈217〉`-㉲ 원문(「화면 층(`P4`)의 조항은 이미 「미판정 0건」으로 서 있어 문언을 고치지 않았다」)은 지우지 않는다 — 그 조항은 살아 있고 모수만 바뀌었다.** ／ ⚠ **`Verified` 를 두 정본이 갈라 적는다 — 어느 쪽도 고르지 않았다.** `Co-Lab_ver2_업로드_계보_260825_이태헌.html`(2026-08-25) = `Verified` **0건**(실측) · `Policy_데이터_찾기.md`(2026-08-18 정본) = **8곳**, 그중 `:115` 가 조건을 걸 수 있는 다섯 열에 넣었다. ⭑ **이 갈림에 이가 있다 — 위 `completion_def` ⑴⑵ 가 `Verified` 열에 값이 있어야 성립한다.** 값을 채우는 것은 승인 처리다. **판정 대기.** ／ ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈208〉`⟩ 평가셋은 초안이 아니라 실물이다 — `S2b` 는 산출물 완료로 닫혔고, 그 평가셋으로 재는 화면 층 품질 판정이 이 항목으로 왔다. ⬜ 를 유지하는 이유가 「오라클 부재」에서 「판정 미실행」으로 바뀌었다.** ／ 이전 ~~⬜ 를 유지하는 이유 = 완료 판정의 오라클인 평가셋이 초안이다. ⚠ 그런데 `S2b` 는 `03-HANDOFF` 에서 Ted 승인 완료 ✅ 로 적혀 어긋난다.~~ ⚠ 화면이 서고 staging 에서 실결과(`강우` 3건)를 내는데 상태는 ⬜ 다 — 문서가 그 이유를 명시하므로 상태는 ⬜ 로 둔다. stage 는 `WORK-UNITS` 가 「stage 1 에 지어지고 stage 2 에 판정된다」로 적어 스키마 값 하나로 못 담는다 — `unknown` 으로 적고 여기 남긴다.~~ ⭑ **⟨단계 배정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈212〉`⟩ `unknown` → `stage2`.** 배정 근거 = **판정 시점이 stage 2 다**(화면은 stage 1 에 지어졌고 남은 것은 평가셋으로 재는 판정뿐). 그리고 이 항목은 **승인 처리(`P6`)의 선행**이라 화면·승인 사슬의 실질 경로 안에 있다."
    sources: ["03-HANDOFF §1 T-P", "WORK-UNITS §7", "WORK-UNITS §10.2", "WORK-UNITS §11", "PLAN-SoT §9 〈212〉"]

