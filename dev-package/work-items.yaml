    depends_on: [D5]
    completion_def: "⟨2026-08-29 Ted 판정 · `PLAN-SoT §9 〈189〉`-㉮ · 축자⟩ **완료 = 파일에서 읽고 · 좌표계를 통일하고 · 지도용 영상으로 변환하는 미리보기가 실데이터에서 돌고, 그 과정이 기록에 남는 것까지.** 지도에 그려지는 것(타일 서빙·확대)은 이 항목이 아니라 시각화 항목(`P3`)의 소유다. ＋ 이 레포 공통 완료 조건 **staging 배포 green**(`CLAUDE.md §0`)이 그대로 붙는다. ⚠ 기각된 대안 둘 = ⓐ 「지도에서 확대까지」로 넓히기 ⓑ 「스위치를 켜고 파이프라인이 완주하면」 — 근거는 `〈189〉`-㉯ 에만 적는다. ⭑ **⟨증보 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈190〉`·`〈191〉`⟩ 위 축자 완료 정의는 그대로 두고, 배선 둘과 유실 감지 장치를 완료 조건에 더한다 — 원문은 지우지 않는다.** **⑴ 장부 반영 경로 = 사건 경유** — 파이프라인이 `file.header-parsed`·`file.crs-normalized`·`preview.cog-built` 를 **실제로 발행**하고(staging 실측 현재 각 **0건**), 카탈로그가 받아 적어 `d3_dataset_autometa` 의 `format`·`crs`·`grid` 가 **NULL 이 아니게 된다**(현재 **12행 전건 NULL**). **⑵ 산출물의 자리 = 저장 규약에 「미리보기 산출물」 종류가 서 있고**(`contracts/storage/layout.json` · 동결 해제 ㉯ 절차를 탄 뒤) **산출물이 그 자리에 기록되어 다시 만들지 않고 찾아 쓸 수 있다.** **⑶ 유실 감지 — 축자:** 「**사건이 발행되고도 장부에 반영되지 않으면 red 를 낸다 — 발행 건수와 기록 건수를 대조해 어긋나면 실패로 계수한다. 대상 0건도 red 다(green-by-skip 금지).**」 ⚠ **⑶ 이 없으면 「파이프라인은 성공했다는데 값은 비어 있는」 지금 상태가 그대로 재현된다**(`CLAUDE.md §4` green-by-skip). ⚠ **유실 감지를 무엇으로 구현하는지는 `[미확인]`**(`〈190〉`-㉴-⑴)"
    evidence: "⭑ **⟨착수 1회차 2026-08-30 · 워크트리 `lane-pv1` · `sessions/PV-1-DEPLOY-WIRING-20260830.md`⟩ 먼저 쟀다 — 세 갈래가 전부 코드로 서 있었다.** ⑶ 헤더 파싱 = `domains/d5_ingestion.py` ③ 블록이 `file.header-parsed` 를 페이로드까지 채워 발행한다 · ⑷ 좌표계 통일 = 같은 파일 ④ 블록이 `file.crs-normalized`(`source_crs`→`TARGET_CRS`)를 발행한다 · ⑸ 지도용 영상 변환 = `d5/pipeline.py run_file` 이 `previews_root` 를 받아 `storage_layout.preview_path` 자리에 `tile-*.tif` 를 굽고 `preview.cog-built` 를 발행한다. **완료 조건 ⑵(저장 규약의 「미리보기 산출물」 종류 · 지도 타일 내용 키)도 `contracts/storage/layout.json` 에 이미 서 있다** — 이번 회차의 계약 동결 해제 **0건**. **완료 조건 ⑶(유실 감지)의 집행부도 서 있다** — 게이트 `autometa-loss`·`preview-tile-slot` ＋ 셀프테스트(12건·12건). **없던 것은 하나뿐이었다 — 배포 선언이다.** `infra/staging/compose.i2.yml` 의 `pipeline-worker` 블록에 `COLAB_WORKER_STAGE2` 도 `COLAB_WORKER_PREVIEW_DIR` 도 없었고 미리보기 볼륨도 안 붙어 있었다. 시험 **5건을 red 로 먼저 세우고**(5 failed) 그 셋을 배선해 green(`tests/test_stage2_deployment_declaration.py` · pipeline-worker **196 → 201 passed / 0 failed**). ⛔ **닫지 않는다 — 남은 조건 셋**: ㈎ **staging 재배포**(배선은 트리에 있고 도는 배포에는 아직 없다 — 배포는 이 회차의 권한 밖이라 **멈추고 보고했다**) ㈏ **`COLAB_PREVIEW_TILE_DIR` 를 선언할 호스트 경로**(실측 = `docker volume inspect` 의 마운트 지점이 `Permission denied` · named volume 이라 게이트 사용자가 못 읽는다 — **없는 자리를 지어내지 않는다**) ㈐ 그 뒤 **게이트 `autometa-loss`·`preview-tile-slot` 실판정 green**. 게이트 `all` before **green 33 / red(판정) 1 / red(준비) 1** → after **동일**(이번 변경이 만든 red 0건 · 우회·검사범위 축소 0건). ⭑ **⟨착수 2회차 2026-08-31 · 워크트리 `lane-pv1b` · `sessions/PV-1-PREVIEW-ROOT-DEPLOY-20260831.md` · 판정 `PLAN-SoT §9 〈235〉`·`〈236〉`⟩ 남은 셋 중 ㈎·㈏ 가 닫혔다.** **㈏ 자리 = 호스트 경로로 내줬다**(`#49` 해소) — `compose.i2.yml` 의 `previews` 를 **이름은 그대로 둔 채** 호스트 바인드로 바꿨다(백업이 볼륨을 이름으로 문다). 이관 실측 = 옛 볼륨 **39 파일 · 6.3 MB**(비어 있지 않았다) → 새 자리, 목록 sha256 집계 **양쪽 동일**. 백업은 주장하지 않고 **실물로 검증**했다 — `backup-full.sh` 전범위 GREEN · `previews` 아카이브 40건 · **이번에 구운 타일이 매니페스트·tar 양쪽에** 들어 있다. **㈎ 재배포 = GREEN**(태그 `2ef0276ab349` · 헬스 6종 **본문 대조** · 컨테이너 8 healthy · 두 체인 head · 별칭 `:i2` 이미지 ID 대조 6종 — **루트 200 으로 판정하지 않았다**). **실업로드로 쟀다** — `file.header-parsed`·`file.crs-normalized`·`preview.cog-built` **셋 다 종전 0건 → 발행**, `createDataset` 뒤 `d3_dataset_autometa` 의 `format`·`crs`·`grid` **전부 채워짐**(`GeoTIFF`·`EPSG:4326`·`1280x1280`), 자리에 **지도 타일 1건**. **재사용도 쟀다** — 같은 바이트를 다시 올리니 사건은 나는데 타일은 **mtime·크기 불변·1건 그대로**(굽지 않고 찾아 썼다 = 완료 조건 ⑵ 축자). ⚠ **옛 12행은 여전히 NULL** — stage 1 시절 접수분이고 소급 채움은 범위 밖이다. 게이트 `all` **before green 33 / red(판정) 1 / red(준비) 1 → after green 34 / red(판정) 1 / red(준비) 0**(`preview-tile-slot` **red(준비) → green**) · pipeline-worker **201 → 204 passed / 0 failed** · 우회·검사범위 축소 **0건**. ⛔ **그래도 닫지 않는다 — 남은 차단 하나(`§4` #50)**: `autometa-loss` 가 `gates/run.sh all` 에서 읽는 적용 DB 는 **스키마만 있는 일회용 DB** 라 대조 대상이 **구조적으로 0건**이고 「대상 0건도 red」가 그 게이트의 설계다. **staging 실물로 재면 green**(발행 3 · 반영 3 · 미반영 0). **어느 DB 가 대조 정본인가는 이 회차가 정할 사안이 아니다.** **부분 완료로 닫지 않는다.**"
    deadline: null
    note: "⭑ **2026-08-29 신설** — `D5` 의 stage 2 파트(`§6` D5 행 ⑶⑷⑸)를 독립 행으로 세운 것이다. **`D5` 항목은 그대로 남는다**(`partial` · stage 1 판 완료 정의). 종전에는 `WORK-UNITS §10.2`·`§10.2-b` 두 표에 행이 없고 `§11` 「경계」줄 괄호 주석으로만 존재해 **기계가 세지 못했다** — 그 괄호 주석은 지우지 않고 개정 표시로 남겼다. ⚠ **이 단계를 「가공」이라 부르지 않는다 — 「미리보기」다**(`〈189〉`-㉰). ⚠ **착수 순서(`WORK-UNITS §10.3` 어느 단인지)는 이번 판정 범위 밖 — `[미확인]`**(`〈189〉`-㉷-⑵) ⭑ **2026-08-29 증보** — 배선 판정 둘이 붙었다(`〈190〉` 사건 경유 · `〈191〉` 저장 규약 종류 신설). **값·근거는 `PLAN-SoT §9` 에만 있다.** ／ ⛔ **⟨증보 2026-09-01 · `PLAN-SoT §9 〈264〉`-㉮⟩ 이 항목은 `done` 으로 남는다. 완료 조건 ⑵ 의 문면도 고치지 않는다 — 원문을 지우지 않는다.** 다만 그 조건이 증명된 실측(`〈236〉` 축자 — 「같은 바이트를 다시 올리니 … 타일은 mtime·크기 불변·1건 그대로」)은 **대상 간 재사용**이고, Ted 판정 2026-09-01 ③(안 ⑴ 데이터셋 종속 전환)이 서면 **그 실측은 재현되지 않는다.** ⟹ 되살릴 책임을 `A-1` 완료 정의 ⑺ 이 진다(**대상 내 판**으로 다시 세운다 ＋ 대상 간 손실이 의도된 것임을 시험으로 못 박는다). 되돌리지 않는 근거는 `〈264〉`-㉮ 에만 적는다."
