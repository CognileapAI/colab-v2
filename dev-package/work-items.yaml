    completion_def: >-
      이 레포엔 공용 PageShell 이 없고 화면 뿌리 클래스가 자기 여백을 적는 관례(`catalog.css:24`·`detail.css:27`)인데
      `project.css` 에 `.project-page`·`.project-detail` 뿌리 규칙이 **0건**이었고, 되돌아가기 줄은 `detail.css` 가 `.detail-page` 로만 스코프해 프로젝트 상세에 닿지 않았다.
      `shell.css:148` `.gnb-settings` 만 `gap` 누락(형제 6~7px). (`reports/bug-20260903/recon-C-layout.md §1~§4`)
