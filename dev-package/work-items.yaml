    completion_def: "정본 = `WORK-UNITS §10.2` (완료 정의 12행 · 초안 `sessions/R1-RESTORE-DRAFT.md`) ＋ 볼륨 백업 절차 ＋ `install-schedule.sh install` 재실행. ⭑ ⟨**미확정 4행의 통과 기준 확정** 2026-08-31 · Ted RULING ㉙ · 등재 `PLAN-SoT §9 〈255〉`⟩ **⑴ 크론 첫 회차 로그** = 「`backup-full.sh` 의 크론 **무인** 회차가 **연속 3회 이상 GREEN** ＋ 각 회차 로그에 **1단 회차 표지**(`═══ 1단`) ＋ **같은 회차 스탬프의 볼륨 산출물이 보관처에 실재**」. 손으로 돌린 GREEN 은 세지 않는다. ⚠ **약점 = 자동 감시가 주 1회뿐이다** — 강제하는 것은 월요 04:10 `latest-check.sh` 하나이고 그것은 못 뜬 것을 뒤늦게 알린다. **최대 1주 침묵**이 가능하고, `gates/run.sh` 에 이 행을 재는 게이트는 **0건**이다. **⑵ `POST /searches` 1회** = **행을 유지한다.** 이것은 검색 **화면**이 아니라 **복원 검증용 서비스 탐침**이다(`RUNBOOK §5` ③-보). 기준 = 「복원된 스택에서 `ai-service` `POST /searches` 1회가 **200 ＋ `degraded:false` ＋ 원 질의에 없던 확장 낱말 1개 이상**」. 상태코드만 보면 사전이 끊겨도 통과한다. ⛔ **그 행의 잔여 조각인 core-api 중계 다리(정문 `POST /api/v1/dataset-searches` 세션 왕복)는 이 행에서 빼고 stage 3 몫으로 옮긴다** — 그 정문은 검색 화면의 경로이고 `P4`(`after_stage2`)와 같은 단이다. **행 전체를 뺀 것이 아니다.** **⑶ `preflight` 성질** = **「입력을 다 주면 GREEN 이 된다」.** RED 의 사유가 **입력 부재(P6·P7·P8)와 의도된 fail-closed(P9)뿐**이고, 그 밖의 사유가 하나라도 있으면 **결함**이다. ／ 종전 문면 ~~「리허설 경로에서 GREEN 이 못 되는 것은 의도다」~~ — **취소선으로 보존한다.** 바꾸는 이유 = 종전 문면이 **새 결함을 의도로 흡수한다**. 실제로 `P5-b` 가 그렇게 8일을 숨었다(`〈207〉`-㉲). 자동 강제 = **예**(`selftest-restore.sh` fixture 25건 GREEN). **⑷ `:i2` 별칭** = 「배포·롤백 회차마다 `RELEASE_IMAGES` **6종 전건**이 digest 이력에 `[미측정]` **0건**으로 적히고, `:i2` 가 그 릴리스 태그와 **이미지 ID 로 일치**한다」. ⚠ **약점 = 배포 경로 안에서만 강제된다** — `deploy.sh` ⑫-a 의 사후 대조(불일치 시 abort)와 append-only 원장이 강제하고, **`gates/run.sh` 에는 이 행을 재는 게이트가 0건**이다. **배포를 돌리지 않는 회차는 이 행을 재지 않는다.** ⛔ **그래도 `R-1` 을 닫지 않는다 — 남은 조건은 `note` 말미에 명시했다.**"
