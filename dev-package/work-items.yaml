    note: "⭑ ⟨후속 판정 2026-09-05 · Ted · 등재 `PLAN-SoT §9 〈315〉`-㉯⟩ **판정 불가 19벌 = 걸린 데이터셋을 다시 굽고 `artifact-ownership` 을 재계수한다 — `tolerate` 기한 연장이 아니다.** 이 항목(`RC-1`)은 `done` 이라 다시 열지 않는다 — 재굽기·재계수는 **다음 staging 창의 진입조건/단계**로 지고 간다(`03-HANDOFF §4.5`). ⚠ **대상 데이터셋 목록은 이 세션이 갖고 있지 않다 — `[미확인]`, 그 창에서 실측한다.** ⭑ **⟨신설 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉰⟩ 소유가 없어 `[미확인]` 으로 떠 있던 자리를 항목으로 세웠다.** 종전 기록 = `V-1.completion_def_draft` ⓒ 축자 「**별도 작업**이고, 그 자리는 `J-1` 묶음도 `Y-1` 도 지고 있지 않다 `[미확인] · 소유 미정`」. **왜 `V-1` 이 지지 않는가** = 회수 후보 목록(`_produced_for`)이 **이 프로세스가 스스로 구운 것만** 세고 디렉터리를 훑지 않으므로(코드 주석이 그 이유를 적어 두었다 — 자리가 평평해 훑으면 남의 대상까지 집는다), 그리는 서버가 다시 뜨면 옛 파일은 후보가 아니다. ⟹ **`V-1` 이 서도 쌓인 분은 정리되지 않는다.** ⚠ **`03-HANDOFF §1`·`WORK-UNITS §11` 에는 행을 세우지 않았다** — 신설 시점의 근거가 실측이 아니라 분리 판정이고, 착수 회차가 행을 세운다.⭑ **⟨관측 2026-09-03 · 등재 `PLAN-SoT §9 〈305〉` · 근거 `sessions/V-2-CLOSE-20260903.md §4`⟩ **진입조건으로 읽는다 — 이 항목이 훑을 자리에 산출물이 있는 대상은 14 중 3 건이다.** staging 카탈로그 **14건 전수**를 값 조회 1회씩으로 훑은 실측 = `available:true` **3건**(`01M0YWDXN7CA13KB7MQC9PGEW5` · `01M1JM3JTQSSTKR9A2QQ67QN81` · `01M19RENXAANZ2HDWM4Z46C37Y`) · **11건은 `200 ＋ available:false ＋ 「자리에 산출물이 없다」`**(`E-2` 의 tif·nc·gz·hdf 넷 포함). ⚠ **`E-2` 의 엣지 왕복을 근거로 「그 5종에 타일이 있다」고 읽으면 안 된다** — `E-2` 가 잰 것은 **렌더 한 장의 왕복**이지 **자리에 구운 COG 의 유무**가 아니다. 둘은 다른 자리다. ⚠ **종전 설명은 낡았다** — `〈254〉` 실측 ⑥(「`NumPy`·`GRIB` 는 지원 목록 밖」)은 `#58`(`44bef51`)이 파서를 넷에서 여섯으로 채우며 **부분적으로 뒤집혔다**(`d5/pipeline.py COG_BUILDERS` 실측 **다섯**). ⛔ **원인 `[미확인]` — 추측하지 않는다.** 푸는 법 = staging 의 자리(`previews`)를 **읽기 전용**으로 세어 대상별 `tile-` 벌의 유무를 직접 대조하고 각 데이터셋의 적재 시각과 견준다. ⚠ **차단이 아니다** — 지금 막히는 항목은 0건이고, 이 항목이 훑는 모집단의 크기를 미리 아는 것이 목적이다. ⭑ **⟨진입조건 증보 2026-09-03 · `PLAN-SoT §9 〈307〉`-㉷⑶·㉸ · 워크트리 `lane-307`⟩ 이 항목은 **배포 직후에 서야 하고, 그 전에 소유 계수를 읽으면 안 된다.** `〈307〉` 이 viz-render 캐시 키에 **시각·격자 digest** 를 넣었다 ⟹ 배포 순간 **기존 산출물·타일이 전량 미스**가 된다. ⛔ **하드 진입조건 — `main` 을 staging 에 배포한 뒤, 산출물 재굽기와 소유 네 등급 재실측을 돌리기 전에는 이 항목의 완료 조건(판정 불가 49 → 19)을 판정하지 않는다.** 배포만 하고 재굽기를 건너뛴 채 읽은 계수는 **키가 갈려서 난 미스**이지 소유 판정이 아니다 — 종전 회차가 「바뀌지 않은 것이 정상이다」로 읽던 근거(`〈273〉`-⑸)가 배포 뒤에는 **참이 아니다.** ⚠ **차단이 아니라 순서다** — 막는 것은 0건이고, 정하는 것은 「무엇 뒤에 재는가」다. 값·근거는 `〈307〉` 에만 적는다(이 줄은 링크만 든다). 같은 순서를 `03-HANDOFF §4.5` 「다음 회차가 지고 갈 것」 ⑵ 와 대장 `CR-2` 가 같이 든다.⭑ **⟨하드 진입조건 충족 2026-09-04 · `PLAN-SoT §9 〈308〉` · 워크트리 `lane-window-b3` · 근거 `sessions/WINDOW-20260903-B3.md`⟩ `〈307〉` 이 건 하드 진입조건(「재굽기 전 판정 금지」)이 풀렸다 — **재굽기가 집행됐고 전후 계수가 둘 다 축자로 남았다.** **전**(2026-09-04T01:01:06+09:00) = `산출물 소유 — 대상 한 벌 108 · 살아 있다 75 · 접수분에만 닿는다 0 · 고아 14 · 판정 불가 19` · **후**(2026-09-04T01:06:35+09:00) = `산출물 소유 — 대상 한 벌 117 · 살아 있다 84 · 접수분에만 닿는다 0 · 고아 14 · 판정 불가 19`. 재굽기 = 공개 엣지 `POST /api/v1/previews` 3건(`01M0YWDXN7CA13KB7MQC9PGEW5`·`01M1JM3JTQSSTKR9A2QQ67QN81`·`01M19RENXAANZ2HDWM4Z46C37Y`) · 9층 전건 200 · 실패 0. ⭑ **델타가 말하는 것 = `+9`(3 데이터셋 × 3층)가 전건 `살아 있다` 로 섰고, 판정 불가 19 · 고아 14 는 한 벌도 움직이지 않았다.** **재굽기는 더하기만 한다 — 옛 벌은 그 자리에 남는다.** ⟹ **남은 집행은 회수 한 자리**(`invalidation.reclaim_plan()` → `apply()` · 완료 정의 ⑶). ⛔ **갈라야 할 것 둘** — 고아 14 는 원본이 사라진 것이라 지우는 대상이고, **판정 불가 19 는 「구판 · 판정 보류」라 없는 필드를 근거로 지우면 그것이 오삭제다**(게이트 덫 ②). 보류는 `gates/config/artifact-ownership.toml` `[legacy] tolerate` 에 **이름으로** 선언하고 건수를 드러낸다. ⚠ **이 회차는 아무것도 지우지 않았다 — 삭제 0건** 이고 `status` 는 `open` 그대로다. ⚠ **재지 않은 판단기준** = 캐시 키가 갈린 원인의 귀속(`[미확인]` — 직전 팔레트를 읽을 경로가 상세에도 사이드카에도 없어 팔레트 차이와 리팩터 차이가 갈리지 않는다).⭑ ⟨재굽기 2회차 ＋ 계수 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`done` 유지 — 이 회차는 이 항목을 다시 열지 않는다.** `BF-2` 배포(`f465d83a2ef1`)로 ③지도형 캐시 키가 예고대로 갈렸고 **재굽기 2회차**를 공개 엣지 `POST /api/v1/previews` 3건(팔레트 `단색-파랑` · renderId `01M1P8MMM5G81K7KW754MXSYA8`·`01M1P8MN2S2A300F9RG212PMZB`·`01M1P8MNCV92X3AFB56K713D1Z`)으로 돌았다 — 9층 전건 200 · 실패 0. **계수(축자)** — 재굽기 **전** `산출물 소유 — 대상 한 벌 104 · 살아 있다 85 · 접수분에만 닿는다 0 · 고아 0 · 판정 불가 19`(스냅숏 230 줄) → **후** `산출물 소유 — 대상 한 벌 106 · 살아 있다 87 · 접수분에만 닿는다 0 · 고아 0 · 판정 불가 19`(스냅숏 236 줄). ⛔ **A4 §6⑷ 의 기대치 `+9` 는 서지 않았다 — 실측은 `+3`(자리 파일 +9)** 이고 그 차이는 갈린 층이 ③지도형 하나뿐이라 ①②가 기존 키를 되돌려받은 것으로 설명된다. ⚠ `〈309〉` 대비 첫 +1 벌은 재굽기가 아니라 **상세 화면 GET 이 낸 온디맨드 굽기**(GK-2A ③ `50dc2d4d…` · 21:59:37)다 — 이 창이 화면 확인을 재굽기보다 먼저 돌린 탓이고, 감추지 않는다. 근거 `sessions/WINDOW-20260904-B4.md §3.1`·`§4`·`§5`."
