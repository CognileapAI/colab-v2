    note: "`03-HANDOFF §1 T-X` 는 상태 칸에 🟧 를 적으면서 같은 칸 본문에 ⛔ 글리프를 함께 쓴다. `WORK-UNITS §10.2` 는 ⛔(「그래도 R-1 은 열려 있다」가 두 번 반복)로, 같은 문서 `§10.3` 은 「기구 ✅ · 유인 1회 GREEN ✅ · 크론 첫 회차 로그 대기」로 적는다. 완료 정의 12행은 전건 ✅ 인데 남은 넷(크론 첫 회차 로그 · `POST /searches` 1회 · `preflight` 성질 판정 · `:i2` 태그 이력)이 있다. 어느 하나를 고르지 않는다. ⭑ **2026-08-28 — 넷 중 첫째를 실측했고, 닫히지 않았다**(`evidence` 필드). 실측이 갈라짐을 없애지는 않는다 — `§10.2` 는 여전히 ⛔ 이고 `§10.3` 은 진행 표기다. **`status: conflict` 를 그대로 둔다.** 남은 셋(`POST /searches` · `preflight` 성질 · `:i2` 이력)은 미실측이다. ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈187〉`-㉮⟩ 잔여 넷 중 첫째가 닫혔다** — `backup-full.sh` 의 크론 무인 첫 회차 **2026-08-29 03:30 GREEN** 실측. 그 전까지는 원장 전용 백업만 돌면서 GREEN 이 찍히던 green-by-skip 자리였다. **`R-1` 항목 자체는 닫지 않는다 — 남은 셋은 여전히 미측정 `[미확인]` 이고 `status: conflict` 를 유지한다.** ⭑ **⟨개정 2026-08-29 저녁 · `PLAN-SoT §9 〈207〉`⟩ `status` 를 `conflict` → `partial` 로 갈았다.** `conflict` 는 **「산문끼리 갈린 채 남아 있다」의 기록**이었고, 이 회차가 갈린 산문 셋(`03-HANDOFF §1 T-X` · `WORK-UNITS §10.2` · `§10.3`)을 실측에 맞춰 걷었다. **남은 셋 중 둘이 닫혔다** — 읽는 경로 1회 · `preflight` 성질 판정. **여전히 열려 있는 것은 `:i2` 태그 이동 이력 하나**이고, 그것은 `[미확인]` 이 아니라 **「이력을 남기는 기구가 없다」는 실측된 결손**이다. **그래서 `done` 이 아니라 `partial` 이다.** ⚠ 이 회차가 새로 연 것 = `preflight` 의 `P5-b` 산출물 선택 결함(`〈207〉-㉲`) — **`R-1` 의 꼬리가 아니라 별건이다.** ⭑ **⟨실측 ＋ 기준 제안 2026-08-31 · Ted 판정 ㉒ · 워크트리 `lane-ops`⟩ 미확정 4행을 실측하고 통과 기준을 **제안으로** 적는다. **확정은 Ted 몫이고, 확정 전까지 이 항목을 닫지 않는다**(`status: partial` 유지).** **⑴ 크론 첫 회차 로그 — 재고 있다. 적어 두지 않았을 뿐이다.** 실측 `~/colab-v2-backups/LAST-SUCCESS.txt` = `backup-full.sh OK` **무인 회차 3회**(`2026-08-29T03:30:41` · `2026-08-30T03:30:38` · `2026-08-31T03:30:45`) ＋ 주간 `latest-check.sh OK` `2026-08-31T04:10:13`. 로그 `staging-backup.log` 에 `backup-full.sh` 표지 `═══ 1단` **3회**(08-29·08-30·08-31). 보관처에 그 회차의 `vol-uploads`·`vol-previews` 실재. **제안 기준** = 「`backup-full.sh` 의 크론 무인 회차가 **연속 3회 이상 GREEN**, 각 회차 로그에 `═══ 1단` 표지, **같은 회차 스탬프의 볼륨 산출물이 보관처에 실재**」 — 손으로 돌린 GREEN 은 세지 않는다. **자동 강제 = 부분.** 강제하는 것은 월요 04:10 `latest-check.sh` 하나이고 그것은 **못 뜬 것을 뒤늦게 알리는 장치**다(최대 1주 침묵 · `IS3` note 가 이미 적은 한계). **`gates/run.sh` 에 이 행을 재는 게이트는 0건이다.** **⑵ `POST /searches` 1회 — 행 자체는 지금도 유효하다. 빼자는 것은 그 잔여 하나다.** **유효성 판정** = 이 행은 검색 **화면**이 아니라 **복원 검증 블록 `§4.6-③-보`「읽는 경로까지 살아 있다」**의 오라클이고, 재는 대상은 **`ai-service` 서비스**다. 검색 화면(`P4`)과 `K4` 가 `after_stage2` 로 간 것과 **모수가 다르다** — `ai-service` 는 staging 에 healthy 로 서 있다(실측 `colab_v2_staging_ai_service` Up · healthy). **복원이 DB 를 되돌렸을 때 사전이 조용히 비는 사고(`〈153〉`)를 잡는 유일한 탐침**이라 빼면 그 자리가 헬스 200 으로만 지켜진다. **⟹ 행을 유지하자고 제안한다.** ⛔ **다만 이 행의 잔여 `[미확인]`(core-api 중계 다리 = 정문 `POST /api/v1/dataset-searches` 세션 왕복)은 빼자고 제안한다** — 그 정문은 검색 화면의 경로이고 `P4`(`after_stage2`)와 함께 stage 3 몫이다. **임의로 빼지 않았다.** **제안 기준** = 「복원된 스택에서 `ai-service` `POST /searches` 1회가 **200 ＋ `degraded:false` ＋ 원 질의에 없던 확장 낱말 1개 이상**」 — 상태코드만 보면 사전이 끊겨도 통과한다(`〈207〉-㉯` 가 적은 green-by-skip 자리). **자동 강제 = 아니오.** `verify-restored.sh:59`·`:109` 축자가 이것을 **손검사**로 명시하고 스크립트 스스로 「복원 검증 **미완** — 손검사 2건」을 찍는다. ⚠ **이 회차는 이 값을 다시 재지 못했다**(도구 제한으로 컨테이너 안 요청이 막혔다) — **최신 실측값은 `〈207〉` 의 2026-08-29 20:49·20:50 그대로이고, 이 회차의 값으로 적지 않는다.** **⑶ `preflight` 성질 — 재측정했고, `〈207〉` 이 남긴 결함이 사라졌다.** 실측 `bash infra/staging/restore/preflight.sh`(무인자) = **RED 11건**(P6 **8** 환경 미source · P7 **1** 복원 직전 백업 미지목 · P8 **1** `--record-digests` 미지정 · P9 **1** `COLAB_RESTORE_CAUSE` 빈 값). **`P5-b` 2건이 사라졌다** — `pick()` 이 회차 단위로 한 벌을 고르고 볼륨마다 `.pair` 를 두게 고쳐져 **P5-b 볼륨 uploads·previews 짝 = `platform-20260831T033009.sql.gz` 로 PASS**. 즉 `〈207〉-㉲` 가 연 별건은 **닫혔다.** **제안 기준** = 종전 문면(「리허설 경로에서 GREEN 이 못 되는 것은 의도다」)을 **「입력을 다 주면 GREEN 이 된다」로 바꾼다** — RED 의 사유가 **입력 부재(P6·P7·P8)와 의도된 fail-closed(P9)뿐**이고, 그 밖의 사유가 하나라도 있으면 결함이다. 종전 문면은 「GREEN 이 안 되는 것이 정상」이라 **새 결함을 의도로 흡수해 버린다** — `P5-b` 가 실제로 그렇게 8일을 숨었다. **자동 강제 = 예.** `infra/staging/restore/selftest-restore.sh`(fixture **23 → 25**건 GREEN). ⭑ **이 회차가 그 셀프테스트로 침묵 결함 하나를 더 잡았다** — `preflight.sh` P4(sha256 무결성) 루프가 `${!ART[@]:-}`(따옴표 포함 표기) 로 적혀 있어 bash 가 「invalid variable name」을 내고 **본문이 한 번도 돌지 않았다.** `fail` 이 안 불리므로 **손상된 산출물이 P4 를 조용히 통과**했다(이 레포 대표 실패형). **먼저 red 를 세우고**(SR19 「P4 대조가 0건이다(기대 4)」 · SR19-b 「손상된 산출물이 P4 를 통과했다」) 고쳤고, 고친 뒤 실산출물 **P4 4건 전건 일치 PASS**(platform · ai · vol-uploads · vol-previews). **⑷ `:i2` 별칭 — 재고 있다. 이력 기구가 `〈207〉` 이후 생겼다.** 실측 셋 = ⓐ `deploy.sh` ⑫-a 가 **붙인 뒤 `image inspect` 로 이미지 ID 를 대조**하고 어긋나면 `abort`(「붙였다」 ≠ 「가리킨다」) ⓑ `pipeline/lib.sh digest_ledger_append` 가 별칭 이동마다 **append-only 이력**을 적는다 — `~/colab-v2-releases/image-digest-ledger.tsv` **36줄**, 최근 세 릴리스(`fb4cc2bfa9a8`·`273bbd64eef6`·`de2241ad83ef`)가 각각 **6종 전건** 기록 · `[미측정]` **0건** ⓒ `restore/check-image-digests.sh` 가 **compose 를 검사 범위의 정본**으로 삼아 미선언을 RED 로 낸다. **`〈207〉`-㉲ 가 적은 「이력을 남기는 기구가 없다」는 더 이상 실물과 맞지 않는다.** **제안 기준** = 「배포·롤백 회차마다 `RELEASE_IMAGES` **6종 전건**이 digest 이력에 `[미측정]` 없이 적히고, `:i2` 가 그 릴리스 태그와 **이미지 ID 로 일치**한다」. **자동 강제 = 예(배포 경로 안에서).** `deploy.sh`·`rollback.sh` 가 실패를 삼키지 않고 abort 하며, `selftest-restore.sh` **SR18**(두 회차 4줄 append · 덮어쓰기 없음) · **SR18-b**(실측 불가 → `[미측정]` 기재 ＋ 실패)가 fail-closed 를 증명한다. ⚠ **게이트(`gates/run.sh`)에는 이 행을 재는 게이트가 0건**이고 강제는 배포 스크립트 안에서만 이뤄진다 — 배포를 돌리지 않는 회차는 이 행을 재지 않는다. ⛔ **Ted 확정 대기 — 이 항목을 닫지 않는다.** 확정받을 것 넷 = ⑴ 연속 3회 기준 · ⑵ 행 유지 ＋ 잔여(core-api 중계 다리) 제거 · ⑶ 성질 문면 교체 · ⑷ 6종·`[미측정]` 0 기준. **`status: partial` 유지.** ⭑ **⟨확정 2026-08-31 · Ted RULING ㉙ · 등재 `PLAN-SoT §9 〈255〉` · 워크트리 `lane-checklist`⟩ 위 네 「제안」이 전부 **확정**됐다 — 기준 문면은 `completion_def` 로 옮겼고, 약점 둘(⑴ 주 1회 감시 · ⑷ 배포 경로 한정)도 거기 함께 적었다.** **㉮ ⑵ 의 분리를 집행했다** — 이 행이 재는 것은 `ai-service` `POST /searches` 하나이고, **core-api 중계 다리(정문 세션 왕복)는 이 행에서 나갔다.** 그 조각의 새 자리 = **stage 3**(`P4` 와 같은 단). **행 전체를 뺀 것이 아니다** — 복원이 DB 를 되돌렸을 때 사전이 조용히 비는 사고(`〈153〉`)를 잡는 유일한 탐침이라 그대로 둔다. **㉯ ⑶ 의 문면 교체가 실제로 바꾼 것** = **판정 규칙이 뒤집혔다.** 종전 문면에서는 RED 가 몇 건이든 「의도」로 읽혀 **결함이 사유별로 걸러지지 않았다**. 새 문면에서는 **사유가 오라클**이다 — 입력 부재(P6·P7·P8)·의도된 fail-closed(P9) **밖의 사유가 1건이라도 있으면 red** 다. `P5-b` 가 8일을 숨은 자리가 이 규칙 아래에서는 첫 회차에 걸린다. 문면을 옮겨 적은 자리 = `WORK-UNITS §10.3` 1단 · `infra/staging/restore/RUNBOOK.md §1`. ⛔ **`R-1` 을 닫지 않는다 — 남은 조건을 실측으로 확인했고, 다음 셋이 남는다.** **ⓐ ⑵ 를 이 회차의 값으로 재지 못했다** — 최신 실측은 `〈207〉` 의 2026-08-29 20:49·20:50 이고, **복원된 스택에서** 재는 회차가 아직 0건이다(기준이 요구하는 모수는 「복원된 스택」이다). **ⓑ ⑴ 의 「연속 3회」는 충족이지만 재는 기구가 게이트 밖에 있다** — 실측 3회(08-29·08-30·08-31)로 기준은 섰으나, **다음 회차가 이 값을 자동으로 다시 재지 않는다.** 회차마다 사람이 `LAST-SUCCESS.txt` 를 본다. **ⓒ 완료 정의 12행 중 `RUNBOOK §5` ⑤(권한·RLS 양성·음성)와 ③-보가 여전히 손검사다** — `verify-restored.sh` 스스로 「복원 검증 **미완** — 손검사 2건」을 찍는다. **부분 완료로 닫지 않는다**(`CLAUDE.md §5`). 이 셋은 `dev-package/PR-CHECKLIST.md` 에 올렸다. ⭑ **⟨현황 2026-09-02 · `PLAN-SoT §9 〈278〉`-㉲⟩ 값·근거는 그 회차에 있다 — `status: partial` 유지.** ⑴ **크론 무인 연속 GREEN 실측 5회**(2026-08-29 ~ 09-02 · **끊긴 날 0**) ⟹ 완료 정의 ⑴ 의 **3회 창은 2026-08-31 완료**. ⑵ **재측정기 신설 ＋ fail-closed 픽스처 30건.** ⑶ **잔여 둘** = 복원된 스택에서 **검색 1회**(200 ＋ `degraded:false` ＋ 확장 낱말 1개 이상) ＋ **운영 안내서 손검사 2건의 자동화**. ⑷ ⭑ **복원 실행은 Ted 승인됐다 — 조건은 「단독 창」**(다른 레인이 같은 스택을 건드리지 않는 회차). ⟹ **부분 충족으로 닫지 않는다.**"
