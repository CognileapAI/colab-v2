  - id: F-1
    name: "S-08 화면 (미등록 미리보기 화면 자체)"
    status: in_progress
    stage: stage2
    owner: "frontend"
    entry_conditions: ["P3 와 병렬 가능"]
    depends_on: []
    completion_def: "2026-08-28 기재(Ted 판정 `PLAN-SoT §9 〈183〉` · 근거 산출 `sessions/F1-SCOPE.md`) — ⑴ **도달 경로** = 업로드 모달에서 「보기만 할게요」를 고르면 이 화면으로 간다(라우트 연결 ＋ 모달이 실제로 이동). 「연구실에 등록으로 되돌아가기」는 범위 밖 ⑵ ⭑ ⟨개정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈210〉`⟩ **구간 수 컨트롤은 남긴다 — 「정본 무근거」가 사실이 아니었다.** 정본 `Policy_데이터셋_상세.md` 두 줄이 그 값을 준다(축자·행 번호 = `〈210〉`). **팔레트는 여전히 범위 밖**(`V-1` 서버측 재렌더 · `J-1` 고르는 UI 소유). ⚠ **미해소 기획 질문 1건 — 지어내지 않는다.** 정본이 그 컨트롤을 주는 자리는 **데이터셋 상세 화면의 `업로드·편집` 권한자**이고 (권한이 없으면 편집 컨트롤이 화면에 없다고 같은 정본이 적는다), 이 드롭다운이 사는 **미등록 미리보기 화면은 정본이 다루지 않는다.** 그 화면에서의 권한·노출 규칙 = `[미확인]`. 푸는 법 = Ted 가 정본에 이 화면의 컨트롤 행을 세우거나 이 화면 전용 규칙을 판정한다 ／ 이전 ~~⑵ **표현 변경 없음 — 보기만**(팔레트 변경·구간 조절 없음. 정본이 이 화면의 컨트롤을 규정하지 않는다 = `정본 무근거`)~~ ⑶ **닫는 기준 = 화면 시험 통과 ＋ 관련 게이트 green.** staging 실배포는 조건이 아니다 — 넣으면 배포 자동화에 묶여 병렬성이 깨진다. **명시적 범위 밖** = 확대 · 타일 · 지도 값 조회 · 스크린샷 · 팔레트 컨트롤 · 등록 복귀 경로(전부 다른 항목 소유)"
    evidence: "근거 산출 `sessions/F1-SCOPE.md` · 완료 정의 판정 `PLAN-SoT §9 〈183〉`. 이번 회차 착수 — 별도 에이전트가 격리 워크트리에서 구현 중이다. **완료가 아니다.**"
    deadline: null
    note: "G4 에서 「S-08 은 P2 편입 권장이 아니라 stage 2 배정」으로 이관된 그 화면. `03-HANDOFF §1` 에는 행이 없다. ⭑ **2026-08-28 — 종전 `완료 정의 미작성` 이 `〈183〉` 으로 기재됐고 상태가 `open` → `in_progress` 로 갔다.** ⚠ `〈183〉` 은 `sessions/F1-SCOPE.md §5` 의 결정 9항 중 1·2·7 만 답한다 — 나머지(정본 §8.1 판정 행 범위 · 목업 대비 · 수명·만료 시험 범위 · 권한 · 타인 접근)는 `[미확인]`."
    sources: ["WORK-UNITS §10.2", "WORK-UNITS §10.3", "PLAN-SoT §9 〈183〉"]

