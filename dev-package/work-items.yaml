# work-items.yaml — 개발 항목 상태의 정본(SSOT)
#
# 이 파일이 항목 상태의 **유일한 원본**이다. `03-HANDOFF §1` · `WORK-UNITS §10~§11` ·
# `PLAN-SoT §9` 의 산문 표기는 이 대장의 **반영본**이지 원본이 아니다.
# 상태를 바꾼다는 것은 **먼저 이 파일을 고치는 것**이고, 산문은 그 뒤에 맞춘다.
# 검사기 = `./gates/run.sh work-item-consistency`. 대장과 산문이 어긋나면 red 다.
#
# `status: conflict` 는 상태가 아니다. **산문 문서끼리 갈린 채 사람의 실측 판정을 기다리는 자리**다.
# 어느 한쪽을 고르거나 평균하거나 「해소」하지 않는다 — 고른 순간 갈렸다는 사실이 사라진다.
# conflict 가 하나라도 남아 있으면 게이트는 ㈓ 로 red 를 낸다. 그 red 가 이 기구의 첫 산출이다.
#
# 이 대장은 두 벌의 독립 읽기(03-HANDOFF §1 66행 · WORK-UNITS §10~§11 74항목)를 합친 것이다.
# 두 읽기는 서로를 보지 않고 만들어졌고, 그 불일치가 여기 그대로 남아 있다.

