    note: "⭑ **⟨신설 2026-09-03 · Ted 판정 · 등재 `PLAN-SoT §9 〈305〉` · 워크트리 `lane-v2rule`⟩ `V-2` 완료 정의 ⑻ 의 읽는 법이 「유휴 후 첫 접촉을 포함한다」로 판정되면서 **실물 결손 하나가 드러났고, 그 집행을 지는 항목으로 이 행을 세운다.** `V-2` 는 판정이 아니라 **기능** 항목이라 닫히지 않고 `in_progress` 로 남으며, **느린 첫 접촉을 고치는 몫은 이 행이 진다.** ⭑ **소유를 `D7 / viz-render` 로 세운 근거** — `〈294〉` 실측에 따라 **자리의 COG 를 여는 것은 viz-render** 다(`app/routes/values.py` ＋ `domains/d7_visualization/value_lookup.py` 가 창 1×1 을 읽고, 자리 이름 재계산의 재료 여섯도 그 안에서 모인다). core-api(`routes/preview.py`)는 접근 판정 뒤 **중계만** 한다. ⚠ **그래도 ⑴ 의 첫 걸음은 「어느 서비스가 느린가」를 가르는 일이다** — 엣지·core-api·viz-render 세 구간이 아직 갈리지 않았고(`〈304〉` — 계측이 클라이언트 벽시계 하나뿐이라 Cloudflare ＋ nginx 가 포함된다), **가른 결과가 D7 밖을 가리키면 소유를 옮긴다.** ⭑ **`stage: stage2` 로 세운 근거** — 선행 `V-2` 가 `stage2` 이고 이 행은 그 완료 정의 한 줄을 닫기 위해 존재한다. 단을 옮기면 `V-2` 가 **닫을 수 없는 채로 `stage2` 에 남는다**(선례 `TL-1`·`RC-1` 도 같은 이유로 `stage2` · `〈302〉`-㉲·`〈289〉`-㉰). ⚠ **계수 효과 = +1 이다 — 감추지 않는다.** `stage2` 미완이 **9 → 10** 이 되고 `PA-G` 개시 조건의 값은 **8 → 9** 다. **`V-2` 가 이 행 없이 닫힐 수 있었던 것이 아니다** — 종전에는 그 결손이 `V-2` 안에 이름 없이 들어 있었고, 이 행은 그것을 **밖으로 꺼내 세었을 뿐**이다. ⚠ **`03-HANDOFF §1`·`WORK-UNITS §11` 에는 행을 세우지 않았다** — `TL-1`·`RC-1` 과 같은 이유로, 신설 근거가 실측이 아니라 판정이고 **착수 회차가 행을 세운다.**⭑ ⟨첫 접촉 채집 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`done` 유지 — `㉳ 재지 않은 것` 중 ⑴ 이 닫혔고 ⑶ 은 후보가 하나 줄었다.** 배포(`f465d83a2ef1`) 직후 `deploy.sh` 종료 3초 안에 값 조회 4건을 **데이터셋당 1회씩** 공개 엣지로 불렀다(원값 `sessions/WINDOW-20260904-FIRSTTOUCH.tsv` 13열 4행). **⑴ 닫힘 — `Server-Timing` 이 공개 엣지를 통과한다.** Cloudflare 가 헤더를 떼지 않는다(`server: cloudflare` · `cf-ray a35d2435caf6f9ad-HKG`) · 배포 **전** 같은 스크립트 대조(21:52:51 · 서빙 `64791f910f49`)는 4건 전부 **헤더 미도착**이었다. 축자 예 = `coreAccess;dur=9.425, coreRelay;dur=97.846, coreTotal;dur=107.271, vizResolve;dur=0.152, vizFindTile;dur=9.151, vizReadPoint;dur=79.135, vizTotal;dur=88.448`. **⑶ 부분 — 재기동 첫 접촉 비용은 실재하나 사용자 시간을 지배하지 않는다.** 1번 호출 `vizReadPoint 79.1 ms`·`coreRelay 97.8 ms` 대 3번 호출 `1.6`·`11.2 ms` 인데 `time_total` 차이는 **110 ms**(0.309 s 대 0.199 s). ⛔ **`〈304〉` 의 1,164 / 2,111 ms 스파이크는 재현되지 않았다** — 첫 접촉 4건 관측 최대 **327 ms**. **후보 ⓓ 로는 설명되지 않는다 ⟹ 원인은 `[미확인]` 그대로이고 후보가 하나 줄었을 뿐이다.** ⚠ **완전한 「사람이 부르는 첫 요청」은 아니다** — `deploy.sh ⑪` 이 `verify-deploy.sh` 로 `/healthz` 6종을 먼저 친다. 다만 값 조회 경로(core-api 데이터셋 라우트 → viz-render 자리 탐색·점 읽기)는 헬스가 밟지 않는 코드다. 근거 `sessions/WINDOW-20260904-B4.md §2`."
    sources: ["PLAN-SoT §9 〈305〉", "PLAN-SoT §9 〈304〉", "PLAN-SoT §9 〈294〉", "sessions/V-2-CLOSE-20260903.md"]

  - id: F-1
    name: "S-08 화면 (미등록 미리보기 화면 자체)"
    status: done
    stage: stage2
    owner: "frontend"
    entry_conditions: ["P3 와 병렬 가능"]
    depends_on: []
    completion_def: "2026-08-28 기재(Ted 판정 `PLAN-SoT §9 〈183〉` · 근거 산출 `sessions/F1-SCOPE.md`) — ⑴ **도달 경로** = 업로드 모달에서 「보기만 할게요」를 고르면 이 화면으로 간다(라우트 연결 ＋ 모달이 실제로 이동). 「연구실에 등록으로 되돌아가기」는 범위 밖 ⑵ ⭑ ⟨개정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈210〉`⟩ **구간 수 컨트롤은 남긴다 — 「정본 무근거」가 사실이 아니었다.** 정본 `Policy_데이터셋_상세.md` 두 줄이 그 값을 준다(축자·행 번호 = `〈210〉`). **팔레트는 여전히 범위 밖**(`V-1` 서버측 재렌더 · `J-1` 고르는 UI 소유). ⚠ **미해소 기획 질문 1건 — 지어내지 않는다.** 정본이 그 컨트롤을 주는 자리는 **데이터셋 상세 화면의 `업로드·편집` 권한자**이고 (권한이 없으면 편집 컨트롤이 화면에 없다고 같은 정본이 적는다), 이 드롭다운이 사는 **미등록 미리보기 화면은 정본이 다루지 않는다.** 그 화면에서의 권한·노출 규칙 = `[미확인]`. 푸는 법 = Ted 가 정본에 이 화면의 컨트롤 행을 세우거나 이 화면 전용 규칙을 판정한다 ／ 이전 ~~⑵ **표현 변경 없음 — 보기만**(팔레트 변경·구간 조절 없음. 정본이 이 화면의 컨트롤을 규정하지 않는다 = `정본 무근거`)~~ ⑶ **닫는 기준 = 화면 시험 통과 ＋ 관련 게이트 green.** staging 실배포는 조건이 아니다 — 넣으면 배포 자동화에 묶여 병렬성이 깨진다. **명시적 범위 밖** = 확대 · 타일 · 지도 값 조회 · 스크린샷 · 팔레트 컨트롤 · 등록 복귀 경로(전부 다른 항목 소유)"
    evidence: "⭑ **⟨2026-08-31 닫힘⟩ 완료 정의 3행 전건 충족 — 실측으로 판정했다.** ⑴ **도달 경로** = 라우팅 표 `frontend/src/app/routes.tsx` 가 `PREVIEW_ROUTE_PATH` 로 `UnregisteredPreviewPage` 를 세우고, 모달 `UploadModal.tsx` 의 `보기만 할게요` 가 `previewNavigation()` 으로 실제로 이동한다. **양쪽 절반이 각각 시험으로 잠겨 있다** — `frontend/test/preview.test.tsx` 「완료 정의 ① — 앱 라우팅 표가 S-08 을 세운다」 · `frontend/test/upload.test.tsx` 「§7.2 전이 — `보기만 할게요` 는 S-08 로 보낸다」(2건) ⑵ **구간 수 컨트롤 있음 · 팔레트 없음** — `PreviewControls.tsx` 가 3~9·기본 6 을 내고 팔레트 자리는 후보 0개다(`〈210〉`). 시험 3건이 값·부재·재렌더 인자를 잠근다 ⑶ **화면 시험 통과 ＋ 게이트 green** — `frontend` 시험 **385건 전건 통과**(종전 383 ＋ 이번 회차 신설 2) · `tsc --noEmit` 오류 0 · `gates/run.sh all` **green 35 / red(판정) 0**. ⭑ **이번 회차 신설 = 음성 시험 2건** — 「S-08 은 언제나 한 장이다」(타일 모자이크·확대 컨트롤 부재). 명시적 범위 밖(확대·타일)이 코드로 새어들면 red 가 되도록 잠갔고, 화면에 `zoom` 을 물리는 변형으로 **red 를 먼저 확인했다**. ⚠ **수명·만료 실서버 시험은 완료 조건이 아니다** — `〈183〉` 이 답한 것은 `F1-SCOPE §5` 의 1·2·7 뿐이고 나머지는 `[미확인]` 그대로다. 근거 산출 `sessions/F1-SCOPE.md` · 완료 정의 판정 `PLAN-SoT §9 〈183〉`·`〈210〉` · 닫음 기록 `PLAN-SoT §9 〈243〉`"
    deadline: null
    note: "G4 에서 「S-08 은 P2 편입 권장이 아니라 stage 2 배정」으로 이관된 그 화면. `03-HANDOFF §1` 에는 행이 없다. ⭑ **2026-08-28 — 종전 `완료 정의 미작성` 이 `〈183〉` 으로 기재됐고 상태가 `open` → `in_progress` 로 갔다.** ⭑ **2026-08-31 — `in_progress` → `done`. 착수 전 실측에서 ⑴·⑵ 는 이미 서 있었고, 이 회차가 더한 것은 범위 밖(타일·확대)을 잠그는 음성 시험 2건과 `〈210〉` 개정을 반영하지 못한 `PreviewControls.tsx` 낡은 주석의 정정뿐이다 — 없던 기능을 새로 만든 회차가 아니다.** ⚠ `〈183〉` 은 `sessions/F1-SCOPE.md §5` 의 결정 9항 중 1·2·7 만 답한다 — 나머지(정본 §8.1 판정 행 범위 · 목업 대비 · 수명·만료 시험 범위 · 권한 · 타인 접근)는 `[미확인]`."
    sources: ["WORK-UNITS §10.2", "WORK-UNITS §10.3", "PLAN-SoT §9 〈183〉", "PLAN-SoT §9 〈210〉", "PLAN-SoT §9 〈243〉"]

