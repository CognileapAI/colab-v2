    evidence: "**staging 첫 실배포 2026-08-29 — 완료 정의 15행 중 닫힘 9 · 열림/부분 6.** 값과 근거 전건 = `PLAN-SoT §9 〈185〉` · 산출 `sessions/I3-BUILD.md`(빌드·수정) · `sessions/I3-POSTDEPLOY.md`(배포 후 실측). ⑴ 원장 3행 = approve 1 · red 1(`0a3ea797dbb1` 롤 부트스트랩) · **green 1**(`2026-08-29T10:08:36 · 30b3e0a7b3f3 · 배포전백업GREEN 워킹트리변경=0`). ⑵ **2차 배포 GREEN** — 판정 15건 · SKIP 0 · 컨테이너 8/8 healthy · 공개 헬스 6종 200 · 노출 `0.0.0.0` 0건 · 서빙 태그 6종 전부 `:30b3e0a7b3f3`(세는 기준 = `verify-deploy.sh` 요약줄 · 시점 2026-08-29 10:16 KST). ⑶ **1차 red 는 설계대로 동작한 것** — 마이그레이션 직전 중단(스키마 무접촉) · 자동 롤백 없이 표식. 진짜 원인은 값 부재가 아니라 **배선**(env 파일이 `--env-file` 로만 넘어가 호스트의 `db-bootstrap.sh` 가 빈 환경으로 돌았다) → 프리플라이트를 ⓪-b 로 앞당기고 요구 목록 정본을 `db-bootstrap.sh required-env` 하나에 뒀다. **변이 시험으로 증명**(그 검사를 빼면 green). ⑷ 기준선 무변경 — 데이터셋 12 · 파일 본체 123(저장 전체 129) · 계보 6 · K2 시드 22(기준 = `colab_platform` 표 행 수 · 시점 = 2026-08-29 01:14/01:29 UTC 동일). ⑸ 게이트 27종 = green 26 · red 1(`work-item-consistency`) · 못 돈 것 0건. **`schema-diff` green — 살아 있는 두 체인 드리프트 0**. ⑹ cloudflared 헬스체크 실물 확정(`healthy`). ⭑ **⟨증보 2026-09-03 · 단독 창 2 단계 F 집행 · 등재 `PLAN-SoT §9 〈301〉` · 근거 `sessions/WINDOW-20260903-F2.md`⟩ 완료 정의 ⑷·⑸ 가 실행으로 닫혔다 — 롤백 왕복을 실제로 돌렸다(전례 0회였다).** **㉮ ⑷ 롤백 왕복** = `72408173be50`(서빙) → `rollback.sh --to-last-green` → **`77813d391f94`** → `deploy.sh --target staging` → **`d9e89a3a074b`**. 각 국면이 **본문으로** 판정됐다 — 롤백 후 `배포 판정: GREEN (통과 15건 · SKIP 0)`(헬스 6종 200 ＋ 본문 단위명 대조 ＋ 컨테이너 8 healthy ＋ `0.0.0.0` 0건), 되돌아온 뒤 같은 판정 GREEN(통과 15 · SKIP 0). 체인은 두 국면 모두 무변경(platform `0011_lv1_drop_level_user_set` · ai `0005_k2b_concept_graph_seed`). **㉯ ⑸ 직전 릴리스 확인** = **헬스가 아니라 서빙 이미지 태그로** 판정했다 — 축자 `서빙 태그 대조 GREEN — 서빙 중인 이미지가 실제로 77813d391f94 다`(`rollback.sh` 「헬스는 태그를 묻지 않는다」). **자리표시가 아니다** — `--to-placeholder` 를 넘기지 않았고 넘긴 플래그는 `--to-last-green` 하나다. 원장 축자 `rollback\t-\t77813d391f94\tgreen\t직전 green 릴리스로 되돌림 (직전 배포=72408173be50) 별칭재부착GREEN digest이력=6종`, 되돌아온 배포 축자 `deploy\td9e89a3a074b\td9e89a3a074b\tgreen`. 별칭 `:i2` 재부착은 **양 국면 모두** 6/6 이미지 ID 대조 GREEN(`X-6` 형제① 실물 검증 — 종전 껍데기 픽스처로만