    evidence: "⭑ **⟨닫힘 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉯⟩ 완료 정의가 `〈241〉` 의 실측으로 이미 충족돼 있었다 — 새로 잰 것이 아니라 기재가 없어 열려 있던 자리다.** `〈241〉` 축자 = 「공개 엣지 = 꺼짐의 `/previews/<해시>.png` **13/13 200 ＋ `image/png` ＋ 매직 `89504e47`**(15,852 ~ 1,214,406 B) · 켜짐의 타일 조각 **104/104 200 ＋ `image/png` ＋ 매직**(데이터셋 26 × 배율 4종 `z=6·8·10·12` · 334 ~ 16,254 B · `text/html` **0건**)」. 같은 회차에 `P3` 가 닫혔고(`〈241〉`-㉹) 릴리스는 `de2241ad83ef` 다. ／ 종전 문면은 지우지 않는다 — ~~`a747c67`·`875aa2a` 미리보기 UI · `15847b3` P4 검색 화면. ①②는 공개 주소에서 200 · ③지도형은 안 뜬다~~ ⚠ **「③지도형은 안 뜬다」는 2026-08-29 시점의 값이고 `〈241〉`(2026-08-31)이 그것을 뒤집었다** — 값을 지우지 않고 시점을 붙인다."
