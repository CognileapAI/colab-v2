    entry_conditions: ["없음 — 지금 착수 가능(코드 아님, 분류다)"]
    depends_on: []
    completion_def: "`§8.5` — `SEED-DATA.md` 가 존재하고 2,122 파일 전부가 세 분류 중 하나에 배정돼 미분류 0. `.npy` 1,622건 제외 · tif 62건 입력 포맷, 그중 이미 COG 인 것 표시"
    evidence: "`SEED-DATA.md` — 2,122 파일 전부 배정 · 미분류 0 · 데이터셋 15건 · 계보 3갈래 (2026-08-23 닫힘 · `〈57〉`). `03-HANDOFF §1 T-S 초기 데이터` `S1` 행 = ✅ · `WORK-UNITS §8.5` `↳ S1 실적` = ✅ 닫힘 · `§11` = ✅ — 세 자리가 일치한다"
    deadline: null
    note: "⭑ ⟨개정 2026-08-29 · 이름 분리로 닫는다⟩ **갈라짐의 원인은 상태값이 아니라 이름이었다** — 한 식별자 `S1` 이 셋을 가리켰다: ⑴ WU `S1`(초기 데이터 적재 범위 확정 · 이 항목) ⑵ 화면 레인 접두사 `S1-*` ⑶ 집행 계획 `S1-PLAN`. **Ted 판정 2026-08-29 = ⑵ 만 바꾼다** — 레인 접두사를 `SC-`(화면 레인)로 갈라 다섯 레인에 `SC-1`~`SC-5` 를 붙였다. 기각 둘 = WU 개명(대장 식별자라 이력 추적이 끊긴다) · 계획 문서만 개명(WU 와 레인이 여전히 겹쳐 문제가 안 풀린다). **그 결과 `03-HANDOFF §1` 에서 `S1` 로 읽히는 행은 이 항목 하나뿐이고 세 읽기가 모두 ✅ 다 — `status: done` 으로 닫는다.** 등재문 초안 = `dev-package/sessions/NAME-SPLIT.md`(`PLAN-SoT §9` 등재 대기). ／ 이전 두 읽기는 모두 ✅(`SEED-DATA.md` — 2,122 파일 전부 배정, 미분류 0 · 데이터셋 15건 · 계보 3갈래 · 2026-08-23 닫힘)로 적지만, 산문 자체가 식별자 `S1` 에 두 표기를 함께 붙인다. `03-HANDOFF §1` 안에서 `S1` 로 읽히는 행이 다섯이고 그중 넷(`SC-1`·`SC-2`·`SC-3`·`SC-4`)은 ✅, 하나(`SC-5`)는 🟧 다 — T-S 레인 접두사 `S1-*` 과 T-S 초기데이터의 WU `S1`, 그리고 집행 계획 `S1-PLAN` 이 한 이름을 쓴다. 기계는 어느 것이 WU `S1` 의 상태인지 가를 수 없다. 어느 하나를 고르지 않는다 — 사람이 레인 접두사를 WU 와 다른 이름으로 갈라 붙일 자리다."
    sources: ["03-HANDOFF §1 T-S 초기 데이터", "WORK-UNITS §8.5", "WORK-UNITS §10", "WORK-UNITS §11"]

