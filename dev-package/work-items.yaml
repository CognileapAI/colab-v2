    completion_def: >-
      ⭑ **⟨등재 2026-09-01 · `PLAN-SoT §9 〈263〉` · 초안 `sessions/ARTIFACT-OWNER-DESIGN-20260831.md §10.4` 6항을 실물에 맞게 다듬어 8항으로 등재⟩**
      **⑴ 「이 산출물이 누구 것인가」에 기계가 답한다** — 자리의 산출물 전건에 대해 가리키는 대상을
      경로 또는 원장 대조로 판정할 수 있다. ⭑ **개정** — 「판정 불가」가 남으면 **그 건수를 드러낸 채**
      넘어간다(대상 0건도 red · `CLAUDE.md §4` green-by-skip 금지). 「모른다」를 「없다」로 세지 않는다.
      **⑵ 참조가 0 이 된 것을 감지하는 자리가 프로세스 메모리 밖에 있다** — 컨테이너를 재기동해도
      고아가 새로 생기지 않는다(회귀 시험으로 증명). 지금 후보 출처는 `d7_visualization/jobs.py`
      `self._jobs` 딕셔너리다(실측).
      **⑶ 집행은 `invalidation.apply()` 한 자리를 그대로 쓴다** — 지우는 문을 늘리지 않는다.
      **⑷ `〈247〉` 경계 유지** — 접수분 루트(원본·기준 격자 파일)·데이터셋은 대상이 아니고, 자리의
      `tile-` 키는 `kept` 로 산다. **음성 시험이 잠근다.**
      **⑸ ⭑ 개정 — 종전 초안 ⑸「기존 80건이 회수됐고」는 실물과 어긋나 폐기한다**(`〈261〉` 실측 —
      고아는 **1 키 3 파일 33,071 B** 이고 나머지는 살아 있거나 판정 불가다). 고쳐 적는다:
      **회수 전 자리 전수 스냅숏이 남아 있고**(키·확장자·크기·사이드카 `source`), **네 등급**
      (살아 있다 / 접수분에만 닿는다 / 고아 / 판정 불가)의 계수가 **회차마다 재현 가능**하며,
      **회수 대상은 고아 등급뿐**이다. ⛔ **판정 불가 34 키는 이 항목이 지우지 않는다**(Ted 판정
      2026-09-01 ② — 「폐기 후보로 표시만 하고 새 구조가 선 뒤 판정한다」).
      **⑹ ⭑ 신설(Ted 판정 2026-09-01 ②)** — **사이드카를 전 층(썸네일 `.webp`·비지도형 `.png` 포함)에
      남긴다.** 지금 판정 불가 34 키가 생긴 유일한 원인이 사이드카 부재이고(실측), 이것이 그 원인을 끊는다.
      **⑺ ⭑ 개정 (2026-09-02 · Ted 판정 「안 ⑷ 채택」 · `PLAN-SoT §9 〈270〉`-㉲) — 승계는 불요하고,
      `PV-1` 완료 조건 ⑵ 의 **존속**을 회귀 시험으로 지킨다.** 종전 문면이 전제한 「대상 간 재사용의
      소멸」은 **안 ⑴ 이 경로를 `targetId` 로 가를 때** 생기는 손실이고, **안 ⑷ 는 경로를 가르지
      않으므로 그 손실이 일어나지 않는다.** ⟹ 승계할 것이 없다. ⛔ **316,201 B·632,402 B 는 완료
      정의에서 뺀다 — 일어나지 않는 값을 남겨 두면 다음 회차가 그것을 목표로 읽는다.**
      ／ 종전 문면 ↓ ~~**신설 — `PV-1` 완료 조건 ⑵ 의 승계**(`〈264〉`-㉮). `PV-1` 이 실물로 증명한
      「같은 바이트를 다시 올리면 다시 굽지 않는다」는 **대상 간** 재사용이라 안 ⑴ 아래에서
      재현되지 않는다. 이 항목이 그 자리를 **대상 내 판**으로 다시 세우고, **대상 간 재사용의
      소멸이 의도된 손실임**을 시험으로 못 박는다(실측 손실 상한 = **316,201 B** ·
