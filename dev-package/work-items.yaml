  - id: J-1
    name: 편의 기능 묶음
    status: open
    stage: stage2
    owner: "혼합"
    entry_conditions: ["stage 2 마지막(`〈157〉-㉱`)"]
    depends_on: [A-1]
    completion_def_draft: >-
      ⚠ **초안이다 — 확정본이 아니다.** 등재 = `PLAN-SoT §9 〈251〉` (2026-08-31 · Ted RULING ㉔).
      `completion_def` 를 덮어쓰지 않았다. 범위 9건은 `〈214〉`-㉮ 그대로이고 이번에 더한 것은
      **각 건의 통과 조건 초안**뿐이다.
      **`J-1` 격자 가져오기** — ⑴ 같은 연구실에서 형상이 일치하는 격자만 후보 ⑵ 직접 올린 것과
      같은 결과(같은 다이제스트 → 같은 지도형 캐시 키) ⑶ 계보를 접지 않고 `d8_activity` 에 남는다
      (`〈60〉`) ⑷ ⭑ **⟨확정 2026-09-03 · `〈289〉`-㉱⟩ 연구실 밖 가져오기 = 불허.** ／ 종전 ~~`[미확인]` 허용 여부 — Ted 판정 필요(권한)~~
      **근거 실측 둘** — ㈎ RLS `lab_boundary` 가 테넌트 표 전건에 `ENABLE + FORCE` 로 걸려 있다
      (`db/platform/schema.sql:775`·`:786` 이하) ⟹ 다른 연구실 행은 **엔진이 먼저 지운다**
      ㈏ 다른 연구실 접근은 **404**(존재를 알리지 않는다)가 실측돼 있다(`CT-1.evidence` 축자
      「다른 연구실 행 **404**(두 hop 다)」). **통과 조건 = 다른 연구실 격자를 후보로 내지 않고,
      키를 손으로 넣어도 404 — 음성 시험 1건.**
      **`J-2` 연구실 기본 격자** — ⑴ 마이그레이션 1건(`0004` 에 자리 없음) ⑵ 제시까지이고
      자동 적용하지 않는다 ⑶ 되돌림 마이그레이션 ＋ `schema-diff` 두 체인 선언＝적용
      ⑷ ⭑ **⟨확정 2026-09-03 · `〈289〉`-㉱⟩ 기본 격자를 정할 수 있는 역할 = 교수.** ／ 종전 ~~`[미확인]` — Ted 판정 필요~~
      **근거 = 역할 집합이 둘뿐이다** — `db/platform/schema.sql:131` 축자
      `role text NOT NULL CHECK (role IN ('교수', '연구원'))`. 연구실 설정을 정하는 자리는
      같은 파일이 이미 교수 쪽으로 기울여 두었다(`:138` 축자 「교수는 네 스위치가 항상 켜진
      것으로 **취급한다**」). **연구원에게 열지 않는다 — 음성 시험 1건.**
      ⚠ **마이그레이션 번호는 `0012` 가 비어 있다**(체인 head `0011_lv1_drop_level_user_set` ·
      `〈287〉` §4 축자 「다음 번호 `0012` 는 비어 있다 … 지금 후보는 `J-1`(`J-2` 연구실 기본 격자) 하나」)
      **`J-3` 격자 불일치 경고** — ⑴ 형식·해시가 다른 격자가 올라오면 경고 ⑵ 판정을 막지 않는다
      ⑶ ⭑ **⟨확정 2026-09-03 · `〈289〉`-㉱⟩ 문구에 실을 거리 = 고정값 없음.** ／ 종전 ~~`[미확인]`~~
      **한 쌍마다 그 쌍의 경계 상자와 화소 크기로 계산해 싣는다.** 못 구하면 「거리 `[미상]`」
