  - id: W-1
    name: 항목 상태 대장·검사기
    status: done
    stage: stage2
    owner: dev-package / gates
    entry_conditions: []
    depends_on: []
    completion_def: >-
      ⓐ dev-package/work-items.yaml 이 03-HANDOFF §1 · WORK-UNITS §10~§11 의 전 항목을 담는다
      ⓑ gates/run.sh work-item-consistency 가 검사 6종을 돌고 ㈎㈏㈐㈑㈒ 가 green
      ⓒ gates/run.sh work-item-selftest 가 대조군 1 · red 증명 8 로 green
      ⓓ 대장의 conflict 가 전건 사람 판정으로 닫혀 ㈓ 가 green — **이 조건이 이 WU 를 닫는 것이다**
      ⓔ 03-HANDOFF 머리말 · CLAUDE.md §6 · gates/README.md 배선
    evidence: "⭑ **⟨2026-08-30 실측⟩ 완료 정의 ⓐ~ⓔ 전건 충족 — 닫는다.** **ⓐ** 대장 **95항목**(84 → 95)이 `03-HANDOFF §1` · `WORK-UNITS §10~§11` 을 담는다 — 근거는 게이트 요약줄의 대조 건수다(㈐ 진실원 **70행** · ㈏ 체크리스트 **49건**). **ⓑ** `./gates/run.sh work-item-consistency` = **green · 불일치 0** · 검사 6종 전건 실행(㈐ 70행 · ㈏ 49건 · ㈑ 착수 후보 33행 · ㈒ 기한 6건 · ㈓ conflict 0건) · **검사 대상 밖 9건 ＋ 항목표가 아닌 표 1건을 요약줄이 드러낸 채** 통과(안 본 자리를 통과 근거로 세지 않는다). **ⓒ** `./gates/run.sh work-item-selftest` = **green · 10 케이스(대조군 1 · red 증명 9)**. ⚠ 완료 정의는 「red 증명 **8**」로 적혀 있으나 실물은 **9** 다 — **정의를 고치지 않는다.** 증명이 **늘어난** 것이지 범위가 줄어든 것이 아니다(늘어난 1 = 「㈑ 항목표 머리글이 바뀌어 대상이 0 표가 됐다 → red」 조용한 통과 금지). **ⓓ** **`conflict` 0건 — ㈓ green.** `S2b`·`S2`(`〈208〉`) · `R-1`(`〈207〉` `conflict` → `partial`)로 전건 사람 판정이 끝났다. **이 조건이 이 WU 를 닫는 것이다.** **ⓔ** 배선 3자리 실물 확인 — `03-HANDOFF` 머리말(「상태의 원본은 `work-items.yaml`, 이 문서는 그 반영본」 · 「판정은 게이트 `work-item-consistency` 가 한다」) · `CLAUDE.md:119-121` · `gates/README.md:24`·`:72`·`:92` ＋ 「못 보는 것」 절. ⛔ **다만 배선 한 자리가 비어 있었고 이 회차가 채웠다** — `work-item-consistency` 와 형제 `planning-freshness` 가 **어느 CI 잡에서도 돌지 않았다**(`.github/workflows/ci.yml` 전수 확인). `work-item-selftest` 만 `gate-selftest` 잡의 집합 `selftest` 에 실려 **「판정기가 red 를 낼 수 있다」만 증명**하고 있었고, **정작 판정 자체는 CI 에 없었다** — 증명만 있고 판정이 없으면 상태 드리프트가 그대로 `main` 에 들어간다. **신설 = `planning-gates` 잡**(경로 필터 `dev-package/**`·`gates/**` — 판정기가 바뀌어도 다시 판정한다 · pyyaml 핀은 `gates/requirements.txt` 하나를 재사용해 판을 두 곳에 적지 않는다 · **모듈 부재가 게이트 red 로 위장하지 않도록 `import yaml` 설치 확인 스텝**을 앞에 둔다). 로컬 실측 = 두 게이트 모두 green."
    deadline: null
    note: "검사기 자신이 관리 대상 밖이 되지 않게 대장에 등재한다. ⭑ **⟨2026-08-30 닫힘⟩ 이 항목이 만든 것은 「상태를 산문이 아니라 게이트가 판정한다」는 구조**이고, 그 구조의 마지막 구멍이 **판정기가 CI 에서 안 돌던 것**이었다(`evidence` ⓔ). ⚠ 남는 것 = 이 게이트가 **못 보는** 범위(`gates/README.md` 「work-item-consistency 가 못 보는 것」 절) — 항목이 닫혔다고 그 범위가 덮이지는 않는다."
    sources: ["PLAN-SoT §9 〈176〉"]

