    completion_def: "⭑ ⟨개정 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ **검색 화면은 자연어와 AI 를 지닌 채 통째로 stage 3 으로 간다 — 정본을 고치지 않고 정본대로 따른다.** 근거 축자 = `Policy_데이터_찾기.md:45` 「두 길의 역할을 넘나들지 않는다. 카탈로그에 자연어 입력을, **검색에 조건 패널을 두지 않는다**」 · `:38` 「입력 ｜ 검색: **말하듯 한 문장** ／ 카탈로그: **표 헤더의 조건과 정렬**」 · `:40` 「AI ｜ 검색: **쓴다**(코랄 표시) ／ 카탈로그: **안 쓴다**」. ⭑ **2회차가 이 항목에서 뺐던 자연어 세 조항이 되돌아온다** — 결과 카드의 `AI 근거`(정본 `:120` 「파일명 · 포맷 · Lv · Verified · 관련도 막대 · 요약 · **AI 근거** · 기간 · 원천 · 소유」 · `:148` 「좌측 코랄 선과 코랄 라벨의 \"왜 이 결과?\" 한 줄」) · 검색 질문(정본 `:122` 「**1~200자. 자연어**」) · 평가셋 A층 대비 화면 층 대조. **아래 ⑴~⑹ 은 한 조항도 버리지 않고 이 항목에 그대로 남아 함께 stage 3 으로 간다.** ⭑ **`〈217〉` 검색 품질 합격선의 자연어 몫도 이 항목으로 되돌아온다** — 2회차가 `K4` 로 보낸 몫이며, 「미판정 0건 ＋ 판정 후 전건 통과 ＋ 판정마다 사유 기록」이라는 **형식은 그대로이고 모수가 다시 합쳐진다.** `〈217〉`-㉲ 원문 무삭제. ⛔ **2회차의 정지 1건(「검색 화면에 조건 패널을 세우는가」)은 오늘 판정으로 무의미해졌다** — 검색 화면이 이번 릴리즈에 없으므로 정본 `:45` 와 부딪칠 자리 자체가 사라진다. **정본은 개정되지 않았고 개정할 필요도 없어졌다.** ／ **아래는 2회차 본문 — 지우지 않는다.** ⟨개정 2026-08-30 (2회차) · Ted 판정 — 검색 화면을 자연어 검색이 아니라 조건 검색 위에 세운다⟩ **완료 정의를 정본이 검색 화면에 실제로 적은 것만으로 다시 쓴다. 오라클은 평가셋 A층이 아니라 `Policy_데이터_찾기.md`(260818 정본) 축자다.** **⑴ 기본 정렬 = Verified 우선 + 관련도** — 정본 `:117` 축자 「기본 정렬 ｜ 카탈로그: 수정일 최신순 · 검색: **Verified 우선 + 관련도**」. 판정 = 검색 결과가 Verified 를 앞세우고 그 안에서 관련도 순인지를 화면에서 건별로 확인한다. ⚠ **실행 경로에 `verified` 가 0건이고 순서는 `ts_rank_cd` 단독이다**(`〈224〉`-㉯ 실측) — `ts_rank_cd` 는 낱말 그대로의 순위라 자연어가 아니다. ⚠ **「우선 정렬」의 소유가 승인 처리(`P6`)인데 `P6` 이 `P4` 를 선행으로 건다** — 투입 시점 = 판정 대기(`〈224〉`-㉶). **⑵ Verified만 보기 토글** — 정본 `:150` 축자 「켜면 승인 결과만, 건수 갱신. **검색 전용이다.**」. 조건성 동작이고 자연어와 무관하다. **⑶ 관련도 표시 = 막대만** — 정본 `:121` 축자 「막대만. 수치·등급 텍스트를 붙이지 않는다」. **⑷ 잠긴 결과 카드** — 정본 `:151` 축자(자물쇠 ＋ `접근 권한 없음` 칩 ＋ 카드 안 접근 요청 버튼 · 기간·원천·소유 메타 줄을 두지 않는다). ⚠ 셋이 실물과 어긋난다(`〈224〉`-㉳) — 갈래가 잠금 표시·접근 요청이라 승인 처리 소유로 읽힌다. **⑸ 조건 결과 0건 문구** — 정본 `:170` 축자 「조건에 맞는 데이터가 없어요. 조건을 하나 풀어 보세요.」 ＋ 전체 해제. **⑹ 「각 P 의 완료 판정」 4항**(`WORK-UNITS §7`) 은 그대로 남는다. ⛔ **「검색 화면에 표·필터·정렬을 세운다」는 쓰지 않았다 — 정본이 그것을 금한다.** 축자 `:45` 「두 길의 역할을 넘나들지 않는다. 카탈로그에 자연어 입력을, **검색에 조건 패널을 두지 않는다**」 · `:38` 「입력 ｜ 검색: 말하듯 한 문장 ／ 카탈로그: 표 헤더의 조건과 정렬」 · `:40` 「AI ｜ 검색: 쓴다(코랄 표시) ／ 카탈로그: 안 쓴다」. **표·필터·정렬은 정본에서 카탈로그 화면(S-03)의 것이고 검색 화면(S-01·S-06)의 것이 아니다. 지어내지 않고 멈춘다 — 판정 대기.** ⚠ **자연어 쪽은 이 항목에서 뺐다** — 결과 카드의 `AI 근거`(정본 `:120`) · 검색 질문 「1~200자. 자연어」(정본 `:122`) · 평가셋 A층 대비 화면 층 대조. **셋은 `K4` 를 따라 stage 3 으로 간다.** ／ 이전 ~~⟨개정 2026-08-29 · `〈208〉`⟩ 「각 P 의 완료 판정」 4항 ＋ 검색 화면(S-01·S-06)이 내는 결과를 검색 평가셋 A층 실행 결과와 대조해 화면 층에서의 통과·실패를 건별로 판정한다. 미판정 0건이어야 닫는다. 오라클 실물 = `eval/s2b-alayer/evalset.json`(18건) · 실행기 `run.py` · 기준선 `baseline.json`. 재측정 귀속이 `T-1` 에서 이 항목으로 옮겨 왔다~~ — **원문을 지우지 않는다. 이 문언은 폐기가 아니라 stage 3 에서 `K4` 가 그대로 진다.**"
