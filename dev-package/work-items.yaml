    note: "⭑ **⟨개정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈204〉`⟩ 이름의 「2D 시각화 3종」 중 경계·점 둘이 범위에서 빠졌다 — 남는 것은 격자다.** 근거 = 원천 5종이 전부 래스터이고 벡터 자료 0건(`sessions/P3-SCOPE.md:48` · Ted 확인 「벡터 자료 아직 없다」). **이름 원문은 지우지 않았다 — 이 줄이 개정 표시다.** 배제와 재개 조건은 별도 항목 `VZ-1` 이 진다. ／ 「P3 은 stage 2 전체다」(`〈74〉`). `D5 → P3` 는 엄격 직렬 의존 — 타일은 COG 없이 못 낸다. advisor 는 D7 흡수에 반대하고 별도 WU 절단을 권고했다. ⭑ **⟨2026-08-30 · 진입조건 충족 · 착지 1건 · 항목은 열려 있다 — `sessions/P3-DETAIL-PREVIEW-20260830.md`⟩** **진입조건 `P2`·`D5` 가 둘 다 `done` 이라 성립한다** — 직전 회차(`sessions/P3-SCOPE.md §1`)의 「반만 성립」은 `D5` 가 `partial` 이던 시점의 기록이라 낡았다. **착지 = 데이터셋 상세(S-05)의 미리보기(격자) 구역** — 정본 축자 대비 시험 **15건을 red(15 failed) 로 먼저 세우고** 구현해 green 으로 돌렸다(frontend 314 → **329 passed / 0 failed** · `tsc` 종료 0). **계약·`services/**`·DB·운영 스택 무접촉**이고 파일 면은 `frontend/**` 넷뿐이다 — 중계 계약(`createPreviewRender`)이 `datasetId` 대상을 이미 받고 있어 **계약 개정이 0건**이다. **범위 목록의 나머지 실물** = 계보 그래프·`createScreenshot` **서버**는 이미 서 있다(직전 회차들). ⛔ **닫지 않는다 — 남은 차단 다섯** ㈎ **`createScreenshot` 의 화면 도달 경로가 계약에 없다**(`fe-core.yaml` 에 중계 op **0건** — 정본 `§6`·`§8` 은 스크린샷을 편집 권한자 컨트롤로 요구한다). **우회하지 않았다** — 갈 곳 없는 버튼도 중계 없는 직접 호출도 만들지 않았고, **경계 셋 중 ①「Port(중계 op) 하나 추가」로 보고한다**(절차 = 계약 동결 해제 ㉯ · Ted 승인) ㈏ **확대(줌)의 정본 근거 0건** — 의존 쪽 차단은 `D5` 로 풀렸고 남은 것은 「무엇을 지을지가 정본에 없다」 하나다. **`V-2`(값 조회)와 같은 자리이므로 같이 판정받아야 한다** ㈐ **렌더 성능·상한의 합격선 미기재**(몇 초·몇 픽셀이 어느 문서에도 없다) ㈑ **완료 판정 3항 staging 배포 green** `[미확인]` ㈒ **완료 판정 4항 목업 대비 화면 검증** `[미확인]` — 이번 회차는 정본 축자로만 쟀다. ⭑ **다섯 중 셋(㉮·㉯·㉰)이 코드가 아니라 계약·판정·정의의 자리다.** **해제된 하위 항목 0건** — `V-1`·`V-2`·`Y-1`·`S3`·`P6` 다섯은 여전히 `P3` 를 미충족 선행으로 든다. ⭑ **⟨차단 하나 해소 2026-08-30 · 병합·배포 회차⟩ 위 다섯 중 ㈑(완료 판정 3항 `staging 배포 green`)만 충족됐다 — `[미확인]` 을 지우지 않고 여기 갱신을 적는다.** ⭑ **⟨staging 배포 green 2026-08-30T18:39:07+0900 · 릴리스 `eb61556de245`⟩ 「각 P 의 완료 판정」 4항 ③ 이 충족됐다.** 실측 = `infra/staging/deploy.sh --target staging` 배포 판정 **GREEN(통과 15건 · SKIP 0)** — 헬스 6종이 200 이 아니라 **본문 대조**(각 단위의 `unit` 값 일치)로 통과했고, 컨테이너 8종 전부 `healthy` 이며 호스트 노출 0건. 체인 판정 **GREEN**(platform `0008_lineage_origin_labels` · ai `0005_k2b_concept_graph_seed`). 별칭 `:i2` 재부착 **6/6 이미지 ID 대조 GREEN**. 실물 동일성 근거 = 앱 5종의 실행 이미지 태그가 **`eb61556de245`(＝ 병합 커밋 SHA)** 이고 digest 이력 원장에 6종이 그 태그로 새로 적혔다 — 루트 200 하나로 판정하지 않았다. ⛔ **그래도 닫지 않는다 — 남은 차단 넷은 그대로다**: ㈎ `createScreenshot` 중계 op 부재 · ㈏ 확대(줌)의 정본 근거 0건 · ㈐ 렌더 성능·상한 합격선 미기재 · ㈒ 완료 판정 4항 목업 대비 화면 검증 `[미확인]`. **넷 다 이 회차가 손대지 않았고 별도로 다뤄진다.** `status: open` 유지. ⭑ **⟨화면 레인 2026-08-30 · `lane-viewer`⟩ `〈231〉`·`〈232〉` 가 연 자리를 화면이 실제로 채웠다** — 확대(줌) 조건 여섯 ＋ 스크린샷 버튼(중계 op 도달). **직전 회차의 「화면의 버튼은 아직 없다」·「확대는 아직 짓지 않았다」가 여기서 닫힌다.** ⛔ **그래도 `P3` 는 닫지 않는다 — 남은 차단 둘은 그대로다**: ㈐ **렌더 성능·상한 합격선 미기재**(판정 요청 `03-HANDOFF §4` #47 · 재지 않은 수를 적지 않는다) · ㈒ **완료 판정 4항 목업 대비 화면 검증** `[미확인]`. **둘 다 이 회차가 손대지 않았다.** 근거·수치는 `sessions/P3-DETAIL-ZOOM-SCREENSHOT-20260830.md`. ⭑ **⟨차단 둘 해소 2026-08-30 · Ted 판정 `PLAN-SoT §9 〈231〉`·`〈232〉` · 워크트리 `lane-canon`⟩ 남은 넷 중 ㈎·㈏ 가 닫혔다. 종전 문장을 지우지 않고 여기 적는다.** **㈎ `createScreenshot` 중계 op 부재 = 해소.** **11차 동결 해제**(`〈231〉` · 등급 ㉯ op 신설 · Ted 승인 2026-08-30)로 `fe-core.yaml` 에 **`createPreviewScreenshot`**(`POST /preview-screenshots`)을 신설했고 **같은 회차에 구현했다**(`services/core-api/.../routes/preview.py` · 집행 없는 신설 금지 `X2-FREEZE-PROTOCOL §5-㉰-4`). op 총계 53 → **54** · 501 표 불변 · 마이그레이션 0 · 계약 게이트 전건 green · 생성물 `frontend/src/generated/fe-core.ts` **명령 재생성**(손수정 0). ⚠ **화면의 버튼은 아직 없다** — 이 회차는 계약·중계까지이고, 버튼을 세우는 것은 `P3` 의 화면 레인 몫이다. **㈏ 확대(줌)의 정본 근거 0건 = 해소.** 정본 `Policy_데이터셋_상세` **v2.4 → v2.5**(`〈232〉`)에 확대를 기능으로 명시하고 **닫는 조건 여섯**을 적었다 — `§2` 업무 흐름 행 · `§8` `확대·이동` 행 · `§8` 「확대(줌) — 왜 넣는가, 무엇이 되면 된 것인가」 블록. **확대는 이번 릴리스 안이다**(Ted 판정). ⚠ **`V-2`(값 조회)는 여기 포함되지 않는다** — 확대와 같은 자리로 묶여 있었으나 **다른 항목이고 Ted 는 확대만 판정했다.** `V-2` 는 `완료 정의 미작성` 을 그대로 둔다. ⛔ **남은 차단 둘** — ㈐ **렌더 성능·상한의 합격선 미기재**(여전히 `[미확인]` · **판정 요청으로 올린다** — 몇 초·몇 픽셀을 뒷받침할 실측이 레포·정본 어디에도 없고, 있는 것은 성격이 다른 둘뿐이다: 계약 `core-viz.yaml Viewport.width/height` 의 `maximum: 4096`(요청 상한이지 합격선이 아니다) · PoC 실측에서 온 「한 파일 해석 시간 60초」(`sessions/DATA-PROCESSING-HARVEST.md` G-8 — 업로드·디코드 한도이지 렌더 합격선이 아니다). **지어내지 않는다**) · ㈒ **완료 판정 4항 목업 대비 화면 검증** `[미확인]`. `status: open` 유지. ⭑ **⟨차단 둘 해소 · 새 차단 하나 2026-08-30 · `PLAN-SoT §9 〈233〉`·`〈234〉` · 워크트리 `lane-perf`⟩ 남은 둘(㈐·㈒)이 닫혔다. 종전 문장을 지우지 않고 여기 적는다.** **㈐ 렌더 성능·상한 합격선 미기재 = 해소** — **먼저 쟀다.** 미리보기 최초 표시(viz-render 렌더 시간) 실원천 **포맷 5종 × 반복 7 = 표본 35** → **중앙값 0.551초 · p95 2.081초 · 최대 2.095초**(포맷별 중앙값 HDF4 2.054 · GeoTIFF 0.838 · NetCDF 0.551 · NumPy 0.412 · Binary 0.350 초 · 코퍼스 최대 본체 53 MB `.npy` ＋ 격자 214 MB 도 중앙값 0.855초). 확대·이동은 조작 1회 **p95 1.827 ms · 최대 4.004 ms**(표본 20) · 끌어 옮기기 **p95 1.171 ms**(표본 20). **확정 합격선 = 미리보기 최초 표시 p95 10초 · 상한 60초(초과 시 실패) · 확대·이동 100 ms.** 적은 자리 = 정본 `Policy_데이터셋_상세` **v2.5 → v2.6 §8**(확대 조건 **여섯 → 일곱** · 「수치를 정하지 않는다」 문단을 합격선 블록으로 갈음 · 종전 문면 보존) · `planning-freshness` **green**(VER 2.6 · SHA8 `9b38b3c9`). **자동 검사 = 게이트 `render-latency` ＋ `render-latency-selftest` 신설**(시험 `services/viz-render/tests/test_perf_render_latency.py` · 눈금 정본 `gates/config/render-latency.toml` · 표본 25 · 포맷 5종 · 실측 p95 **2.022초** green · selftest 12건 · **변이로 오라클 증명**). 확대 쪽은 게이트가 아니라 시험이다(`frontend/test/dataset-preview-zoom-latency.test.tsx`) — **레포에 frontend 시험을 도는 게이트가 없어서**이고 없는 게이트를 지어내지 않았다. **㈒ 목업 대비 화면 검증 = 차단 아님** — Ted 판정(`〈234〉`) 「**목업 없음 — 내가 직접 보고 판단한다, 개발 속행**」. 판정 주체가 **Ted 의 직접 확인**이고 WU 밖이다(`〈230〉` 이 `P5` 의 같은 축을 `G1b` 로 보낸 것과 방향이 같다). ⛔ **그래도 `P3` 는 닫지 않는다 — 실측이 새 차단 하나를 드러냈다.** ㈓ **「타일 서빙」이 화면에 도달하지 않는다.** 완료 정의에 **타일 서빙**이 이름으로 올라와 있는데(`WORK-UNITS §7` 말미 「각주로만 있던 것을 완료 정의로 올린다」), **실측** = 완료된 렌더 결과의 키가 `bounds`·`colorRangeStage`·`imageUrl`·`legend`·`precisionBadge`·`sidecarUrl`·`thumbnailUrl`·`valuePreviewUrl`·`worldFileUrl` **아홉이고 `tileUrlTemplate` 은 없다**(`jobs.py:92` 가 stage 1 에서 타일 갈래를 싣지 않는다고 코드로 적어 두었다). **타일 자체는 선다** — 같은 렌더에 `GET /renders/{id}/tiles/6/54/25.png` 가 **200 ＋ PNG** 다. 즉 **이음매에는 있고 화면에는 못 간다.** 확대는 타일 없이 클라이언트 변환으로 섰고 정본 조건 ⑴~⑺ 을 충족하므로 **확대는 이 차단과 별개**다. 자리(미리보기 산출물 루트)는 `PV-1` 이 내주며 게이트 `preview-tile-slot` 이 그 자리를 기다리는 red(준비)다. **부분 완료로 닫지 않는다** — `status: open` 유지. ⭑ **⟨차단 ㈓(`#48`) 해소 · 새 남은 조건 하나 2026-08-31 · Ted 판정 ⑩ · `PLAN-SoT §9 〈238〉` · 워크트리 `lane-tile` · `sessions/P3-TILE-SURFACE-20260831.md`⟩ 지도 화면을 타일 방식으로 전환했다 — 종전 문장을 지우지 않고 여기 적는다.** **㈓ 해소** — 등록 데이터셋의 지도형 결과가 이제 `tileUrlTemplate` 을 싣고 `imageUrl` 을 내지 않는다(`oneOf` 택일) · 화면은 단일 PNG 한 장이 아니라 **타일 모자이크**다 · 같은 문자열로 조회한 타일이 **200 ＋ PNG**. **계약 개정 0건**(두 갈래가 이미 계약에 있었다 — 바뀐 것은 어느 갈래를 내는가다 · 동결 해제 직전 11차 그대로) · 생성물 재생성·손수정 0건 · 마이그레이션 0건. **경계 셋** = 지도형만 · 등록 데이터셋만 · 서명 비밀이 있을 때만. **비지도형은 그대로 `imageUrl` 하나다 — 없는 경계를 지어내지 않았다**(`DR-9`). **회귀 재측정** = 확대 조건 **일곱 전건 green**(시험 15건 · **14건 red 선행**) · 확대·축소 1회 **p95 2.081 ms · 최대 2.758 ms** · 끌어 옮기기 **p95 1.384 ms**(각 표본 20 · 합격선 100 ms) · 미리보기 최초 표시 게이트 `render-latency` **p95 2.189초**(합격선 p95 10초 · 상한 60초). **조건 ⑶ 「렌더 재요청 0건」은 정본 문면대로 판정해 green** — 조작 13회에 `createPreviewRender` **0건**(조각 수신은 「이미 그린 결과 안에서」의 일이다). **실측** = 게이트 `all` **green 35 / red 0 → green 35 / red 0**(이번 변경이 만든 red 0건) · viz-render **146 → 152 passed** · frontend **368 → 383 passed** · `tsc` 0 · core-api·pipeline-worker 무접촉. ⛔ **그래도 닫지 않는다 — 남은 조건 하나**: 「각 P 의 완료 판정」 4항 ③ **`staging 배포 green` 이 이 변경분에 대해 없다**(도는 릴리스 `2ef0276ab349` 에 타일 갈래가 없다). **배포 권한 밖이라 멈추고 보고한다.** **부분 완료로 닫지 않는다** — `status: open` 유지.'"
    sources: ["03-HANDOFF §1 T-P", "WORK-UNITS §7", "WORK-UNITS §10.2", "WORK-UNITS §11", "PLAN-SoT §9 〈204〉", "sessions/P3-DETAIL-PREVIEW-20260830.md", "sessions/P3-DETAIL-ZOOM-SCREENSHOT-20260830.md", "sessions/P3-RENDER-PERF-20260830.md", "PLAN-SoT §9 〈233〉", "PLAN-SoT §9 〈234〉", "PLAN-SoT §9 〈238〉", "sessions/P3-TILE-SURFACE-20260831.md", "PLAN-SoT §9 〈240〉", "sessions/P3-TILE-AB-20260831.md", "sessions/P3-EDGE-TILE-20260831.md", "PLAN-SoT §9 〈241〉", "sessions/P3-AB-DEPLOY-20260831.md"]

