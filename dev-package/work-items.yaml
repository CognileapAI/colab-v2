    entry_conditions: ["⭑ ⟨해소 2026-09-02 · Ted 판정⟩ ~~⛔ **저장처 형태 판정(Ted) — 미판정.** 후보 = 호스트 볼륨 / 객체 저장소 / 기존 배치 정본 `contracts/storage/layout.json` 의 종류 승격. 이 판정 전에는 완료 정의를 쓸 수 없다(`PLAN-SoT §9 〈278〉`-㉯)~~ ⟹ **판정 = 「파일 저장처는 지금 볼륨을 그대로 쓴다」**(객체 저장소는 인프라·비용·운영 경계를 한꺼번에 끌고 오고 이 단계에서 정당화되지 않는다). **조건 = 내려받기 경로를 이음매 하나 뒤에 둔다.** 이 판정으로 완료 정의를 쓸 수 있게 됐고 `03-HANDOFF §4 #63` 이 해소된다"]
