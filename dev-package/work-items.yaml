    completion_def: "⭑ ⟨**확정** 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉰ · advisor 권고대로 집행 · Ted 사전 위임 2026-09-03⟩ 종전 문면은 지우지 않는다 — ~~완료 정의 미작성~~(`〈213〉`·`〈250〉`) ⟹ **아래 `completion_def_draft` 의 ⑴~⑺ 을 글자 그대로 확정본으로 올린다. 조항을 새로 만들거나 고치지 않았다** — `〈250〉`-㉯ ＋ `〈259〉`(⑷ 개정) 판이 그대로 요구다. **초안이 닫지 못한 것 둘의 거처를 함께 못 박는다.** — **ⓐ 팔레트만 바꿀 때의 값 배열 재사용 = 요구에서 제외한다.** 근거 셋 — ㈎ 팔레트는 **이미 `render_cache_key` 의 입력**이라 키가 갈리고 무효화 코드가 필요 없다(`〈250〉` 실측) ㈏ 조항 ⑴(같은 데이터·같은 색범위·같은 구간 수에서 **색만 바뀐 그림**)은 값 배열을 다시 읽든 재사용하든 **똑같이 성립한다** — 재사용은 성능 최적화이지 정확성 조항이 아니다 ㈐ 성능 쪽 합격선을 새로 세울 이유가 없다 — 실측 `〈233〉` **p95 2.081 s ≪ 10 s** 로 눈금 안이다. ⟹ **합격선이 없어 닫지 못하던 자리를 「요구가 아니다」로 정리한 것이고, 지어낸 수치로 메우지 않았다.** — **ⓑ 옛 키 파일 청소(이미 쌓인 49/80 벌) = `V-1` 이 지지 않는다.** 별도 항목 **`RC-1`**(구판 사이드카 재굽기 후 `reclaim_plan` 1회 · `owner: D7 / viz-render`)로 뗐다. 근거 = 초안 ⓒ 축자 「후보 목록(`_produced_for`)은 **이 프로세스가 스스로 구운 것만** 센다 … **`V-1` 이 서도 자연히 정리되지 않는다 — 별도 작업**」. ⟹ **이 확정으로 `V-1` 은 착수 가능이 된다**(`03-HANDOFF §4 #54` 에서 내린다). ⛔ **착수한 것은 아니다 — `status` 는 `open` 이다.**"
