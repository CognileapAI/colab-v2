    depends_on: [A-1, V-2]
    completion_def: "2026-09-03 기재(Ted 판정 `PLAN-SoT §9 〈302〉` ＋ 실측 `sessions/ARTIFACT-OWNER-DESIGN-20260831.md` ㉯㉰). **쓸 수 있는 만큼만 적었고 나머지는 적지 않았다.** ⑴ **판정 규칙** = 「살아 있는 데이터셋 파일 또는 보류 업로드가 **하나라도** 가리키면 산다」 — 3 주체 공유가 실표본이다(같은 타일 키를 살아 있는 데이터셋 2개 ＋ 미등록 업로드 1개가 가리킨다 · `ARTIFACT-OWNER-DESIGN §㉯`). ⟹ **첫 주체가 지워져도 타일은 살고, 마지막 주체가 사라질 때만 고아다.** ⑵ **입력을 다시 계산한다** = `〈294〉` 가 읽는 쪽에 세운 키 계산(`storage_layout` 생성물 ＋ `map_tile_grid_digest`)을 판독기도 그대로 부른다 — 규칙을 두 곳에 적지 않는다(`CLAUDE.md §3` 불변규칙 1). ⑶ **네 등급을 그대로 쓴다** = `살아 있다` / `접수분에만 닿는다` / `고아` / `판정 불가`(`ARTIFACT-OWNER-DESIGN §㉰`). 타일은 사이드카가 0건이라 **`판정 불가` 로 떨어지지 않아야 한다** — 키 재계산이 그 자리를 메우는 것이 이 항목의 핵심이다. ⑷ **`ownership.scan()`·`grade()` 는 고치지 않는다**(Ted 판정 · `〈296〉`-㉶ 와 같은 선). 판독기는 **별도 진입점**이고 `invalidation.apply()` 와의 결선은 이 항목이 판정한다. ⑸ **자기 증명** = 3 주체 공유 표본을 픽스처로 고정해 「주체 둘을 지워도 살고 셋을 다 지우면 고아」를 시험이 못 박는다. ⭑ **미작성으로 남긴 것 = ⑹ 회수 집행 주체·주기**(누가 언제 부르는가) — `〈296〉`-㉵ 의 주기 배경 루프에 얹을지 별도 자리인지 실측 근거가 0건이라 **지어내지 않았다** `[미확인]`."
    evidence: "⭑ **⟨집행·첫 실측 2026-09-05 · 워크트리 `lane-tl1` · 등재 `PLAN-SoT §9 〈313〉`(초안 `notes/TL1-LEDGER-PENDING.md`) · 근거 `sessions/TL-1-20260905.md`⟩ 완료 정의 ⑴⑵⑶⑸ 충족 · ⑷ 는 반쪽 · ⑹ 는 `[미확인]` 그대로 ⟹ **닫지 않는다.** ⑴⑵ **「생존」을 키 재계산으로 정의했다** — 타일에는 소유 필드도 사이드카도 없으므로 「누구 것인가」가 아니라 **「지금의 주체(살아 있는 데이터셋 파일 또는 보류 업로드)가 낳는 이름인가」**를 묻는다(`〈294〉` 의 승격분 ＋ `map_tile_content_key`). `used_reference_grid` 는 D7 이 모르므로 **후보 둘을 다 「닿는다」로** 센다 — 지어내지 않는다. ⑶ **네 등급 그대로** — `판정 불가` 는 시험과 실측 **둘 다 0**(키 재계산이 사이드카의 자리를 메운다). ⚠ **제3의 상태를 명시로 세웠다** — 주체의 본체를 못 열면 「고아」가 아니라 **계산 불가**이고 **판정을 시작하지 않는다**(`ReaderNotReady` · 진입점 종료 코드 **78 = red(준비)**). 못 센 주체를 조용히 빼면 그 주체가 가리키던 타일이 **고아로 둔갑한다**(`DATA-REFERENCE §0 M-9`). ⑸ **3 주체 공유 픽스처로 못 박았다** — 「주체 둘을 지워도 살고 셋을 다 지우면 고아」 · 시험 **16 케이스** · RED 선실측(모듈 부재로 수집 실패) 후 green. ⭑ **첫 참값(읽기 전용 · 삭제 0건)** — 주체 **125**(데이터셋 본체 125 ＋ **보류 업로드 0** — 접수분 17건이 **전건 등록 전환**됐다) 이 낳은 후보 키 **157** 대 자리의 타일 **2벌**. 축자 `지도 타일 생존 — 자리의 타일 2벌 · 살아 있다 2 · 접수분에만 닿는다 0 · 고아(못 닿는다) 0 · 판정 불가 0 · 계산 불가 0` · **가장 오래된 못 닿는 벌 = 없다.** ⭑ **다주체 공유가 실물에 실재한다** — `tile-e63939cc…` 를 **데이터셋 파일 둘**이 낳는다. ⚠ **이 0 을 「결손이 없었다」로 읽지 않는다** — 종전 값은 `0` 이 아니라 **`[미확인]`** 이었고 이 회차가 처음 셌다. ⛔ **`〈312〉` 의 stale 3벌은 `tile-` 벌이 아니다** — ③지도형 **렌더** 산출물(키 규칙 `render_cache_key`)이고 이 판독기 대상 밖이다(`CR-2` ⑶). 타일 키가 안 갈린 이유 = `warp+blockavg→warp+nearest` 는 **렌더의 다운샘플**이고 지도 타일 키 재료 여섯에 그 이름이 없다 · `MAP_TILE_KEY_VERSION` **1 무변**. ⚠ **모집단 2벌** — 검증된 것은 규칙이지 「타일이 많은 자리에서도 0」이 아니다 `[미확인]`. ⑷ **`ownership.py` 는 한 글자도 고치지 않았다**(음성 시험이 재증명) · 판독기는 **별도 진입점**이다. ⛔ 그러나 **`invalidation.apply()` 와의 결선은 판정하지 않았다** — 회수 경로를 넓히는 일은 Ted 판정 자리다. ⑹ **회수 집행 주체·주기 `[미확인]` 그대로.** ⚠ **게이트는 세우지 않았다 — 감추지 않는다.** 완료 정의가 요구한 것은 「별도 **진입점**」과 「**픽스처** 자기 증명」이고 둘 다 섰다(픽스처는 `service-tests-viz-render` 가 돈다). 지금 세우면 **매 회차 red(준비)** 다 — 접수분 루트가 **바인드가 아닌 도커 볼륨**이라 게이트 사용자가 못 읽는다(`docker volume inspect` 실측). **없는 자리를 지어내지 않는다**(선례 `COLAB_PREVIEW_TILE_DIR`). **계약 개정 0 · 마이그레이션 0(head `0011`) · staging 쓰기 0 · 배포 0 · push 0 · 삭제 0건.** ⭑ **⟨종결 2026-09-05 · 워크트리 `lane-tl1b` · Ted 판정 「도는 배경 루프에 얹는다」 · 등재 `PLAN-SoT §9 〈316〉`(초안 `notes/TL1-CLOSE-LEDGER-PENDING.md`)⟩ 완료 정의 ⑴~⑹ 전건 충족 ⟹ `in_progress` → `done`.** **⑴⑵⑶⑸ = `〈313〉` 충족분 무접촉** — 판정 규칙·키 재계산·네 등급·3 주체 공유 픽스처를 이 회차가 한 글자도 안 바꿨다(등급 넷과 `ReaderNotReady` 그대로). **⑷ 전단 = 유지** — `ownership.scan()`·`grade()` 는 이 회차도 **0줄**이다(`git diff --stat` 에 그 파일이 없고 음성 시험이 재증명한다). **⑷ 후단 = 닫힘** — 판독기가 `invalidation.apply()` 와 결선됐다: `invalidation.tile_reclaim_plan()` 이 **같은 계산기 `plan()`** 을 `keep_keys` 로 부르고(`reclaim_plan`·`supersede_plan` 과 같은 모양 · **계획기 셋째 신설 0**) 지우는 문은 여전히 `apply()` 하나다. `plan()` 의 `tile-` 보존은 **기본값 그대로**이고 `reclaim_map_tiles` 는 **명시로만 여는 문**이라 다른 부름은 전부 종전과 같다(회귀 시험이 못 박는다). **⑹ = 닫힘** — 회수 주체·주기는 **`#60` 이 세운 주기 배경 루프**(`app/trigger_loop.TriggerDrainLoop` · `〈286〉`)다. 새 스레드·새 HTTP 표면·계약 개정 **0**. **주체는 저장소 루트에서 얻는다** — 근거 셋: 「D7 에는 원장이 없어 **디렉터리가 곧 사실**」(`kernel/storage_layout.py:16`) · core-api 가 원장에서 사라진 파일의 **바이트도 치운다**(`core-api/app/routes/ingestion.py:92`) · **그릴 때 쓰는 입력도 같은 자리 하나**(`ports/source.py:80`) ⟹ **판독 입력 = 렌더 입력이라 「그려지는데 고아」가 성립할 수 없다.** 등록 여부는 배치가 안 가르므로 출신을 찍지 않고 `ORIGIN_STORAGE` 로 두고 사유에 「등록 여부는 D7 이 모른다」를 남긴다(**회수 판정에는 차이 0**). **가드 넷** = 관측 전용 기본(`COLAB_VIZ_TILE_RECLAIM_APPLY` 미선언 = 끄기) · **상한 20 벌/바퀴**(넘으면 한 벌도 안 지우고 멈춘다 — 근거 `〈313〉` 2벌·0 과 `RC-1` 14벌) · **fail-closed 3종**(주체 0건·계산 불가 ≥1·저장소 루트 부재 ⟹ 판정 미시작 · 고아 수를 0 으로도 안 적는다) · **주기 3600초** ＋ 지운 키마다 키·등급·나이·크기 로그. **시험 21건 신설 · RED 선실측**(`ImportError: cannot import name 'tile_reclaim'`) · `viz-render` 유닛 **343 → 364 전건 통과** · **전 게이트 `green 50 / red(판정) 0 / red(준비) 0`**. ⚠⚠ **`done` 의 뜻을 좁혀 적는다 — 「타일 고아가 실제로 회수됐다」가 아니라 「회수 기구가 서고 주체·주기가 판정됐다」다.** **실물 삭제 0건**(staging 무접촉 · 배포 0)이고 staging 의 못 닿는 벌은 `〈313〉` 실측 **0** 이라 켜도 지금 지울 것이 없다. **배포는 항목 종결에 불요하나 효과에는 필요하고, 첫 배포 상태는 관측 전용이다** — 켜기는 계수 증명 뒤 홈 env 한 줄이다. ⭑ **⟨첫 관측 전용 배포 2026-09-05 · staging 단독 창 5b 단계 B · 등재 `PLAN-SoT §9 〈318〉`-㉳ · 근거 `sessions/WINDOW-20260905-A5b.md §10`⟩ `done` 무변 — 이 회차는 항목 상태가 아니라 「기구가 실물에서 어떻게 서는가」를 처음 실측했다.** 릴리스 `e37808cace69` 로 회수 루프가 **처음 staging 에 실렸고, 도는 컨테이너의 `COLAB_VIZ_TILE_RECLAIM_*` 3키가 전부 빈 값(길이 0)** 이라 `config.py` 기준 **꺼짐 = 관측 전용**이 실물에서 확인됐다(설계한 기본값 그대로). **삭제 0건**은 자리 대조로 실측됐다 — 스냅숏 전후 **사라진 벌 0** · 자리 파일 `285 → 306` **증가만**. ⛔ **그러나 회수 바퀴는 「못 봤다」다** — 로그의 회수 바퀴 기록 **0건** · 기동 `13:22:00` · 최종 확인 `13:52:04` · **경과 30분** · **주기 3600초** ⟹ **한 바퀴가 아직 안 돌았다.** ⚠ **「루프가 0건을 셌다」로 적지 않는다** — 위의 0 은 **자리 대조에서 나온 0** 이고 루프의 계수가 아니다. 둘은 다른 사실이다. ⟹ `〈313〉` 의 **「켜도 지금 지울 것이 없다」는 아직 검증되지 않았다** `[미확인]` — 푸는 법 = 기동 60분 뒤(2026-09-05 14:22 KST 이후) `docker logs colab_v2_staging_viz_render` 에서 **첫 한 바퀴의 계수**를 읽는 것이고, 그것은 다음 창이 진다. **이 회차의 `TL-1` 관련 쓰기 0 · 삭제 0 · 켜기 0.** ⭑ **⟨관측 2026-09-05 15:00 KST · 근거 `sessions/V-1-STAGING-20260905.md` ㉶ · 등재 `PLAN-SoT §9 〈324〉`⟩ `status` `done` 무변 — 기구는 서 있고, 안 서는 것은 **관측**이다.** 기동 `13:22` → 확인 `15:00` = **경과 98분** · 주기 기본 **3600초** ⟹ 한 바퀴가 돌았어야 하는데 `docker logs colab_v2_staging_viz_render` 에 `reclaim`·`liveness`·`회수` **0건**이다. 등급별 계수는 **「못 봤다」**이고 **0 으로 적지 않는다** · 삭제는 자리 기준 **0건**(인가된 재렌더가 회수한 7파일 말고 사라진 파일 0 · `tile-` 무변). **원인은 이 항목의 결손이 아니라 로그 설정 부재이고 그 자리는 `BF-12` 가 진다** — `services/viz-render/src` 전수에 `basicConfig`·`dictConfig`·`setLevel` **0건**이라 `trigger_loop.py` 의 `log.info(result.summary())` 가 버려진다. ⟹ **`TL-1` 을 다시 열지 않는다** · 막히는 것은 **첫 한 바퀴 계수**이고 그것을 푸는 것은 `BF-12` 다. `〈313〉` 의 「켜도 지금 지울 것이 없다」는 **여전히 `[미확인]`**."
