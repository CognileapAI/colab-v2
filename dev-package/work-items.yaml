    evidence: "⭑ **⟨2026-08-31 · 12차 동결 해제 · `PLAN-SoT §9 〈253〉` · Ted RULING ㉗ · 워크트리 `lane-trigger` · 산출 `sessions/Y-1-TRIGGER-WIRING-20260831.md`⟩ 완료 정의 ⓐ~ⓔ 가 전부 섰다. 남은 것은 ⓕ 하나다.** **㉮ 무엇이 막고 있었나** — `〈247〉` 회차가 세운 것은 **받는 자리**(`TriggerPort` Protocol)까지였고 **보내는 쪽이 없었다**(`03-HANDOFF §4 #55`). 우회로 둘이 막혀 있었다: D7 이 D5 표·outbox 를 직독하면 불변규칙 1 위반 · 이벤트 계약은 종류 추가가 곧 계약 개정. **㉯ 판정 = ⓐ 이벤트 계약을 확장한다**(Ted RULING ㉗). **㉰ 계약** = `EventType` **7종 → 10종**(`preview.backend-rerun`·`preview.grid-changed`·`preview.file-added`) ＋ `InvalidationTrigger` 열거(대장 축자 3값) ＋ `PreviewStalePayload` ＋ 구체 이벤트 3 ＋ `AnyEvent` 분기 3. **셋으로 가른 근거는 멱등 키**(`<타입>:<uploadId>`) — 한 종류면 업로드당 트리거가 한 번만 나가 완료 정의 ⓑ 가 배선에서 성립하지 않는다. **㉱ 발신(D5)** = `IngestionService` 가 **「이미 `ready` 인 업로드」에서만** 셋을 낸다(격자 축 신설 → 격자 변경 · 처음 보는 본체 감지 → 파일 추가 · 뒷단 ③④⑤ 재실행 → 미리보기 뒷단 재실행) ＋ 릴레이 발행자 `spool_publish`/`fan_publish`(D7 종류만 버스로) ＋ `COLAB_WORKER_EVENT_SPOOL`. **㉲ 수신(D7)** = `app/trigger_bus.SpoolTriggerPort`(poll → 집행 → ack · 멱등 키로 재전달 거름) ＋ `app/triggers.drain` ＋ `COLAB_VIZ_TRIGGER_SPOOL` ＋ `create_app` 이 `app.state.triggers` 로 들고 선다. **㉳ 마이그레이션 1건** = `0009_preview_stale_event_types`(`event_type` CHECK 7 → 10 · 순수 가산 · 값 이행 0행 · 전진 전용). **㉴ 배포 선언** = `compose.i2.yml` 에 버스 볼륨 `events` ＋ 두 단위 env, **시험이 두 값을 대조한다**(선언이 코드에 있고 배포에 없으면 아무 일도 안 난다 — RULING ㉗ 이 기각한 ⓒ 의 실패형). **㉵ 계수** = viz-render 180 → **194**(+14 · 새 음성 7) · pipeline-worker 204 → **222**(+18 · 새 시험 15 ＋ 배포 선언 3 · 새 음성 5) · 이벤트 픽스처 valid 5 → 8 · invalid 8 → 10 · op 총계 **무변동 54**(HTTP 표면 0). 전 게이트 **green 35 / red 0**. **㉶ 경계 위반 0건** — `import-boundary`·`banned-import`·`db-boundary`·`ai-no-lineage-write` green ＋ 식별자 음성 시험(수신부에 `sqlalchemy`·`psycopg`·`httpx`·`publish`·`outbox`·`append_event`·`d5_*` 0건). **㉷ `〈247〉` 음성 8건은 그대로 green** 이고 배선 끝까지 잠그는 음성이 늘었다. ⭑ **⟨2026-09-02 · 워크트리 `lane-59` · 릴리스 `14d3136aa55a`⟩ ⓕ 가 섰다 — 항목을 닫는다.** **ⓕ 막던 것 둘이 순서대로 걷혔다**: `#59`(버스 볼륨 `events` 소유권 — 릴리스 `b3c4085ccdf0`) → `#60`(`drain` 의 런타임 호출자 부재). **#60 의 해법 = 주기 배경 루프**(Ted 판정 — 관