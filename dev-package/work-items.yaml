    note: "⭑ **⟨신설 2026-09-03 · Ted 판정 · 등재 `PLAN-SoT §9 〈302〉` · 워크트리 `lane-close`⟩ `V-3` 이 물은 것(⑷ 후보 ⓐⓑⓒ)의 답이 「셋 다 아니다 — 별도 판독기」였고, 그 집행을 지는 항목으로 이 행을 세운다.** `V-3` 은 판정 항목이라 닫혔고 **실물 결손은 이 행이 진다.** ⭑ **`stage: stage2` 로 세운 근거** — ⑴ 선행 `A-1`(산출물 소유 구조)이 `stage2` 이고 이 행은 그 규율의 **구멍을 메우는 것**이라 같은 단이 아니면 `A-1` 이 반쪽으로 닫힌 채 남는다 ⑵ `V-3` 자신이 `stage2` 로 등재됐고 그 대체 항목이 단을 옮기면 **계수가 조용히 줄어든다**(`CLAUDE.md §5` 「「나중에」로 남기지 않는다」 · `〈258〉` RULING ㉞ 와 같은 선) ⑶ 앞선 같은 무늬의 신설 `RC-1`(`〈289〉`-㉰)도 `stage2` 로 섰다 — 대장 관행이 있다. ⚠ **계수 효과 = 0 이다 — 감추지 않고 셈을 적는다.** 같은 회차에 `V-3` 이 `done` 으로 내려가고(−1) 이 행이 서므로(+1) `stage2` 미완은 **9 그대로**이고 `PA-G` 개시 조건의 값도 **8 그대로**다. **줄어든 것이 아니라 바뀐 것이다** — 판정 항목 하나가 집행 항목 하나로 교체됐다. ⚠ **`03-HANDOFF §1`·`WORK-UNITS §11` 에는 행을 세우지 않았다** — `RC-1` 과 같은 이유로, 신설 근거가 실측이 아니라 판정이고 **착수 회차가 행을 세운다.** ⚠ **코드는 한 줄도 건드리지 않았다** — 이 회차는 원장 전용이다.⭑ **⟨관측 2026-09-03 · 등재 `PLAN-SoT §9 〈305〉` · 근거 `sessions/V-2-CLOSE-20260903.md §4`⟩ **진입조건으로 읽는다 — 이 항목이 훑을 자리에 산출물이 있는 대상은 14 중 3 건이다.** staging 카탈로그 **14건 전수**를 값 조회 1회씩으로 훑은 실측 = `available:true` **3건**(`01M0YWDXN7CA13KB7MQC9PGEW5` · `01M1JM3JTQSSTKR9A2QQ67QN81` · `01M19RENXAANZ2HDWM4Z46C37Y`) · **11건은 `200 ＋ available:false ＋ 「자리에 산출물이 없다」`**(`E-2` 의 tif·nc·gz·hdf 넷 포함). ⚠ **`E-2` 의 엣지 왕복을 근거로 「그 5종에 타일이 있다」고 읽으면 안 된다** — `E-2` 가 잰 것은 **렌더 한 장의 왕복**이지 **자리에 구운 COG 의 유무**가 아니다. 둘은 다른 자리다. ⚠ **종전 설명은 낡았다** — `〈254〉` 실측 ⑥(「`NumPy`·`GRIB` 는 지원 목록 밖」)은 `#58`(`44bef51`)이 파서를 넷에서 여섯으로 채우며 **부분적으로 뒤집혔다**(`d5/pipeline.py COG_BUILDERS` 실측 **다섯**). ⛔ **원인 `[미확인]` — 추측하지 않는다.** 푸는 법 = staging 의 자리(`previews`)를 **읽기 전용**으로 세어 대상별 `tile-` 벌의 유무를 직접 대조하고 각 데이터셋의 적재 시각과 견준다. ⚠ **차단이 아니다** — 지금 막히는 항목은 0건이고, 이 항목이 훑는 모집단의 크기를 미리 아는 것이 목적이다.⭑ ⟨이 항목이 왜 있는지의 실측 근거 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **캐시 키가 갈렸는데 고아는 0 이다 — 게이트가 낸 문면 그대로 적는다.** `BF-2` 배포로 ③지도형 키 3개가 전건 갈렸는데(`4e0ac3e3…`→`50dc2d4d…` · `a306fb2b…`→`d4a00edc…` · `f7b007c5…`→`4bf57c39…`) `artifact-ownership` 은 재굽기 전·후 **둘 다 `고아 0`** 을 냈다 — 축자 `산출물 소유 — 대상 한 벌 106 · 살아 있다 87 · 접수분에만 닿는다 0 · 고아 0 · 판정 불가 19` · `artifact-ownership green — 대상 106 벌 (살아 있다 87 · 접수분 0 · 고아 0 · 판정 불가 19) · 지도 타일 2 · 스냅숏 236 줄 · 삭제 0건`. **왜 그런가 = 등급이 사이드카의 원천 파일 존재로 매겨지기 때문**이다. 옛 키 산출물도 사이드카의 `baked_for.target_id` 가 살아 있는 데이터셋을 가리키므로 **`살아 있다` 로 남는다.** ⟹ **키 변경으로 stale 이 된 벌은 이 게이트의 회수 대상이 아니고 자리에 그대로 쌓인다** — 자리 파일 `227 → 236` · 벌 `103 → 106`(이 창 한 회차 · `〈309〉` 회수 직후 기준). ⛔ **게이트에 「stale」 등급이 없다** — 「고아」도 「판정 불가」도 아닌 제3의 상태이고, 그것을 지목·회수하는 자리가 이 항목이다. 근거 `sessions/WINDOW-20260904-B4.md §5`."
    sources: ["PLAN-SoT §9 〈302〉", "PLAN-SoT §9 〈294〉", "PLAN-SoT §9 〈296〉", "sessions/ARTIFACT-OWNER-DESIGN-20260831.md", "notes/SPEC-DELTA-PENDING.md §3-b ⓔ", "sessions/TL-1-20260905.md", "notes/TL1-LEDGER-PENDING.md", "PLAN-SoT §9 〈312〉", "PLAN-SoT §9 〈316〉", "notes/TL1-CLOSE-LEDGER-PENDING.md", "PLAN-SoT §9 〈286〉", "PLAN-SoT §9 〈309〉", "PLAN-SoT §9 〈318〉", "sessions/WINDOW-20260905-A5b.md", "PLAN-SoT §9 〈324〉", "sessions/V-1-STAGING-20260905.md"]

  - id: TL-2
    name: "구판 미리보기 산출물 회수 — 지도 타일 회수 루프의 소유 판정에 등급을 더한다"
    status: open
    stage: stage2
    owner: "D7 / viz-render"
    entry_conditions:
      - "`TL-1` 닫힘(회수 기구·주기 루프 실재 · ✅ 2026-09-05 `PLAN-SoT §9 〈316〉`)"
      - "⛔ `BF-12` 닫힘 — 관측 전용 계수는 로그로만 나오는데 지금 그 로그가 버려진다(`〈324〉`). 그 전에는 완료 정의 ⑴⑸ 를 잴 수 없다"
    depends_on: [TL-1, BF-12]
    completion_def: >-
      2026-09-05 기재(Ted 판정 · 구두 축자 「1,2 권고대로」 · 등재 `PLAN-SoT §9 〈323〉`). **요구를 새로 만들지 않았다** —
      `〈318〉`-㉱ 가 `〈315〉`-㉯ 를 반증하면서 갈 곳이 없어진 처분 하나를 항목으로 세운 것이다.
      ⑴ **등급 신설**(**판정 불가** · **원천 원장 부재**)이 **관측 전용 계수**에 나타난다 — 세기만 하고 지우지 않는다
      ⑵ **단독 실측 시험 RED → GREEN**(등급 없는 상태에서 그 벌들이 안 잡히는 시험이 먼저 red)
      ⑶ **계수 결과가 창 5b 의 19벌 집합과 대조된다** — 재굽기로 닿지 않는 **16벌**(사이드카 부재 **14** ＋ 원천 원장 부재 **2**)이 그 안에 있다
      ⑷ **삭제는 Ted 의 별도 go 이후** · 상한 **20/바퀴** · **fail-closed 유지**(`TL-1` 이 세운 가드를 낮추지 않는다)
      ⑸ **staging 배포 green 뒤 관측 로그 1바퀴 실측**
      ⛔ **여기 적힌 것 밖의 수를 지어내지 않았다** — 등급별 예상 건수 · 루프 주기 변경 · 기한은 전부 `[미확인]`.
    evidence: >-
      ⭑ **⟨2026-09-05 착수 보류 — 진입조건 미충족⟩ 진입조건 「`BF-12` 닫힘」이 서지 않아 착수하지 않았다**(`CLAUDE.md §4` 「진입조건 미충족이면 구현하지 말고 보고한다」).
      `BF-12` 는 코드가 `main` 에 병합됐으나(`14db1a8` · 등재 `PLAN-SoT §9 〈325〉`) **완료 정의 ⑶(staging 배포 뒤 첫 바퀴 요약 1줄 실물)이 미충족이라 `open` 이다.**
      ⟹ 이 항목의 완료 정의 ⑴⑸ 는 여전히 **잴 수 없다** — 관측 전용 계수가 로그로만 나오는데 그 로그가 아직 staging 에서 확인되지 않았다.
      **착수 자리** = **다음 배포 창(창 6)** 에서 `docker logs colab_v2_staging_viz_render` 의 회수 요약 1줄이 서는 순간(`03-HANDOFF §4.5`).
      ⛔ **이 회차의 `TL-2` 관련 코드·시험·계약 변경 0줄.** 등급별 예상 건수·루프 주기·기한은 여전히 `[미확인]`.
    deadline: null
    note: >-
      **신설 2026-09-05 · 등재 `PLAN-SoT §9 〈323〉`** — Ted 판정으로 선택지 ㉮(기구 재사용)를 채택하고 ㉯(1회성 수동 삭제)를 기각했다.
      **`〈315〉`-㉯ 의 「재굽고 재계수한다」를 대체한다**(종전 문면은 `RC-1.note` 와 `〈315〉` 에 원문 그대로 보존).
      ⚠ **순서를 항목 안에 못 박았다** — 관측 전용 계수(삭제 0 확인) → Ted 별도 go → `apply`. 한 회차에 붙이지 않는다.
      ⚠ **`CR-2` ⑶ 이 지는 것은 재굽기·재실측까지**이고 처분은 여기로 왔다.
    sources: ["PLAN-SoT §9 〈323〉", "PLAN-SoT §9 〈318〉", "PLAN-SoT §9 〈315〉", "PLAN-SoT §9 〈316〉", "PLAN-SoT §9 〈324〉", "PLAN-SoT §9 〈325〉", "sessions/WINDOW-20260905-A5b.md", "work-items.yaml CR-2 ⑶"]

  - id: VL-1
    name: "값 조회 초기화 지연 — 유휴 후 첫 접촉 p95 1초 초과의 원인 조사와 개선"
    status: done
    stage: stage2
    owner: "D7 / viz-render"
    entry_conditions: ["없음 — `V-2` 의 완료 정의 여덟 중 일곱이 이미 서 있어 잴 대상(값 조회 경로)이 실재한다(`PLAN-SoT §9 〈294〉`·`〈304〉`). 계약 개정 0 · 마이그레이션 0 으로 착수할 수 있고, 개선 집행과 재측정은 staging 접촉을 요구한다"]
    depends_on: [V-2]
    completion_def: "2026-09-03 기재(Ted 판정 · 등재 `PLAN-SoT §9 〈305〉`). **`V-2` 완료 정의 ⑻ 개정이 만든 항목이다 — 요구를 새로 만들지 않았다.** ⑴ **원인 실측** — 유휴 후 첫 접촉에서 **무엇이 느린가**를 값으로 가른다. 후보(어느 것도 아직 증명되지 않았다) = ⓐ 자리 COG 최초 열기(파일 열기 ＋ 헤더·오버뷰 읽기) · ⓑ 자리 이름(내용 키) 재계산 — `sourceDigest`·`sourceByteSize` 가 본체 파일을 열어야 나온다(`〈294〉`-㉲) · ⓒ OS 페이지 캐시 미적중 · ⓓ 컨테이너·워커 프로세스의 첫 요청 비용(모듈 적재 · 연결 풀) · ⓔ 엣지·프록시 경로 확립(Cloudflare ＋ nginx). ⚠ **측정 방법을 함께 적는다** — 서버가 자기 처리 구간을 `Server-Timing` 에 실어 보내게 하거나(그러면 `〈304〉` 의 `[미확인]` 인 **서버 단독 p95** 도 함께 풀린다) 서버 로그에 구간 시간을 남긴다. **「냉시동」을 원인으로 적지 않는다 — 그것은 관측에 붙인 이름이다.** ⑵ **개선 집행** — ⑴ 이 귀속한 그 자리를 고친다. **무엇을 고칠지는 지금 적지 않는다**(원인이 `[미확인]` 인 상태에서 쓰면 지어낸 완료 정의가 된다). ⑶ **재측정** — **유휴 30분 후 첫 접촉을 포함한 p95 ≤ 1초** · **3 데이터셋 × 첫 접촉 각 5회 이상** · **데이터셋별로 판정**(합산 아님 · `V-2` ⑻ ㈁ 와 같은 규칙) · **표본 원값을 남긴다**(`〈304〉` 가 원값을 안 남겨 합산 p95 를 `[미확인]` 으로 잃었다 — 같은 실패를 되풀이하지 않는다) · **상한 ≤ 5초**도 함께 잰다. ⚠ 유휴 30분은 **재는 조건**이고, 실제 유휴 간격을 기록한다(`〈304〉` 의 유휴 간격 `[미확인]` 을 남기지 않는다). ⑷ **`V-2` ⑻ 재판정** — ⑶ 의 값으로 `V-2` 완료 정의 ⑻ 을 다시 판정하고 결과를 `V-2.evidence` 에 적는다. **충족이면 `V-2` 를 닫고, 미충족이면 닫지 않는다.** ⚠ **명시적 범위 밖** = 값의 정확도(`V-2` ⑶⑷) · 동시 부하 아래의 눈금(`〈304〉`-㉴ 가 남긴 별개 축) · 자리에 산출물이 없는 11건의 원인(`TL-1`·`RC-1` 이 진입조건으로 안고 있는 관측) · 굽는 경로를 넓히는 일."
    evidence: "⭑ **⟨실측·집행 2026-09-04 · 워크트리 `lane-vl1` · 등재 `PLAN-SoT §9 〈311〉` · 근거 `sessions/VL-1-20260904.md` · 표본 원값 `sessions/VL-1-SAMPLES-20260904.tsv`(400건) · 탐침 `sessions/VL-1-PROBE-20260904.sh`⟩ 완료 정의 ⑴~⑷ 전건 집행. **㉮ ⑴ 원인 실측 — 「냉시동」은 D7 안에 없다.** 방법 셋을 함께 적는다: ㈎ `docker exec`(~~읽기만~~ **읽기 ＋ 파일 단위 페이지 캐시 조작** — `posix_fadvise(DONTNEED)` 는 「읽기만」이 아니라 **레인의 읽기 전용 범위를 넘은 측정 행위**다. 되돌릴 수 있고 staging 자료는 무변경) 안에서 `value_lookup` 단계별 `perf_counter` ＋ **파일별 `posix_fadvise(DONTNEED)`** 로 찬 상태를 만들었다(호스트 전역 `drop_caches` 는 쓰지 않았다) · ㈏ 같은 `POST` 를 **공개 엣지**와 **nginx 직접**(Cloudflare 무경유) 양쪽으로 불러 `curl` 의 connect·appconnect·starttransfer 를 남겼다 · ㈐ 서버가 자기 구간을 `Server-Timing` 에 싣게 고쳤다(㉯ · **배포 전이라 이번 귀속에는 쓰지 못했다**). **구간표(찬 상태 중앙값)** — nginx 직접 **17 ms** ＜ 엣지 **279 ms**(TCP 46 ＋ TLS 44 ＋ **Cloudflare·터널·오리진 왕복 189**). 컨테이너 안 `lookup()` 전체 = GK-2A **8.6 / 7.9 ms**(찬/따뜻) · DEM **6.3 / 6.3** · U-Net **20.1 / 19.9** · PV-1 **7.9 / 7.7**. **귀속 = 사용자가 겪는 시간의 262 ms 가 엣지이고 서버는 17 ms 다.** 후보 기각 — ⓒ 페이지 캐시(찬/따뜻 차 0.7 ms) · ⓑ 키 재계산(13 MB sha256 **6.6 ms** = 예산 1초의 0.7 %) · ⓓ 워커 첫 요청 — ⭑ **⟨정정 2026-09-04 · 수용 검토⟩ 근거는 ~~유휴 33분 뒤 nginx 15~30 ms~~ 가 아니라 `GK-2A` 엣지 첫 접촉 5 표본(247·292·292·338·259 ms)뿐이다** — `cold_ngx` 20 표본은 엣지 첫 접촉 1~4 초 뒤라 프로세스가 이미 따뜻하다(`VL-1-PROBE-20260904.sh:30-35`). ⚠ **남긴 관측 둘** — COG 최초 열기가 페이지 캐시를 버린 직후 **285.3 ms**(GK-2A · 표본 1 · 13 MB · 따뜻하면 1.2 ms)이고 `sourceDigest` 는 **본체 크기에 선형**(1 GB 면 약 500 ms 추정)이다. **둘 다 지목되지 않았고 고치지 않았다.** **㉯ ⑵ 개선 집행 — advisor 권고대로 집행(자문 1회 · 종료). 성능 고침 0건 · 계측 1건.** 결정 사실 = 「nginx 17 ms vs 엣지 279 ms 이고 가장 느렸던 표본(DEM)이 서버 일을 가장 적게 한다」. 집행 = `Server-Timing` 구간 — viz-render `vizResolve`·`vizFindTile`·`vizReadPoint`·`vizTotal` · core-api `coreAccess`·`coreRelay`·`coreTotal` ＋ **저쪽 구간 무해석 통과**. **계약 몸통 무변경**(op 신설 0 · seam 개정 0 · `contract-breaking` green — `Server-Timing` 은 표준 응답 헤더이고 `/healthz` `tileBranch` 와 같은 선의 관측 자리다). **시험 6건 신설 · 구현 전 red 실측 확인 후 green.** ⛔ **`sourceDigest` 캐시는 넣지 않았다** — 측정이 그 자리를 지목하지 않았고 `VL-1` ⑵ 축자 「원인이 `[미확인]` 인 상태에