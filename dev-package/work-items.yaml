    entry_conditions: ["K2", "G2", "D2", "`K4-b`(그래프 증강)는 `G8b` Q1 대기"]
    depends_on: [K2, G2, D2, T-1]
    completion_def: "⭑ ⟨개정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈208〉` — `S2b` 에서 품질 오라클을 넘겨받았다⟩ **⑴ 검색 평가셋 A층을 `eval/s2b-alayer/run.py` 로 1회 실행하고 결과를 `baseline.json` 대비로 기록한다 ⑵ 통과·실패 건별로 「고칠 것인가 · 한계로 기대값에 반영할 것인가 · 범위 밖인가」를 판정해 하나도 무판정으로 남기지 않는다 — 2026-08-29 시점 미판정분 = A층 실패 8건 ⑶ ⭑ ⟨개정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈217〉`⟩ **합격선은 퍼센트가 아니다 — 「미판정 0건 ＋ 판정 후 전건 통과」다.** 그리고 **판정마다 그 사유를 기록한다** — 사유 없이 실패를 재분류하면 보는 범위가 조용히 줄어든다(이 레포 대표 실패형인 green-by-skip 의 문서판이다). ／ 이전 ~~⑶ 합격선(재현율·근거 정확도의 수치)은 이 항목이 정한다. 정하지 않으면 닫지 않는다.~~** ⚠ **`S2b` 는 산출물 항목으로 닫혔다 — 품질을 되돌려 보낼 곳이 없다.** ⚠ 실패 8건을 고칠 수단이던 형태소 분석기 교체는 `〈182〉` 로 폐기됐다 — **고치는 것이 아니라 판정하는 것이 완료 조건이다.** ／ 이전 ~~평가셋 대비 재현율/근거 정확도 (`§8`). ⭑ 완료 판정이 `T-1` 에 걸렸다(`〈167〉-㉱` — 평가셋 A층 재측정)~~"
    evidence: null
    deadline: null
    note: "⭑ **⟨간선 절단의 반대편 2026-08-30 · Ted 판정(오늘)⟩ `P4`(검색 히어로·검색 결과)가 이 항목을 선행으로 걸던 `depends_on` 간선이 끊겼다.** 직전 회차가 「판정 대기 1건」으로 올린 자리가 닫혔다 — 검색 화면은 조건 검색 위에 서고, 이 항목을 기다리지 않는다. **이 항목이 잃은 것은 없다** — `P4` 가 지고 있던 자연어 몫이 오히려 이리로 모인다. ／ ⭑ **⟨합격선 재배치 2026-08-30⟩ `〈217〉` 의 자연어 몫이 이 항목에 남는다** — ⑴ 평가셋 A층 대비 화면 층(S-01·S-06) 대조 ⑵ 결과 카드의 `AI 근거`(정본 `Policy_데이터_찾기.md:120`) ⑶ 검색 질문 「1~200자. 자연어」(같은 정본 `:122`). **조건 검색 몫(정본 `:117` Verified 우선 정렬 · `:150` Verified만 보기 토글 · `:121` 관련도 막대 · `:151` 잠긴 카드 · `:170` 0건 문구)은 `P4` 에 남아 stage 2 에서 판정된다.** 「미판정 0건 ＋ 판정 후 전건 통과 ＋ 사유 기록」이라는 **합격선의 형식은 양쪽이 똑같이 물려받는다 — 갈린 것은 모수뿐이고 어느 쪽도 버리지 않았다.** ／ ⚠ **`〈220〉`-㉲ 가 이 항목을 닫지 않았다**(전건 통과 미충족 · 기대값 개정 6건이 Ted 확정 대기) — **그 미결은 stage 3 으로 그대로 넘어간다.** ／ ⭑ **⟨단계 이동 2026-08-30 · Ted 판정 · `PLAN-SoT §9` 번호 미발급 — 등재문 `dev-package/sessions/STAGE3-AI-SPLIT.md`⟩** `stage1` → `after_stage2`(= **stage 3**). **근거 축자 = 「AI 는 전부 다음 단계」** — 이 항목의 이름 자체가 **자연어 검색**이라 판정이 직접 닿는다. 기획 정본과도 같은 방향 = `_결정_업로드계보_260826.md` §2-5 축자 「**자연어 검색은 넣지 않는다**」. ／ ⭑ **함께 옮기지 않은 것을 이름으로 적는다 — 조건 검색은 이번 릴리즈에 남는다.** 같은 §2-5 축자 「**표·필터·정렬 기반 조건 검색만**」. 그래서 `T-1`·`F-2`·`P4` 는 **stage 2 에 남겼다**(자연어라 깨끗이 부를 수 없는 것은 남긴다). ／ ⚠ **선행 판정을 지우지 않는다** — `〈182〉`(검색 진입점은 AI 검색 하나) · `〈208〉`·`〈217〉`(합격선 = 미판정 0건 ＋ 판정 후 전건 통과) · `〈220〉`·`〈222〉`(평가셋 2세대) 는 **본문 그대로 유효**하고 stage 3 의 완료 판정 규칙으로 그대로 쓴다. ／ ⭑ **자산 인계** — 평가셋 `eval/s2b-alayer/`(18건 · `run.py` · `baseline.json`) · 2세대 평가셋 · `LlmQueryInterpreter` ／ `LiteralInterpreter` 자동 폴백. **끄는 비용이 0이라 되살리는 일이 아니다**(`_결정_…` §2-15 축자 「**되돌리기 쉽다**」). ／ ⚠ **`P4` 가 이 항목을 `depends_on` 으로 건다** — `P4` 는 stage 2 에 남았는데 선행이 stage 3 이 됐다. **Ted 판정 대기 1건**으로 올린다. ／ 이전 ~~stage1~~ ／ ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈208〉`⟩ 오라클은 초안이 아니다 — 평가셋 18건이 `eval/s2b-alayer/` 에 실재하고 실행기·기준선이 붙어 있다(2026-08-29 21:01 KST 실측). 남은 것은 「돌려서 판정하는 일」이고 그것이 이 항목의 완료 조건으로 들어왔다.** ／ 이전 ~~닫지 않는다 — 완료 판정의 오라클(평가셋)이 초안 상태다. ⚠ `S2b` 는 이미 Ted 승인 ✅ 로 적혀 있어 「초안」 진술과 어긋난다.~~ ⚠ 서비스가 staging 에서 실결과를 내는데 상태는 ⬜ 다 — 문서가 이유를 명시하므로 ⬜ 로 둔다. 하위 층 `K4-a`·`K4-b` 와 선행 `G8b` 는 어느 표에도 자체 행이 없다."
    sources: ["03-HANDOFF §1 T-K", "WORK-UNITS §8", "WORK-UNITS §10.2", "WORK-UNITS §11"]

