    evidence: "⭑ **실측 (2026-08-29 · `sessions/STAGE2-READINESS-AUDIT.md §1`) — 완료 정의 2항이 코드로는 전건 충족이다.** ⑴ 삼킴 구문 `docker tag … 2>/dev/null || true` **부재** — `9c6fc92` · `31f36a5` 가 제거했다. 현재 판정은 `infra/staging/pipeline/lib.sh:135-159 alias_reattach()` 가 **종료코드 ＋ 이미지 ID 대조**로 내리고, 재부착 성공 0건도 red 로 떨어뜨린다(「대상 0건 = red」). 호출 자리 = `infra/staging/deploy.sh:220-226` 으로 **원장 green 앞**에 선다. ⑵ 실패 픽스처 **P15 · P16 · P20** 실재(`infra/staging/pipeline/selftest.sh:185`·`:192`·`:207-214`) — P20 은 `|| true` 잔존과 `alias_reattach` 미호출을 각각 FAIL 로 잡는다. selftest **37/22 GREEN**. ⚠ **남은 행동은 코드가 아니라 Ted 상태 판정이다** — 이 항목의 `status: open` · 형제 탐색 `[미확인]` 을 어떻게 닫을지가 사람의 자리다. ⭑ **⟨개정 2026-08-30 · 재실측⟩ 완료 정의 2항 전건 충족 — 닫는다.** **⑴** 삼킴 구문 **전수 부재** 재확인 — `infra/staging/**` 의 `docker tag` 5자리 중 무조건 성공 경로 **0건**(`deploy.sh:110` 은 `|| abort`, 나머지는 주석). 판정은 `pipeline/lib.sh:175 alias_reattach()` 가 종료코드 ＋ 사후 `image inspect` **이미지 ID 대조**로 내리고, 호출 자리 `deploy.sh:225` 는 **원장 green 앞**이며 `rollback.sh:120` 도 같은 함수를 재사용한다. **⑵** 실패 픽스처 **실행** 확인 — `pipeline/selftest.sh` P15(태그 실패) · P16(성공을 말했는데 안 붙음) · P20(무조건 성공 경로 소멸 ＋ 판정 함수 호출) ＋ 양성 대조군 P14·P18 ＋ P26(rollback 호출) · 결과 `pipeline selftest: GREEN (54건 + 판정기 전건 기대대로)` ＋ `verify selftest: GREEN (22건)`. ⭑ **⑴ 은 코드뿐 아니라 실배포로 행사됐다** — 2026-08-30 배포 회차가 별칭 재부착을 **실제로 돌렸고** 원장이 `별칭재부착GREEN digest이력=6종` 을 적었다(`~/colab-v2-releases/release-ledger.tsv` `2026-08-30T10:41:50+0900 deploy cfc98e302ae4 green`). 이미지 ID 대조의 실물 = `image-digest-ledger.tsv` **6행**(`core-api`·`pipeline-worker`·`viz-render`·`ai-service`·`frontend`·`migrator` 각 `:i2` ↔ `sha256:…`) — **선언된 6종 전건이 대조됐고 대상 0건이 아니다.** ⚠ 형제 탐색 `[미확인]` 은 **이 항목의 완료 정의 밖**이다(완료 정의는 2항뿐) — 닫는 근거로 쓰지 않았고 별건으로 남는다."
