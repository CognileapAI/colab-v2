      ⑴ 실패 시험 red — 같은 `--*` 이름이 둘 이상의 CSS 에 정의돼 있으면 **값이 글자 그대로 같아야** 하고, 갈리면 red(정적 대조 · 입력은 vite `?raw` — `node:fs` 를 쓰지 않는다)
      ⑵ 갈린 자리가 실측되면 **어느 값이 정본인지 사람이 판정한 뒤** 한 값으로 모은다 — 시험이 고르지 않는다
      ⑶ 세 파일에 공통인 이름은 `tokens.css` 로 올릴지 화면 로컬로 둘지 판정한다(「셸이 실제로 쓰는 토큰만 옮긴다」는 `tokens.css` 머리말과 부딪히지 않게)
