    completion_def: "⭑ ⟨신설 2026-09-03 · `PLAN-SoT §9 〈289〉`-㉰ · advisor 권고대로 집행 · Ted 사전 위임 2026-09-03⟩ **`V-1` 초안 ⓒ 가 「별도 작업이고 소유 미정」이라 적어 둔 자리를 항목으로 세운 것이다 — 요구를 새로 만들지 않았다.** **기구는 `A-1` 이 이미 지었다**(`d7_visualization/invalidation.reclaim_plan()` ＋ 게이트 `artifact-ownership` · `〈272〉`). **없는 것은 한 번 도는 것뿐이다.** — **⑴ 구판 사이드카를 판 2 로 재굽는다.** 지금 자리의 사이드카가 **전건 구판**이라 소유 판정이 서지 않는다(실측 `〈273〉` — 판정 불가 **49** · 재굽기 **0회**). — **⑵ 재굽기 뒤 `reclaim_plan()` 을 1회 돌린다.** 계산기는 새로 짓지 않는다 — `plan()` 을 부르고 고아가 아닌 키를 `keep_keys` 로 넘기는 기존 경로 그대로다. — **⑶ 완료 조건(실측값으로 못 박는다)** = **판정 불가 49 → 19** · **삭제 0** · **재굽기 0회** 였던 세 값이 각각 갱신되어 관측된다. ⚠ **「몇 건을 지운다」로 적지 않는다** — 사후 판정을 관측 개수로 쓰지 않는다(`CLAUDE.md §5`). 지우는 대상은 **고아 등급뿐**이고 그 수는 재기 전에는 모른다. — **⑷ 음성 조건** = 지도 타일(`tile-`)은 `kept` · 접수분 루트는 `OutOfScope` · 원본·기준 격자·데이터셋 **무접촉**(`〈247〉` 과 같은 선 · `A-1` 음성 시험이 이미 잠근다). — ⛔ **범위 밖** = 팔레트 선택 재렌더 경로(`V-1`) · 고르는 UI(`J-6`)."
    evidence: "⭑ ⟨집행 2026-09-04 · `PLAN-SoT §9 〈309〉` · 워크트리 `lane-rc1` · 근거 `sessions/RC-1-RECLAIM-20260904.md` · Ted 승인 2026-09-04 「전수 스냅숏 후 회수」⟩ **회수 1회를 집행했다 — 고아 14 벌(28 파일)만 지웠다.** ⑴ = `〈308〉` 충족(재굽기 3건 · 9층 200). ⑵ = `invalidation.reclaim_plan()` → `apply()` **한 자리**로 집행 · 계산기 신설 0. ⑶ = 판정 불가 **49→19** 는 `〈308〉` 이 충족했고 **회수 후 재실측도 19 유지** · 삭제 **0 → 28 파일(14 벌)** · 재굽기 **0 → 3건**. ⑷ 음성 = 지도 타일 2 · 판정 불가 19 · 살아 있다 84 가 **전건 `kept`**(누락 0 · `stale` 침범 0) · `OutOfScope` 0 · SQL 쓰기 0 · 컨테이너 수명 조작 0 · 파괴 플래그 0 · hand-`rm` 0. **계수 전후** = `대상 117 · 살아 있다 84 · 접수분 0 · 고아 14 · 판정 불가 19` → `대상 103 · 살아 있다 84 · 접수분 0 · 고아 0 · 판정 불가 19`(자리 파일 255 → 227). **게이트 `artifact-ownership` 이 red(판정) 에서 green 으로 닫혔다** — `〈308〉` 이후 서 있던 유일한 red 였다. **되돌릴 길** = 회수 **전에** 뜬 짝 백업 `platform-20260904T013647` / `vol-previews-20260904T013726`(255건 · 매니페스트 전건 일치)에 28 파일이 그대로 있다. **전수 스냅숏** = `dev-package/sessions/RC-1-SNAPSHOT-20260904T0138.tsv`(255 줄 · 키·확장자·크기·source·sidecarVersion·baked_for·등급·사유). **지운 14 벌의 정체** = `baked_for.is_upload: true` 이고 `source` fileId 셋(`01M1H43V0SX1V7ZPCB2KTC9RN8` 6벌·`01M1H44AYFJA62X9NQQD849DN9` 4·`01M1H4800DAJ0PVH7CTG74TDEE` 4)이 `d3_file` **0행** · `d5_upload_file` **0행** · 대상 3건이 `d3_dataset` **0행** — **등록되지 않고 버려진 접수분의 그림**이라 등록된 데이터셋의 화면은 하나도 바뀌지 않는다. **현물 확인 전후 `diff` 0줄** — 렌더 3건 × 3층 전건 200(바이트 수까지 동일) · 값 조회 3건 200 `available true`. ⚠ **면제 선언은 비운 채다**(`[exempt] keys = []`) — **회수로 닫았지 선언으로 닫지 않았다.** ⚠ **재지 않은 것** = 판정 불가 19 벌의 처분 `[미확인]`(구판은 그 키가 다시 구워질 때만 덮인다 · `tolerate = true` 유지) · 캐시 키가 갈린 원인의 귀속 `[미확인]`(`〈308〉` 과 같다) · 회수한 디스크 용량 합계 미산출."
