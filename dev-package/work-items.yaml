    evidence: null
    deadline: null
    note: >-
      **신설 2026-09-05 · 등록만** — `PLAN-SoT §9 〈331〉`. 발견 = `BF-11` 수용 검토(`reports/bf-11/lane-report.md §2`·`§7`).
      ⭑ **드리프트 위험이지 오늘의 결함이 아니다** — `BF-11` 이 옮겨 적은 값은 원본과 글자 그대로 같음을 그 회차가 확인했고, `BF-11` 의 판정 둘(ⓐ 폐기 별칭 재정의 금지 · ⓑ 정본 계열 이름만)이 **`project.css` 한 파일에 대해서는** 되돌아갈 길을 막는다.
      ⛔ **막지 못하는 것** = 세 파일 사이의 **값 불일치**다. 같은 이름이 다른 값으로 갈려도 어느 시험도 red 를 내지 않는다 — 그것이 `BF-11` 이 없앤 것(정본과 어긋난 두 번째 이름 체계)과 같은 뿌리이고, 이름이 아니라 값에서 다시 난다.
