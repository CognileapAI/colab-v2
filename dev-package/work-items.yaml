    note: "⭑ ⟨개정 2026-08-29 · 화면 레인 접두사 분리⟩ 종전 식별자는 `S1-preview-ui` 였다 — WU `S1`(초기 데이터)·집행 계획 `S1-PLAN` 과 한 이름을 쓰던 자리다. 접두사를 `SC-`(화면 레인)로 갈라 다섯 레인에 `SC-1`~`SC-5` 를 붙였다. 등재문 초안 = `dev-package/sessions/NAME-SPLIT.md`. ／ 이전 사유 = `§4` #20. 단 `§4` #20 은 2026-08-26 `〈115〉-㉮` 로 ✅ 해소 표기 — 진행도 🟧 와 어긋난다. WORK-UNITS 읽기에는 이 레인이 없다. ⭑ **⟨2026-09-03 · `PLAN-SoT §9 〈289〉`-㉯ · advisor 권고대로 집행 · Ted 사전 위임 2026-09-03⟩ 완료 정의를 기재하고 `partial` → `done` 으로 닫았다.** **이름에서 `(P4)` 를 뗀 근거** = 검색 화면은 `P4` 소유이고 `P4` 는 **stage 3** 다(Ted 2026-08-30 축자 「통째로 stage 3」). 그 화면을 이 stage 1 레인의 이름에 달아 두면 **stage 1 이 stage 3 산출물을 기다리는 모양**이 되어 영영 닫히지 않는다. `15847b3`(P4 검색 화면)이 종전 `evidence` 에 남아 있던 것도 같은 혼선이다 — 값은 지우지 않고 귀속만 바로잡았다. **선례** = `SC-1`~`SC-4` 도 완료 정의 공백 상태에서 근거로 닫혔고 필드 모양이 같다. ⟹ **효과 = `stage1` 미완 1 → 0.** `PA-G` 개시 조건 셈법(`PA-G.entry_conditions` 규칙 ①~④)의 stage 1 몫이 이것으로 비었다."
