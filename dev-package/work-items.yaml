    evidence: "⭑ 2026-09-02 · 워크트리 `lane-p7` — **넷 중 셋 충족, 셋째(staging 배포 green)가 남았다.** ① 수용 기준 = E-07 의 P7 범위 넷(데이터 맵 · 요약 지표 · 할 일 함 · 최근 활동 ＋ 연구실 정보 읽기 모달)이 화면으로 섰다. ② 게이트 = `all` **green 35 / red 0**(우회·검사 축소 0). ③ **staging 배포 green = 미충족** — 이 회차는 배포 승인 범위 밖이었다. ④ 목업 대비 = `홈_대시보드_260817.html` 축자 대조로 문구 6곳을 실물에 맞췄다(`우리 연구실 데이터 맵` · `기록 없음이 정상` · `미확정 N건` · `대기 N건` · `계보 확인이 필요한 데이터 N건 전부 보기 →` · 상대 시각). **D8 실동작 op 0 이 닫혔다** — 501 표 8 → 5(`getDashboardSummary`·`getDataMap`·`listActivities`), **계약 개정 0 건**. 시험 = core-api **519**(＋9 · 연구실 경계 음성 포함) · frontend **422**(＋23).⭑ **⟨2026-09-02 닫힘 · `PLAN-SoT §9 〈273〉`⟩ 완료 판정 네 항 전건 충족 — 남아 있던 3항이 섰다.** 3항 `staging 배포 green` = 릴리스 `e935db203b07` · `verify-deploy.sh` **GREEN 통과 15건 · SKIP 0**. ⭑ **배포된 스택에서 D8 세 op 이 실제로 서 있는 것을 확인했다 — 배포 green 만으로 단언하지 않았다**: `/api/v1/dashboard/summary`·`/dashboard/data-map`·`/dashboard/activities` 가 **401 `UNAUTHORIZED`** 를 낸다(미인증 호출). **501 `NOT_IMPLEMENTED` 이 아니라 401 이라는 것이 op 이 실재한다는 증거다** — 미구현이면 인증 앞에서 501 이 먼저 나온다. ⚠ **주체 토큰을 든 양성 왕복은 이 회차에 재지 않았다 `[미확인]`**(푸는 법 = 배포 스택에 교수 베어러 1개로 세 op 1회씩 · 레포 시험 core-api 9건·frontend 23건은 green). ⭑ **1·2·4 항은 `lane-p7` 실측을 승계한다** — 다만 병합 뒤 프런트 시험이 회차마다 422/421 을 오갔고 그 원인을 고쳤다: `DataMapCard.tsx:17` 이 `map.byLineageState` 를 무방비로 읽어 배열이 없으면 **렌더 예외로 App 트리가 통째로 죽었다**(`test/auth.test.tsx` 가 `/lab` 에서 App 을 그리고 모든 응답을 `account()` 로 덮는다). 계약은 그 필드를 required 로 못박으므로(`contracts/seams/fe-core.yaml:3350`) **규격을 지키는 응답에서는 이 수정이 아무것도 바꾸지 않는다.** 고친 근거는 `P7` 자신의 규칙이다 — `useDashboard.ts` 머리말 축자 「구획마다 따로 싣고 따로 실패한다 … 한 덩어리로 묶으면 하나가 죽을 때 홈이 통째로 죽는다」. 수정 후 **frontend 422 전건 green 을 5 회 연속** 확인했다(수정 전 5 회 중 2 회 red · 병합 전 기준선 399 는 3 회 전건 안정 ⟹ **병합 결함이 아니라 `P7` 결함**). 배포 전 시험 = core-api **519** · frontend **422** · viz-render **232** · pipeline-worker **222** · ai-service **145** · 게이트 green 37 / red 0."
    deadline: null
    note: "D8 실동작 op 0 이 여기서 닫혔다. ⚠ I5 진입조건이 P7 을 거는데 P7 은 stage 2 다. ⭑ **`partial` 인 이유는 하나뿐 — staging 배포 green(`§7` 완료 판정 3항)이다.** 코드·시험·게이트는 다 섰고 배포만 다음 회차다. ⚠ **P8 은 아직 열리지 않는다** — `P8.depends_on = [P7]` 이고 P7 이 `done` 이 아니다. ⚠ **정본 안 갈림 하나** — `Policy_홈_대시보드 §5.3` 은 「맵에서 누른 조건이 카탈로그로 전달되는 것」을 Phase 2+ 로 미루는데 같은 문서 `§8`(v1.5)은 「막대는 전부 눌려 그 조건으로 카탈로그를 연다」고 적는다. **뒤에 쓰인 `§8` 을 따랐고**(주소 질의 `lineageState`·`topic` → `useCatalog` 초기 조건), 조건 툴바를 새로 만들지는 않았다. ⚠ **검색 히어로는 손대지 않았다** — 목업의 히어로(예시 질문 3개 등)와 실물이 다르지만 그 자리의 주인은 `P4`(stage 3)다. ⭑ **⟨2026-09-02⟩ 닫혔다 — `partial` 의 유일한 사유였던 `staging 배포 green` 이 섰다**(릴리스 `e935db203b07` · 등재 `PLAN-SoT §9 〈273〉`). ⟹ **`P8` 의 진입조건 `P7` 이 충족돼 `P8` 이 열렸다.** ⭑ **명세 갈림 하나를 판정 없이 넘기지 않았다(`〈273〉`-㉳ 재등재)** — `Policy_홈_대시보드 §5.3` 은 「맵의 조건이 카탈로그로 전달되는 것」을 Phase 2+ 로 미루는데 같은 문서 `§8`(v1.5)은 「막대는 전부 눌려 그 조건으로 카탈로그를 연다」고 적는다. **뒤에 쓰인 `§8` 을 채택했다** — 근거는 작성 시점 하나이고, 그 밖의 근거(제품 판정)는 없다. ⚠ **Ted 가 `§5.3` 을 정본으로 확정하면 이 채택은 뒤집힌다 `[미확인]`.**"
    sources: ["03-HANDOFF §1 T-P", "WORK-UNITS §7", "WORK-UNITS §10.2-b", "WORK-UNITS §11"]

