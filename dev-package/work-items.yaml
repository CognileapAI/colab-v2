ine-through` · `--color-gray-500` · `cursor: not-allowed`). 시험 3건(`frontend/test/catalog.test.tsx` §5 Verified 열) = ⓐ 안 온 행은 글자 `Verified` ＋ `verified--pending` ＋ `aria-disabled` ⓑ 온 행은 그 표식이 붙지 않는다 ⓒ 한 행은 둘 중 **하나만** 그린다. **red 확인 = 구현 전 2건 red 실측.** ⚠ **취소선 자체를 계산값으로 재지는 못했다 `[미확인]`** — jsdom 이 stylesheet 를 싣지 않는다(종전 회차의 헤더 고정 시험과 같은 도구 제약 · 값을 지우지 않고 시점을 붙인다). 규칙은 `catalog.css` 축자로 읽어 확인했다. ⛔ **`status` 는 `open` 그대로다** — 조항 ⑴ 의 **헤더 고정 시험 부재**가 `[미확인]` 로 남아 있고(같은 도구 제약 · 프런트 시험 설정 회차가 푼다), **부분 충족으로 닫지 않는다**(`CLAUDE.md §5`). ／ 실측 = frontend **429 → 432 pass** · `tsc --noEmit` 신규 오류 0. 등재문 = `dev-package/notes/P4X-LEDGER-PENDING.md` ㉯."
