  - id: I4
    name: "운영 준비 (추적·알람·복구 리허설)"
    status: open
    stage: stage2
    owner: "인프라"
    entry_conditions: ["I3"]
    depends_on: [I3]
    completion_def: "복원 리허설 성공 (`§4`) · 정본 = `WORK-UNITS §10.2-b`. ⭑ ⟨증보 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈215〉`⟩ **`R-1`(복원 절차)과 분리 유지한다 — 이 항목은 `R-1` 의 리허설 **결과를 받아 쓰고**, 리허설을 **다시 돌리지 않는다.** 이 항목이 지는 것은 추적·알람이 붙은 **운영 리허설**이다.** 흡수하지 않는 이유 = `R-1` 은 `I3` 무의존인데 이 항목은 `I3` 선행이라, 흡수하면 재기동의 전제조건(`〈158〉`-㉯)이 `I3` 대기로 끌려 들어간다 ⭑ ⟨범위 조정 2026-08-31 · Ted RULING ㉚ · `PLAN-SoT §9 〈256〉`⟩ **「시점 복구 리허설 1회」는 이번 범위 밖이다** — ／ 이전 표기 ~~시점 복구 리허설 1회~~ → **이번 범위 = 「회차 단위(하루 1회 03:30) 복원 리허설 1회」**이고 `R-1` 의 결과를 받아 쓴다. **시점 복구(WAL)는 삭제하지 않고 `§9-㊻` 의 prod 개통 필수 관문 (다) 로 옮겼다.** 이번 범위의 남은 조건 = **분산 추적 · 로그 · 알람 · 데이터 레지던시 기록** 넷(실물 0건) ＋ 진입조건 `I3`"
    evidence: null
    deadline: null
    note: "／ 이전 ~~⚠ R-1 과 복원 리허설 재료가 겹치는데 한쪽이 다른 쪽을 흡수하는지 두 문서 모두 미기재.~~ **`§9` 그래프의 `I4 ── P6` 은 `〈168〉-㉵` 로 WU 의존이 아님이 판정됐다**(이 문장은 그대로 유효하다). ⭑ **⟨실측 판정 2026-08-31 · Ted 판정 ㉑ · `PLAN-SoT §9 〈249〉` · 워크트리 `lane-ops`⟩ 두 리허설은 **다르다**. 합치지 않고, 무엇이 다른지를 여기 적는다** — `〈215〉`(분리 유지)를 뒤집지 않았고, 뒤집을 근거도 실측에서 나오지 않았다. **㉮ 겹치는 것은 넷 중 하나뿐이다.** 이 항목이 요구하는 것은 넷(**분산 추적 · 로그 · 알람 · 시점 복구 리허설 1회 · 데이터 레지던시 기록** · `WORK-UNITS §4:175`·`§10.2-b:449`)이고, `R-1` 과 겹치는 것은 **복원 리허설 한 자리**다. **나머지 셋의 실물은 레포에 0건** — `otel|opentelemetry|jaeger|trace_id|alertmanager|prometheus|residency|레지던시` 전수 grep(`services/**`·`infra/**`·`contracts/**`)의 히트는 **요구를 적은 산문 두 줄뿐**(`infra/README.md:33` 데이터 레지던시 · `:37` 분산 추적)이고 **구현·설정·시험 0건**이다. 즉 이 항목의 4분의 3 은 `R-1` 이 만든 적이 없다. **㉯ 겹치는 그 한 자리도 성질이 다르다 — 「시점 복구」가 실물로 못 선다.** `R-1` 의 리허설(`infra/staging/restore/rehearsal.sh`)이 되돌리는 재료는 **논리 덤프**(`pg_dump | gzip`)와 **볼륨 tar** 다 — `archive_mode`·WAL 보관·`recovery_target`·basebackup 의 실물이 `infra/staging/backup/**`·`restore/**` 에 **0건**(전수 grep). **복원 입도는 「하루 1회 03:30 회차」이지 임의 시점이 아니다.** 그래서 이 항목의 「**시점** 복구 리허설」은 `R-1` 의 「**제자리** 복원 리허설」로 충족되지 않는다 — **기구가 없어서 아직 못 재는 것**이고, `[미확인]` 이 아니라 **실측된 결손**이다. **㉰ 방향도 반대다.** `R-1` 의 리허설은 **살아 있는 staging 을 읽기만 하고 일회용(`r1_*`)에만 쓰는** 무해 리허설이라(`rehearsal.sh` 머리말 축자) 추적·알람이 붙을 자리가 없다. 이 항목이 지는 것은 `〈215〉` 축자대로 **추적·알람이 붙은 운영 리허설**이다. **㉱ 그래서 조치 = 합치지 않는다.** `R-1` 의 리허설 결과를 **받아 쓰고 다시 돌리지 않는다**는 `〈215〉` 문면을 그대로 두고, **이 항목이 따로 져야 하는 것 넷을 위 ㉮~㉯ 로 명시**했다 — 다음 사람이 「R-1 이 끝났으니 I4 도 끝났다」로 읽지 않게 하는 것이 이 기재의 목적이다. ⚠ **상태는 고치지 않았다**(`open` 유지) — 진입조건 `I3` 이 🟧 이고 완료 정의도 재지 않았다. ⭑ **⟨범위 조정 ＋ 판정 2026-08-31 · Ted RULING ㉚ · 등재 `PLAN-SoT §9 〈256〉` · 워크트리 `lane-checklist`⟩ 「시점 복구(WAL)」를 **이번 범위에서 뺀다. 삭제하지 않고 prod 개통 전 필수 관문으로 옮긴다.**** **㉮ 근거 = `[미확인]` 이 아니라 없는 것이 확인됐다.** `archive_mode`·WAL 보관·`recovery_target`·basebackup 의 실물이 `infra/staging/backup/**`·`infra/staging/restore/**` 에 **0건**(`〈249〉`-㉯ 전수 grep). 복원 입도는 **하루 1회 03:30 회차**이지 임의 시점이 아니다. **㉯ 이번 릴리스의 공식 복원 수준 = 「하루 1회 회차 단위」.** **잃을 수 있는 최대 구간 = 정상 운전에서 약 24시간**(직전 03:30 회차 이후 쌓인 것 전량 · 크론 `30 3 * * *`). ⚠ **백업이 조용히 멈추면 그보다 길어진다** — 자동 감시가 월요 04:10 주 1회뿐이라(`10 4 * * 1`) 발견까지 최대 약 7일이 더해져 **최악 약 8일**이다. 이 문면은 `infra/staging/restore/RUNBOOK.md §0.1` 에 같은 값으로 적었다. **숫자를 좋게 적지 않았다.** **㉰ 옮긴 자리 = `PLAN-SoT §9-㊻` 의 prod 개통 조건.** ㊻ ③ 이 정한 두 조건(가·나)에 **(다) 시점 복구(WAL) 관문**을 더한다 — prod 는 회차 단위 복원만으로 열지 않는다. `〈256〉` 이 그 개정을 적는다. **`I5`(prod 전환)의 대장 행은 이 회차가 건드리지 않았다**(이 레인의 territory 밖). **㉱ 그래서 이번 범위 기준으로 이 항목이 완주 가능한가 = 예. 단 남은 조건 셋이 있다.** 이 항목이 지는 넷 중 **「시점 복구 리허설 1회」가 「회차 단위 복원 리허설 1회」로 내려앉고**, 그것은 `R-1` 의 결과를 받아 쓴다(`〈215〉` 그대로 · 다시 돌리지 않는다). **남은 조건 = ⓐ 분산 추적 ⓑ 로그 ⓒ 알람 ⓓ 데이터 레지던시 기록** — 넷 다 레포 실물 **0건**(`〈249〉`-㉮ 전수 grep · 히트는 `infra/README.md:33`·`:37` 의 요구를 적은 산문 두 줄뿐)이고, **진입조건 `I3` 이 아직 🟧 다.** ⛔ **닫지 않는다** — `status: open` 유지. 남은 조건 넷과 WAL 관문은 `dev-package/PR-CHECKLIST.md` 에 올렸다. ⭑ **⟨증보 2026-09-04 · `PLAN-SoT §9 〈311〉`(`VL-1`) · 워크트리 `lane-vl1`⟩ 값 조회 지연의 귀속이 D7 밖으로 떨어졌다 — 같은 `POST` 가 nginx 직접 **17 ms** · 공개 엣지 **279 ms**(TCP 46 ＋ TLS 44 ＋ Cloudflare·터널 왕복 189)로 **262 ms 가 엣지·터널 구간**이다(근거 `sessions/VL-1-20260904.md` §1.2·§1.3 · 표본 원값 `sessions/VL-1-SAMPLES-20260904.tsv` 400건). **`VL-1` 은 D7 개선 0건으로 닫혔고 이 구간은 인프라 소관**이다 — 이 항목의 추적·알람이 엣지·터널 지연을 볼 수 있어야 한다. ⛔ 새 WU 는 세우지 않았다."
    sources: ["03-HANDOFF §1 T-I", "WORK-UNITS §4", "WORK-UNITS §10.2-b", "WORK-UNITS §11"]

