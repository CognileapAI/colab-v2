    note: "`§J-7` 에서 적출돼 J-1 이 10건 → 9건이 됐다. ⚠ `WORK-UNITS §11` 완주 체크리스트에 행이 없고 `03-HANDOFF §1` 에도 행이 없다. ⭑ **⟨2026-08-31 · Ted RULING ⑲ · `PLAN-SoT §9 〈247〉`⟩ 완료 정의 ⓓ 의 「예외의 범위」가 문면으로 못 박혔다 — **렌더 산출물 한정**(미리보기 3층 ＋ ③의 사이드카·월드파일). **원본·기준 격자·데이터셋은 어떤 트리거로도 자동 재생성하지 않는다.** 전수 실측에서 재생성 대상은 다섯 중 둘이고, COG(`tile-` 접두사 · D5 소유)·서빙 타일 조각(디스크에 없다)·별도 캐시층(없다)은 대상이 아니다. **집행 = ⓐⓑⓒⓓⓔ 가 viz-render 에 섰다**(`d7_visualization/invalidation.py` ＋ `JobStore.regenerate` · 시험 16건 · 13 red 선확인 · viz-render 164 → 180). ⛔ **그래도 닫지 않았다 — 남은 것 둘**: ⑴ **D5 → D7 트리거 발신의 실물 배선**(지금 선 것은 받는 자리 `TriggerPort` 뿐이고, 이벤트 계약에 종류를 더하는 것은 계약 개정이다 · `03-HANDOFF §4 #52`) ⑵ **ⓕ staging 배포 green**(그 회차는 배포 금지 조건이었다). ⭑ **⟨2026-08-31 · `〈253〉`⟩ 둘 중 ⑴ 이 닫혔다 — 발신·수신이 실물로 섰다**(위 `evidence`). ⛔ **남은 것은 ⑵ 하나이고, 이번 회차도 배포 금지 조건이었다.** 그래서 **`partial` 이지 `done` 이 아니다** — 부분 완료로 닫지 않는다(`WORK-UNITS §12`). **다음 회차의 진입조건** = 배포 인가 ＋ `compose.i2.yml` 의 버스 볼륨 `events` 가 실제로 뜬 상태에서 `verify/verify-deploy.sh` green ＋ 트리거 왕복 1건 실측(업로드 재처리 → 미리보기 재생성). ⭑ **⟨2026-09-01 · 워크트리 `lane-deploy2` · `PLAN-SoT §9 〈269〉`⟩ 배포는 GREEN 인데 ⓕ 를 닫지 않는다 — 트리거 왕복이 집행 불가다.** **선언은 전부 섰다**(실측) — 버스 볼륨 `colab-v2-staging_events` 가 두 단위에 마운트 · `COLAB_WORKER_EVENT_SPOOL=/srv/viz-events` · `COLAB_VIZ_TRIGGER_SPOOL=/srv/viz-events` · `COLAB_WORKER_STAGE2=on`. ⛔ **그런데 아무 일도 안 난다 — 새 결함**: `infra/staging/compose.i2.yml` 의 `volume-init` 이 `uploads`·`previews` 만 `chown 10001` 하고 **신설 볼륨 `events` 를 빠뜨렸다.** 실측 = `/srv/viz-events` 가 `root:root 0755` 인데 pipeline-worker·viz-render 는 둘 다 uid `10001` ⟹ 양쪽에서 `touch` **Permission denied**. **D5 발신도 D7 ack 도 물리적으로 못 쓴다.** **고치지 않았다** — 수정은 새 커밋 ＋ 두 번째 배포이고 이번 승인 범위 밖이다(범위를 늘리지 않는다). **남은 것 하나 = 트리거 왕복 1건 실측**, 그 **선행 = `events` 볼륨 `chown 10001` 수정 ＋ 재배포.** 문면(`staging 배포 green`)만으로 닫지 않는다 — **동작하지 않는 것을 닫지 않는다**(`WORK-UNITS §12`). ⭑ **⟨2026-09-02 · Ted 배포 승인 · 워크트리 `lane-59` · 릴리스 `b3c4085ccdf0`⟩ 선행이 걷혔다 — `#59` 해소.** `volume-init` 의 `chown 10001` 대상에 `/srv/viz-events` 를 넣고 재배포했다. **실측** = 두 단위에서 `/srv/viz-events` 소유자 `10001:10001` · 쓰기 성공 양쪽 · D5 `spool_publish` 발행 → D7 `SpoolTriggerPort.poll()` 수령(`격자 변경`·`upl-59-probe`) → `ack()` 뒤 버스 비움 **왕복 1건**(두 컨테이너의 설치된 코드로). 게이트 **35 green / 0 red** · `verify-deploy.sh` **15 PASS · SKIP 0**. ⛔ **그래도 `done` 이 아니다 — ⓕ 는 여전히 미충족이고 새 블로커 `#60` 이 막는다.** ⓕ 의 축자는 「트리거 왕복 1건 실측(**업로드 재처리 → 미리보기 재생성**)」인데, `app/triggers.drain` 의 **런타임 호출자가 0건**이다(부르는 것은 시험뿐 · 주기 작업·라우트·기동 훅 어느 것도 없다). 도는 `viz-render` 는 봉투가 놓여도 집지 않으므로 **재생성이 일어나지 않는다.** 이번에 선 것은 **버스가 물리적으로 쓰인다**까지다. **남은 것 하나 = 집행 호출자 판정 ＋ 배선**(주기 작업 · 기동 1회 · 관리 op 중 무엇인가는 Ted 판정 사안이고, op 면 계약 개정이다). **동작하지 않는 것을 닫지 않는다**(`WORK-UNITS §12`)."
