측정은 호스트 발) · 동시 부하 눈금(`〈304〉`-㉴ 별개 축). **㉴ 본 회차 실적** = 계약·생성물·DB·인프라 무접촉 · staging 쓰기 0(부른 op 은 값 조회 `POST` 하나이고 읽기다 · 렌더 작업 생성 0) · 컨테이너 수명 조작 0 · 배포 0 · push 0 · 병합 0 · ⭑ **⟨재실측 2026-09-04 · 병합 ref(`main` `37bec14` ＋ 이 레인) 위에서 잰 값 · 수용 검토⟩ 단회 `./gates/run.sh all -j 1` 요약줄 축자 = **`── 계 : green 44 / red(판정) 5 / red(준비) 1`**(종전 이 행이 적었던 ~~게이트 50/0/0~~ 은 **구 `main` 기준의 값이고 실측 출처가 붙어 있지 않았다**). **red 6건의 귀속** — ⑴ `schema-diff` red(판정) = 게이트 전용 **적용 DB**(`172.17.0.3`) 접속 불가 · 그 일회용 컨테이너가 이 호스트에 **없다**(`RESTART.md` ㉮④) ⟹ **호스트 환경 · 이 레인 소관 아님 · 미해소** ⑵ `autometa-loss`·`preview-tile-slot`·`artifact-ownership` red(판정) = staging pg **IP 이동**(`172.18.0.2` → **`172.18.0.6`** · staging 8 컨테이너가 이 작업 31분 전 재기동) ⟹ 실제 IP 로 **개별 재측정 green 3건** ⑶ `service-tests-core-api` red(판정) = **이 레인 소유의 결함 1건** — 새 시험 `test_중계_응답이_자기_구간을_말한다` 의 허용오차 `1e-6` 이 **헤더 자신의 반올림**(`dur={ms:.3f}` · 구간마다 따로 반올림)보다 작다(실패값 **9.092 vs 9.091**) ⟹ 허용오차 **`2e-3`** 으로 고치고 재측정 **green** ⑷ `rls-effect-selftest` red(준비) = 일회용 postgres 준비 실패(18 케이스 중 1 · `elapsed=1초`) ⟹ 단독 재실행에서 **green**. **재측정 후 = green 49 / red(판정) 1(`schema-diff` · 호스트 환경) / red(준비) 0.** ⚠ 이 **49 는 한 번의 `all` 실행이 낸 줄이 아니라** 단회 실행 ＋ 개별 재측정의 합이다 — 감추지 않는다. **시험 계수 실측**(병합 ref) = viz-render **수집 279 · 실행 279 · failed 0** · core-api **수집 626 · 실행 626 · failed 0**(종전 이 행의 ~~viz 269→273 · core 624→626~~ 은 구 `main` 기준이다 — `main` 의 `〈310〉` `BF-2` 가 viz 시험을 269→275 로 늘렸고 이 레인이 **＋6건**(viz 4 · core 2)을 더해 **279 / 626** 이다). `work-item-consistency -j 1` **green**. ⚠ **청소 후속 1건** — `relay.py` `_request` / `_request_timed` 가 같은 오류 처리를 각자 들고 있다(동작 동일 · 시험 green). **이 회차는 고치지 않는다** — 계측 배포 뒤에 정리한다."
