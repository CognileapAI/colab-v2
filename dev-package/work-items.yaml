ial` → `done`. 종전 본문을 지우지 않는다.** **판정 = 순환을 끊는다.** 「P6(승인)」 조항을 `P5` 의 완료 정의에서 빼고, 잘못 붙은 `§1.5` 인용도 이 행에서 걷었다. 새 완료 정의는 **구현 ＋ 게이트 green ＋ staging 배포 green** 셋이다. **그 셋을 건별로 재서 전건 충족을 확인했다** — ⑴ **구현** = op 셋(`deleteProject`·`setProjectStatus`·`unlinkProjectDataset`) ＋ 모달 셋(F-03·F-04·F-05) 전건 착지 · 501 표 19 → 16 · **잔여 0건**(`〈229〉`-㉲) ⑵ **게이트 green** = `gates/run.sh all` **green 31 / red(판정) 1(`autometa-loss`) / red(준비) 1(`preview-tile-slot`)** — 둘 다 stage 2 가 아직 안 돌아서 나는 **구조적** red 이고 `P5` 소관이 아니다(`RESTART §④-㉯`) ⑶ **staging 배포 green** = 2026-08-30T18:39:07+0900 · 릴리스 `eb61556de245` · 배포 판정 GREEN(통과 15 · SKIP 0). ⚠ **정직하게 — 「목업 대비 화면 검증」의 실측 기록은 모달 셋(`ProjectFormModal`·`ProjectCloseModal` 머리글이 목업 `프로젝트_260817.html` 의 `newModal`·`editModal`·`closeModal` 을 인용)과 데이터셋 표(`ProjectDatasetTable` 「목업의 여섯 열」)에는 있고, 목록·상세 골격(`ProjectCards`·`ProjectTable`·`ProjectToolbar`)에는 없다.** 그 축을 이 항목에 다시 걸지 않는 것이 이번 판정이고, 축 자체는 **전 화면 대상 `G1b`(⬜) 가 계속 진다** — 사라지지 않았다."
