    evidence: '⭑ **집행 실측 (2026-09-01 · 워크트리 `lane-p6` · `PLAN-SoT §9 〈265〉`·`〈266〉`) — 완료 정의 4항 중 셋이 섰고 하나가 남았다. 부분 충족으로 닫지 않는다.** ⑴ **수용 기준 ✅** — 승인 처리 여덟 op 이 실동작한다(501 표 **16 → 8**): 접근 요청 `createAccessRequest`·`listPendingAccessRequests`·`approveAccessRequest`·`rejectAccessRequest` ＋ Verified `requestVerification`·`listPendingVerificationRequests`·`approveVerification`·`cancelVerification`. 저장처는 마이그레이션 `0010`(`d2_dataset_access_request`·`d2_verification_request`)이 세웠고 **결과 표(`d2_dataset_access_grant`·`d2_verified`)와 `body_access` 정책은 무변경**이다. 승인 범위 **데이터 한 건** · 유효 기간 **6개월** · 거절 사유 **1~300자 필수** · **[모두 승인] 표면 0건**. ⑵ **도메인 게이트 green ✅** — `gates/run.sh all` before **green 35 / red 0** · after **green 35 / red 0**(병렬도 정본 `-j 2` · 우회·검사 축소 **0건**). ⑷ **목업 대비 ✅** — 정본 `Policy_승인_처리 §8` 적용 지점 중 이번 릴리즈 몫 셋을 화면에 얹었다: 잠긴 상세의 `접근 요청` 버튼·모달 ＋ **검토 대기 칩** · 헤더 우측 **한 자리가 셋으로 갈리는** 액션(승인 요청／승인／`⋯` 더보기 → 승인 취소 · 파급 모달 경유) · **Verified 배지**(표시 전용 — 버튼도 링크도 아니다). 요청은 **잠긴 상세에서만** 한다(카탈로그 행에 버튼 0건 · `Policy_데이터_찾기:152`). ⛔ **⑶ `staging 배포 green` = 미충족.** 이번 회차는 **배포 승인이 없고 staging 무접촉이 회차 조건**이었다 — **예정된 미충족이며 이 하나 때문에 열어 둔다.** ⭑ **음성 다섯 전건 green**(`services/core-api/tests/test_approval.py`) — ① 남의 연구실로 요청·목록·승인이 새지 않는다(전부 **404**) ② 승인 없이 본문이 안 열린다(요청 중도 열림이 아니다) ③ 만료된 허용 줄은 안 연다 ④ 일괄 승인 표면 0건(계약·실물 라우트 양쪽) ⑤ **승인 권한 없는 역할은 승인 불가**(`승인 위임` 꺼진 연구원 403 ＋ 허용 줄 0건 · 스위치를 켜도 **Verified 는 여전히 403** — 위임 불가). ⭑ **시험 계수** = core-api **510**(511 에서 **기준이 바뀐 값**: 501 표 축소로 파라미터화 32 → 16, 새 승인 시험 15 ⟹ `511 − 16 + 15`) · frontend **399**(387 ＋ 12) · `tsc --noEmit` **0** · viz-render 194 · pipeline-worker 222 · ai-service 145. ⭑ **정본 정정 1건** — 회차 지시문은 승인자를 「데이터 소유자」로 적었으나 정본은 **「교수 ＋ `승인 위임` 연구원」**(`§1.2`·`§6`)이고 **정본대로 구현했다**. ⚠ **판정 대기 둘이 이 항목을 향해 열려 있다** — 열린 `⑭`(접근 승인 **조기 회수** 규칙 · 정본 §11) · `Verified` 갈림(`〈224〉` 계열). **둘 다 지어내지 않았다.** ⭑ **⟨2026-09-01 · 워크트리 `lane-deploy2` · `PLAN-SoT §9 〈269〉`⟩ 남아 있던 ⑶ `staging 배포 green` 이 섰다 — 완료 정의 4항 전건 충족이라 닫는다.** 배포 GREEN · 릴리스 `bc499c2c1ac9`(＝ 커밋 SHA · 워킹트리 변경 0건) · 플랫폼 체인 head **`0010_p6_access_request`** · 헬스 6종 200 ＋ 본문 대조 · 컨테이너 8/8 healthy · 호스트 노출 0건 · 별칭 `:i2` 6/6 이미지 ID 대조 · `⑩-b` 엣지 설정 바이트 대조 일치(`56cc63f04dad443a`). **배포된 스택에서 실동작을 쟀다** — 양성 = 잠긴 상세 `bodyAccessible=false` → 요청 201 → `accessRequestPending=true` → 목록 총 1 → 승인 200(만료 = 승인일 ＋6개월 실측) → `bodyAccessible=true` → 재승인 409. 음성 = 남의 연구실 상세·요청 생성 **404** · 남의 연구실 **실재하는** 요청의 승인·거절 **404**(403 이 아니다) · 내 목록 누출 **0건** · Verified 교수 경로 202 → 대기 1 → 승인 200. 게이트 `all` **green 35 / red 0**(우회·검사 축소 0건). 시험 데이터는 합성만 쓰고 **전량 되돌렸다**(잔재 7 표 전부 0건 · 실데이터 무접촉). ⚠ **닫으면서 세지 않은 축 하나를 이름으로 남긴다 — 「`승인 위임` 꺼진 연구원의 403」의 배포 스택 실측이 `[미측정]`** 이다. staging 주체 표의 베어러가 교수 하나뿐이라 연구원으로 붙을 수단이 없었다(레포 시험은 green). 푸는 법 = 주체 표에 연구원 베어러 1건 추가 — **자격 변경이라 배포 승인이 덮지 않는다. 별도 승인 사항.**'
    deadline: null
    note: "⭑ **⟨선행 재지정 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ `depends_on` 에서 검색 화면(`P4`)을 뺐다 — `[P1, P2, P3, P4, P5]` → `[P1, P2, P3, P5]`.** **종전 값 ~~[P1, P2, P3, P4, P5]~~ · 종전 진입조건 ~~P1~P5~~ 를 지우지 않고 남긴다.** 근거 = 오늘 판정으로 **검색 화면이 통째로 stage 3** 이고, 끊지 않으면 이 항목과 그 뒤 사슬(연구실 대시보드 `P7` → E-01 적용 지점 표 `P8`) 전체가 stage 3 뒤로 밀려 **stage 2 가 닫히지 않는다.** ⭑ **이 항목이 이제 무엇에 붙나 = 카탈로그 화면(`P1` · ✅ done).** 정본 `:177` 축자 「적용 지점 표의 \"검색 결과 카드\"·\"검색 잠긴 카드\"·\"**카탈로그 행**\" 인용」 — **세 적용 지점 중 카탈로그 행 하나가 이번 릴리즈에 남고 검색 쪽 둘은 stage 3 으로 간다.** 남는 것의 축자 = `:130` 「잠긴 데이터 … **카탈로그 행은 자물쇠 + `잠김` 칩**」 · `:152` 「자물쇠 + 잠김 칩 · **행에는 접근 요청 버튼을 두지 않는다** · 행을 누르면 잠긴 상세로 가고 요청은 거기서 한다」 · `:115` 「조건을 걸 수 있는 열은 주제 · Level · 업로더 · 계보 · **Verified** 다섯」(그 열에 값을 채우는 것이 이 항목이다). ⚠ **완료 정의(「각 P 의 완료 판정」 4항)는 고치지 않았다** — 적용 지점이 7곳에서 몇 곳으로 주는지는 `WORK-UNITS §9`·E-06 적용 지점 표의 몫이고 **지어내지 않는다.** `[미확인]` — 푸는 법 = E-06 적용 지점 표 7행을 화면별로 갈라 stage 2 몫을 세는 1회 대조. ⚠ **`Verified` 갈림이 이 항목에 직접 걸린다** — 아래 `〈224〉` 계열 기록 및 `sessions/STAGE3-AI-SPLIT.md §8` 참조. **Ted 판정 대기.** ／ **아래는 종전 본문 — 지우지 않는다.** ⭑ ⟨2026-08-29 해소 · `PLAN-SoT §9 〈187〉`-㉱⟩ **판정은 2026-08-27 에 이미 끝났고(`〈168〉-㉵`) 그래프·경고문만 안 따라갔던 것이다.** 고친 것 둘 = `§10.3` 말미 「미판정」 경고문을 삭제하고 판정 완료 한 줄로 대체 · `§9` 그래프의 `I2 ── I3 ── I4 ── P6 ─ P7 ─ P8 ── I5(prod)` 사슬을 `I2 ── I3 ── I4 ── I5(prod)`(인프라 진행 순서)와 `S3 ── P6 ─ P7 ─ P8`(WU 의존)으로 **갈랐다**. **진입조건 정본 = `§7` 의 P6 행 하나(`P1`~`P5`)** — `I4` 는 P6 의 시작을 막지 않는다. ／ 이전 ~~같은 문서 `§10.3` 말미 경고문은 여전히 「둘 중 어느 쪽이 값인지 미판정」으로 남아 있고 `§9` 그래프도 `I4 ── P6` 사슬 그대로다 — 어느 하나를 고르지 않는다~~"
