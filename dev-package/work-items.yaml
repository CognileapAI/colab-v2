    evidence: "집행·검증 완료 (2026-08-28 · `§9 〈177〉-㉮`). 슈퍼유저 비밀번호를 `ALTER USER postgres` 로 회전하고 `~/.colab-v2-staging.env` 의 `COLAB_PG_SUPER_PASSWORD` 를 제자리 갱신(0600 유지). **양성·음성 둘 다 쟀다** — 신규 값 인증 통과 · **옛 값 거부**. ⭑ **검증 경로를 한 번 갈아야 했다**: `pg_hba` 가 `local` 과 `127.0.0.1` 을 **`trust`** 로 두어(`pg_hba_file_rules` 실측) 컨테이너 안에서 `127.0.0.1` 로 한 첫 확인은 **인증을 아예 통과시키지 않는 가짜 오라클**이었다. 별도 컨테이너에서 네트워크로 붙어 `scram-sha-256` 규칙에 걸리게 한 뒤에야 음성이 실제로 red 를 냈다. 옛 값 사본(`.env.bak-20260828`)은 검증 뒤 제거."
    deadline: null
    note: "⚠ **회전은 유출된 옛 값을 무효화했을 뿐, 노출 자체는 그대로다** — `compose.i2.yml:57` 이 `POSTGRES_PASSWORD` 를 평문 env 로 넘기므로 **새 값도 `docker inspect` 에 보인다**. 없애려면 `POSTGRES_PASSWORD_FILE` 로 바꾸는 별건이 필요하고, 그것은 이 WU 의 완료 정의가 아니다. 원 note — T-X 는 stage 2 가 열리면 닫히는 임시 트랙. `〈153〉` 이 앱·소유자 3롤만 회전했고 슈퍼유저 값은 아직 `docker inspect` 로 보인다. ⚠ 되돌릴 수 없다 — 착수 전 Ted 확인."
    sources: ["03-HANDOFF §1 T-X", "WORK-UNITS §10.1", "WORK-UNITS §10.3"]

