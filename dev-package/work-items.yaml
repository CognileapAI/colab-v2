    note: >-
      **신설·닫힘 2026-09-03** — `PLAN-SoT §9 〈310〉`-㉯. 곁가지 둘은 항목으로 뗐다 — `LabPage` 뿌리 규칙 부재 = `BF-8` · `project.css` 미정의 토큰 = `BF-11`(이 수정이 그 관례의 토큰 `--line`·`--fg-muted`·`--surface` 를 그대로 썼다).
      스크린샷 `reports/bug-20260903/bug01-*.png`·`bug02-*.png`·`bug09-*.png`.
      ⭑ ⟨상태 정정 2026-09-04 · advisor 게이트 ③⟩ `done → in_progress` — 완료 = staging 배포 green(`CLAUDE.md §0`)이고 이 항목은 통합 브랜치 `bugfix/20260903-ui-12` 에만 있다. staging 배포 green 시 `done` — 배포 창이 전환한다.
      ⭑ ⟨staging 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`in_progress` → `done`.** ⑴ **staging 배포 green** `f465d83a2ef1` ⑵ **사용자 시야 확인**(실브라우저 계산 스타일): `.project-page` `padding: 24px 20px 40px` · `.project-detail` `padding: 32px 24px 96px` · `.gnb-settings` `gap: 6px`. 근거 `sessions/WINDOW-20260904-B4.md §6`.
