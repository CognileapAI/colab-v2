    deadline: null
    note: "계약에 남은 미집행 선언 전수 확인 — op·필드가 선언만 되고 구현이 없는 것. 발견분은 철회 또는 집행으로 가른다. 선례 `〈151〉`. **⟨2026-08-28 닫힘⟩ 열린 판정 0건** — 7건 전건 판정 완료(`§9-〈180〉`·`〈181〉`). 판정 이력 = 5건 → 3건 → 0건. 마지막 3건은 **Stage 2 연관성 기준**으로 갈랐다(`〈181〉`): 읽기·중계 4 op 의 `403` **철회·집행**(둘이 `P3`·`V-1`·`V-2` 가 올라탈 표면이라 착수 전 확정) · `PermissionSwitchChange` **판정 없음 종결**(`P-33` 이 이미 「조회 화면 없음」으로 닫아 둔 결정이 낡은 감사 문서로 재등장한 것) · `suggestLineage` **판정 아님, `K3` 착수 순서로 이관**.**`422` 2건은 철회로 판정·집행 완료**(`§9-〈180〉` · `core-viz.yaml#createRender`·`core-ai.yaml#searchDatasets` 선언 삭제 · 코드 변경 0). 집행된 `403` 2건은 **`main` 병합 완료**(2026-08-28 · 리베이스 후 fast-forward · 산출 `sessions/X5-403-VERIFY.md`) — **red 픽스처 증명 완료**(생산 코드 두 훅만 되돌려 재실행 → `assert 200 == 403` 둘 실물 확인 후 복원) · `455 passed` 실패 0 · 게이트 6종 green · 일회용 DB 로 검증, 운영 스택 무접촉. ⚠ **여전히 로컬 green 이고 staging 배포 전이다** — **`[미확인]` 잔 1건 = staging 실물의 `403`**(배포 후 `PATCH` 2회로 풀린다 · `I3` 에 딸린다). **frontend 회귀는 해소**(`〈181〉` 실측 — `274 passed` 13파일 · `npm run build` 성공)."
    sources: ["03-HANDOFF §1 T-X", "WORK-UNITS §10.2", "WORK-UNITS §10.3"]

  - id: X-6
    name: 별칭 재부착 실패 삼킴
    status: done
    stage: stage2
    owner: "인프라"
    entry_conditions: ["없음 — 무의존. `I3` 실배포에서 적출(2026-08-29)"]
    depends_on: []
    completion_def: "⑴ `deploy.sh` ⑫ 의 별칭 재부착이 **실패를 삼키지 않는다** — `docker tag … 2>/dev/null || true` 의 무조건 성공 경로를 없애고, 실패하면 배포 판정이 GREEN 이 되지 않는다. ⑵ 그 성질을 **실패 픽스처로 증명한다** — 별칭 재부착이 실패하는 픽스처에서 판정이 실제로 red 를 내는 것을 `infra/staging/pipeline/selftest.sh` 회차로 못 박는다(통과시키려고 검사 범위를 줄이지 않는다). ⚠ 이 두 줄이 완료 정의의 전부다 — 이 항목의 근거 문장(`PLAN-SoT §9 〈185〉-㉸`-⑵)에서만 도출했고 그 밖은 넘겨짚지 않았다."
    evidence: "⭑ **실측 (2026-08-29 · `sessions/STAGE2-READINESS-AUDIT.md §1`) — 완료 정의 2항이 코드로는 전건 충족이다.** ⑴ 삼킴 구문 `docker tag … 2>/dev/null || true` **부재** — `9c6fc92` · `31f36a5` 가 제거했다. 현재 판정은 `infra/staging/pipeline/lib.sh:135-159 alias_reattach()` 가 **종료코드 ＋ 이미지 ID 대조**로 내리고, 재부착 성공 0건도 red 로 떨어뜨린다(「대상 0건 = red」). 호출 자리 = `infra/staging/deploy.sh:220-226` 으로 **원장 green 앞**에 선다. ⑵ 실패 픽스처 **P15 · P16 · P20** 실재(`infra/staging/pipeline/selftest.sh:185`·`:192`·`:207-214`) — P20 은 `|| true` 잔존과 `alias_reattach` 미호출을 각각 FAIL 로 잡는다. selftest **37/22 GREEN**. ⚠ **남은 행동은 코드가 아니라 Ted 상태 판정이다** — 이 항목의 `status: open` · 형제 탐색 `[미확인]` 을 어떻게 닫을지가 사람의 자리다. ⭑ **⟨개정 2026-08-30 · 재실측⟩ 완료 정의 2항 전건 충족 — 닫는다.** **⑴** 삼킴 구문 **전수 부재** 재확인 — `infra/staging/**` 의 `docker tag` 5자리 중 무조건 성공 경로 **0건**(`deploy.sh:110` 은 `|| abort`, 나머지는 주석). 판정은 `pipeline/lib.sh:175 alias_reattach()` 가 종료코드 ＋ 사후 `image inspect` **이미지 ID 대조**로 내리고, 호출 자리 `deploy.sh:225` 는 **원장 green 앞**이며 `rollback.sh:120` 도 같은 함수를 재사용한다. **⑵** 실패 픽스처 **실행** 확인 — `pipeline/selftest.sh` P15(태그 실패) · P16(성공을 말했는데 안 붙음) · P20(무조건 성공 경로 소멸 ＋ 판정 함수 호출) ＋ 양성 대조군 P14·P18 ＋ P26(rollback 호출) · 결과 `pipeline selftest: GREEN (54건 + 판정기 전건 기대대로)` ＋ `verify selftest: GREEN (22건)`. ⭑ **⑴ 은 코드뿐 아니라 실배포로 행사됐다** — 2026-08-30 배포 회차가 별칭 재부착을 **실제로 돌렸고** 원장이 `별칭재부착GREEN digest이력=6종` 을 적었다(`~/colab-v2-releases/release-ledger.tsv` `2026-08-30T10:41:50+0900 deploy cfc98e302ae4 green`). 이미지 ID 대조의 실물 = `image-digest-ledger.tsv` **6행**(`core-api`·`pipeline-worker`·`viz-render`·`ai-service`·`frontend`·`migrator` 각 `:i2` ↔ `sha256:…`) — **선언된 6종 전건이 대조됐고 대상 0건이 아니다.** ⚠ 형제 탐색 `[미확인]` 은 **이 항목의 완료 정의 밖**이다(완료 정의는 2항뿐) — 닫는 근거로 쓰지 않았고 별건으로 남는다."
    deadline: null
    note: "적출 = `I3` 첫 실배포 회차(2026-08-29 · `PLAN-SoT §9 〈185〉-㉸`-⑵ · 산출 `sessions/I3-POSTDEPLOY.md`). **모양** = `deploy.sh` ⑫ 이 별칭 태그를 다시 붙일 때 `2>/dev/null || true` 로 무조건 성공한다. **왜 위험한가** = 실패해도 배포가 GREEN 을 찍고, 복원 리허설(`compose.throwaway.yml`)이 **그 별칭 이름으로 이미지를 찾으므로** 옛 이미지를 리허설하며 통과를 낼 수 있다. **이 레포 대표 실패형(green-by-skip)과 같은 모양**이다(`CLAUDE.md §4 게이트 정책` · 스킬 `§4`). ⚠ **형제를 찾는다** — 한 곳에서 이 모양이 나오면 다른 곳에도 있다. 다만 형제 탐색 범위는 이번에 세지 않았다 → `[미확인]`(푸는 법 = `infra/staging/**` 의 `|| true`·`2>/dev/null` 자리를 전수 열거해 각각이 판정 경로인지 가른다). ⭑ **⟨2026-08-29 실측⟩ 위 `evidence` 참조 — 적출된 모양은 이미 제거됐고 잔여는 상태 판정 하나다. 상태값은 이 회차에서 고치지 않는다(동결 해제 프로토콜 소관).** ⭑ **⟨2026-08-30⟩ 상태값을 `open` → `done` 으로 갈았다** — 근거는 `evidence` 의 재실측 ＋ **실배포 1회의 실제 행사**다. ⚠ **형제 탐색 `[미확인]` 은 그대로 열려 있다**(푸는 법 = 위 문단 그대로) — 완료 정의 2항에 없으므로 이 항목을 막지 않되, **사라진 것이 아니다.**"
    sources: ["PLAN-SoT §9 〈185〉", "03-HANDOFF §4 #45"]

  - id: R-1
    name: 복원 절차
    status: partial
    stage: stage2
    owner: "인프라"
    entry_conditions: ["없음 — X-1·X-4 재기동의 전제조건(`〈158〉-㉯`)"]
    depends_on: []
    completion_def: "정본 = `WORK-UNITS §10.2` (완료 정의 12행 · 초안 `sessions/R1-RESTORE-DRAFT.md`) ＋ 볼륨 백업 절차 ＋ `install-schedule.sh install` 재실행"
    evidence: "크론 첫 회차를 실측했다 (`§9 〈174〉-㉮`). **2026-08-28 03:30 회차는 GREEN 이지만 오라클이 아니다** — 돌린 것이 `backup.sh`(원장 전용)이고 `backup-full.sh` 가 아니다. 근거 셋 = 로그에 `backup-full.sh` 표지인 `═══ 1단` **0회** · `LAST-SUCCESS.txt` 가 08-24~08-28 **다섯 회차 전부 `backup.sh OK`** · 그 시각 보관처에 `vol-*` 산출물 없음. 원인 = crontab 대상 교체(`〈173〉-㉰`)가 그 회차 **뒤에** 이뤄졌다. ⚠ 매일 GREEN 이 쌓여 전범위가 도는 것처럼 읽히는 **green-by-skip 모양**이다. ⭑ ⟨개정 2026-08-29 저녁 · `PLAN-SoT §9 〈207〉` · 산출 `sessions/R1-TAILS-EXEC.md`⟩ **잔여 셋을 실행해 쟀다 — 둘이 닫히고 하나가 남는다.** ⑵ **읽는 경로 = 닫힘** — 서빙 중 `ai-service` 에 `POST /searches` 실요청 2회(20:49:45·20:50:23+0900) · **200 · `degraded:false`** · 원 질의에 없던 `강우·강수`·`낙동강 유역` 이 붙고 `topic` 이 채워졌다(사전 실조회의 증거). ⚠ 완료 정의가 든 오라클(`RuntimeError`)이 실물과 달랐다 — 사전이 죽어도 200 이라 **옳은 오라클은 `degraded:false`** 다. 잔여 `[미확인]` = core-api 중계 다리(정문 `POST /api/v1/dataset-searches` 무세션 **401** 실측 · 세션 왕복 미측정). ⑶ **`preflight` 성질 = 판정 확정 「의도 ＋ 결함 1건」** — 실행 결과 RED 12건(`P5-b` 2 ＋ `P6` 8 ＋ `P7` 1 ＋ `P9` 1). P6·P7 은 입력 부재, **P9 는 fail-closed 가 옳다**(리허설에 사고 원인을 적으면 지어낸 값이 된다). ⛔ **다만 `P5-b` 2건은 새 결함** — `pick()` 이 원장과 볼륨을 각각 독립으로 최신 선택해 짝이 깨지고, `--stamp` 도 우회로가 아니다(볼륨마다 스탬프가 다르다 · 35초 차) → **입력을 다 줘도 GREEN 이 안 된다.** ⑷ **`:i2` 이력 = 닫히지 않는다(부분)** — 대장 대조 **RED 5건/8건** · 이동 시점은 `release-ledger.tsv` 로 특정됐으나(**2026-08-29T10:08:36 green 배포**) 원장이 적는 것은 **릴리스 태그이지 digest 가 아니다.** 이력 기구가 여전히 없다."
    deadline:
      condition: "⭑ ⟨개정 2026-08-29⟩ **첫 무인 회차가 돌았다** — `2026-08-29T03:30:41+0900 backup-full.sh OK`(`LAST-SUCCESS.txt` 마지막 줄) · 볼륨 산출물 `vol-uploads`·`vol-previews` 실재. ／ 이전 `backup-full.sh` 의 크론 무인 회차가 아직 0 회다 — 첫 회차는 2026-08-29 03:30. 손으로 돌린 GREEN 은 기구가 아니다"
      fired: true
    note: "`03-HANDOFF §1 T-X` 는 상태 칸에 🟧 를 적으면서 같은 칸 본문에 ⛔ 글리프를 함께 쓴다. `WORK-UNITS §10.2` 는 ⛔(「그래도 R-1 은 열려 있다」가 두 번 반복)로, 같은 문서 `§10.3` 은 「기구 ✅ · 유인 1회 GREEN ✅ · 크론 첫 회차 로그 대기」로 적는다. 완료 정의 12행은 전건 ✅ 인데 남은 넷(크론 첫 회차 로그 · `POST /searches` 1회 · `preflight` 성질 판정 · `:i2` 태그 이력)이 있다. 어느 하나를 고르지 않는다. ⭑ **2026-08-28 — 넷 중 첫째를 실측했고, 닫히지 않았다**(`evidence` 필드). 실측이 갈라짐을 없애지는 않는다 — `§10.2` 는 여전히 ⛔ 이고 `§10.3` 은 진행 표기다. **`status: conflict` 를 그대로 둔다.** 남은 셋(`POST /searches` · `preflight` 성질 · `:i2` 이력)은 미실측이다. ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈187〉`-㉮⟩ 잔여 넷 중 첫째가 닫혔다** — `backup-full.sh` 의 크론 무인 첫 회차 **2026-08-29 03:30 GREEN** 실측. 그 전까지는 원장 전용 백업만 돌면서 GREEN 이 찍히던 green-by-skip 자리였다. **`R-1` 항목 자체는 닫지 않는다 — 남은 셋은 여전히 미측정 `[미확인]` 이고 `status: conflict` 를 유지한다.** ⭑ **⟨개정 2026-08-29 저녁 · `PLAN-SoT §9 〈207〉`⟩ `status` 를 `conflict` → `partial` 로 갈았다.** `conflict` 는 **「산문끼리 갈린 채 남아 있다」의 기록**이었고, 이 회차가 갈린 산문 셋(`03-HANDOFF §1 T-X` · `WORK-UNITS §10.2` · `§10.3`)을 실측에 맞춰 걷었다. **남은 셋 중 둘이 닫혔다** — 읽는 경로 1회 · `preflight` 성질 판정. **여전히 열려 있는 것은 `:i2` 태그 이동 이력 하나**이고, 그것은 `[미확인]` 이 아니라 **「이력을 남기는 기구가 없다」는 실측된 결손**이다. **그래서 `done` 이 아니라 `partial` 이다.** ⚠ 이 회차가 새로 연 것 = `preflight` 의 `P5-b` 산출물 선택 결함(`〈207〉-㉲`) — **`R-1` 의 꼬리가 아니라 별건이다.**"
    sources: ["03-HANDOFF §1 T-X", "WORK-UNITS §10.2", "WORK-UNITS §10.3"]

