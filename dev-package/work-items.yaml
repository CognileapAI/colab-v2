    evidence: "⭑ **실측 (2026-08-29 · `sessions/STAGE2-READINESS-AUDIT.md §1`) — 걷어낼 키워드 입력이 실물에 없다.** `frontend/src/components/catalog/**` 의 `<input>` **0건**(`AppliedConditions.tsx`·`CatalogTable.tsx`·`ColumnMenu.tsx` 전건 0) · `useCatalog.ts:29` 질의 모델은 `{ sort, filters }` 뿐이라 `keyword` 필드 **없음** · 검색 진입점은 이미 `SearchHero` **하나**. 즉 완료 정의 ⓑⓒ 는 실물이 이미 만족한다. **잔여 = 문구 정합 1건** — `DatasetsPage.tsx:60` 은 「찾을 것이 정해져 있으면 홈의 AI 검색이 빨라요」, `SearchHero.tsx:34-37` 은 「이 검색은 데이터에 적혀 있는 낱말 그대로 찾아요」로 **정반대를 말한다**. 어느 쪽이 맞는지는 `T-1` 한국어 형태소 검색 재작성이 무엇을 바꾸느냐가 정한다 → **`T-1` 종속**. ⚠ **진입조건에 적힌 `F-1` 과의 `frontend/**` 파일 면 겹침은 실재하지 않는다 — 겹치는 파일 0건(실측).**"
