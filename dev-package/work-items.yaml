  - id: BF-6
    name: "데이터셋 설명문 `／` 구분자 — 표시 단계 줄 나눔 (A안) (Ted 15 · 접수 C-4)"
    status: done
    stage: stage1
    owner: "frontend (D3 상세 화면)"
    entry_conditions: []
    depends_on: [S2b]
    completion_def: >-
      시드 설명문(`S2b`)이 `／` 로 항목을 잇는데 상세 `.dh-sum` 이 한 줄로 그려 읽기 힘들다. **Ted 판정 Q5 = 표시만 분할(A안)** — 저장·목록·검색 카드는 그대로.
      완료 = ⑴ `DetailHeader.tsx` `SUMMARY_SEPARATOR = '／'` ＋ `summarySegments()`(split → trim → 빈 조각 제거) ⑵ 조각 2개 이상일 때만 `.dh-sum` 안을 `<p class="dh-sum-lead">` ＋ `<ul class="dh-sum-list">` 로 · 1개면 종전 그대로
      ⑶ `.dh-sum` 껍데기와 `data-testid="dh-sum"` 유지(기존 `detail.test.tsx:63`·`:160` 통과) ⑷ 시드·DB·계약·`SearchHitCard` 무접촉 ⑸ `git revert 02738e4` 한 번으로 되돌아간다.
    evidence: >-
      커밋 `02738e4`(기반 `56eac76` · 3파일 +43/−1 ＋ 신규 시험 5건). RED = **2 failed / 3 passed**(통과 3건은 「종전 그대로」 가드 — `／` 없음 · 빈 설명 · 검색 카드 한 줄)
      → GREEN vitest **37파일 / 575건 전건 통과** · `tsc --noEmit` 0. 근거 `reports/bug-20260903/lane-C4-report.md`.
    deadline: null
    note: >-
      **신설·닫힘 2026-09-03** — `PLAN-SoT §9 〈310〉`-㉮ Q5. ⚠ **Ted §8 문구 확인 대기** — 정본 `Policy_데이터셋_상세 §8` 은 이 자리를 「③ **한 줄** 요약」으로 못 박는다(`DetailHeader.tsx:2` 축자).
      여러 줄로 펼치는 것이 정본 위반인지 Ted 확인이 남았고, 코드는 승인 전제로 넣되 되돌리기 1회로 설계했다. 표시 규약 「`／` = 구분자」는 `〈310〉`-㉳ 에 등재했다 — 본문에 `／` 를 쓴 설명이 뒤에 들어오면 오분할한다(현재 사용자 입력은 `RegisterArea` 300자 한 줄이라 해당 사례 0).
      스크린샷 `reports/bug-20260903/bug12-*.png`.
      ⭑ ⟨상태 정정 2026-09-04 · advisor 게이트 ③⟩ `done → in_progress` — 완료 = staging 배포 green(`CLAUDE.md §0`)이고 이 항목은 통합 브랜치 `bugfix/20260903-ui-12` 에만 있다. staging 배포 green 시 `done` — 배포 창이 전환한다.
      ⭑ ⟨staging 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`in_progress` → `done`.** ⑴ **staging 배포 green** `f465d83a2ef1` ⑵ **사용자 시야 확인**(실브라우저 · GK-2A 상세): `dh-sum` 이 이끔 문장 1(`자료명 GK2A_NDVI_mean_yyyymm.tif.`) ＋ 목록 **5개 항목**으로 갈렸고 화면 텍스트에 `／` **0건**. ⚠ **정본 `Policy_데이터셋_상세 §8` 「한 줄 요약」 문구와의 충돌은 여전히 Ted 확인 대기다** — 배포 green 은 그 판정을 대신하지 않는다. 위반이면 `git revert 02738e4`. 근거 `sessions/WINDOW-20260904-B4.md §6`.
