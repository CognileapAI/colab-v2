  - id: D3b
    name: "RLS 실효 증명 — 음성·양성 테스트"
    status: done
    stage: stage1
    owner: "T-D"
    entry_conditions: ["D3", "P0 스키마"]
    depends_on: [D3, P0]
    completion_def: "① 허용자 아님·만료됨 본체 조회 0행 ② 잠긴 데이터셋 메타는 조회됨(P-13 회귀 방지) ③ cross-tenant 0행. 셋 다 red fixture 로 fail-closed 증명 (`§6`)"
    evidence: "2026-08-23 닫힘 — 게이트 `rls-effect` 로 승격. ①본체 음성 ②메타 양성(`P-13`) ③cross-tenant(18표 전수 0행). red fixture 18/18"
    deadline: null
    note: >-
      부수로 `db-selftest` 결합 결함을 고쳤다 — 게이트가 옳고 selftest 배선이 틀렸다.
      ⭑ **⟨증보 2026-09-05 · 등재 `PLAN-SoT §9 〈332〉`⟩ 이 게이트의 판정이 아니라 준비 대기가 틀려 있었다 — 값과 근거는 그 행에 있다.**
      `postgres:16-alpine` 이 initdb 동안 띄우는 **임시 서버**도 `pg_isready` 에 응답하는데 종전 대기 루프가 거기서 break 했고, 확인 `pg_isready` 가 임시 서버 종료와 실서버 기동 사이 **≈200 ms 공백**에 떨어져
      `rls-effect-selftest` 단독 실행이 **유휴 호스트에서 3연속 red(준비)**(매번 다른 케이스 · 축자 `limit=60초|elapsed=1초`)를 냈다.
      ⛔ **검사기의 결함이지 검사 대상의 결함이 아니다** — 같은 회차에 `rls-effect` 본체는 green 이었고 **이 항목의 판정 기준·케이스는 한 건도 줄지 않았다.**
      고침(브랜치 `gate/pg-ready-wait` · `6e83027`·`6bb3a9b`·`768fccc`)은 준비를 **초기화 완료 표식 ＋ 그 뒤 `pg_isready` 성공**으로 좁히고 세 곳에 흩어져 있던 대기 루프를 `pg_wait_ready` 하나로 모았다 —
      ⚠ **정밀화이지 범위 축소가 아니다**(예산 60초 그대로 · 재시도 없음 · 상한을 넘기면 여전히 red(준비)). fail-closed 증명은 **18 → 19건**으로 늘었다(엔트리포인트를 `sleep` 으로 바꾼 파생 이미지).
      ⚠ **`main` 병합은 아직이다** — 이 고침은 `gate/pg-ready-wait` 에 있다. ⛔ **`status` 는 `done` 무변** — 이 항목의 완료 정의는 2026-08-23 에 닫혔고 이번에 고친 것은 그 판정을 **감싸는 대기**다.
    sources: ["03-HANDOFF §1 T-D", "WORK-UNITS §6", "WORK-UNITS §11", "PLAN-SoT §9 〈332〉", "reports/gate-pg-ready/lane-report.md"]

