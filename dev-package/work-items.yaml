    evidence: "⭑ **⟨실측 2026-09-03 · 워크트리 `lane-v2close` · 등재 `PLAN-SoT §9 〈304〉` · 근거 `sessions/V-2-CLOSE-20260903.md`⟩ `〈294〉` 가 남긴 둘 중 **하나는 닫혔고 하나는 눈금의 읽는 법이 미판정이라 닫지 않았다.** `status: in_progress` 유지.** **㉮ staging 배포 green = 충족.** 서빙 릴리스 `d9e89a3a074ba859a27ffc4270579bc180317c81` · 원장 축자 행 `2026-09-03T12:43:56+0900 deploy d9e89a3a074b d9e89a3a074b green` · `git merge-base --is-ancestor d570f2d d9e89a3a074ba859…` **종료 코드 0** ⟹ `〈294〉` 병합분이 서빙 중이다. **㉯ ⑻ 응답 눈금 = 실측했으나 판정 보류.** 공개 엣지 `https://www.colab-hydro.com` 로 `POST /datasets/{id}/value-lookup` 만 불러 잰 **클라이언트 벽시계**이고 **Cloudflare ＋ nginx 가 포함**된 값이다 — 서버 단독 p95 는 `Server-Timing` 에 처리 구간이 없어 **`[미확인]`**. 회차 정본(따뜻한 상태 · 데이터셋 3 × 경계 안 10 점 × 3 반복 ＋ 무타일 5 = **n 95**) = 합산 **p50 193 ms · p95 261 ms · max 280 ms · 오류 0**(데이터셋별 p95 263/255/249 ms · 무타일 p95 226 ms). **실행 4회 전건 p95 ≤ 261 ms.** ⚠ **그러나 이 날 첫 실행에서 데이터셋 둘의 p95 가 1 초를 넘었다 — 1,164 ms · 2,111 ms.** 뒤 네 실행에서 재현되지 않았고 **상한 5 초는 다섯 실행 통틀어 넘지 않았다(관측 최대 2,448 ms)**. ⛔ **그 실행의 합산 p95 는 표본 원값을 안 남겨 되살릴 수 없다 `[미확인]`** — 1 초 초과 표본이 95 중 약 4~5 건으로 **합산 p95 경계와 겹쳐 추정으로 판정하지 않았다.** **㉰ 왜 닫지 않는가 — 완료 정의 ⑻ 의 문면이 「응답 p95 1초 · 상한 5초」뿐이고 데이터셋별인지 합산인지 · 따뜻한 상태인지 유휴 후 첫 접촉인지를 적지 않았다**(정본 `Policy_데이터셋_상세 v2.8 §8` 도 같다). 읽는 법에 따라 판정이 **뒤집힌다** ⟹ **Ted 판정 대기 1건**(선택지·권고 = 근거 문서 §7). 집행 레인이 자기 편한 쪽으로 고르지 않는다. **㉱ 값 대조 — 답하는 수가 그 칸의 실측값이다(⑶⑷ 재확인).** NumPy 적재분 3점을 원천 `Prediction_20230501.npy` ＋ 동봉 격자와 대조 = **3/3 이 원천 격자 한 칸의 값과 같다**(차 1.3e-12 · 4.2e-11 · **0**). **블록 평균이 아니다.** 한 점은 최근접 선택이 한 행 갈렸고(반 칸 재배치 — `〈254〉` ② 가 적어 둔 한계 그대로), **응답이 스스로 `exactness: 가장 가까운 칸` 과 `sizeDegrees` 로 그 한계를 말한다.** ⭑ 호스트에 numpy 가 없어 `.npy` 를 **순수 파이썬으로 읽었다**(원천 무변경). **㉲ ⚠ 착수 전제가 실물과 어긋났다** — 「`E-2` 5종에 타일이 있다」가 **거짓**이다. staging 14건 전수 훑기 = **자리에 산출물 3건** · 나머지 **11건**(`E-2` 의 tif·nc·gz·hdf 포함)은 `200 ＋ available:false ＋ 「자리에 산출물이 없다」`. ⟹ **눈금 표본은 포맷 5종을 가로지르지 않는다.** 원인 **`[미확인]`** — `〈254〉` 실측 ⑥ 으로 설명하려 했으나 **그 문면이 낡았다**(`d5/pipeline.py COG_BUILDERS` 실측 다섯 · `NumPy` 는 `#58`/`44bef51` 이 넣었다). **㉳ 이번에 세지 