  - id: PA-G
    name: 구글 IdP 어댑터
    status: open
    stage: stage2
    owner: "D1 / core-api ＋ frontend"
    entry_conditions: ["⭑ ⟨**셈법 확정** 2026-08-31 · Ted RULING ㉜ · `PLAN-SoT §9 〈258〉`⟩ **개시 조건 = 대장에서 `stage1`·`stage2` 항목 중 미완이 0건이 되는 시점.** **세는 규칙 넷** — ① **미완 = `status` 가 `done` 이 아닌 것 전부**(`partial` 포함 · `CLAUDE.md §5` 「WU 는 부분 완료로 닫지 않는다」) ② **`deferred` 는 제외** ③ **`PA-G` 자기 자신은 반드시 제외**(자기를 기다리면 영영 열리지 않는다) ④ **`after_stage2`·`out_of_scope` 는 불산입**. **「기능만 센다」로 가르지 않는다** — 무엇이 기능인지 가르는 순간 다시 애매해지고, 이 회차가 본 사고 셋(「타일 서빙」·`CT-1` 의 `P6`·`preflight` 성질 문면)이 전부 그 무늬였다. **실측 2026-08-31** = `stage1` 미완 **3**(`SC-5` partial · `LV-1` open · `LV-2` open) ＋ `stage2` 미완 **15**(`deferred` 1건 `2단-격자전용-실패3건-처분` 제외 시 **14**) = **17**, 여기서 `PA-G` 자신을 빼면 **16**. **`partial` 은 4건**(`SC-5`·`IS4`·`I3`·`R-1`)이고 규칙 ① 로 **전부 미완에 든다**. **기계로 재지는가 = 예. 다만 자동으로 재는 것은 아직 없다** — 이 셈은 대장의 `status`·`stage` 두 필드만으로 뽑히지만(위 값이 그 결과다), `gates/run.sh` 에 이 계수를 재는 게이트는 **0건**이다. 자동이 되려면 `work-item-consistency` 에 계수 검사가 붙어야 한다. ／ 이전 ~~**v2 의 기존 기능이 전부 완성된 시점**~~ — 그 뒤·출시 결정 **전**에 연다. 기한 정본은 아래 `deadline.condition` 과 `WORK-UNITS §7` 의 PA-G 행. ／ 이전 ~~stage 1 완료 판정~~"]
    depends_on: [PA]
    completion_def: "2026-08-27 작성(`〈168〉-㉷`) — PA 의 7항은 자동 승계되지 않는다. ⓐ 어댑터가 `kernel/authn.py` 한 파일에만 ⓑ 비밀번호 발급 경로 제거(공존시키지 않는다) ⓒ `credentials.json`·`ops/set-password.py` 폐기 ⓓ admin 계정 처리 + 음성 시험 ⓔ PA ①②③⑤⑥ 재통과 ⓕ staging 배포 green"
    evidence: null
    deadline:
      condition: "⭑ ⟨개정 2026-08-29 · `PLAN-SoT §9 〈188〉`⟩ **v2 의 기존 기능이 전부 완성된 시점에 이 WU 를 연다 — 그 뒤·출시 결정 전에 구글 계정 전환을 집행한다. 날짜가 아니라 조건이다.** 그때까지 비밀번호 로그인은 「기한부 예외」로 유지하고, 비밀번호 어댑터는 이 WU 가 닫히는 시점에 제거한다(공존시키지 않는다). ／ 이전 ~~교체 기한 = stage 1 완료 판정과 동시에 이 WU 를 연다 (`§7` PA-G 행 · `〈122〉-㉯`)~~"
      fired: false
    note: "⭑ **⟨2026-08-31 · Ted RULING ㉜ · `PLAN-SoT §9 〈258〉`⟩ 셈법이 확정됐다 — `entry_conditions` 로 옮겼다. `03-HANDOFF §4 #52` 는 이것으로 닫힌다.** ⚠ **앞 회차 계수(`19` · `deferred` 제외 `18`)와 이번 실측(`17` · `PA-G` 제외 `16`)이 다르다** — 정의 차인지 시점 차인지 **이 회차가 재지 않았다**. 앞 값의 셈 근거가 남아 있지 않아 **`[미확인]` 으로 둔다.** 지어내지 않았다. **정본은 확정된 셈법으로 다시 뽑은 이번 값이다.** ／ 이전 ~~개시 조건을 무엇으로 세는가는 정하지 않았다 — 후보 다섯과 실측 계수를 `§4 #52` 에 정리했다. 결정 번호를 쓰지 않았다~~ ／ ⭑ ⟨2026-08-29⟩ **`fired` 를 `false` 로 확정했다**(`PLAN-SoT §9 〈188〉`) — 기한의 기준이 「stage 1 완료 판정」에서 **「v2 기존 기능 전부 완성」**으로 바뀌었고, 그 조건은 오늘 충족되지 않았다(미착수 WU 잔존). `unknown` 의 원인이던 「stage 1 완료 판정이 났는지 두 문서만으로 결정되지 않는다」는 기준이 바뀌어 사라졌다. ⚠ **지금 착수하는 항목이 아니다 — 조건이 충족되기 전에는 열리지 않는다.** 조건이 충족되는 회차에 `fired: true` 로 올리면 ㈒ 가 red 로 착수를 강제한다. ／ 이전 ~~fired 를 `unknown` 으로 둔 이유 = `§1.5` 2026-08-27 재판정이 stage 1 조건 대부분을 ✅ 로 적으면서도 잔여 둘(조건 3 D8 · 조건 7 계보 확정 완주)을 stage 2 로 남겨, 「stage 1 완료 판정」이 났는지 두 문서만으로 결정되지 않는다. 사람이 판정할 자리다.~~ — 사람이 판정했다. ⭑ **⟨재실측 2026-09-02 · `PLAN-SoT §9 〈275〉`-㉮⟩ 개시 조건은 아직 충족되지 않았다 — `stage 2` 를 다 닫아도 열리지 않는다.** 셈법은 `entry_conditions` 의 넷 그대로이고 값만 다시 뽑았다(대장의 `status`·`stage` 두 필드만으로). ⛔ **`stage1` 미완이 그대로 3 건 남아 있다 — `LV-1`(open) · `LV-2`(open) · `SC-5`(partial)**. 규칙 ① 로 `partial` 도 미완이다. **이 3 건은 `stage 2` 작업으로는 줄지 않는다** — 다른 단의 항목이다. ⟹ **「stage 2 를 다 닫으면 `PA-G` 가 열린다」는 틀렸다.** **`stage2` 미완 = 14 건**(`IS4`·`I3`·`I4`·`A-1`·`R-1`·`V-1`·`V-2`·`J-1`·`CT-1`·`P7`·`P8`·`PA-G`·`S3` ＋ `deferred` 1건 `2단-격자전용-실패3건-처분`), 규칙 ② 로 `deferred` 를 빼면 **13**, 규칙 ③ 으로 `PA-G` 자신을 빼면 **12**. ⟹ **총 미완 = 3 ＋ 12 = 15**(종전 2026-08-31 실측 16 → 15 · 이 회차에 `A-1`·`P7` 둘이 닫히고 계수 시점이 달라진 결과다). ⚠ **자동 계수는 여전히 없다 `[미확인]`** — `gates/run.sh` 에 이 계수를 재는 게이트는 **0건**이고, 붙이려면 `work-item-consistency` 에 계수 검사가 들어가야 한다(종전 기록 그대로)."
    sources: ["03-HANDOFF §1 T-S 초기 데이터", "WORK-UNITS §7", "WORK-UNITS §10.2-b", "WORK-UNITS §10.3", "PLAN-SoT §9 〈188〉"]

