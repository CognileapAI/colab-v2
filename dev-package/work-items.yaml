    owner: "D10 / ai-service"
    entry_conditions: ["K2(✅) · D2(✅) — 열려 있다", "`P2` 산출만 필요해 `D5`·`P3` 과 병렬"]
    depends_on: [K2, D2, P2]
    completion_def: "⭑ ⟨기재 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈211〉`⟩ **⑴ D4 쓰기 경로 부재 음성 테스트 green** — AI 가 계보를 직접 쓰지 못한다(`CLAUDE.md §3-2` 불변 규칙) **⑵ 정직한 빈 상태** — 제안할 것이 없으면 지어내지 않고 「없음」을 돌려주며 화면이 그대로 적는다 **⑶ 품질의 수치 합격선은 이 항목이 정하지 않는다 — 별건으로 뺀다.** 사유 = 모수가 계보 간선·데이터셋 각각 한 자릿수여서 퍼센트가 오라클 행세만 한다(계수와 근거 = `〈211〉`). 별건의 재개 조건도 `〈211〉` 에 적었다 ／ 이전 ~~평가셋 대비 제안 품질 ＋ D4 쓰기 경로 부재 음성 테스트 green (`§8`)~~"
