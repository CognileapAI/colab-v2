    completion_def: "⭑ ⟨정정 2026-08-31 · Ted 판정 ⑳ · `PLAN-SoT §9 〈248〉`⟩ **5종**(`NetCDF`·`Binary`·`HDF4`·`GeoTIFF`·`NumPy`) 각각 최소 1건이 시각화 화면에 그려지고 계보가 확정 상태로 남는다. GeoTIFF 를 가장 먼저 돌린다. 실패 파일은 목록으로 남긴다. **숫자가 아니라 목록으로 읽는다** — 목록의 정본은 `gates/config/e2e-format-coverage.toml` `[required].formats` 하나다. ／ 이전 문면 ~~4종 각각 최소 1건이…~~ (수를 고쳤을 뿐 조항은 그대로다)"
    evidence: "⭑ **⟨착수 회차 2026-09-01 · 워크트리 `lane-s3` · 근거 `sessions/S3-E2E-20260901.md` · 등재 `PLAN-SoT §9 〈267〉`⟩ 완료 정의 넷 중 셋을 실측으로 충족했다. 값과 근거는 그 회차 기록에만 적는다.** ㉮ **5종 각각 그려진다** = `services/viz-render/tests/test_e2e_real.py` 의 `e2e_format` **5건** ＋ 게이트 `e2e-format-coverage` green(면제 0건). ⭑ **이 회차가 한 겹 더 세웠다** — `tests/test_e2e_storage_layout_real.py` **5건**: 본체를 **배치 정본이 적는 이름(ULID · 확장자 없음 · `contracts/storage/layout.json` `keys.본체`)** 으로 놓고도 5종이 그려진다. 종전 E2E 는 **원래 파일 이름**으로 놓고 있었다 — 확장자에 기대는 자리가 하나만 있었어도 시험은 전건 초록인데 실업로드는 한 장도 안 그려졌을 자리다(`DATA-REFERENCE §0 M-1` · `03-HANDOFF §4 #20` 의 무늬). **결함 0건**이었고 회귀 시험으로 못 박았다. ㉯ **계보가 확정 상태로 남는다** = ⛔ **재는 자리가 없었다 → 이 회차가 지었다.** `services/core-api/tests/test_e2e_s3_real.py` **6건** — 5종 **실파일 바이트**를 접수(영수증 `byteSize` ↔ 실파일 `st_size` 대조)해 등록·부모 연결·`confirmLineage` 까지 가고 **`확정`** 을 상세와 계보 그래프 **양쪽에서** 확인한다. 확인 전에는 `확인 필요` 인 것도 함께 본다. 덧붙여 **core-api 가 포맷을 스스로 적지 않는다**(`detected_format` NULL)를 실파일로 음성 확인한다(`DR-3`·`M-1`). ㉰ **실패 파일 목록** = 게이트가 실패·건너뜀을 **이름으로** 찍고 면제는 건수를 드러낸다 · `[면제].formats` **0건**. ㉱ **GeoTIFF 우선** = 두 시험의 포맷 목록이 정본 `.toml` `[required].formats` 와 **순서까지 축자로 같은지**를 기계가 대조한다(정본이 늘면 red). ⭑ **오라클을 변이로 증명했다** — 계보 판에서 확인 호출을 빼면 **5 red**, 배치 판에서 본체를 1,024 B 로 자르면 **5 red**. **빈 단언이 아니다.** ⭑ **5종 전건 완주 · 멈추는 자리 0건**(업로드 → 헤더 파싱 → 좌표계 통일 → 미리보기 산출 → 계보 확정). 격자·dtype·COG 판정 기준은 다시 재지 않고 `DATA-REFERENCE §1`·`§1.1` 실측을 찾아 썼다. **시험 계수** — core-api 511→**517** · viz-render 194→**199** · 나머지 불변 · `tsc` 0. ⭑ **⟨닫는다 2026-09-03 · 단독 창 2 단계 E · 워크트리 `lane-window-e2` · 근거 `sessions/WINDOW-20260903-E2.md` · 등재 `PLAN-SoT §9 〈300〉` · Ted 승인 2026-09-03⟩ 완료 정의 4항이 전건 실측으로 섰다 — `status: open` → `done`.** ㉮ 잔여 1조항이던 **공개 엣지 포맷별 왕복**을 포맷 이름과 함께 쟀다 — `tif` `01M0Y1VQ09TMHAC78ESDRTMAZD` · `nc` `01M0Y1WMH6M87QFM790QPEYJ2R` · `gz` `01M0Y1WM5JBDJRZ8FT3AX8HXE1` · `hdf` `01M0Y1WNXRRFBZ7XW9K9TE4352` · `npy` `01M1JM3JTQSSTKR9A2QQ67QN81` **5/5 전건 `200 ＋ Content-Type: image/png ＋ 매직 89504e47`** · `text/html` **0건**. ㉯ 그 선행이던 **`NumPy` 본체 0건**도 풀었다 — 업로드 모달과 같은 요청 순서(`POST /uploads` → `GET /uploads/{id}` → `POST /datasets`)로 `Prediction_20230501.npy` `(1280,1280)` `<f4` ＋ 동봉 격자 짝 `(1280,1280)` `<f8` 을 적재했고 `format = NumPy` · `grid = 1280x1280` 로 섰다. **staging 쓰기는 전부 공개 API 이고 SQL 쓰기 0건.** ㉰ 나머지 3항은 `〈267〉` 실측을 인용한다(다시 재지 않았다) — 다만 `e2e-format-coverage` 는 이 회차에 **재실행해 green**(축자 `필수 5종 · 표식 붙은 케이스 5건 · 면제 0종`). ㉱ ⚠ **그 게이트가 이 항목을 닫은 것이 아니다** — 게이트는 로컬 오라클이고, 닫은 것은 위 ㉮ 의 **공개 엣지 실측**이다."
    deadline: null
    note: "⭑ **⟨닫힘 2026-09-03 · `PLAN-SoT §9 〈300〉`⟩ 아래 ⛔ 문면 전부 — 「닫지 않는다」·「잔여 1행」·「Ted 승인 대기」 — 는 이 회차로 해소됐다. 원문은 지우지 않는다.** ⛔ **⟨재판정 회차 2026-09-02 · 워크트리 `lane-fmt` · 초안 `dev-package/notes/FMT-LEDGER-PENDING.md` ⟨초안 B⟩⟩ 닫지 않는다 — 남은 조건은 여전히 하나이고, 그 하나의 정체가 갈렸다.** **㉮ 완료 정의 4항 대조 (2026-09-02).** ⑴ 5종 각각 그려진다 = ✅ 로컬 실측(`viz-render` `e2e_format` 5건 ＋ 배치 정본 이름 5건 · `〈267〉`) ⑵ 계보 확정 = ✅(`core-api` `test_e2e_s3_real.py` 6건 · `〈267〉`) ⑶ 실패 파일 목록 = ✅(게이트가 이름으로 찍고 `[면제]` 0건) ⑷ **공개 엣지에서 포맷별 왕복 = ⛔ `[미확인]`.** **㉯ ⚠ `#58` 이 이 항목을 막고 있지 않았다 — 대장 두 자리가 어긋나 있었고 실물이 갈랐다.** 이 항목의 종전 note 축자가 「**`S3` 를 막지 않는다 — 경로가 다르다**」로 옳고, `PLAN-SoT §9 〈275〉`-㉱-⑻ 의 「이 블로커가 막는 것은 `S3` 잔여 1행이다」가 **틀렸다.** 근거 = 화면 미리보기는 `viz-render`(D7)가 원본에서 직접 내고 그 경로는 `NumPy` 를 **이미** 읽고 있었다(`readers._read_numpy`). `#58` 은 D5 의 COG·지도 타일 경로 결함이다. `#58` 은 이 회차에 집행됐고(⟨초안 A⟩) **그것으로 이 항목의 잔여는 하나도 줄지 않았다.** **㉰ ⛔ 잔여가 막힌 진짜 이유를 실측했다 — staging 에 `NumPy` **본체**가 0건이다.** `colab_platform.d3_file` 을 `kind` 와 함께 센 값(2026-09-02 · 읽기 전용 조회) = `tif` 본체 53(데이터셋 8) · `nc` 본체 41(2) · `gz` 본체 22(2 · HSR) · `hdf` 본체 8(1) · **`npy` 는 6건 전부 `기준 격자 파일`(데이터셋 3) — 본체 0건.** 계 = 데이터셋 13 · 파일 130. **기준 격자는 다른 본체의 좌표를 세우는 부속이지 그려지는 대상이 아니다.** ⟹ 「NumPy 가 화면에 그려진다」를 staging 에서 재려면 **NumPy 본체를 화면 경로로 1건 적재해야 하고 그것은 staging 쓰기**다. 이 레인은 읽기 전용 조건이라 하지 않았다. **㉱ 나머지 4종의 엣지 왕복도 못 쟀다** — 주 화면 왕복에 베어러가 필요하고 자격증명 접근이 이 세션에서 차단됐다. **㉲ 푸는 법(순서 바뀜) = ⑴ NumPy 본체 1건을 업로드 모달 경로로 staging 에 적재 ⑵ 5종 각각 주 화면을 왕복해 `200 ＋ image/png` 를 포맷 이름과 함께 적는다. ⑴ 이 선행이다 — 막는 것은 배포가 아니라 적재다.** ／ 이전 ⛔ **⟨착수 회차 2026-09-01 · `lane-s3`⟩ 닫지 않는다 — 남은 조건 하나. 부분 완료로 닫지 않는다.** **남은 것 = 「시각화 화면에 그려진다」의 포맷별 실측.** 포맷에 의존하는 지점은 전부 `viz-render` 안에 있고 거기서 5/5 실측됐으며, 화면 구역의 정본은 「무엇으로 그릴지는 사람이 고르지 않는다 — 판정은 포맷이 하고 viz-render 가 한다」이고 중계도 「해석하지 않는다」다. ⟹ 화면은 **구조상 포맷 무관**이다. **그러나 그것은 틀이지 측정이 아니다**(`M-5` — 증거는 확정으로, 틀은 잠정으로). 공개 엣지 실측은 `〈241〉` 의 **주 화면 13/13 = 200 ＋ `image/png`** 하나뿐인데 **그 13건의 포맷 구성이 어디에도 적혀 있지 않다**(같은 문서의 「표본 25 · 포맷 5종」은 게이트 `render-latency` 의 **로컬** 측정이지 엣지가 아니다). ⟹ 「5종 각각이 공개 엣지에 도달했다」는 **`[미확인]`**. **푸는 법** = staging 에서 5종 각각 최소 1건을 골라 주 화면 자리를 왕복해 `200 ＋ image/png` 를 **포맷 이름과 함께** 적는다. **이 레인은 staging 무접촉 조건이라 재지 않았다** — 못 잰 것을 잰 것처럼 쓰지 않는다. ⛔ **함께 상신하는 새 블로커 하나 — `NumPy` 가 `pipeline-worker`(D5) 헤더 파싱에서 멈추고, 에러 메시지가 「지원 목록 밖」이라 거짓말한다.** 실측 = `detect_format` 은 `NumPy` 로 바르게 판정하는데 `d5/parse.py` `parse_metadata` 의 분기가 넷(`NetCDF`·`HDF4`·`GeoTIFF`·`Binary`)만 받고 나머지를 `else` 로 떨어뜨린다(`d5/pipeline.py` COG 분기도 같은 모양). **그런데 D5 자신의 선언은 지원한다고 말한다** — `SUPPORTED_FORMATS` 에 `NumPy` 가 있고(`〈77〉`) `NOT_RENDERABLE_FORMATS` 는 `GRIB` 하나뿐이라 `RENDERABLE_FORMATS` 에도 들어 있다. **선언 여섯 · 처리 넷**이고, 이것은 **「지원 목록 밖」이 아니라 「구현 결함」**이다 — 메시지가 그 둘을 뒤바꿔 말해 읽는 사람이 정책으로 착각한다(`M-6` 의 무늬). ⚠ **`S3` 를 막지 않는다 — 경로가 다르다.** 화면이 받는 미리보기는 `viz-render`(D7)가 원본에서 직접 산출하고, D5 의 COG 는 **지도 타일 재사용용 별도 산출물**이다(`layout.json` `contentKeys` 가 만드는 자리 둘·키 규칙 둘을 못 박는다). **소유는 `D5`(`partial`)이고 이 레인이 고치지 않았다**(범위를 늘리지 않는다). ⚠ **`GRIB` 을 이것과 한 덩어리로 접지 않는다** — 같은 `else` 가지에서 떨어지지만 `GRIB` 은 `NOT_RENDERABLE_FORMATS` 라 **정책일 가능성이 있다**(`〈134〉`-㉰ 이 디코더를 들이지 않았다고 적는다). `[미확인]`. ／ 이전 문면은 지우지 않는다 — 아래가 그것이다. ／ 「S3 전체가 stage 2 로 이관된다」(`〈74〉`). ／ 이전 ~~⚠ 이름은 「4종」인데 `㊿`·`〈77〉` 은 지원 포맷을 5종(＋NumPy)으로 올렸다 — 이름과 값이 어긋난다.~~ ⭑ **⟨정정·중복 접기 2026-08-31 · Ted 판정 ⑳ · `PLAN-SoT §9 〈248〉` · 워크트리 `lane-ops`⟩ 갈림을 실측으로 끝냈고, 중복 항목 `S3-e2e-4종` 을 이 항목으로 접었다.** **㉮ 5종이 값이다 — 실측.** `services/viz-render/tests/test_e2e_real.py` 에 `@pytest.mark.e2e_format` 케이스가 **다섯**(`GeoTIFF:98` · `NetCDF:107` · `Binary:120` · `HDF4:159` · `NumPy:284`) 서 있고, 목록 정본 `gates/config/e2e-format-coverage.toml` `[required].formats` 도 **다섯**이며 `[면제].formats` 는 **0건**이다. 게이트 `e2e-format-coverage` 는 필수 포맷의 통과 케이스 0건을 red 로 내고 면제는 이름·사유와 함께 건수를 드러낸다. **즉 「4종」은 낡은 이름이었지 다른 값이 아니었다.** **㉯ `S3-e2e-4종` 은 같은 항목의 중복 계상이다 — 접었다.** 근거 넷 = ⑴ 그 항목의 `completion_def` 축자가 「`§8.5` S3 행의 완료 판정과 **동일**」이다 ⑵ 그 항목의 `depends_on` 이 `[S3]` 하나다 ⑶ 원천이 `WORK-UNITS §11` 한 줄뿐이고 그 줄(`:637`)은 **`§1.5` 완료 조건 7 을 그대로 옮긴 문장**이며 괄호로 스스로 「**= S3**」이라 밝힌다 ⑷ 그 줄에는 **식별자 토큰이 없어** 게이트 `work-item-consistency` ㈏ 의 대조 대상 밖(`unchecked`)이었다 — **접어도 검사 대상이 줄지 않는다**(실측으로 확인한 조건이다). **어느 쪽 근거도 지우지 않았다** — 접힌 항목의 note 원문은 아래 ㉰ 에 통째로 옮겨 둔다. **㉰ 접힌 `S3-e2e-4종` 의 원문 note** — 「⚠ 원문 줄에는 식별자 토큰이 없다 — `§11` ASCII 블록 마지막 줄이고 `§1.5` 완료 조건 7 을 그대로 옮긴 문장이며, 괄호로 스스로 「= S3」임을 밝힌다. 즉 S3 의 중복 계상이다. 대장의 id `S3-e2e-4종` 은 이 대장이 붙인 것이고 산문에는 없다. 지원 포맷도 이 줄은 4종, `§8.5` S3 행은 5종으로 적어 같은 문서 안에서 목록이 어긋난다.」 **㉱ 산문 반영본에 남은 「4종」** = `WORK-UNITS §1.5` 조건 7 머리(`:48`) · `§7` `S3` 행(`:307`) · `§11`(`:637`). **셋 다 같은 줄 안에 「지원 포맷 목록은 `〈77〉` 로 … NumPy 가 된다」를 이미 달고 있다** — 즉 값은 옳고 **머리의 숫자만 낡았다.** 이 회차가 `§7`·`§11` 두 줄에 정정 표시를 달았고(원문 무삭제), `§1.5` 조건 7 은 **정의 원문이라 고치지 않는다**(`§10.2-b` 머리말 규칙). ⛔ **이 항목은 닫지 않는다** — 완료 정의(5종 각각 화면에 그려짐 ＋ 계보 확정)는 이 회차가 재지 않았고, 진입조건 `P3` 도 열려 있다. ⭑ **⟨등재 2026-09-02 · `PLAN-SoT §9 〈277〉`-㉳㉴㉵⟩ 위 재판정이 원장에 실렸다 — 값·근거는 그 회차에 있다.** 잔여는 포맷 조건이 아니라 **공개 엣지의 포맷별 왕복 실측** 하나다. **선행은 배포가 아니라 적재**(NumPy 본체 1건을 화면 경로로 staging 에 올리는 **staging 쓰기**) ＋ **엣지 왕복용 자격증명 접근** — **둘 다 Ted 승인 대기**. `status: open` 유지."
    sources: ["03-HANDOFF §1 T-S 초기 데이터", "WORK-UNITS §1.5", "WORK-UNITS §7", "WORK-UNITS §8.5", "WORK-UNITS §10.3", "WORK-UNITS §11", "PLAN-SoT §9 〈248〉"]


