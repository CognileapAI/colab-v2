    completion_def: "⭑ ⟨기재 2026-09-02 · Ted 판정 「파일 저장처는 지금 볼륨을 그대로 쓴다」⟩ 종전 문면은 지우지 않는다 — ~~완료 정의 미작성(저장처 형태 미판정 · `〈278〉`-㉯)~~ ⟹ **그 사유가 판정으로 풀려 여기서 처음 기재한다.** 각 조항은 **무엇을 재고 무엇이면 통과인가**를 적었다. — **⑴ 바이트를 어디서 읽는가** · 원본은 **접수 볼륨**(`compose.i2.yml` named volume `uploads`)에서 읽고, 자리는 `contracts/storage/layout.json` 배치 그대로이며 **키는 원장이 든다**(`d3_file.storage_key`). **통과 기준** = 볼륨에 놓인 실제 바이트가 `downloadDataset` 응답으로 그대로 돌아오는 시험 1건 이상 green · **새 저장 배치 0건 · 마이그레이션 0건.** — **⑵ 접근 판정을 무엇으로 하는가** · **기존 기계를 그대로 쓴다. 병렬 기계 0건.** ㈎ 연구실 경계 = RLS(행이 안 보이면 404) ㈏ 잠금 = `d2_access.DatasetAccessAdapter` 의 `body_accessible`(거짓이면 403) ㈐ 조각 질의에 `d3_file` 의 `body_access` 정책이 한 겹 더. **통과 기준** = `listDatasetFiles` 와 같은 두 줄을 쓰고(코드 대조), 그 두 줄을 지우면 시험이 실제로 red 가 되는 것을 확인한다. — **⑶ 잠긴 행·경계 밖 행** · 잠김 **403**(존재는 인정 · `P-13`·`P-34`) · 다른 연구실 **404**(존재를 알리지 않는다 · `P-9`·`P-10`) · 토큰 없음 **401**. **거절에는 이력을 쌓지 않는다.** **통과 기준** = 세 음성 각각 시험 1건 이상 green ＋ 잠금 음성은 이력 행 증가 0건까지 센다. — **⑷ 갈아 끼우는 이음매** · **`services/core-api/src/colab_core/kernel/file_store.py` 한 파일.** 라우트는 `FileStore` 말고 아무것도 모른다(루트도·경로도·볼륨이라는 사실도). **통과 기준** = 내려받기 라우트에 저장 루트·경로·파일 열기가 0회 등장한다. — **⑸ 이력** · `d8_download` 에 **302 응답 시점에** 한 줄(`DataModel §6.2` · 계약 산문 축자). **받은 횟수는 어느 화면에도 내리지 않는다.** **통과 기준** = 성공 1회 +1 · 거절 1회 +0 을 시험이 센다. — **⑹ 무엇이 닫는가** · ㈎ core-api 시험 green(양성 ＋ 음성 셋 ＋ 결손 1) ㈏ 화면에서 누른 다운로드가 저장 경로를 타는 frontend 시험 green ㈐ `gates/run.sh all` red(판정) 0 ㈑ 501 표에서 `downloadDataset` 이 빠지고 `test_route_table.py` 오라클 green. ⛔ **staging 배포 green 은 이 항목이 재지 않는다** — stage 2 완료 정의가 따로 잰다. ⛔ **정본이 침묵하는 자리 — 지어내지 않았다(`[미확인]`)** — ㈎ **묶음에 기준 격자 파일을 넣는가**: 정본은 「조각 묶음이면 묶어서 한 번에」(`Policy_데이터셋_상세:69`)라고만 적고 그 「조각」의 범위를 어느 조항도 말하지 않는다. 이번 구현은 **본체만** 넣었다(같은 정본 `§5` 의 `파일` 칸이 본체 수이고 격자는 `hasReferenceGridFile` 로 따로 말한다). **푸는 법** = 정본에 한 줄이 생기거나 Ted 가 판정한다. ㈏ **큰 파일의 전달 방식**: 조각이 여럿이면 메모리에서 zip 을 만들어 내린다. 합계 용량 상한·스트리밍 요건을 정본도 대장도 적은 적이 없고 staging 실측 최대 묶음 용량도 이번에 재지 않았다. **푸는 법** = 합격선(상한 용량·응답 시간)을 정하고 그 값으로 잰다."
    evidence: "⭑ **집행 실측 (2026-09-02 · 워크트리 `lane-st1` · 조항별)** — **⑴** 볼륨에 놓은 바이트가 그대로 돌아온다(`tests/test_dataset_download.py::test_a_permitted_row_download_actually_opens` · 302 ＋ `Location` → 200 ＋ 바이트 일치) · **마이그레이션 0건**(head `0011` 그대로) · **계약 개정 0건**. **⑵** `_dataset_for_download` 가 `listDatasetFiles` 와 같은 두 줄을 쓴다(`routes/catalog.py`) · **그 두 줄을 지우고 돌려 red 2건을 실제로 확인했다**(잠금 음성 둘이 403 → 404 로 무너진다). **⑶** 잠김 **403** · 다른 연구실 **404**(두 hop 다) · 토큰 없음 **401** · 거절 시 `d8_download` 증가 **0건** — 시험 4건 green. **⑷** 이음매 = `kernel/file_store.py` 한 파일 · 내려받기 라우트의 `pathlib`·저장 루트 등장 **0회**(실측 grep) · 쓰는 쪽(`routes/ingestion._storage_root`)도 같은 함수로 모았다. **⑸** 성공 1회에 `d8_download` **+1** · 화면 노출 0건. **⑹** core-api **519 → 524 pass**(신규 7 · 501 파라미터화 -2) · frontend **424 → 427 pass** · `tsc --noEmit` 신규 오류 **0**(기존 4건은 `test/e01-apply-points.test.ts` 로 main 과 동일) · **게이트 `all -j 1` = green 37 / red(판정) 0 / red(준비) 0** · 501 표 **5 → 4** 이고 `NOT_IMPLEMENTED_NO_STORE` **0건** · `test_route_table.py` green. ⛔ **staging 배포 0건** — 이 항목이 재지 않는 칸이다. ／ **신설 근거 실측 (2026-09-02)** — ⑴ `downloadDataset` 이 **501 `NOT_IMPLEMENTED_NO_STORE`** 를 낸다(`〈275〉`-㉯ 실측 승계). ⑵ **저장처를 지는 WU 가 0건**이다 — 대장 96 항목 중 파일 저장처를 이름·완료 정의로 가진 항목이 하나도 없다(전수 조회). ⑶ `CT-1` 의 남은 한 칸이 이 자리에 걸려 있고, `CT-1` 이 흡수하면 그 항목 완료 정의 축자 「새 요건은 **0건**」이 거짓이 된다 ⟹ **별도 항목이 옳다.** ／ ⚠ **이 항목 자체의 진척 근거는 아직 0건이다** — 위는 **신설 근거**이지 집행 실측이 아니다."
    deadline: null
    note: "⭑ **⟨집행 2026-09-02 · 워크트리 `lane-st1`⟩ 완료 정의 여섯을 전부 실측으로 채웠다.** ⛔ **`status` 를 `done` 으로 올리는 판정은 오케스트레이터 몫으로 남긴다** — 이 항목은 `03-HANDOFF §1` T-P 표·`WORK-UNITS §11` 체크리스트에 아직 행이 없고(신설 회차가 완료 정의 부재를 이유로 안 넣었다), 닫으려면 그 두 자리에 행을 세우는 것이 함께 가야 한다. **레인은 자기 브랜치까지가 끝이다.** ⚠ 남은 `[미확인]` 2건(묶음의 격자 포함 여부 · 큰 파일 전달 방식)은 **조건이 아니라 정본이 침묵하는 자리**다 — 완료 정의 안에 이름으로 적혀 있다. ／ ⭑ **⟨신설 2026-09-02 · Ted 판정 · `PLAN-SoT §9 〈278〉`-㉯⟩ 판정 대기 두 자리(`downloadDataset` ＋ 저장처 소유)를 한 항목으로 연다.** ⚠ **`stage2` 로 둔 근거** = `CT-1`(stage2)의 잔여가 여기 걸려 있고, stage 2 완료 정의의 「staging 배포 green」과 같은 단에서 재는 자리다. ⚠ **`depends_on: [P2]` 근거** = 저장처에 놓일 바이트를 만드는 것이 업로드 접수 경로(`P2`)다 — 그 경로가 서기 전에는 내려받을 원본이 없다. ⚠ **`03-HANDOFF §1` T-P 표·`WORK-UNITS §11` 체크리스트에는 이 항목을 아직 넣지 않았다** — 완료 정의가 없는 항목을 완주 체크리스트에 올리면 계수만 늘고 판정이 안 선다. `03-HANDOFF §4 #63` 에 판정 대기로 세웠다. ⭑ **⟨닫힘 2026-09-02 · `PLAN-SoT §9 〈279〉`-㉲⟩ `status: open` → `done`.** 완료 정의 여섯이 전부 실측으로 찼고, 함께 간 것 둘 = `03-HANDOFF §1 T-P` 표 행 신설 ＋ `WORK-UNITS §11` 완주 체크리스트 행 신설(신설 회차 `〈278〉`-㉯ 가 완료 정의 부재를 이유로 비워 둔 자리다). ⚠ **`[미확인]` 2건은 그대로 남는다** — ㈎ 묶음에 기준 격자 파일을 넣는가(정본이 「조각」의 범위를 말하지 않는다 · 이번 구현은 본체만 · 푸는 법 = 정본 한 줄 또는 Ted 판정) ㈏ 큰 파일의 전달 방식(지금은 메모리 zip · 상한 용량·스트리밍 요건이 정본·대장 어디에도 없다 · 푸는 법 = 합격선을 정하고 그 값으로 잰다). **완료 정의가 그 둘을 조항으로 걸지 않았으므로 닫는 것을 막지 않는다 — 다음 회차 진입조건이다.** ⭑ **⟨집행 2026-09-02 · 워크트리 `lane-p4x` · Ted 판정 4건⟩ 남아 있던 `[미확인]` 2건이 **둘 다 판정되고 집행됐다**.** ㈎ **묶음의 기준 격자 파일 포함 = 넣는다.** `domains/d3_catalog.py` 의 질의를 `kind = '본체'` → `kind IN ('본체', '기준 격자 파일')` 로 넓히고(`files_for_download` · 본체 먼저·격자 뒤 정렬) 라우트가 그것을 쓴다. 시험 = `tests/test_dataset_download.py::test_the_bundle_carries_the_reference_grid_files_too`(zip 안에 `a1-body.csv` ＋ `a1-grid.nc` 둘 다 · 바이트 일치 · `testzip()` None). **red 확인 = `kind` 조건을 되돌려 3건 red 실측.** ⚠ 경계는 그대로다 — `body_access` RESTRICTIVE 는 `kind` 를 보지 않아 격자 행도 같은 잠금·같은 연구실 경계를 탄다(`db/platform/schema.sql:858`) · 잠긴 행 403 · 다른 연구실 404 시험 green 유지. ㈏ **큰 파일의 전달 방식 = 용량 상한 없음 ＋ 스트리밍 zip.** `kernel/file_store.py` 에 `_ZipSink` ＋ `stream_bundle()` 신설(`seekable() == False` ⟹ data descriptor · 청크 `STREAM_CHUNK = 1 MiB` 마다 싱크를 비워 내보낸다 · `force_zip64=True`), `routes/catalog.py` `_bundle` 이 `StreamingResponse(file_store.stream_bundle(...))` 한 줄이 됐다. ⛔ **라우트 계약 무변경** — 302 두 hop · `Location` · `Content-Disposition` 그대로. **증명** = ⑴ 반환이 생성기(`inspect.isgenerator`) ⑵ 64 MiB 조각을 64 KiB 청크로 흘릴 때 **한 번에 내보낸 최대 조각 ≤ 청크 + 4096** ⑶ 흘려 낸 zip 이 실제로 풀리고 이름·바이트 일치 ⑷ 라우트가 전량 버퍼를 **호출하지 않는다**(`ast` 로 호출만 계수 — `BytesIO`·`.getvalue`·`.read` 0건 · **글자 grep 으로 재지 않았다**). ⚠ **피크 RSS 로는 재지 않았다 `[미확인]`** — 이 하네스는 프로세스 안이라 다른 픽스처와 섞인다. **낸 증명이 무엇인지 위에 그대로 적는다.** ／ 실측 = core-api **530 → 534 pass**(신규 4) · frontend **429 → 432 pass** · `tsc --noEmit` 신규 오류 0(기존 4건은 `test/e01-apply-points.test.ts` 로 main 과 동일) · 마이그레이션 0건(head `0011`) · 계약 개정 0건 · staging 무접촉. 등재문 = `dev-package/notes/P4X-LEDGER-PENDING.md` ㉰·㉱ (**번호 미발급** — 최신 〈281〉)."
    sources: ["PLAN-SoT §9 〈275〉", "PLAN-SoT §9 〈278〉", "PLAN-SoT §9 〈279〉"]

  - id: CT-1
    name: "카탈로그 표 스펙 세목 — 열 구성 · 조건 다섯 열 · 기본 정렬 · 잠긴 행 · 0건 문구"
    status: done
    stage: stage2
    owner: "frontend / D3"
    entry_conditions: ["`P1` 닫힘(카탈로그 화면 실물 존재 · ✅ 2026-08-23) — 이 항목은 화면을 새로 짓지 않고 **이미 선 화면이 정본 세목을 지키는지**를 판정한다"]
    depends_on: [P1, ST-1]
    completion_def: "⭑ ⟨신설 2026-08-30 · Ted 판정(오늘)⟩ **정본이 이미 카탈로그에 배정한 조항을 완료 정의로 옮긴 것이다 — 요건을 새로 만들지 않았다.** 전거 = `40 COLAB-기획/…/E-02_데이터_찾기/documents/Policy_데이터_찾기.md`(2026-08-18) ＋ `40 COLAB-기획/_재검토_E02-E03_260826.md`(2026-08-26 · `〈129〉` 지정 정본). 각 조항은 축자 인용이고 인용처를 붙였다. — **⑴ 열 구성 8열** · `Policy_데이터_찾기.md:111` 축자 「`데이터셋 · 주제 · Level(가공 단계) · 프로젝트 · 업로더 · 수정일 · 계보 · Verified` + 오른쪽 끝 빠른 작업 자리」 ／ 같은 문서 `:156` 축자 「**8열 표 + 빠른 작업 자리.** 헤더는 세로 스크롤에도 위에 고정된다. 가로·세로 스크롤은 표 래퍼 한 곳이 맡는다」. — **⑵ 조건을 걸 수 있는 열 다섯** · `:115` 축자 「표 헤더에만 둔다. 조건을 걸 수 있는 열은 **주제 · Level · 업로더 · 계보 · Verified 다섯**이고, 나머지 열은 정렬만 갖는다. 한 열에서 값을 여러 개 고를 수 있다」 ／ ⭑ **다섯 열 유지 확정** = `_재검토_E02-E03_260826.md:49` 축자 「\"조건을 걸 수 있는 열은 주제 · Level · 업로더 · 계보 · Verified 다섯\" … **다섯 열 유지가 정답**이고, 근거 한 줄만 덧붙이면 된다 (자유 입력 값은 값 목록을 세울 수 없다)」 ／ 딸린 조항 `:116` 축자 「값별 건수 — 열 메뉴의 값마다 붙는다. **다른 열에 걸린 조건을 먼저 적용한 뒤에 센다.** 눌러도 0건인 값은 미리 흐리게 둬 **빈 결과로 보내지 않는다**」. — **⑶ 기본 정렬** · `:117` 축자 「기본 정렬 ｜ 카탈로그: **수정일 최신순**」 ／ `:147` 축자 「순서를 고르는 조작은 **카탈로그에만** 있다」. — **⑷ 잠긴 행** · `:152` 축자 「자물쇠 + 잠김 칩 · **행에는 접근 요청 버튼을 두지 않는다** · 행을 누르면 잠긴 상세로 가고 요청은 거기서 한다」 ／ `:130` 축자 「잠긴 데이터 ｜ 이름·요약까지 노출 + 접근 요청 (범위는 승인 처리 E-06 적용 지점 표) ｜ … **카탈로그 행은 자물쇠 + `잠김` 칩**」 ／ `:162` 축자 「행 빠른 작업 — … 평소에는 비어 있고, **잠긴 행에는 나타나지 않는다**」. — **⑸ 0건 문구** · `:170` 축자 「조건 결과 0건 ｜ \"**조건에 맞는 데이터가 없어요. 조건을 하나 풀어 보세요.**\" ｜ 조건 칩 줄의 전체 해제」 ／ `:140` 축자 「조건 결과 0건 ｜ **조건 조합이 과함** ｜ \"조건을 하나 풀어 보세요\" + 조건 칩 줄의 전체 해제 [가정]」. — ⭑ **판정 방법** = 위 다섯을 화면 실물과 1:1 대조한다. **완료 판정의 절차 4항(수용 기준 · 도메인 게이트 green · staging 배포 green · 목업 대비 화면 검증 — `WORK-UNITS §7`)은 `P1` 이 이미 통과했으므로 이 항목이 다시 세우지 않는다.** ⛔ **정본이 침묵하는 자리 — 지어내지 않았다(`[미확인]`)** — ㈎ **승인 처리 도착 전 `Verified` 열의 정직한 상태**: 정본은 `:116`(0건 값 흐리게)·`:170`(조건 조합 과함)만 적고, **값을 채울 기능 자체가 이번 릴리즈에 없어 참이 영영 안 맞는 조건**은 어느 조항도 다루지 않는다. `:170` 의 진단(「조건 조합이 과함」·「조건을 하나 풀어 보세요」)은 이 경우에 **틀린 안내**다 — 조건을 풀어도 맞는 행이 생기지 않는다. **문구를 쓰지 않고 멈췄다 — 제품 판정 대기.** ㈏ **카탈로그 행의 `Verified` 칸 값 글자**: 정본은 계보 열 표기 네 가지는 `:118` 로 못 박으면서 `Verified` 칸의 글자는 적지 않는다. 실물은 `columns.ts:37` 「`Verified` 아니면 `승인 전`」 — **정본 무근거**. ㈐ **상호 안내(`:155` 「점선 박스로 반대 길을 권한다」)**: 반대 길인 검색 화면이 이번 릴리즈에 없다. 정본은 **두 길이 다 있는 세계만 기술한다** — 대체 문구 침묵."
