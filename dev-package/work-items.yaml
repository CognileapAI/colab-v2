  - id: X-4
    name: "`_FILE` 배선 재기동 실전 검증"
    status: done
    stage: stage2
    owner: "인프라"
    entry_conditions: ["`R-1` 선행(`§9 〈158〉-㉯`)"]
    depends_on: [R-1]
    completion_def: "정본 = `WORK-UNITS §10.1`"
    evidence: "집행·검증 완료 (2026-08-28 · `§9 〈177〉-㉯`). `docker compose -f infra/staging/compose.i2.yml --env-file ~/.colab-v2-staging.env up -d` 로 재기동. ⭑ **첫 회차는 증명이 아니었다** — 평문 `up -d` 는 `pg`·`nginx` 만 재생성하고 앱 5개를 `Running` 으로 두었다. **전부 healthy 라 통과처럼 보이지만 `_FILE` 을 읽는 사건이 일어나지 않았다.** `--force-recreate` 로 앱 5개를 다시 띄운 뒤에야 실전 검증이 성립했다. 결과 = 앱 5개 전부 새로 기동(10~11초) · `core-api`·`pipeline-worker`·`ai-service` 안에 `/etc/colab/*.url` 실재 확인 · 기동 로그 실패 흔적 **0** · 컨테이너 **7 healthy ＋ cloudflared**(헬스체크 없음) · nginx 경유 헬스 **5종 전부 200** · digest 대장 **8건 전건 일치** · 기준선 **12 · 129 · 6 · 12 · d8_activity 3 불변** · 마이그레이션 head **`0007_p2_human_written_meta` · `0005_k2b_concept_graph_seed` 불변**."
    deadline: null
    note: "⭑ **⟨순환 절단 2026-08-30 · 근거 대조로 확정⟩ `depends_on` 에서 `X-1` 을 뺐다 — `[R-1, X-1]` → `[R-1]`. 종전 값 ~~[R-1, X-1]~~ 를 지우지 않고 남긴다.** **끊은 이유 = 그 간선에 근거가 0건이다.** ⑴ 이 항목의 `entry_conditions` 축자는 「**`R-1` 선행(`§9 〈158〉-㉯`)**」 하나이고 `X-1` 을 적지 않는다. ⑵ 반대편 `X-1` 의 `entry_conditions` 는 「**`X-4` 재기동에 동봉**」으로 **자기 쪽 간선을 명시**한다 — 근거가 있는 방향은 `X-1 → X-4` 한쪽뿐이다. ⑶ `WORK-UNITS §10.3` 순서표 축자는 「`X-1` 회전 ＋ `X-4` 재기동」으로 **한 걸음에 묶어** 적고 둘 사이 순서를 두지 않는다. ⑷ `PLAN-SoT §9 〈158〉`-㉮ 도 「재기동(`X-1`＋`X-4`)」으로 묶으며, `〈177〉` 집행 기록은 ㉮ `X-1` → ㉯ `X-4` 순이라 **`X-4` 가 `X-1` 을 기다렸다는 기록이 어디에도 없다.** ⭑ **순환이 무엇을 망가뜨렸나** — `X-1 ⇄ X-4` 는 서로를 기다려 **둘 다 영원히 진입 불가**로 계산된다. 둘 다 `status: done` 이라 실무 피해는 없었으나 **임계 경로 계산이 순환 보호로 우회해야 했다.** ⚠ **`status` 는 건드리지 않았다**(둘 다 `done` 유지). ／ **아래는 종전 본문 — 지우지 않는다.** ⚠ **`up -d` 만으로는 이 WU 가 증명되지 않는다** — 앱 컨테이너가 실제로 재생성돼야 `_FILE` 을 읽는다. 다음 회차도 `--force-recreate` 를 쓴다. 원 note — 대상 = `RESTART.md §2` 의 `COLAB_STAGING_*_DB_URL_FILE` 5키. 「5키가 없으면 `:?` 로 죽는다. 표는 갱신했지만 다음 재기동이 첫 실전이다」. ⚠ 되돌릴 수 없다 — 착수 전 Ted 확인."
    sources: ["03-HANDOFF §1 T-X", "WORK-UNITS §10.1", "WORK-UNITS §10.3"]

