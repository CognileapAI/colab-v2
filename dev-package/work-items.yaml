  - id: BF-11
    name: "`project.css` 미정의 토큰(`--line`·`--fg-muted`·`--surface`·`--fg`) → `tokens.css` 정본 치환 ＋ backlink 공용화"
    status: open
    stage: stage1
    owner: "frontend (shell · D6 화면)"
    entry_conditions:
      - "없음 — 실측(origin/main `56eac76`) `project.css` 의 `var(--line` 15 · `var(--fg-muted` 14 · `var(--surface` 1 · `var(--surface-2` 6 · `var(--warn` 4 이고 `shell/tokens.css` 에 이 이름은 **0건** — 전부 폴백 리터럴로만 그려진다(`recon-C-layout.md §4`)"
      - "`BF-5` 병합 뒤 — `BF-5` 가 backlink 를 `detail.css` 에서 복제하며 같은 토큰을 더 썼다"
    depends_on: [BF-5]
    completion_def: >-
      ⑴ 실패 시험 red — `project.css` 가 참조하는 `--*` 이름이 **`tokens.css` 또는 그 파일 자신의 `:root`(정본 계열 이름만)에 없으면 실패**(정적 대조) ⑵ 다섯 이름을 `--color-border`·`--color-text-muted` 계열 정본 토큰으로 치환 · 폴백 리터럴 제거
      ⑶ backrow/backlink 규칙을 `detail.css`·`project.css` 두 벌에서 공용 한 벌로 ⑷ 화면 회귀 0(기존 `project.test.tsx`·`detail.test.tsx` green).
      ⛔ **⟨문구 정정 2026-09-05 · 등재 `PLAN-SoT §9 〈327〉`⟩ 종전 ⑴ ~~「`tokens.css` 에 없는 `--*` 이름을 참조하면 실패」~~ 를 그대로 쓰면 `detail.css`·`catalog.css` 가 이미 따르는 집 관례(화면 CSS 의 `:root` 로컬 토큰)가 통째로 위반이 되고 `--text-h2`·`--radius-pill` 같은 화면 전용 값을 셸 정본에 밀어 넣게 된다** — 「셸이 실제로 쓰는 토큰만 옮긴다」는 `tokens.css` 머리말과 정면으로 부딪힌다. 좁힌 오라클의 구멍(폐기 별칭을 로컬에 되살리기)은 판정 둘로 막았다 — 아래 evidence ⓐⓑ.
    evidence: >-
      ⭑ **⟨집행 2026-09-05 · 레인 `bf-11/project-css-tokens` · 기반 `main` `b0c1f34`⟩** 커밋 `d999d60`(치환·공용화·시험) · `41602de`(레인 보고) · `ec0714a`(수용 검토 반영 — 로컬 `:root` 의 폐기 별칭·계열 밖 이름 금지).
      6파일 — `project.css` ＋62/−84 · `shell.css` ＋48 · `detail.css` −12 · `vite.config.ts` ＋13/−1 · 신규 `test/project-css-tokens.test.ts` ＋79 · `test/project.test.tsx` ＋3/−1.
      **재실측**(`b0c1f34` · `BF-5` 병합 뒤) `var(--line` **16** · `var(--fg-muted` **15** · `var(--surface` **3** · `var(--surface-2` **6** · `var(--warn` **4** · `var(--fg` **1** — 원장 진입조건(`56eac76`)보다 넷이 늘었고 `--fg` 는 원장 note 가 예고한 대로 `BF-5` 가 더한 자리다. `tokens.css` 에 이 이름들 **0건**.
      ⭑ **원장에 없던 것 4종** — `--radius-pill`·`--color-gray-100`·`--color-success-50`·`--color-success-600` 은 **폴백조차 없어 선언째 버려지고 있었다**(미정의 총 **13종**). **색이 어긋난 것이 아니라 안 그려졌다.**
      치환 19종(폴백 전부 제거) · `project.css` 머리 `:root` 에 새로 적은 8개는 값을 `detail.css`·`catalog.css` `:root` 에서 **그대로 옮겼다**(색을 새로 만들지 않았다).
      **RED = `4 failed | 1 passed (5)`**(축자 `AssertionError: 정의가 없는 토큰: --text-h2 · --fg-muted · --line · --surface · --fg · --surface-2 · --warn · --ok-line · --ok-bg · --radius-pill · --color-success-50 · --color-success-600 · --color-gray-100` 외 3건) → **GREEN `5 passed (5)`**.
      ⭑ **수용 검토 반영 — 좁힌 오라클의 구멍을 판정부가 막는다.** ⓐ **폐기 별칭 재정의 금지** — `project.css` 로컬 `:root` 가 `--line`·`--fg`·`--fg-muted`·`--surface`·`--surface-2`·`--warn`·`--ok-line`·`--ok-bg` 를 되살리면 red. ⓑ **정본 계열만** — 로컬이 정의한 모든 이름이 `--color-*`·`--text-*`·`--radius-*`·`--space-*`·`--shadow-*`. 추가 RED(주입 사본에 겨눈 일회 실행) 축자 `AssertionError: 되살아난 폐기 별칭: --line: expected [ '--line' ] to deeply equal []` → GREEN `7 passed (7)`.
      ⭑ **붉은 픽스처를 시험 안에 상주시켰다** — `project.css` 를 고치지 않고 **원문 사본**에만 `:root { --line: #e3e6ea; --pj-gap: 4px; }` 를 주입해 두 판정이 각각 잡는지 매 회차 확인한다. **판정부가 fail-closed 임이 주장이 아니라 값으로 재측정된다.**
      게이트(레인 단독) **`frontend-test` green 39파일 / 602건**(수용 검토 전 600 ＋ 추가 시험 2) · **`frontend-typecheck` green 오류 0**.
      `node:fs` 우회 배제 — 입력은 전부 vite `?raw`(`e01-apply-points.test.ts` 머리말 · 2026-09-02 `main` 배포 불가 선례).
      backrow/backlink 는 `detail.css`·`project.css` 두 벌 → **`shell.css` 한 벌**(`.loadfail` 과 같은 자리·같은 이유) · 선택자는 두 화면으로 **한정한다**(맨 `.backlink` 로 열면 제 모양을 따로 가진 `preview.css` 가 끌려온다).
      중간 red 2회는 검사 대상을 줄이지 않고 닫았다 — `project.test.tsx` 가 `BF-5` 때 박은 `var(--surface` 단언은 **재는 사실은 그대로 두고 이름만** `var(--color-surface)` 로 옮겼고, `matchAll` 결과의 `string | undefined` 는 단언 3곳으로 닫았다. **게이트를 손대지 않았다.**
      ⭑ **⟨통합 2026-09-05⟩ 통합 브랜치 `integration/bf-11-8` 의 바닥이다** — `bf-8` 이 이 위에 병합됐다(`dcd0a59` · `vite.config.ts` `test.css.include` 합집합 7항). **`main` 병합은 아직이다.**
      근거 `dev-package/reports/bf-11/lane-report.md`.
    deadline: null
    note: >-
      **신설 2026-09-03 · 등록만** — `PLAN-SoT §9 〈310〉`-㉱. `--fg` 는 지시에 든 이름이고 origin/main 실측은 0건이다 — 레인 C 가 더한 자리가 있으면 병합 뒤 재실측한다. ~~색이 미묘하게 어긋나는 것 외에 막는 것 0건.~~ **⟹ 실측이 이 전제를 넓혔다** — 미정의 13종 중 폴백조차 없던 4종은 **선언째 버려지고 있었다**(안 그려졌다).
      ⭑ **⟨코드 집행 2026-09-05 · 등재 `PLAN-SoT §9 〈327〉`⟩ `status` 는 `open` 무변 · `03-HANDOFF §1` 표기도 ⬜ 무변** — 실질은 「코드 집행 완료 · 통합 브랜치 대기」이고 `CLAUDE.md §0` 기준 완료는 staging 배포 green 이다. 선례 = `BF-12`(`〈325〉`).
      ⚠ **`[미확인]` — 치환으로 색이 바뀐 자리 5종의 실브라우저 눈 확인.** `--surface-2 #f4f5f7 → #f4f7fb` · `--surface-2 #eceef2 → #e8ecf2` · `--warn #b45309 → #a85400` · `--ok-bg #f2fbf5 → #efffef` · `--fg-muted #667 → #565c63`. **이것이 이 항목의 목적**이다(폴백이 정본과 어긋나 있었다). 해소 = staging 배포 뒤 계산 스타일 실측(`BF-5` 가 한 방식).
      ⚠ **`[미확인]` — `--color-success-100: #cde9d6` 은 집 토큰에 없는 새 이름이다.** 종전 폴백 값에 이름만 붙였다(색을 새로 만들지 않았다). 해소 = 목업 `프로젝트_260817.html`/`제품_260817.html` 의 `:root` 에서 이 값의 이름을 찾아 그 이름으로 바꾼다.
      ⚠ **`[미확인]` — `preview.css` 의 backrow/backlink 는 합치지 않았다.** 원장이 말한 것은 두 벌이고 미리보기 사본은 치수·색·hover 가 다른 **별개 디자인**이라 합치면 이 항목이 재지도 않은 화면이 바뀐다. 해소 = S-08 정본에서 되돌아가기 줄이 상세와 같은 모양이어야 하는지 확인.
    sources: ["PLAN-SoT §9 〈310〉", "PLAN-SoT §9 〈327〉", "reports/bug-20260903/recon-C-layout.md", "reports/bug-20260903/lane-C-report.md", "reports/bf-11/lane-report.md"]

  - id: BF-12
    name: "지도 타일 회수 루프 「관측 전용의 관측이 안 된다」 — 앱 로그 설정 부재로 INFO 요약이 버려진다"
    status: open
    stage: stage2
    owner: "D7 / viz-render"
    entry_conditions:
      - "없음 — 실측이 이미 섰다(staging 기동 13:22 → 확인 15:00 · 경과 98분 · 주기 3600초인데 `docker logs colab_v2_staging_viz_render` 에 `reclaim`·`liveness`·`회수` 0건)"
    depends_on: []
    completion_def: >-
      ⑴ **앱 로거가 INFO 를 stdout 으로 낸다**(uvicorn 포맷과 동일 계열 — 두 갈래로 갈리지 않게)
      ⑵ **실패 픽스처** — 로깅 미설정 상태에서 회수 요약이 안 잡히는 시험이 **RED** → 설정 후 **GREEN**
      ⑶ **staging 배포 뒤 첫 바퀴 요약 1줄 실물**
      ⑷ **비밀값 미출력 확인**
    evidence: >-
      ⭑ **⟨집행 2026-09-05 · 워크트리 `agent-ac6173ae`(기준 `main` `59b1c13`) · 등재 초안 `notes/BF12-LEDGER-PENDING.md`⟩ 완료 정의 ⑴⑵⑷ 충족 · ⑶ 미충족 ⟹ **닫지 않는다.** ⑴ **`colab_viz` 로거 하나에** stdout 처리기를 단다 — 신규 `kernel/logging_setup.configure_logging()` 을 `app/main.create_app()` 첫 줄이 부른다. 포맷은 **uvicorn 동일 계열**(`INFO:     …`) · `propagate=False` · 표식 하나로 **멱등**(시험이 앱을 수백 번 세운다). ⛔ **`basicConfig` 로 루트를 갈아엎지 않았다** — 그러면 uvicorn·써드파티 줄까지 우리 포맷이 되고 그것이 두 갈래로 갈리는 길이다. ⑵ **RED 선실측 4건 → GREEN 4건**(`tests/test_app_logging.py`). 축자 RED = `AssertionError: assert '관측 한 줄' in ''` 외 3건 · `4 failed in 3.96s` → `4 passed in 0.30s`. ⭑ **`caplog` 를 쓰지 않았다** — pytest 가 자기 처리기를 루트에 달아 두므로 caplog 로 재면 「설정 없어도 잡힌다」가 되고 **그것이 이 결함이 시험을 통과했던 이유**다. 루트를 미설정으로 되돌린 뒤 진짜 stdout 을 잡는다. ⭑ **형제 자리를 같이 잠갔다**(`〈324〉`-㉰) — 회수 요약과 「트리거 집행 N건」이 **둘 다** 난다는 것을 한 시험이 함께 단언한다. ⑷ **비밀 미출력** — 서비스 토큰·타일 서명 비밀 두 값이 로그에 없음을 단언한다. ⚠ 잰 것은 **회수 요약·기동 경로**이고 「어떤 줄에도 영영 안 실린다」는 `[미확인]`. ⛔ **⑶ staging 배포 뒤 첫 바퀴 요약 1줄 실물은 못 쟀다** — 이 회차 staging 접촉 0 · 배포 0. 해소 조건 = **다음 배포 창**에서 `docker logs colab_v2_staging_viz_render` 에 `지도 타일 회수 — …` 1줄. ⚠ **환경변수를 새로 만들지 않았다** — 수준 INFO 고정. `Settings` 에 수준 자리가 없었고, 내면 `infra/` 에 줄을 더해야 하는데 그 줄이 빠지면 「홈 env 에 무엇을 적어도 영영 꺼짐」이 된다(`#20`·`#49` 무늬) `[미확인]`. ⭑ **레포에 선례가 0건이다** — `services/` 전수에 `basicConfig`·`dictConfig`·`setLevel` 0건이라 core-api 에도 따라 쓸 무늬가 없었다. 다른 배포 단위의 같은 결손 여부는 이 회차가 재지 않았다 `[미확인]`. **게이트 실측 1회** — 선언 50 · **green 34 · red(판정) 1 · red(준비) 15**. `service-tests-viz-render` **green**(수집 330 · 실행 330 · skipped 0 · deselected 40 · failed 0 — 종전 326 ＋ 이번 4) · `service-tests-selftest` green. red(판정) 1 = `generated-up-to-date` 이고 **이 변경 때문이 아니다** — 축자 `frontend/node_modules/.bin/openapi-typescript: No such file or directory`(체크아웃에 의존 트리 부재) · 생성물 수정 0줄. **계약 개정 0 · 마이그레이션 0 · infra 0 · Dockerfile 0 · staging 접촉 0 · 배포 0.** ⭑ **⟨등재 2026-09-05 · `PLAN-SoT §9 〈325〉`⟩ 위 집행이 원장에 등재됐고 코드는 `main` 에 병합됐다**(`14db1a8` · 병합 트리 `ed8ceb3`). **게이트는 병합 트리 기준으로 다시 쟀다 — 두 실행에 걸쳐 선언 50 · green 50 · red(판정) 0 · red(준비) 0** (첫 실행 `all -j 1` = green 43 · red(판정) 1 · red(준비) 6 · 그 판정 red 1 은 `planning-freshness` 이고 원인은 기획 정본 폴더 이동이라 `370ed99` 로 닫혔다(`〈326〉`) · red(준비) 6 은 셸 입력 미선언이라 `source ~/.colab-v2-test.env` 뒤 재실행 10 종 전건 green). ⚠ **「한 번에 50 green」이 아니다.** ⛔ **`status` 는 `open` 무변** — 완료 정의 ⑶(staging 배포 뒤 첫 바퀴 요약 1줄 실물)이 여전히 미충족이고, 그 자리는 **다음 배포 창(창 6)** 이다(`03-HANDOFF §4.5`).
    deadline: null
    note: >-
      **신설 2026-09-05 · 등재 `PLAN-SoT §9 〈324〉` · 근거 `sessions/V-1-STAGING-20260905.md` ㉶.**
      **원인** = `services/viz-render/src` 전수에 `basicConfig`·`dictConfig`·`setLevel` **0건** ⟹ 루트 로거에 처리기가 없고 `lastResort` 가 WARNING 이상만 흘려
      `trigger_loop.py` 의 `log.info(result.summary())` 가 uvicorn 기본 로깅에서 버려진다.
      ⭑ **형제 자리** — 트리거 루프의 **「트리거 집행 N건」 info 줄**도 같은 운명이다. **회수 요약 하나만 고치면 절반만 고친 것이다.**
      ⛔ **루프 미기동이 아니다**(약한 후보) — `compose.i2.yml:335` 가 `COLAB_VIZ_TRIGGER_SPOOL` 을 주고 있어 `main.py` 기동 조건이 선다.
      ⭑ **`stage1` 이 아닌 근거** — `BF-` 전건이 `stage1` 인 것은 회귀한 원본 항목이 stage 1 이라서이고(`〈310〉`), 이 결함이 사는 자리는 `TL-1`(stage2)의 관측 경로다.
      **막는 것** = `TL-1` 첫 한 바퀴 계수(`03-HANDOFF §4.5` ㉢) · `TL-2` ⑴⑸. **`TL-1` 은 다시 열지 않는다** — 기구의 결손이 아니라 로그의 결손이다.
      ⚠ 등급별 계수는 여전히 **「못 봤다」**이고 **0 으로 적지 않는다** · 삭제는 자리 기준 **0건**.
    sources: ["PLAN-SoT §9 〈324〉", "sessions/V-1-STAGING-20260905.md", "PLAN-SoT §9 〈316〉", "PLAN-SoT §9 〈323〉", "PLAN-SoT §9 〈325〉", "notes/BF12-LEDGER-PENDING.md"]

