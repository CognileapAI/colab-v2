    evidence: "⭑ **실측 (2026-08-29 · `sessions/STAGE2-READINESS-AUDIT.md §1`) — 걷어낼 키워드 입력이 실물에 없다.** `frontend/src/components/catalog/**` 의 `<input>` **0건**(`AppliedConditions.tsx`·`CatalogTable.tsx`·`ColumnMenu.tsx` 전건 0) · `useCatalog.ts:29` 질의 모델은 `{ sort, filters }` 뿐이라 `keyword` 필드 **없음** · 검색 진입점은 이미 `SearchHero` **하나**. 즉 완료 정의 ⓑⓒ 는 실물이 이미 만족한다. **잔여 = 문구 정합 1건** — `DatasetsPage.tsx:60` 은 「찾을 것이 정해져 있으면 홈의 AI 검색이 빨라요」, `SearchHero.tsx:34-37` 은 「이 검색은 데이터에 적혀 있는 낱말 그대로 찾아요」로 **정반대를 말한다**. 어느 쪽이 맞는지는 `T-1` 한국어 형태소 검색 재작성이 무엇을 바꾸느냐가 정한다 → **`T-1` 종속**. ⚠ **진입조건에 적힌 `F-1` 과의 `frontend/**` 파일 면 겹침은 실재하지 않는다 — 겹치는 파일 0건(실측).**⭑ **재실측 (2026-08-31 · 워크트리 `lane-fe-copy` · 읽기만)** — ⓑⓒ 의 실물 조건은 그대로 참이다: `frontend/src/components/catalog/**` 의 `<input>` **0건**(`AppliedConditions`·`CatalogTable`·`ColumnMenu` 각 0) · 검색 진입은 `LabPage.tsx:11` 의 `SearchHero` 하나. **문구 불일치도 실재한다** — `DatasetsPage.tsx:60` 축자 「찾을 것이 정해져 있으면 **홈의 AI 검색**이 빨라요」 ↔ `SearchHero.tsx:37-38` 축자 「이 검색은 데이터에 **적혀 있는 낱말 그대로** 찾아요」. ⛔ **그러나 고치지 않았다 — 정본이 대체 문구를 말하지 않는다.** 정본 `Policy_데이터_찾기.md:155` 은 상호 안내를 「점선 박스로 **반대 길**을 권한다」로만 적고, 그 반대 길(검색 화면 S-01·S-06)은 3회차 판정으로 **stage 3** 이라 이번 릴리즈에 없다. 겸하여 정본 `:40` 이 검색을 「AI ｜ 쓴다」로 적으므로 「AI」 두 글자만 지우는 것도 정본 축자에 어긋난다. **지우는 근거도 바꾸는 근거도 0건** ⟹ `[미확인]` 유지 · **`F-2` 는 닫지 않는다**(부분 완료 금지 · `CLAUDE.md §5`).⭑ **집행 (2026-08-31 · 워크트리 `lane-catalog` · Ted 판정 `PLAN-SoT §9 〈245〉`) — 정본에 근거를 새로 적고 그 위에서 문구를 고쳤다.** **㉮ 정본 개정** = `Policy_데이터_찾기` **v1.8 → v1.9**(`updated: 2026-08-31`) · 두 자리 — ⑴ `§8` 화면 동작에 「**상호 안내 — 반대 길이 그 릴리스에 없을 때**」 행 ⑵ 같은 절에 같은 이름의 블록(근거 ＋ **완료 기준 여섯**). `§12` 변경 이력에 1.9 행. **종전 문면 무삭제** — `§8` `상호 안내` 행(「점선 박스로 반대 길을 권한다」)·`§1.3-8`(「두 길은 서로를 가리킨다」)·`§1.2` 「AI ｜ 쓴다」는 **한 글자도 지우지 않았고 두 길이 다 있는 릴리스의 규칙으로 그대로 유효하다**(`〈232〉` 가 확대에 쓴 방식 그대로). **㉯ 충돌을 뭉개지 않고 개정으로 풀었다** — 정본이 요구하는 것은 「**점선 박스로** 반대 길을 권한다」이고 「AI ｜ 쓴다」는 **자연어 검색이 무엇인가**의 서술이다. 개정 문면은 **박스의 자리와 형태를 그대로 두고 가리키는 대상만 바꾼다** — 걷어내지 않으므로 `:155` 와 충돌하지 않고, 없는 것의 성질을 광고하지 않으므로 `:40` 과도 충돌하지 않는다. **㉰ 화면 문구(축자)** — 종전 `DatasetsPage.tsx:60` ~~「찾을 것이 정해져 있으면 **홈의 AI 검색**이 빨라요.」 ＋ `:62` `<Link to=\"/lab\">검색으로</Link>`~~ → 현행 「**찾을 것이 정해져 있으면 표 헤더의 열 이름을 눌러 조건을 걸어 보세요.**」 ＋ **링크 0건**. 문구는 화면이 짓지 않고 정본 v1.9 가 고정한 한 줄을 그대로 옮긴 것이다. **㉱ 시험** — `frontend/test/catalog.test.tsx` 에 「§8 상호 안내 — 반대 길이 그 릴리스에 없을 때 (정본 v1.9)」 **2건 신설**(⑴ 점선 박스가 남고 정본 축자 문구를 안내한다 ⑵ 없는 화면으로 보내지 않는다 — 박스 안 `a` 0건 · 「AI」 0건 · `a[href=\"/lab\"]` 0건). **구현 전 red 2건 확인 → 구현 후 green.** 프런트엔드 **385 → 387 pass** · `tsc --noEmit` **0**. **㉲ 완료 기준 여섯 대조** — ⑴ 점선 박스 존치(`.crosslink` 유지 · 시험) ⑵ 없는 화면 링크 0건(시험) ⑶ 표 헤더 조건을 권한다(축자) ⑷ 「AI 검색」이라 부르지 않는다(시험) ⑸ 카탈로그에 자연어 입력칸 0건(기존 시험 「AI 표시·자연어 입력칸이 없다」 green ＋ `components/catalog/**` `<input>` 0건) ⑹ 검색 화면이 들어오는 회차의 되돌림 = **`P4` 에 딸린 후행 의무**로 아래 `note` 에 적었다. `planning-freshness` **green**(E-02 `md-policy` **VER 1.9** · SHA8 `cd1dfc2c` · 패키지 임베드는 검사기 자신의 `normalize()` 로 재동기 · 검사기·검사 범위 무수정). 정본은 버전 관리 밖이라 편집 전 사본을 떴다(`<작업공간>/40 COLAB-기획/_backup_260831_CROSSLINK/` · md 1 · 패키지 html 1)."
    deadline: null
    note: "⭑ **⟨닫음 2026-08-31 · Ted 판정 `PLAN-SoT §9 〈245〉`⟩ `status` `open` → `done`. 아래 회차 본문은 한 줄도 지우지 않는다.** **닫은 근거 = 이번 릴리스에 남아 있던 조건이 둘이고 둘 다 실물로 참이 됐다.** ⓑ(카탈로그에서 키워드 입력을 걷어내고 필터로만 거른다) = `components/catalog/**` 의 `<input>` **0건** · 조회 모델 `types.ts:21` `{ sort, filters }` 에 낱말 필드 없음 — **정본 `:45`·`:53`·`:115` 가 검색 화면 없이도 그대로 세우는 조항이다**(3회차 판정). ＋ **문구 정합** = 위 `evidence` ㉮~㉲ 로 **정본 근거가 새로 서고**(v1.9 완료 기준 여섯) **여섯을 전건 충족**했다. ⚠ **부분 완료로 닫은 것이 아니다 — 남은 하나는 판정으로 이 항목에서 빠져나간 조건이다.** ⓒ(검색 진입점은 AI 검색 하나)는 **3회차 Ted 판정으로 검색 화면을 따라 stage 3 으로 갔고**(주어가 검색 화면이다), 그 화면의 항목은 `P4`(`stage: after_stage2`)다. **집 없이 남기지 않는다 — ⓒ 의 판정 자리는 `P4` 다.** ／ ⭑ **후행 의무 1건을 여기 못 박는다(`〈245〉` 완료 기준 ⑹)** — **검색 화면이 릴리스에 들어오는 회차(`P4`)에 정본 v1.9 의 「상호 안내 — 반대 길이 그 릴리스에 없을 때」 절을 걷고 `§8` `상호 안내` 본문면으로 되돌린다.** 되돌림은 `P4` 의 완료 정의에 든다 — **이 항목이 닫혀도 그 의무는 남는다.** ／ ⭑ **⟨미결 종결 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ 완료 정의 ⓑ 와 ⓒ 의 거취가 갈렸다 — 어느 것도 지우지 않는다.** **ⓑ(카탈로그 화면에서 키워드 입력을 걷어내고 필터로만 거른다) = stage 2 존치.** 근거가 검색 화면이 아니라 **정본 자신**이다 — `Policy_데이터_찾기.md:45` 「**카탈로그에 자연어 입력을** … 두지 않는다」 · `:53` 「카탈로그의 조건과 정렬은 **전부 표 헤더에 있다**. 조건 툴바도 좌측 패싯 사이드바도 두지 않는다」 · `:115` 「조건을 걸 수 있는 열은 주제 · Level · 업로더 · 계보 · Verified 다섯」. **검색 화면이 이번 릴리즈에 없어도 ⓑ 는 그대로 선다.** 실측상 이미 충족(아래 `evidence`). **ⓒ(검색 진입점은 AI 검색 하나) = 검색 화면을 따라 stage 3 으로 간다.** 그 문장의 주어가 검색 화면이고 오늘 판정이 그 화면을 통째로 옮겼다. **`〈182〉` 원문은 고치지 않는다.** ⛔ **그러면서 정지 1건이 새로 선다** — 실측 잔여였던 **문구 정합 1건**이 오늘 판정으로 **틀린 문구가 됐다**: `DatasetsPage.tsx:60` 축자 「찾을 것이 정해져 있으면 **홈의 AI 검색**이 빨라요」가 **이번 릴리즈에 없는 화면으로 사용자를 보낸다.** **그 자리에 무엇을 적을지는 정본이 말하지 않는다** — 정본은 검색 화면이 있는 세계만 기술한다(`:52` 「두 길은 서로를 가리킨다」 · `:154`·`:155` 상호 안내). **지어내지 않고 멈춘다 — 문구 확정은 Ted 자리다.** `[미확인]` — 푸는 법 = 「검색 화면 없는 릴리즈에서 카탈로그 하단 상호 안내와 0건 안내를 무엇으로 대체하는가」 한 줄 판정. ／ **아래는 1회차 본문 — 지우지 않는다.** ⭑ **⟨미결 종결 2026-08-30 (1회차) · Ted 판정⟩ 「AI 는 전부 다음 단계」 판정이 이 항목을 건드리지 않는다 — `stage2` 확정.** 사유 = **자연어 기능이 아니다.** 실측 잔여가 **문구 정합 1건**뿐이고(2026-08-29 · 위 `evidence`), 걷어낼 키워드 입력은 실물에 이미 없다. ／ ⚠ **다만 그 문구 하나가 오늘 판정으로 방향이 갈렸다** — 완료 정의 ⓒ 축자 「**검색 진입점은 AI 검색 하나**」(`〈182〉`)인데 **AI 검색이 stage 3 으로 갔다.** 그러면 stage 2 의 검색 진입점이 무엇을 말해야 하는지가 `[미확인]` 이다. `SearchHero.tsx:34-37` 축자 「이 검색은 데이터에 적혀 있는 낱말 그대로 찾아요」가 **오늘 판정과 방향이 같다**(낱말 그대로 = 조건·키워드). **그러나 `〈182〉` 원문을 고치지 않는다 — 문구 확정은 Ted 자리다.** 판정 대기 1건으로 올린다. ／ `〈182〉` 가 남긴 **실제 작업 1건.** 항목만 세웠고 **코드는 건드리지 않았다**(`frontend/**` 는 `F-1` 소유). 의미 기반 AI 검색·온톨로지 어휘 확장은 이 항목이 아니라 **다음 회차**다(`〈182〉` ⓓ). `03-HANDOFF §1` 에는 행이 없다. ⭑ **⟨2026-08-29 실측⟩ 그 「실제 작업 1건」은 화면 코드가 아니라 문구 하나이고, `T-1` 판정 뒤에 열린다** — 위 `evidence` 참조. 상태값은 이 회차에서 고치지 않는다(동결 해제 프로토콜 소관)."
