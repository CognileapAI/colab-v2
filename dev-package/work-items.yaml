    evidence: >-
      커밋 `61ef95b`(버그 1·9 · `project.css` +70 · `vite.config.ts` · `test/project.test.tsx` +2) ＋ `d3bf37e`(버그 2 · `shell.css` +1 · `test/shell.test.tsx` +1) · 기반 `56eac76`.
