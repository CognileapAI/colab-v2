    completion_def: "⭑ ⟨개정 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ **검색 화면은 자연어와 AI 를 지닌 채 통째로 stage 3 으로 간다 — 정본을 고치지 않고 정본대로 따른다.** 근거 축자 = `Policy_데이터_찾기.md:45` 「두 길의 역할을 넘나들지 않는다. 카탈로그에 자연어 입력을, **검색에 조건 패널을 두지 않는다**」 · `:38` 「입력 ｜ 검색: **말하듯 한 문장** ／ 카탈로그: **표 헤더의 조건과 정렬**」 · `:40` 「AI ｜ 검색: **쓴다**(코랄 표시) ／ 카탈로그: **안 쓴다**」. ⭑ **2회차가 이 항목에서 뺐던 자연어 세 조항이 되돌아온다** — 결과 카드의 `AI 근거`(정본 `:120` 「파일명 · 포맷 · Lv · Verified · 관련도 막대 · 요약 · **AI 근거** · 기간 · 원천 · 소유」 · `:148` 「좌측 코랄 선과 코랄 라벨의 \"왜 이 결과?\" 한 줄」) · 검색 질문(정본 `:122` 「**1~200자. 자연어**」) · 평가셋 A층 대비 화면 층 대조. **아래 ⑴~⑹ 은 한 조항도 버리지 않고 이 항목에 그대로 남아 함께 stage 3 으로 간다.** ⭑ **`〈217〉` 검색 품질 합격선의 자연어 몫도 이 항목으로 되돌아온다** — 2회차가 `K4` 로 보낸 몫이며, 「미판정 0건 ＋ 판정 후 전건 통과 ＋ 판정마다 사유 기록」이라는 **형식은 그대로이고 모수가 다시 합쳐진다.** `〈217〉`-㉲ 원문 무삭제. ⛔ **2회차의 정지 1건(「검색 화면에 조건 패널을 세우는가」)은 오늘 판정으로 무의미해졌다** — 검색 화면이 이번 릴리즈에 없으므로 정본 `:45` 와 부딪칠 자리 자체가 사라진다. **정본은 개정되지 않았고 개정할 필요도 없어졌다.** ／ **아래는 2회차 본문 — 지우지 않는다.** ⟨개정 2026-08-30 (2회차) · Ted 판정 — 검색 화면을 자연어 검색이 아니라 조건 검색 위에 세운다⟩ **완료 정의를 정본이 검색 화면에 실제로 적은 것만으로 다시 쓴다. 오라클은 평가셋 A층이 아니라 `Policy_데이터_찾기.md`(260818 정본) 축자다.** **⑴ 기본 정렬 = Verified 우선 + 관련도** — 정본 `:117` 축자 「기본 정렬 ｜ 카탈로그: 수정일 최신순 · 검색: **Verified 우선 + 관련도**」. 판정 = 검색 결과가 Verified 를 앞세우고 그 안에서 관련도 순인지를 화면에서 건별로 확인한다. ⚠ **실행 경로에 `verified` 가 0건이고 순서는 `ts_rank_cd` 단독이다**(`〈224〉`-㉯ 실측) — `ts_rank_cd` 는 낱말 그대로의 순위라 자연어가 아니다. ⚠ **「우선 정렬」의 소유가 승인 처리(`P6`)인데 `P6` 이 `P4` 를 선행으로 건다** — 투입 시점 = 판정 대기(`〈224〉`-㉶). **⑵ Verified만 보기 토글** — 정본 `:150` 축자 「켜면 승인 결과만, 건수 갱신. **검색 전용이다.**」. 조건성 동작이고 자연어와 무관하다. **⑶ 관련도 표시 = 막대만** — 정본 `:121` 축자 「막대만. 수치·등급 텍스트를 붙이지 않는다」. **⑷ 잠긴 결과 카드** — 정본 `:151` 축자(자물쇠 ＋ `접근 권한 없음` 칩 ＋ 카드 안 접근 요청 버튼 · 기간·원천·소유 메타 줄을 두지 않는다). ⚠ 셋이 실물과 어긋난다(`〈224〉`-㉳) — 갈래가 잠금 표시·접근 요청이라 승인 처리 소유로 읽힌다. **⑸ 조건 결과 0건 문구** — 정본 `:170` 축자 「조건에 맞는 데이터가 없어요. 조건을 하나 풀어 보세요.」 ＋ 전체 해제. **⑹ 「각 P 의 완료 판정」 4항**(`WORK-UNITS §7`) 은 그대로 남는다. ⛔ **「검색 화면에 표·필터·정렬을 세운다」는 쓰지 않았다 — 정본이 그것을 금한다.** 축자 `:45` 「두 길의 역할을 넘나들지 않는다. 카탈로그에 자연어 입력을, **검색에 조건 패널을 두지 않는다**」 · `:38` 「입력 ｜ 검색: 말하듯 한 문장 ／ 카탈로그: 표 헤더의 조건과 정렬」 · `:40` 「AI ｜ 검색: 쓴다(코랄 표시) ／ 카탈로그: 안 쓴다」. **표·필터·정렬은 정본에서 카탈로그 화면(S-03)의 것이고 검색 화면(S-01·S-06)의 것이 아니다. 지어내지 않고 멈춘다 — 판정 대기.** ⚠ **자연어 쪽은 이 항목에서 뺐다** — 결과 카드의 `AI 근거`(정본 `:120`) · 검색 질문 「1~200자. 자연어」(정본 `:122`) · 평가셋 A층 대비 화면 층 대조. **셋은 `K4` 를 따라 stage 3 으로 간다.** ／ 이전 ~~⟨개정 2026-08-29 · `〈208〉`⟩ 「각 P 의 완료 판정」 4항 ＋ 검색 화면(S-01·S-06)이 내는 결과를 검색 평가셋 A층 실행 결과와 대조해 화면 층에서의 통과·실패를 건별로 판정한다. 미판정 0건이어야 닫는다. 오라클 실물 = `eval/s2b-alayer/evalset.json`(18건) · 실행기 `run.py` · 기준선 `baseline.json`. 재측정 귀속이 `T-1` 에서 이 항목으로 옮겨 왔다~~ — **원문을 지우지 않는다. 이 문언은 폐기가 아니라 stage 3 에서 `K4` 가 그대로 진다.**"
    evidence: "⭑ ⟨진척 기재 2026-09-03 · `PLAN-SoT §9 〈295〉` · **닫지 않는다**⟩ 완료 정의 넷 중 **⑵ `Verified만 보기` 토글 · 결과 헤드(건수 ＋ 정렬 기준 한 줄) · 결과 카드의 `Verified` 표시**가 화면에 섰다 — `frontend/src/routes/SearchResultsPage.tsx`(결과 헤드 `search-result-head` ＋ 토글 `verified-only`) · `components/search/SearchHitCard.tsx`(배지 `hit-verified` ＋ 좌측 초록 룰 ＋ 「교수 승인이라 위로 올렸어요」) · 새 시험 `frontend/test/search-verified-20260903.test.tsx` **9건**(red 7 먼저 실측 후 구현). `frontend-test` **green 471건 / 실패 0** · `frontend-typecheck` **green 0건**. ⛔ **닫지 않는 이유 셋** ⑴ 완료 정의 **⑴ 기본 정렬(Verified 우선 + 관련도)이 미착지** — `verified` 가 D2 값이라 `routes/catalog.py` 조립 루프에서만 걸리고 그 파일은 이 회차의 소유가 아니었다(`〈295〉`-㉯). ⑵ 카드 구성 중 **`요약`·`기간` 은 계약에 칸이 없다** — `SearchResultRow`(=`DatasetRow` ＋ 둘)에 `summary`·`period` 부재, **계약 개정 사안**(`〈295〉`-㉰). ⑶ 토글의 **서버 걸름 부재** — `SearchQuery` 에 `verified` 칸이 없고 라우트가 계약 밖 필드를 400 으로 막는다. 화면 걸름은 한 쪽(`limit` 20) 안에서만 돈다(`〈295〉`-㉱). ⚠ 이 항목은 **stage 3**(Ted 2026-08-30 「통째로 stage 3」)이라 애초에 이번 단에서 닫을 자리가 아니다. ⭑ ⟨진척 기재 2026-09-03 · `PLAN-SoT §9 〈298〉`(16차 동결 해제) · 워크트리 `lane-s16` · **닫지 않는다**⟩ **바로 위가 적은 「닫지 않는 이유 셋」이 전건 해소됐다 — 종전 문장을 지우지 않고 여기 적는다.** ⑴ 완료 정의 **⑴ 기본 정렬(Verified 우선 + 관련도)** = `services/core-api/src/colab_core/app/routes/catalog.py` 의 조립 루프 뒤 `items.sort(key=lambda r: not r[\"verified\"])` 한 줄로 섰다(`〈295〉`-㉯ 가 특정한 그 자리 그대로). **안정 정렬이라 무리 안의 순서는 관련도 그대로**이고, 그 성질 자체를 `services/core-api/tests/test_search_verified_16.py::test_relevance_order_survives_inside_each_group` 가 오라클로 든다. ⑵ 카드 구성의 **`요약`·`기간`** = 16차 해제로 `SearchResultRow` **두 번째 객체**에 `summary`·`period` 두 칸이 섰고(`DatasetRow` 무변 — 카탈로그 required 13칸 그대로), 화면이 `components/search/SearchHitCard.tsx` 의 `hit-summary`·`hit-period` 로 `Policy :120` 순서대로 그린다. **기간 문면은 `detail/format.ts#formatPeriod` 재사용**이라 `〈283〉` 의 「끝이 없으면 무기한」이 상세와 갈리지 않는다. ⚠ **잠긴 카드에는 기간을 두지 않는다**(`Policy :151`). ⑶ 토글의 **서버 걸름** = `SearchQuery.verified` 가 섰고 걸름이 **`limit` 앞**으로 갔다 — 건수·이어보기 토큰도 걸른 뒤 기준이다. 화면 걸름은 걷었다(`SearchResultsPage` 가 받은 것을 다시 거르지 않는다). **⟹ 완료 정의 ⑴·⑵ 와 카드 구성의 두 칸까지, 이 항목의 stage 2 에서 볼 수 있는 몫은 이 회차로 완결이다.** ⛔ **그래도 `open` 그대로다** — 이 항목은 **stage 3** 이고, 남은 것은 자연어 몫(평가셋 A층 대비 화면 층 대조 · `K4`)과 「각 P 의 완료 판정」 4항의 **staging 배포 green** 이다. **부분 충족으로 항목을 닫지 않는다.** 시험 = 새 파일 둘 `test_search_verified_16.py` **12건**(red 8 먼저 실측) · `frontend/test/search-contract-16.test.tsx` **10건**(red 8 먼저 실측). 실측 계수와 게이트는 `PLAN-SoT §9 〈298〉`-㉳ 에 있다 — 값은 한 곳에만 적는다."
    deadline: null
    note: "⭑ **⟨단계 이동 2026-08-30 (3회차) · Ted 판정(오늘 · 최신)⟩ `stage2` → `after_stage2`(＝ Ted 가 이름 붙인 **stage 3**).** **종전 값 ~~stage2~~ 를 지우지 않고 여기 남긴다.** 판정 = **「검색 화면은 자연어와 AI 를 지닌 채 통째로 stage 3 으로 간다」·「카탈로그 화면이 이번 릴리즈의 데이터 찾는 길이다」.** ⭑ **정본은 개정되지 않았다 — 이 판정이 정본 문언(`Policy_데이터_찾기.md:38`·`:40`·`:45`)을 그대로 따른다.** 딸린 이유 = **AI 없이도 제품이 완결이라는 성질을 지킨다.** ／ ⚠ **`after_stage2` 를 쓴 이유는 1회차와 같다** — 검사기 허용값 5종에 `stage3` 이 없고(`gates/tools/work_item_consistency.py:87`) **검사기를 고치지 않는다.** ／ ⭑ **이 항목을 선행으로 걸던 둘의 재지정** — ⑴ **승인 처리(`P6` · stage 2)** = `depends_on` 에서 이 항목을 빼고 **카탈로그 화면(`P1` · ✅ done)** 에 붙는다. 근거 축자 = 정본 `:177` 「적용 지점 표의 \"검색 결과 카드\"·\"검색 잠긴 카드\"·\"**카탈로그 행**\" 인용」 — 셋 중 **카탈로그 행 하나만 이번 릴리즈에 남는다**(`:130` 「카탈로그 행은 자물쇠 + `잠김` 칩」 · `:152`). 나머지 둘은 이 항목을 따라 stage 3 으로 간다. ⑵ **목업·화면 최신성(`G1b`)** = **이미 `after_stage2` 라 같은 단이므로 간선을 그대로 둔다** — 끊을 이유가 없다. ／ ⚠ **`T-1`(형태소 검색 설정) 종속은 끊지 않았다.** 다만 실측 = **`T-1` 의 종속자는 `P4`·`K4` 둘뿐이고 오늘로 둘 다 stage 3 이다** — 2회차가 `T-1` 을 stage 2 에 둔 근거(「조건 검색의 바닥」)는 조건 검색이 카탈로그의 것이고 **카탈로그에는 키워드 입력이 없다**(정본 `:45`·`:53` · `F-2` 실측)는 점에서 성립하지 않는다. **그래도 `T-1` 을 옮기지 않는다 — 덜 빼는 쪽으로 남기고 보고한다.** ／ **아래는 2회차 본문 — 지우지 않는다.** ⭑ **⟨선행 간선 절단 2026-08-30 (2회차) · Ted 판정⟩ `depends_on` 과 진입조건에서 `K4`(자연어 검색 서비스)를 뺐다.** 근거 = 오늘 판정 **「검색 화면을 자연어 검색이 아니라 조건 검색 위에 세운다」**, 그 바탕은 260826 결정 `§2-5` 축자 「이번 릴리즈: **표·필터·정렬 기반 조건 검색만**. **자연어 검색은 넣지 않는다**」 — **조건 검색은 이번 릴리즈에 남았고 자연어 검색만 미뤄졌다.** ⭑ **끊지 않으면 `P4` 가 stage 3 항목을 선행으로 걸고, 그 뒤 승인 처리(`P6`) → 연구실 대시보드(`P7`) → E-01 적용 지점 표(`P8`) 사슬 전체가 stage 3 뒤로 밀려 stage 2 가 닫히지 않는다.** ／ ⚠ **종전 선행을 지우지 않는다 — 개정으로 남긴다.** 이전 `entry_conditions` = ~~P1 · G2 · K4~~ · 이전 `depends_on` = ~~[P1, G2, K4, T-1]~~. 그 간선의 사유(화면 품질 오라클이 자연어 평가셋이었다 — `〈208〉`)는 **틀렸던 것이 아니라 stage 3 으로 옮겨 간 것**이다. `T-1` 종속은 남긴다(형태소 검색 설정이지 자연어가 아니다). ／ ⭑ **⟨합격선 재배치 2026-08-30⟩ `〈217〉` 이 `K4`·`P4` 둘에 걸어 둔 검색 품질 합격선을 두 단으로 갈랐다.** **조건 검색 몫 = 이 항목(stage 2)** — 「미판정 0건 ＋ 판정 후 전건 통과 ＋ 판정마다 사유 기록」의 **형식은 그대로 물려받고, 재는 대상만 평가셋 A층 18건에서 위 `completion_def` ⑴~⑸ 의 정본 축자 5항으로 바뀐다.** **자연어 몫 = `K4`(stage 3)** — 평가셋 A층 대비 화면 층 대조 · `AI 근거` · 자연어 질문. **어느 쪽도 버리지 않았다.** ⚠ **`〈217〉`-㉲ 원문(「화면 층(`P4`)의 조항은 이미 「미판정 0건」으로 서 있어 문언을 고치지 않았다」)은 지우지 않는다 — 그 조항은 살아 있고 모수만 바뀌었다.** ／ ⚠ **`Verified` 를 두 정본이 갈라 적는다 — 어느 쪽도 고르지 않았다.** `Co-Lab_ver2_업로드_계보_260825_이태헌.html`(2026-08-25) = `Verified` **0건**(실측) · `Policy_데이터_찾기.md`(2026-08-18 정본) = **8곳**, 그중 `:115` 가 조건을 걸 수 있는 다섯 열에 넣었다. ⭑ **이 갈림에 이가 있다 — 위 `completion_def` ⑴⑵ 가 `Verified` 열에 값이 있어야 성립한다.** 값을 채우는 것은 승인 처리다. **판정 대기.** ／ ⭑ **⟨개정 2026-08-29 · `PLAN-SoT §9 〈208〉`⟩ 평가셋은 초안이 아니라 실물이다 — `S2b` 는 산출물 완료로 닫혔고, 그 평가셋으로 재는 화면 층 품질 판정이 이 항목으로 왔다. ⬜ 를 유지하는 이유가 「오라클 부재」에서 「판정 미실행」으로 바뀌었다.** ／ 이전 ~~⬜ 를 유지하는 이유 = 완료 판정의 오라클인 평가셋이 초안이다. ⚠ 그런데 `S2b` 는 `03-HANDOFF` 에서 Ted 승인 완료 ✅ 로 적혀 어긋난다.~~ ⚠ 화면이 서고 staging 에서 실결과(`강우` 3건)를 내는데 상태는 ⬜ 다 — 문서가 그 이유를 명시하므로 상태는 ⬜ 로 둔다. stage 는 `WORK-UNITS` 가 「stage 1 에 지어지고 stage 2 에 판정된다」로 적어 스키마 값 하나로 못 담는다 — `unknown` 으로 적고 여기 남긴다.~~ ⭑ **⟨단계 배정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈212〉`⟩ `unknown` → `stage2`.** 배정 근거 = **판정 시점이 stage 2 다**(화면은 stage 1 에 지어졌고 남은 것은 평가셋으로 재는 판정뿐). 그리고 이 항목은 **승인 처리(`P6`)의 선행**이라 화면·승인 사슬의 실질 경로 안에 있다."
    sources: ["03-HANDOFF §1 T-P", "WORK-UNITS §7", "WORK-UNITS §10.2", "WORK-UNITS §11", "PLAN-SoT §9 〈212〉"]

