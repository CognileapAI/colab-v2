      (260826 결정은 AI 를 이번 릴리즈에서 뺐는데 코드는 아직 부른다),
      제거 자체는 `K3` 없이 지금 가능하다.
      **푸는 법 = Ted 가 「자동 호출 제거」와 「버튼 신설」을 한 항목으로 볼지 가를지 정한다.**~~
      (푸는 법대로 Ted 가 정했다 — `〈203〉`)
      ⭑ **⟨2026-08-31 · Ted RULING ㉖⟩ 실측 정정 — 이 항목의 `entry_conditions` 에는
      동결 해제 등급 문구가 **없다**(`〈203〉` 으로 「없음 — 지금 착수 가능하다」가 됐다).
      계약 표면도 건드리지 않는다: 부르는 op `listUploadLineageSuggestions` 는 이미 서 있고
      `reason` 갈래 넷도 중계에 이미 있다. **그러므로 「등급 `[미확인]`」은 해소가 아니라
      「해당 없음」으로 닫힐 수 있다** — 그 판정을 `03-HANDOFF §4 #53` 에 물음으로 올렸다.
      **결정 번호를 쓰지 않았다.**
      ⭑ **⟨확정 2026-08-31 · Ted RULING ㉝ · `PLAN-SoT §9 〈258〉`⟩ 계약 동결 해제 = **해당 없음**으로 닫는다.**
      **근거는 실측이다** — ⑴ 부르는 op `listUploadLineageSuggestions` 가 계약에 이미 서 있다
      (`contracts/seams/fe-core.yaml:454`) ⑵ 「제안 0건」과 「제안을 못 받았다」를 가르는 `reason` 갈래도
      중계에 이미 있다(`relay.py` `honest_empty_suggestions` `:180` 정의 · 호출 `:348`·`:365`·`:374`·`:381`)
      ⑶ 완료 정의 ⓐ~ⓔ 중 계약 표면을 늘리거나 줄이는 항이 **하나도 없다** — 바뀌는 것은
      `LineageStep.tsx` 의 호출 시점(마운트 → 버튼)과 시험뿐이다.
      **⟹ 열 계약이 없으므로 등급을 매길 대상 자체가 없다.** `03-HANDOFF §4 #53` 의 `LV-2` 몫은 이것으로 닫힌다.
      ⛔ **그래도 이 항목을 닫지 않는다 — 미충족 조건이 남는다.**
      완료 정의 ⓐ 가 걷어내라는 마운트 시 자동 조회가 **아직 그대로 있다**
      (`frontend/src/components/lineage/LineageStep.tsx:91` 의 `useEffect` · 2026-08-31 실측).
      ⓑ~ⓔ 도 구현·시험이 0건이다. **`status: open` 유지 — 부분 충족으로 닫지 않는다**(`CLAUDE.md §5`).
    sources: ["PLAN-SoT §9 〈197〉", "PLAN-SoT §9 〈203〉"]

  - id: LV-3
    name: "「CoLAB에서 가공됨」 표식 — 레벨 표시 옆 작은 표식 ＋ 계보 그래프 노드 구분"
    status: open
    stage: after_stage2
    owner: "E-04 · E-03 프런트"
    entry_conditions: ["`DP-1`(데이터 프로세스) — 표식이 가리킬 「시스템이 만든 계보」가 그때 처음 생긴다", "`P3`(계보 그래프) — ⓑ 노드 구분의 자리"]
    depends_on: [DP-1, P3]
    completion_def: >-
      ⓐ 레벨 표시(`lvl lvl-N`) 옆에 작은 표식이 붙는다 — **독립 칩으로 만들지 않는다**
      (잠김·검증 칩과 같은 무게로 읽혀 출처의 성질이라는 종류 차이가 뭉개진다)
      ⓑ 계보 그래프에서 시스템이 만든 노드가 구분된다
      ⓒ 표식이 답하는 질문이 「우리가 만들었다」가 아니라
      **「이 레벨을 시스템이 보증하는가」**임이 문구·툴팁에서 읽힌다
      ⓓ **계보를 편집하면 레벨이 다시 계산되므로** 그 시점에 표식을 어떻게 할지가 정해져 있다
      — ⚠ **이 갈래는 판정 안 됐다 → `[미확인]`**
      ⭑ ⟨2026-08-29 추가 · Ted 판정 `PLAN-SoT §9 〈198〉` 개정⟩
      ⓔ **데이터에 세 번째 출처 값이 있다** — ✅ **집행됐다** (2026-08-29 · 10 차 동결 해제).
      값·근거·게이트 출력은 `PLAN-SoT §9 〈205〉` 에 있다. 이 자리는 링크만 든다.
      ⭑ ⟨개정 2026-08-29⟩ 종전의 「이름은 한국어」·「문자열 미확정 `[미확인]`」은 **해소됐다** —
      Ted 가 영어 세 값(`ai` · `manual` · `processed`)으로 확정했다
      ⓕ **계보 상세·계보 그래프에는 세 값이 그대로 보인다** — 「AI 가 추천했고 사람이 확인함」과
      「사람이 처음부터 골랐음」은 다른 정보이고, 계보를 검토하는 사람에게 쓸모가 있다
      ⓖ **카탈로그 목록·카드에는 「자동 연결인지」만 보인다** — 표식이 없는 것이 곧
      「사람이 적었다」다(칩을 하나 아낀다)
    evidence: null
    deadline: null
    note: >-
      stage 판정 근거 = **표시할 대상이 그 전에는 0 건이다.**
      `d4_lineage_edge.origin` CHECK 2값에 「시스템이 만들었다」가 없고,
      그 값을 만드는 주체인 데이터 프로세스(`DP-1`)가 `after_stage2` 다(`〈189〉`-㉳-⑵).
      그래서 `DP-1` 과 같은 자리에 둔다.
      ⚠ **ⓑ 의 실물은 미확인** — 계보 그래프 화면 자체가 아직 없다(`P3` open).
      푸는 법 = `P3` 착수 시 노드 렌더 구현 자리에서 확인.
      ⚠ **ⓓ 편집 후 표식의 거취는 판정 안 됐다** — 갈래 셋(표식을 걷는다 / 유지하되
      「사람이 손댐」을 함께 표시한다 / 그대로 둔다). 푸는 법 = Ted 판정. 지어내지 않는다.
      ⭑ 실물 근거 — Lv 는 이미 칩 계열이 아니다(`DetailHeader.tsx:25` · `CatalogTable.tsx:157`
      가 `lvl lvl-N`, 주제·잠김·조각 N 은 `chip`).
    sources: ["PLAN-SoT §9 〈198〉", "PLAN-SoT §9 〈198〉 ⟨개정 2026-08-29⟩"]

  - id: LV-4
    name: "계보 관계를 지울 때 부모 이름을 상수로 복사해 남긴다 (링크는 없다)"
    status: open
    stage: after_stage2
    owner: "D4 / core-api ＋ db ＋ E-04 프런트"
    entry_conditions: ["없음 — 다만 저장 자리 설계가 `[미확인]` 이다"]
    depends_on: [P2]
    completion_def: >-
      ⓐ 계보 관계 삭제 시 **부모의 이름이 문자열 상수로 자식 쪽에 복사돼 남는다**
      (`d4_lineage.py:97` `_DELETE_EDGE` 경로가 지나는 자리)
      ⓑ 화면에서 **이름은 보이되 그 데이터로 가는 링크가 없다** — 「무엇에서 왔다」는 읽히고
      클릭해서 갈 수 없다
      ⓒ 「지운 계보에서 온 이름」과 「원래 원천 표기」가 화면·데이터 양쪽에서 갈린다
      — ⚠ **저장 자리(기존 `source_label` 계열을 쓰는가 · 신설하는가)는 판정 안 됐다 → `[미확인]`**
      ⓓ 되돌림(down) 마이그레이션이 있고 `schema-diff` 가 두 체인 각각 선언＝적용
      ⓔ 삭제 후 표시 Lv 가 파생 규칙대로 다시 계산되는 것이 시험으로 단언된다
      (`〈196〉`-㉲ · 사람이 고른 값은 `〈194〉` 로 사라졌다)
    evidence: "2026-08-29 실측 — `d4_lineage_edge` 트리거 0(운영 DB `pg_trigger` 0행 · 읽기 전용 조회) · 이력 열 없음(`db/platform/schema.sql:474-488`) · 삭제 경로 실재(`d4_lineage.py:97`) · 엣지 적재 **6건**. 산출 `sessions/LINEAGE-LEVEL.md §9.2`"
    deadline: null
    note: >-
      **신설 2026-08-29** — `PLAN-SoT §9 〈202〉`(Ted). `〈195〉` 의 선택지 셋 중
      **㋑ 「이름만 상수로 남기기」**를 골랐다(㋐ 소프트 삭제 · ㋒ 삭제 이력 표는 기각).
      ⭑ **⟨단계 배정 2026-08-29 · Ted 판정 `PLAN-SoT §9 〈212〉`⟩ `unknown` → `after_stage2`.**
      배정 근거 = **2026-08-29 신설 항목**이고 저장 자리 설계가 아직 `[미확인]` 이다 — stage 2 배치에 끼워 넣지 않는다.
      ／ 이전 ~~⚠ **stage `[미확인]` — 임의로 정하지 않았다.** 푸는 법 = 삭제 경고(`〈196〉`)의 문구·조건이
      정해지는 자리와 같이 볼지, 저장 자리 설계가 먼저인지를 Ted 가 가른다.~~
      ⚠ **`〈196〉` 의 경고 문구·조건은 여전히 `[미확인]`** — 다만 경고가 말할 손실은
      「영구 삭제」가 아니라 **「연결이 끊기고 이름만 남는다」**로 정해졌다.
    sources: ["PLAN-SoT §9 〈195〉", "PLAN-SoT §9 〈196〉", "PLAN-SoT §9 〈202〉"]

  - id: VZ-1
    name: "2D 시각화의 경계·점 표현 — 범위 밖 (벡터 원천 0건)"
    status: deferred
    stage: out_of_scope
    owner: "D7 viz-render (P3 계열)"
    entry_conditions: ["아래 `deadline.condition` — 벡터 원천이 실제로 들어온 시점"]
    depends_on: [P3]
    completion_def: >-
      **지금은 완료 정의를 쓰지 않는다 — 범위 밖이다.**
      재개 조건이 충족되면 그 회차가 완료 정의를 쓴다. 지어내지 않는다.
    evidence: "2026-08-29 — 원천 5종이 전부 격자(래스터)이고 **경계·점으로 그릴 벡터 자료 0건**(`sessions/P3-SCOPE.md:48` · `DATA-REFERENCE §1`). Ted 확인 = 「벡터 자료 아직 없다.」"
    deadline:
      condition: "경계·점으로 그릴 벡터 원천이 실제로 들어온 시점 — `DATA-REFERENCE §1` 의 원천 표에 래스터가 아닌 자료가 1건 이상 오르면 이 배제를 다시 연다. 날짜가 아니라 조건이다."
      fired: false
    note: >-
      **신설 2026-08-29** — `PLAN-SoT §9 〈204〉`(Ted). **기능이 없는 게 아니라 입력이 없다.**
      기각 둘 = ⑴ 지금 만들기(그릴 대상이 없어 **시험할 수 없는 기능**이 생긴다 — 이 레포 대표 실패형)
      ⑵ 벡터 자료를 먼저 들이기(계획 없음).
      ⚠ **`⏸` 를 `⬜` 로 바꾸지 않는다** — 하지 않기로 한 것이지 착수 후보가 아니다.
      ⚠ **정본 개정이 딸린다** — 레포 안은 이번에 고쳤고(`DOMAINS.md` D7 행 · `WORK-UNITS §7`·`§10` ·
      `03-HANDOFF §1 T-P` `P3` 행 · 이 대장 `P3`), **레포 밖 기획 정본은 사람이 할 일로 목록화**했다
      (`〈204〉`-㉳). **계약 산문**(`contracts/seams/core-viz.yaml:34`·`:64`)은 본 회차 계약 무접촉이라
      고치지 않았다 → `[미확인]` · 푸는 법 = 계약을 여는 회차가 산문만 정정한다.
    sources: ["PLAN-SoT §9 〈204〉", "WORK-UNITS §7", "sessions/P3-SCOPE.md"]

  - id: Q-B
