  - id: CT-1
    name: "카탈로그 표 스펙 세목 — 열 구성 · 조건 다섯 열 · 기본 정렬 · 잠긴 행 · 0건 문구"
    status: open
    stage: stage2
    owner: "frontend / D3"
    entry_conditions: ["`P1` 닫힘(카탈로그 화면 실물 존재 · ✅ 2026-08-23) — 이 항목은 화면을 새로 짓지 않고 **이미 선 화면이 정본 세목을 지키는지**를 판정한다"]
    depends_on: [P1, P6]
    completion_def: "⭑ ⟨신설 2026-08-30 · Ted 판정(오늘)⟩ **정본이 이미 카탈로그에 배정한 조항을 완료 정의로 옮긴 것이다 — 요건을 새로 만들지 않았다.** 전거 = `40 COLAB-기획/…/E-02_데이터_찾기/documents/Policy_데이터_찾기.md`(2026-08-18) ＋ `40 COLAB-기획/_재검토_E02-E03_260826.md`(2026-08-26 · `〈129〉` 지정 정본). 각 조항은 축자 인용이고 인용처를 붙였다. — **⑴ 열 구성 8열** · `Policy_데이터_찾기.md:111` 축자 「`데이터셋 · 주제 · Level(가공 단계) · 프로젝트 · 업로더 · 수정일 · 계보 · Verified` + 오른쪽 끝 빠른 작업 자리」 ／ 같은 문서 `:156` 축자 「**8열 표 + 빠른 작업 자리.** 헤더는 세로 스크롤에도 위에 고정된다. 가로·세로 스크롤은 표 래퍼 한 곳이 맡는다」. — **⑵ 조건을 걸 수 있는 열 다섯** · `:115` 축자 「표 헤더에만 둔다. 조건을 걸 수 있는 열은 **주제 · Level · 업로더 · 계보 · Verified 다섯**이고, 나머지 열은 정렬만 갖는다. 한 열에서 값을 여러 개 고를 수 있다」 ／ ⭑ **다섯 열 유지 확정** = `_재검토_E02-E03_260826.md:49` 축자 「\"조건을 걸 수 있는 열은 주제 · Level · 업로더 · 계보 · Verified 다섯\" … **다섯 열 유지가 정답**이고, 근거 한 줄만 덧붙이면 된다 (자유 입력 값은 값 목록을 세울 수 없다)」 ／ 딸린 조항 `:116` 축자 「값별 건수 — 열 메뉴의 값마다 붙는다. **다른 열에 걸린 조건을 먼저 적용한 뒤에 센다.** 눌러도 0건인 값은 미리 흐리게 둬 **빈 결과로 보내지 않는다**」. — **⑶ 기본 정렬** · `:117` 축자 「기본 정렬 ｜ 카탈로그: **수정일 최신순**」 ／ `:147` 축자 「순서를 고르는 조작은 **카탈로그에만** 있다」. — **⑷ 잠긴 행** · `:152` 축자 「자물쇠 + 잠김 칩 · **행에는 접근 요청 버튼을 두지 않는다** · 행을 누르면 잠긴 상세로 가고 요청은 거기서 한다」 ／ `:130` 축자 「잠긴 데이터 ｜ 이름·요약까지 노출 + 접근 요청 (범위는 승인 처리 E-06 적용 지점 표) ｜ … **카탈로그 행은 자물쇠 + `잠김` 칩**」 ／ `:162` 축자 「행 빠른 작업 — … 평소에는 비어 있고, **잠긴 행에는 나타나지 않는다**」. — **⑸ 0건 문구** · `:170` 축자 「조건 결과 0건 ｜ \"**조건에 맞는 데이터가 없어요. 조건을 하나 풀어 보세요.**\" ｜ 조건 칩 줄의 전체 해제」 ／ `:140` 축자 「조건 결과 0건 ｜ **조건 조합이 과함** ｜ \"조건을 하나 풀어 보세요\" + 조건 칩 줄의 전체 해제 [가정]」. — ⭑ **판정 방법** = 위 다섯을 화면 실물과 1:1 대조한다. **완료 판정의 절차 4항(수용 기준 · 도메인 게이트 green · staging 배포 green · 목업 대비 화면 검증 — `WORK-UNITS §7`)은 `P1` 이 이미 통과했으므로 이 항목이 다시 세우지 않는다.** ⛔ **정본이 침묵하는 자리 — 지어내지 않았다(`[미확인]`)** — ㈎ **승인 처리 도착 전 `Verified` 열의 정직한 상태**: 정본은 `:116`(0건 값 흐리게)·`:170`(조건 조합 과함)만 적고, **값을 채울 기능 자체가 이번 릴리즈에 없어 참이 영영 안 맞는 조건**은 어느 조항도 다루지 않는다. `:170` 의 진단(「조건 조합이 과함」·「조건을 하나 풀어 보세요」)은 이 경우에 **틀린 안내**다 — 조건을 풀어도 맞는 행이 생기지 않는다. **문구를 쓰지 않고 멈췄다 — 제품 판정 대기.** ㈏ **카탈로그 행의 `Verified` 칸 값 글자**: 정본은 계보 열 표기 네 가지는 `:118` 로 못 박으면서 `Verified` 칸의 글자는 적지 않는다. 실물은 `columns.ts:37` 「`Verified` 아니면 `승인 전`」 — **정본 무근거**. ㈐ **상호 안내(`:155` 「점선 박스로 반대 길을 권한다」)**: 반대 길인 검색 화면이 이번 릴리즈에 없다. 정본은 **두 길이 다 있는 세계만 기술한다** — 대체 문구 침묵."
