    note: "⭑ **2026-08-29 — `conflict` 를 풀고 `partial` 로 세웠다.** 종전 갈라짐(`03-HANDOFF §1 T-I` ⬜ ↔ `WORK-UNITS §10` ⛔ ↔ `§10.2-b` ✅ ↔ `§11` ⬜)의 원인이던 **선행 판정 7건은 이미 전건 종결**이고(`PLAN-SoT §9 〈168〉-㉮~㉴`), 그 위에 **실배포까지 섰다**(`〈185〉`). 산문 넷을 같은 회차에 `partial` 로 맞췄다. ／ 이전 ~~`status: conflict` — 한 문서 세 절이 서로 다르다. 사람이 `sessions/TED-DECISIONS-OPEN.md §A` 를 열어 7건의 실물을 세고 판정할 자리다~~ (**낡았다 — 7건은 2026-08-27 에 전건 판정됐다**). ／ **닫지 않는 이유 = 열림/부분 6행.** 열림 ⑴ 자동 트리거 완주(크론 미설치 — `install-schedule.sh` 미실행) ⑷ 롤백 왕복 ⑸ 직전 릴리스 확인. 부분 2-b(실배포 red 로그 없음 — 원장 red 행은 **헬스 판정 미도달** 단계다) ⑽ 게이트(red 1) ⑾ 전후 200→200(**배포 직전 값 미측정** → `[미확인]`). ／ 이전 ~~⚠ **지금 스크립트 롤백 경로가 없다** — `ledger_rollback_target()` 대상 0건(green `deploy` 행이 1건뿐) · `:prev` 는 원장에 없는 수동 빌드본이다(`〈185〉-㉷`-⑵ · 블로커 `§4 #43`). **다음 배포가 한 번 더 성공해야 ⑷⑸ 를 잴 수 있다.**~~ (**낡았다 — 2026-09-03 에 왕복을 실제로 돌렸다.** 원문을 지우지 않는다.) ⭑ **⟨재계수 2026-09-03 · 단계 F 집행 · `〈301〉`⟩ 완료 정의 15행 = 닫힘 11 · 열림 1 · 부분 3.** **닫힘으로 옮긴 둘 = ⑷ 롤백 왕복 · ⑸ 직전 릴리스 확인**(위 `evidence` ㉮㉯). **여전히 열림 1 = ⑴ 자동 트리거 완주** — 사람이 `deploy.sh` 를 불러야 한다. 이 회차의 배포도 손으로 불렀다. 단계 C 가 설치한 크론 셋째 줄은 **백업 연속성 검사**이지 배포 트리거가 아니다. **부분 3** — **2-b** 실배포 red 로그(원장 red 행 `5a71779510f8` 은 **이미지 빌드 단계**에서 죽은 것이라 여전히 **헬스 판정 미도달**이다 · 판정 red 의 실회차 로그는 아직 0건) · **⑽** 게이트 — 이 회차 실측 = `all -j 1` **green 42 · red(판정) 0 · red(준비) 1**(`rls-effect-selftest`) ＋ **그 1건 단독 재실행 green** ⟹ **계수 기준을 밝히면 43 green · red(판정) 0**. ⚠ **한 번의 `all` 실행에서 43/43 이 나온 것은 아니다** — 잔여 red(준비)의 원인은 판정부가 아니라 **일회용 postgres 준비 시간**(`〈CLAUDE.md §1-b-⑸〉` · 선례 `WINDOW-20260903-B2 §3`). 그 구분을 지우고 닫지 않는다 · **⑾** 전후 `/healthz` 200→200(이 회차는 롤백 **직전** `/healthz` 를 안 찍었다 — 찍은 것은 인증 상세 200 이다. 배포 후 `/healthz` 200 은 실측). ⛔ **그래서 닫지 않는다 — `status: partial` 유지.** 「부분 완료로 닫지 않는다」(`sessions/I3.md §6` 말미)."
