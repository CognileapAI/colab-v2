  - id: BF-2
    name: "③지도형 리샘플 — 전방 산란을 출력 주도(역사상) 근사 최근접으로 교체 ＋ 캐시 키 라벨 (Ted 4 · 접수 B-1 ＋ B-4 흰 줄)"
    status: done
    stage: stage1
    owner: "D7 / viz-render"
    entry_conditions: []
    depends_on: [SC-1]
    completion_def: >-
      `warp_to_3857` 이 `np.add.at` 전방 산란이라 원본이 출력(1024 px)보다 성기면 출력 픽셀 대부분이 결측(알파 0)으로 남고
      (126×128 원본 채움 **1.95 %** — bug04 의 실체), 같은 해상도에서도 lat→y 비선형으로 **전 결측 행 2줄**(가로 흰 줄 · bug10·bug11)이 남았다
      (`reports/bug-20260903/recon-B-preview.md §1·§4`). 완료 = ⑴ 원본 긴 변이 `max_side` 를 넘으면 `block_average` 로 먼저 내린다(「촘촘 → 평균」은 이 단계에서 지켜진다)
      ⑵ 원본 셀을 3857 출력 격자에 씨앗으로 심고 2패스(행·열) 근사 최근접으로 채운다 — 추정 원본 간격을 넘으면 채우지 않는다(발자국 밖 보존) · 값 NaN 셀도 씨앗이라 이웃 값이 NoData 를 메우지 않는다
      ⑶ 성긴 원본(126×128) 채움률 ≥ 95 % · 성긴/동해상도 두 케이스 전 결측 행·열 0 · 결측 비율 보존 · 2048² 체크보드가 평균(5.0) · 회전 격자 발자국 보존
      ⑷ 캐시 키의 다운샘플 라벨을 `warp+blockavg` → **`warp+nearest`** 로 바꿔 배포 즉시 구 PNG 가 키에서 갈라진다(무효화는 키 자신의 일 · `storage_layout.py` 원칙 · 재굽기 규율에 기대지 않는다)
      ⑸ docstring 이 「2패스 근사 최근접 · 정확 최근접 일치 약 86~95 %」와 「촘촘→평균은 ① 축소 단계에서만」을 적는다.
    evidence: >-
      커밋 `40844ea`(역사상 리샘플 · 기반 `56eac76`) ＋ `5f6b75f`(advisor 게이트 ② 지적 2건 — 캐시 키 라벨 `warp+nearest` · docstring 근사 최근접 명기).
      RED 선실측 = origin/main 원본으로 신규 시험 6건 **전부 실패**(채움 0.0195 · 전 결측 행 잔존 · 흰 줄 2 · 결측 메움 · 촘촘 평균 안 됨 · 발자국 안쪽 채움 0.094).
      GREEN = 유닛 스위트(`-m "not e2e and not perf"`) **269 → 275 passed · 실패 0**(deselected 40 = e2e/perf) · `tests/test_preview_warp_gaps.py`(+129).
      자체 지연 실측 = 1024×1024 원본 `warp_to_3857` 5회 **평균 0.378 s · 최대 0.415 s**(게이트 눈금 p95 10.0 s 안 · `render-latency` 게이트는 원천 미마운트로 readiness red — 통과로 세지 않았다).
      정확 최근접 대조 = 126×128→512 약 **86 %** · 30×32→256 약 **95 %**(브루트포스 · advisor 게이트 ②). 근거 `reports/bug-20260903/lane-B1-report.md`.
    deadline: null
    note: >-
      **신설·닫힘 2026-09-03** — `PLAN-SoT §9 〈310〉`-㉰. **등재된 한계**(항목을 세우지 않고 여기 적는다) = ㉠ 근사 최근접이라 셀 경계가 1 px 들쭉날쭉할 수 있다(미리보기 배율에서 식별되지 않는다)
      ㉡ 긴 변 ≤ `max_side` 이면서 발자국이 bbox 보다 작은 곡선 격자(크게 회전한 격자)는 한 출력 픽셀에 씨앗이 여럿 떨어져도 평균하지 않고 하나만 남는다 — 현재 실원천(규칙 격자 · ≤1024)에는 이 부류가 없다.
      ⚠ **배포 순서** ⭑ ⟨갱신 2026-09-04 · advisor 게이트 ③ · `origin/main` 병합 후 재정정⟩ 재굽기 1회는 2026-09-04 구 알고리즘으로 이미 돌았고(main 〈308〉) `RC-1` 은 〈309〉 로 닫혔다(회수 1회 · 판정 불가 19 유지). `BF-2` 배포 즉시 ③지도형 층 키(`warp+nearest`)가 다시 갈려 **배포 뒤 재굽기 1회 더** ＋ 소유 계수(103/84/19) 재실측이 필요하다 — 판정 불가 19 벌의 처분은 〈309〉-㉶⑴ 이 이미 다음 회차 진입조건으로 잡아 두었다. 지고 가는 열린 항목 = `CR-2` ⑶(`RC-1` 은 done 이라 다시 열지 않는다).
      사양 반영 = `PREVIEW-IMPLEMENTATION.md §2 표 ③행 · §5.3 ⑤ · §7.2`. 스크린샷 `reports/bug-20260903/bug04-*.png`(＋ 흰 줄 `bug10-*`·`bug11-*`).
      ⭑ ⟨상태 정정 2026-09-04 · advisor 게이트 ③⟩ `done → in_progress` — 완료 = staging 배포 green(`CLAUDE.md §0`)이고 이 항목은 통합 브랜치 `bugfix/20260903-ui-12` 에만 있다. staging 배포 green 시 `done` — 배포 창이 전환한다.
      ⭑ ⟨staging 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`in_progress` → `done`.** ⑴ **staging 배포 green** `f465d83a2ef1` ⑵ **사용자 시야 확인 — ③지도형 PNG 알파 실측(전/후)**: GK-2A 채움 **99.80 % → 100.00 %** · 전결측 행 **2 → 0** · U-Net **48.72 % → 100.00 %** · 전결측 행 **384 → 0** · 열 **181 → 0** · PV-1 **99.80 % → 100.00 %** · 전결측 행 **2 → 0**. ⭑ **캐시 라벨이 실제로 물렸다 — 다만 갈린 층은 ③지도형 하나뿐이다**(A4 §3 의 `[미확인]` 이 닫혔다): GK-2A `4e0ac3e3…` → `50dc2d4d…` · U-Net `a306fb2b…` → `d4a00edc…` · PV-1 `f7b007c5…` → `4bf57c39…` 이고 ①썸네일·②비지도형은 **같은 키**다. ⚠ `warp+nearest` 라벨 자체는 사이드카·화면 어디에도 드러나지 않는다 — 증거는 키 해시 변화와 위 채움률뿐. 근거 `sessions/WINDOW-20260904-B4.md §4.1`·`§6.1`.
    sources: ["PLAN-SoT §9 〈310〉", "sessions/BUG-20260903.md", "reports/bug-20260903/recon-B-preview.md", "reports/bug-20260903/lane-B1-report.md", "PREVIEW-IMPLEMENTATION.md §7.2"]

  - id: BF-3
    name: "확대 한계 안내 — 「확대·축소·기본 배율로」 무동작을 한계 상태 표시로 (Ted 8 · 접수 B-3)"
    status: done
    stage: stage1
    owner: "frontend (D7 화면)"
    entry_conditions: []
    depends_on: [P3]
    completion_def: >-
      `useZoomPan.ts:192` 의 `maxScale = max(1, PNG 폭 / 뷰포트 폭)` 이 실측 808~821 / ≈820 → **1.0** 이라 버튼이 아무것도 못 바꿨다.
      기존 시험은 `measure(4096, 512)` 픽스처(파이프라인이 만들지 않는 해상도)라 못 잡았다(`reports/bug-20260903/recon-B-preview.md §3`).
      **Ted 판정 Q1 = ⓐ `maxScale` 규칙 유지**(정본 조건 ⑷ · `〈232〉` 무변). 완료 = ⑴ `maxScale` 계산 무변경
      ⑵ `atLimit` 조건에 `maxScale <= 1` 을 더해 **첫 클릭 전부터** 「원본 해상도까지 봤어요」 안내 ＋ 확대 버튼 `disabled`
      ⑶ 실측값 픽스처(808/820)로 RED 를 먼저 본다.
    evidence: >-
      커밋 `a1ea2d5`(기반 `56eac76`). RED = origin/main 소스로 신규 2건 실패 확인 → GREEN(레인 합산 vitest **37파일 / 580건** · `tsc` 0).
      최소 수정 · 무관 편집 0(advisor 게이트 ② 검토). 근거 `reports/bug-20260903/lane-B35-report.md`.
    deadline: null
    note: >-
      **신설·닫힘 2026-09-03** — `PLAN-SoT §9 〈310〉`-㉮ Q1. ⚠ 「확대가 stage 2 라 안 됨」이 아니다 — `P3` 가 `〈241〉` 로 닫힐 때 확대는 완료 정의 그대로 충족됐고(`recon-D-scope.md §2`), 이것은 **완료된 기능의 표시 결함**이다.
      스크린샷 `reports/bug-20260903/bug08-*.png`.
      ⭑ ⟨상태 정정 2026-09-04 · advisor 게이트 ③⟩ `done → in_progress` — 완료 = staging 배포 green(`CLAUDE.md §0`)이고 이 항목은 통합 브랜치 `bugfix/20260903-ui-12` 에만 있다. staging 배포 green 시 `done` — 배포 창이 전환한다.
      ⭑ ⟨staging 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`in_progress` → `done`.** ⑴ **staging 배포 green** `f465d83a2ef1` ⑵ **사용자 시야 확인**(실브라우저 · 3 데이터셋 전부): 「확대」 버튼이 `disabled` ＋ `aria-disabled` 참 · 「원본 해상도까지 봤어요」가 **로드 시점부터** 표시(누른 뒤가 아니다) · 「축소」·「기본 배율로」는 활성. `maxScale` 규칙은 Ted Q1 ⓐ 대로 무변. 근거 `sessions/WINDOW-20260904-B4.md §6`.
    sources: ["PLAN-SoT §9 〈310〉", "sessions/BUG-20260903.md", "reports/bug-20260903/lane-B35-report.md"]

  - id: BF-4
    name: "미리보기 이름표 · 범례 변수명 · 원본 격자 캡션 (Ted 11·10 · 접수 B-5·B-4)"
    status: done
    stage: stage1
    owner: "frontend (D7 화면)"
    entry_conditions: []
    depends_on: [SC-5]
    completion_def: >-
      B-5 「정체불명」은 렌더 결함이 아니라 **DEM 페이지(D-02) 오독**이었다 — 범례 `2 ~ 521.1` 이 파이프라인 실행값과 소수 4자리까지 일치(`recon-B-preview.md §5`).
      남는 결함 = 미리보기 머리에 데이터셋 이름이, 범례에 변수명이 없어 어느 자료를 보는지 화면이 말하지 않는다.
      **Ted 판정** Q2 = 「상세에서 원본 픽셀 크기를 알 수 있게」 · Q3 = 권고대로(데이터셋 이름 ＋ 범례 변수명).
      완료 = ⑴ `DatasetPreviewSection` 머리에 `detail.name` ＋ `fileName` ⑵ `PreviewPanels` 범례 첫 줄에 `legend.variable`(서버가 이미 돌려주는 필드 `preview/types.ts:17` · 비면 자리째 뺀다)
      ⑶ 캡션 「격자 <grid> · W × H」 = `basicInfo.grid` ＋ ③지도형 사이드카 `mapGeometry` 의 `width×height`(확대 한계가 쓰는 같은 응답) · ②비지도형은 격자 간격만 · 둘 다 없으면 캡션 없음
      ⑷ 새 API·계약 0.
    evidence: >-
      커밋 `78cad68`(기반 `56eac76` · 5파일 +240/−4 — `DatasetPreviewSection.tsx`·`PreviewPanels.tsx`·`DatasetDetailPage.tsx`·시험 2파일).
      RED(소스 되돌림) = **5 failed / 16 passed** — 정확히 신규 5건 → GREEN vitest **37파일 / 580건 전건 통과** · `tsc --noEmit` 0.
      금지 파일(`LineageSection.tsx`·`.pv-tile` 크기 CSS·`pointFromViewport`·`ScreenshotButton.tsx`) diff 0. 근거 `reports/bug-20260903/lane-B35-report.md`.
      ⭑ **⟨종결 2026-09-05 · staging 단독 창 5b 단계 B · 등재 `PLAN-SoT §9 〈318〉` · 근거 `sessions/WINDOW-20260905-A5b.md §10` ㉠⟩ `in_progress` → `done` — 완료 정의 ⑶ 이 화면에서 섰다.**
      배포 `e37808cace69` GREEN(8/8 healthy) 뒤 **재굽기 뒤에** 실브라우저로 열었고 **온디맨드 굽기 0벌**(자리 파일 306 불변 · 렌더 요청 0건 — `〈312〉 §3.1` 의 순서 오류 미재발).
      **3 데이터셋 전부** 머리에 데이터셋 이름 ＋ 파일명 · 범례 `변수` 칸 · 캡션 「격자 <grid> · W × H」 3요소 충족이고,
      ⭑ **`〈312〉` 에서 자리째 빠졌던 GK-2A 의 격자 캡션이 `821 × 1024` 로 선다**(산출 격자 · `〈315〉`-㉮ 가 정한 형태) ⟹ **Ted Q2 캡션 기준 충족**.
      ⚠ **U-Net 범례 변수명이 여전히 원천 ULID 인 것은 이 항목이 아니다** — `〈312〉` 와 같은 상태이고 이 배포가 고친 자리가 아니다. 계약 개정 0 · 코드 0줄.
    deadline: null
    note: >-
      **신설·닫힘 2026-09-03** — `PLAN-SoT §9 〈310〉`-㉮ Q2·Q3. ⚠ 레인 보고와 `PLAN-fanout.md` 는 B-4·B-5 를 「버그 13·14」로 적었다 — 접수표(`BUG-INTAKE-20260903.md`)의 Ted 번호는 **10·11** 이다. 정본은 접수표.
      Ted 10 의 「업로드/상세 배율 차이」는 버그가 아니다 — 블록은 자료 자체(2 km → 100 m 균등 분할)이고 차이는 컨테이너 폭(`max-width:100%` vs `width:100%`)이다. 항목을 세우지 않는다.
      스크린샷 `reports/bug-20260903/bug10-*.png`·`bug11-*.png`.
      ⭑ ⟨상태 정정 2026-09-04 · advisor 게이트 ③⟩ `done → in_progress` — 완료 = staging 배포 green(`CLAUDE.md §0`)이고 이 항목은 통합 브랜치 `bugfix/20260903-ui-12` 에만 있다. staging 배포 green 시 `done` — 배포 창이 전환한다.
      ⭑ ⟨staging 실측 2026-09-04 · `PLAN-SoT §9 〈312〉` · 단독 창 4⟩ **`in_progress` 유지 — 완료 정의 ⑶ 이 화면에서 절반만 선다.** staging 배포 green(`f465d83a2ef1`)은 섰다. 화면 실측(실브라우저 · 3 데이터셋 · ③지도형 적재까지 12초 대기) — **선 것** ⑴ 머리 `미리보기 — <데이터셋 이름>` **3건 전부** · 파일명 `GK2A_NDVI_mean_202305.tif`·`Prediction_20230501.npy`·`pv1b_upload.tif` **3건 전부** ⑵ 범례에 `변수` 칸 실재. **안 선 것** ⑶ 캡션이 `격자 1280x1280` 까지만 나오고 **「· W × H」(원본 배열 크기)가 3건 전부 빠진다** — `mapGeometry` 의 `width×height` 가 캡션에 도달하지 않는다(③지도형 이미지 자체는 821×1024 로 정상 적재된다). GK-2A 는 `basicInfo.grid` 마저 없어 **캡션 자리가 통째로 빠진다**. ⟹ **Ted Q2 「상세에서 원본 픽셀 크기를 알 수 있게」가 staging 화면에서 아직 안 선다.** ⚠ 곁가지 관측 — 범례 변수명 값이 사람 말이 아니다(U-Net `01M1JM2P8PX4XWWAKTQMN936AW` 원천 ULID · GK-2A·PV-1 `band1`). 서버가 `legend.variable` 에 그 값을 싣고 프론트는 그대로 그린다. **완료 정의 ⑵ 는 자리 기준으로 충족**이라 이 값 품질은 별건이다 — 항목 신설은 Ted 가 연다. 근거 `sessions/WINDOW-20260904-B4.md §6` ⚠⑴⑵.
      ⭑ ⟨Ted 판정 2026-09-05 · 등재 `PLAN-SoT §9 〈315〉`-㉮ · 워크트리 `lane-dec`⟩ **캡션 「· W × H」= 산출 격자(3857) 값을 그대로 수용한다 — `〈314〉` 가 연 「원본 픽셀 크기」 판정 자리를 닫는다.** 원본 배열 크기를 보이려면 `DatasetBasicInfo` 새 칸 = 계약 개정이 필요하나 Ted 는 그 경로를 택하지 않았다. **계약 변경 0 · 완료 정의 ⑶ 은 이미 구현된 문면 그대로 유효** — 3 데이터셋 전부 `821 × 1024` 표기가 정본이다. `03-HANDOFF §4.5` 판정 대기 ㈎ 를 원문 취소선한다.
      ⭑ ⟨원인·수정 2026-09-05 · 워크트리 `lane-bf4` · 등재 `PLAN-SoT §9 〈314〉` · 초안 `notes/BF4-LEDGER-PENDING.md`⟩ **`in_progress` 유지 — 코드는 고쳤고 화면 검증은 다음 배포다.** **원인은 자료 결손이 아니라 판정 조건이다** — `DatasetPreviewSection.tsx` 가 사이드카를 축자 `done?.tileUrlTemplate ? done.sidecarUrl : undefined` 로 **타일 갈래에서만** 물었는데, 타일은 선택 갈래이고 **기본이 꺼짐**이며(`〈240〉` 판정 ⑬ · `DEFAULT_TILE_BRANCH_ENABLED = False` · `compose.i2.yml:323` `COLAB_VIZ_TILE_BRANCH: ${COLAB_VIZ_TILE_BRANCH:-}`) **staging 홈 env 에 그 선언이 없다**(읽기 전용 대조) ⟹ 실화면이 받는 ③지도형 결과는 `imageUrl` ＋ `sidecarUrl` 이라 사이드카 경로가 **한 번도 돌지 않았다.** `sidecarUrl` 은 갈래와 무관하게 실린다 — `core-viz.yaml` `dependentRequired: sidecarUrl → bounds` 는 `tileUrlTemplate` 과 **별개 항**이고 `jobs.py` 도 지도 이미지·좌표가 있으면 싣는다. **계약 밖 값 0건 — 해제 질문 없음.** 고친 것 = 사이드카를 `sidecarUrl` 유무로 묻는다(갈래 무관). ⚠ **확대 한계의 출처는 손대지 않았다**(`BF-3` · 조건 ⑷) — 사이드카 폭을 한계로 쓰는 것은 잴 그림이 없는 타일 갈래뿐으로 남겼다(이미지 갈래는 `naturalWidth` 가 이미 채운다. 확대는 서고 캡션만 빠졌던 이유가 이것이다). 계약·op·서비스 코드 **무변경**(프론트 1파일 ＋ 시험 1파일). RED 실측 = 신규 2건 정확히 실패 / 기존 3건 통과 → GREEN `frontend-test` **595/595** · `frontend-typecheck` 오류 **0**. 덮은 모양 셋 = 격자 ＋ 사이드카(staging 모양) · 격자만(②비지도형) · 격자 없음 ＋ 사이드카(GK-2A — 크기 조각만으로 캡션이 선다). ⛔ **`done` 으로 올리지 않는다** — 프론트 변경이라 **다음 배포 전에는 사용자 눈에 변화가 없다**(`CLAUDE.md §0`). 배포 창이 실화면에서 캡션을 재고 전환한다. ⚠ **감추지 않는 관측** — 사이드카 `width`·`height` 는 ③지도형 **산출 격자(3857)** 이고 3 데이터셋 전부 **821 × 1024** 로 같다(`〈312〉 §6.1`). 완료 정의 ⑶ 이 그 값을 축자로 지목하므로 정본대로 그렸으나, Ted Q2 의 「원본 픽셀 크기」로 읽으면 세 자료가 같은 수를 말한다 — **완료 정의를 고칠지는 Ted 가 연다**(원천 배열 크기는 `DatasetBasicInfo` 새 칸 = 계약 개정이다).
    sources: ["PLAN-SoT §9 〈310〉", "PLAN-SoT §9 〈314〉", "sessions/BUG-20260903.md", "reports/bug-20260903/recon-B-preview.md", "reports/bug-20260903/lane-B35-report.md", "PLAN-SoT §9 〈318〉", "sessions/WINDOW-20260905-A5b.md"]

