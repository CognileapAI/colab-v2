    note: "⭑ **⟨신설 2026-08-30 · Ted 판정(오늘)⟩ 「카탈로그 화면의 세목을 지는 항목을 만든다」.** 직전 회차(`sessions/STAGE3-AI-SPLIT.md §8-5`)가 **항목 신설을 제품 판정이라 보고 멈춘 자리**를 Ted 가 오늘 닫았다. **완료 정의는 정본에 이미 있는 조항을 옮긴 것이고 새 요건은 0건이다.** ／ ⭑ **왜 필요했나** = 오늘 판정으로 **카탈로그 화면이 이번 릴리즈의 데이터 찾는 길**이 됐는데, 그 화면의 유일한 항목(`P1`)은 **stage 1 에서 이미 닫혀 있고**(✅ 2026-08-23) 그 완료 정의는 **모든 P 에 공통인 절차 4항**뿐이라 **열 구성·조건 다섯 열·기본 정렬·잠긴 행·0건 문구를 한 조항도 이름으로 걸지 않는다.** 즉 **위상을 지는 열린 항목이 대장에 0건**이었다. ／ ⚠ **`F-2`(카탈로그 키워드 입력 제거)와 겹치지 않는다** — `F-2` 의 범위는 키워드 입력 제거 ＋ 문구 정합이고, 이 항목의 범위는 위 다섯 세목이다. **같은 화면이지만 조항이 갈린다.** ／ ⭑ **`depends_on` 을 정직하게 적는다 — `P1` ＋ `P6`.** `P1` = 판정 대상 화면이 존재해야 한다(✅ done). **`P6`(승인 처리) = 조항 ⑵ 와 ⑷ 의 판정에 필요하다** — `P1.note` 실측 축자 「`accessRequestPending`·`canApproveVerification` 이 항상 `false`」라 **잠긴 행도 `Verified` 값도 지금은 화면에서 참이 되는 행이 0건**이고, 그 상태로는 두 조항을 판정할 수 없다. ⚠ **`P6` 를 걸어도 임계 경로는 늘지 않는다** — `P6` 는 최장 사슬의 3홉째이고 이 항목은 그 뒤 4홉째라 기존 5홉보다 짧다(`sessions/STAGE3-AI-SPLIT.md §9-4`). ／ ⭑ **`Verified` 다섯 열 유지 = Ted 판정(2026-08-30)으로 닫혔다.** 근거 셋 = ⓐ `_재검토_E02-E03_260826.md`(2026-08-26)가 **가장 나중**이고 `〈129〉` 지정 정본 13건에 든다 ⓑ 그 문서 `:49` 축자 「**다섯 열 유지가 정답**」 ⓒ 지어진 실물이 이미 다섯이다(`columns.ts:17`). **앞선 두 읽기는 지우지 않고 「뒤집혔으나 보존」으로 남긴다** — ~~`Policy_데이터_찾기.md`(2026-08-18) `Verified` 8곳~~ 은 **다섯 열 유지와 같은 방향이라 뒤집힌 것이 아니라 재확인됐다** ／ ~~`Co-Lab_ver2_업로드_계보_260825_이태헌.html`(2026-08-25) `Verified` 0건·`카탈로그` 0건~~ 은 **배제 근거로 읽지 않는다** — 그 문서는 업로드·계보 단일 주제라 카탈로그를 겨냥한 침묵인지 문서 자체로 판별되지 않는다(`sessions/STAGE3-AI-SPLIT.md §8-7` 실측). **두 읽기 모두 원문 무삭제 · 날짜와 함께 보존.**"
