; import-boundary 게이트의 계약 정본 (import-linter 2.13).
;
; 강제하는 것 — CLAUDE.md §3-1 "도메인은 자기 테이블 + D1(shared kernel)만 참조한다.
; 타 도메인 직접 FK·접근 금지, cross-domain 은 Port 경유", §3-2 "D10 → D4 쓰기 경로 없음".
; 도메인 이름과 경계는 dev-package/DOMAINS.md 가 정본이고, 모듈 경로 관례는
; dev-package/sessions/D3-boundary.md §2 가 정본이다. P0 가 이 관례를 따라 코드를 놓는다.
;
; 루트 패키지가 하나라도 없으면 import-linter 는 그래프를 만들지 못하고 실패한다 — 그게 의도다.
; 코드가 생기기 전의 이 게이트는 red 이고, red 인 것이 정상이다 (CLAUDE.md §4).

[importlinter]
root_packages =
    colab_core
    colab_pipeline
    colab_viz
    colab_ai
include_external_packages = False

; ── 1. 배포 단위끼리 파이썬으로 붙지 않는다 ─────────────────────────────────
;    단위 간 통신은 seam(HTTP) 과 async 봉투뿐이다. import 로 붙는 순간 5개 배포 단위가
;    하나의 배포 단위가 된다.
[importlinter:contract:units-independent]
name = 배포 단위 4개는 서로를 import 하지 않는다
type = independence
modules =
    colab_core
    colab_pipeline
    colab_viz
    colab_ai

; ── 2. core-api 내부 층 ─────────────────────────────────────────────────────
;    app(조립 루트) → domains → ports(인터페이스) → kernel(스코프·세션·설정)
;    ports 가 domains 를 import 하면 Port 가 경계이기를 그만둔다.
[importlinter:contract:core-layers]
name = core-api 층 — app > domains > ports > kernel
type = layers
layers =
    colab_core.app
    colab_core.domains
    colab_core.ports
    colab_core.kernel

; ── 3. core-api 도메인 상호 독립 ────────────────────────────────────────────
;    D1 은 shared kernel 이라 이 목록에서 뺀다 (다른 도메인이 직접 참조해도 되는 유일한 예외).
;    나머지는 서로를 직접 import 할 수 없고 colab_core.ports 를 거친다.
[importlinter:contract:core-domains-independent]
name = D2·D3·D4·D6·D8 은 서로 직접 참조하지 않는다 (Port 경유)
type = independence
modules =
    colab_core.domains.d2_access
    colab_core.domains.d3_catalog
    colab_core.domains.d4_lineage
    colab_core.domains.d6_project
    colab_core.domains.d8_insight

; ── 4. shared kernel 은 위를 모른다 ─────────────────────────────────────────
;    D1 이 다른 도메인을 import 하면 "모두가 읽는 커널"이 "모두와 얽힌 커널"이 된다.
[importlinter:contract:d1-knows-nobody]
name = D1(shared kernel)은 다른 도메인을 import 하지 않는다
type = forbidden
source_modules =
    colab_core.domains.d1_identity
forbidden_modules =
    colab_core.domains.d2_access
    colab_core.domains.d3_catalog
    colab_core.domains.d4_lineage
    colab_core.domains.d6_project
    colab_core.domains.d8_insight
    colab_core.app

; ── 5. ai-service 내부 — D10 은 D9 를 Port 로만 읽는다 ──────────────────────
;    DOMAINS.md §2 "지식 레이어 → 읽기 전용 조회(Port) → 추론 레이어".
[importlinter:contract:ai-layers]
name = ai-service 층 — app > d10 > ports > d9
type = layers
layers =
    colab_ai.app
    colab_ai.domains.d10_ai_services
    colab_ai.ports
    colab_ai.domains.d9_ontology

; ── 6. D5 · D7 도 같은 관례를 따른다 ────────────────────────────────────────
[importlinter:contract:pipeline-layers]
name = pipeline-worker 층 — app > domains > ports > kernel
type = layers
layers =
    colab_pipeline.app
    colab_pipeline.domains
    colab_pipeline.ports
    colab_pipeline.kernel

[importlinter:contract:viz-layers]
name = viz-render 층 — app > domains > ports > kernel
type = layers
layers =
    colab_viz.app
    colab_viz.domains
    colab_viz.ports
    colab_viz.kernel

; ── 7. D10 은 D9 를 직접 import 하지 않는다 ─────────────────────────────────
;    layers 계약은 "아래층을 부르는 것"을 허용하므로 6번만으로는 이걸 막지 못한다.
;    D9 는 수문학 소유자가 정하는 지식이고, D10 은 그 표면(Port)만 안다.
[importlinter:contract:d10-reads-d9-via-port]
name = D10 은 D9 를 Port 로만 읽는다 (직접 import 금지)
type = forbidden
source_modules =
    colab_ai.domains.d10_ai_services
forbidden_modules =
    colab_ai.domains.d9_ontology
