# 자리에 있으나 지도 타일로 쓸 수 없는 파일 — **파일 이름으로** 적는다.
# 재사용은 이런 파일을 거절하고 다시 굽는다(그것이 옳다). 여기 적는 것은
# 「거절되는 잔재가 자리에 남아 있는 것을 알고 있다」는 선언이지 검사 면제가 아니다.
#
# **비어 있는 것은 「면제 없음」이다** — 「검사 안 함」이 아니다.
