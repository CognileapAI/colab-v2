# 게이트의 **병렬 안전성 선언** — `gates/run.sh all [-j N]` 이 읽는 정본.
#
# 왜 여기 있는가: `gates/README.md` 는 「`db-selftest` 는 병렬로 돌리지 않는다」고 적어 두었는데
# **실행기가 그 선언을 읽지 않았다.** 그래서 `-j 2` 에서 `db-selftest` 가 red 였고 단독으로는
# green 이었다 — **판정이 아니라 배선이 낸 red** 이고, 이 레포가 이미 한 번 겪은 거짓 red 와
# 같은 뿌리다(`gates/README.md` 「빨리 도는 것과 덜 보는 것은 다르다」 · `CLAUDE.md §4`).
#
# 고치는 방향은 **병렬도를 낮추는 것도 · 재시도도 · 건너뛰기도 아니다.** 게이트가 자기 요구를
# 선언하고 실행기가 그것을 지킨다. 선언은 게이트 곁(이 표)에 있고 실행기 안에 이름 목록으로
# 박히지 않는다 — 다른 정본들(`db-boundaries.toml`·`rls-allowlist.toml`)과 같은 배치다.
#
# ── 세 상태 (`CLAUDE.md §4`) ────────────────────────────────────────────────
#   "serial"    단독으로 돈다. 다른 게이트가 하나도 같이 돌지 않는다.
#   "parallel"  풀에서 동시에 돈다.
#   **선언 없음**  → 실행기가 **안전한 쪽(단독)** 을 고르고 **그렇게 했다고 출력에 적는다.**
#                  조용히 「병렬 안전」으로 가정하지 않는다. 미선언을 통과로 세지 않는 것과 같은 규율이다.
#
# ⚠ 값을 `serial` → `parallel` 로 바꾸는 편집은 **격리 요구를 없앤 결정**이지 속도 튜닝이 아니다.
#   근거 없이 바꾸지 않는다.

[gates]
# ── 단독 실행이 필요한 것 ───────────────────────────────────────────────────
# `schema-diff` e2e 묶음이 **한 적용 DB 를 순서대로 훼손해 가며** 본다. 동시에 돌면 케이스가
# 서로의 드리프트를 본다 — 격리를 깨는 속도는 속도가 아니다 (`gates/README.md`).
"db-selftest" = "serial"

# ── 병렬 안전 ───────────────────────────────────────────────────────────────
# 근거 = `gates/README.md` 「빨리 도는 것과 덜 보는 것은 다르다」 — 검사 대상·기대값·판정 기준이
# 실행 순서에 걸리지 않는다. DB 를 쓰는 것들은 **자기 일회용 컨테이너**를 들고 다니고(`_pg.sh`),
# 도구 설치 구간은 잠금으로 갈라져 있다(`_lock.sh`).
"planning-freshness"        = "parallel"
"harness-contract"          = "parallel"
"harness-contract-selftest" = "parallel"
"contract-lint"             = "parallel"
"contract-breaking"         = "parallel"
"event-lint"                = "parallel"
"event-breaking"            = "parallel"
"seam-consistency"          = "parallel"
"generated-up-to-date"      = "parallel"
"import-boundary"           = "parallel"
"banned-import"             = "parallel"
"ai-no-lineage-write"       = "parallel"
"db-boundary"               = "parallel"
"migration-single-head"     = "parallel"
"schema-diff"               = "parallel"
"rls-coverage"              = "parallel"
"rls-effect"                = "parallel"
"work-item-consistency"     = "parallel"
"ops-observability"         = "parallel"
"ops-observability-selftest" = "parallel"
"operator-notifications" = "serial"
"operator-notifications-selftest" = "parallel"
# `artifact-ownership` — 대조 정본에 **읽기만 한다**(매 회차 쓰기 탐침이 증명) · 자리에는
#   한 글자도 쓰지 않는다(스냅숏은 자기 임시 자리에 적는다). selftest 는 자기 일회용 컨테이너를 든다.
"artifact-ownership"        = "parallel"
"artifact-ownership-selftest" = "parallel"
"stage2-markers"            = "parallel"
# `frontend-typecheck` — 읽기만 한다(`tsc --noEmit` · 산출 파일 0). 공유 자원은
#   `frontend/node_modules` 뿐이고 그것도 읽기다. DB·포트·잠금을 잡지 않는다.
"frontend-typecheck"        = "parallel"
# `frontend-typecheck-selftest` — 사본 트리를 자기 `mktemp -d` 안에만 만들고
#   `node_modules` 는 링크로 빌려 **읽는다**. 진짜 `frontend/` 에는 한 글자도 쓰지 않는다.
"frontend-typecheck-selftest" = "parallel"
# `frontend-fixture-reach` — 읽기만 한다(상대 import 를 따라 파일을 읽을 뿐 산출물이 없다).
#   공유 자원은 없다 — `frontend/node_modules` 조차 필요 없는 zero-dependency 워커다.
"frontend-fixture-reach"        = "parallel"
# `frontend-fixture-reach-selftest` — `gates/fixtures/frontend-fixture-reach/` 를 **읽기만** 한다.
#   워커가 파일 시스템에 아무것도 쓰지 않으므로 사본을 뜨지 않고 그대로 가리켜 돈다.
"frontend-fixture-reach-selftest" = "parallel"
"contract-selftest"         = "parallel"
"event-selftest"            = "parallel"
"boundary-selftest"         = "parallel"
"db-boundary-selftest"      = "parallel"
"rls-effect-selftest"       = "parallel"
"seam-consistency-selftest" = "parallel"
"generated-selftest"        = "parallel"
"work-item-selftest"        = "parallel"
"stage2-markers-selftest"   = "parallel"

# `autometa-loss` — 실측 근거: 이 게이트는 대조 정본에 **읽기만 한다.**
#   ⭑ ⟨개정 2026-08-31 · `PLAN-SoT §9 〈237〉`⟩ 대조 정본이 **staging 실물 platform DB** 로 갈렸다
#     (`COLAB_AUTOMETA_STAGING_DB_URL`). **읽기 전용이라는 성질은 더 강해졌다.**
#   ⚠ 「INSERT·CREATE 가 한 건도 없다」는 근거는 이제 쓰지 않는다 — 스크립트 안에
#     `CREATE TEMP TABLE` 이 **일부러** 하나 있다. 그것이 **쓰기 탐침**이고, 읽기 전용
#     트랜잭션에서 **반드시 거부당해야 하는** 문장이다(거부당하지 않으면 게이트가 red 를 낸다).
#     탐침은 ⑴ 임시 테이블이고 ⑵ 세이브포인트로 되감기며 ⑶ 트랜잭션 전체가 ROLLBACK 된다 —
#     **스크립트 어디에도 COMMIT 이 없다.** 즉 남는 흔적이 0 이고 다른 게이트와 경합하지 않는다.
#   도커·임시 파일·잠금도 쓰지 않는다. 실행 순서가 판정을 바꾸지 않는다.
"autometa-loss"             = "parallel"

# `autometa-loss-selftest` — 실측 근거: **자기 일회용 컨테이너 안에서만** 산다.
#   `_pg.sh` 의 `pg_start` 로 컨테이너를 뜨우고(이름 = PID＋난수 · 포트 미공개 · `--rm`),
#   그 안에 자기 DB(`autometaloss`)를 만들어 쓴다. 픽스처 파일은 자기 `mktemp -d` 안이고,
#   게이트에는 psql 을 주입해 **적용 DB URL 을 아예 쓰지 않는다**(주입된 psql 이 첫 인자를 버린다).
#   도커 데몬 경합은 `_pg.sh` 의 선언 한도(COLAB_PG_MAX_CONCURRENT)가 이미 받는다 —
#   `rls-coverage`·`rls-effect`·`schema-diff`·`stage2-markers` 가 같은 배치로 parallel 이다.
#   ⚠ `db-selftest` 를 serial 로 둔 이유(**한 적용 DB 를 순서대로 훼손해 가며** 본다)는
#     여기에 해당하지 않는다. 이쪽은 적용 DB 를 한 번도 건드리지 않는다.
"autometa-loss-selftest"    = "parallel"

# `preview-tile-slot` — 실측 근거: **적용 DB 에 읽기만 하고, 자리에도 읽기만 한다.**
#   `gates/tools/preview-tile-slot.sh` 안에 INSERT·UPDATE·DELETE·CREATE·DROP·ALTER·TRUNCATE 가
#   한 건도 없다(질의는 `SELECT count(DISTINCT upload_id) …` 하나뿐). 자리 접촉은 `find` 와
#   파일 읽기뿐이라 파일을 만들지도 지우지도 않는다. 도커·임시 파일·잠금도 쓰지 않는다.
#   경합 자원 둘(적용 DB · 미리보기 루트) 모두 읽기 전용이므로 실행 순서가 판정을 바꾸지 않는다.
"preview-tile-slot"         = "parallel"

# `preview-tile-slot-selftest` — 실측 근거: **자기 일회용 컨테이너와 자기 임시 자리 안에서만** 산다.
#   `_pg.sh` 의 `pg_start` 로 컨테이너를 뜨우고 그 안에 자기 DB(`previewtileslot`)를 만들어 쓴다.
#   픽스처 TIFF·면제 선언·타일 자리는 전부 자기 `mktemp -d` 안이고, 게이트에는 psql 을 주입해
#   **적용 DB URL 을 아예 쓰지 않는다.** 레포의 `gates/config` 에는 한 글자도 쓰지 않는다.
#   ⚠ **그런데도 `serial` 이다 — 실측 근거가 그쪽이다.** parallel 로 두고 `all -j 2` 를 두 번 돌리니
#     한 번은 green 28 / red 3, 한 번은 **일회용 postgres 슬롯 고갈로 다른 게이트가 `환경대기` red**
#     였다(2026-08-30 실측). 이 배포에서 pg 를 쓰는 게이트가 하나 늘어난 만큼 슬롯이 모자란다.
#     **재현되지 않는 red 는 판정이 아니라 배선이 낸 red 이고, 그것을 통과로도 실패로도 셀 수 없다.**
#     슬롯 한도를 올려 green 을 만들지 않는다 — 한도는 이 호스트가 감당하는 값이다.
"preview-tile-slot-selftest" = "serial"

# `e2e-format-coverage` — 실측 근거: **원천을 읽기만 하고 자기 임시 파일에만 쓴다.**
#   `gates/tools/e2e-format-coverage.sh` 는 원천 디렉터리를 `-d` 로 확인만 하고,
#   시험은 각자 `tmp_path` 안에 대상을 세운다(`put_target` 픽스처). 산출은 `mktemp` 로
#   받은 junit XML 하나뿐이고, DB·도커·잠금을 쓰지 않는다. 적용 DB 접속 0건.
#   ⚠ 다만 **원천 3.5 GB 를 읽는 구간이 있어 디스크가 경합 자원이다** — 판정을 바꾸지는
#     않으므로 parallel 로 둔다. 판정이 흔들리는 것이 관측되면 그때 `serial` 로 선언한다.
"e2e-format-coverage"       = "parallel"

# `e2e-format-coverage-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
#   junit XML 과 선언 파일을 직접 지어 판정부에 먹인다. 실제 시험을 돌리지 않으므로
#   원천도 DB 도 도커도 쓰지 않는다. 레포의 `gates/config` 에는 한 글자도 쓰지 않는다.
"e2e-format-coverage-selftest" = "parallel"

# `render-latency` — **시간을 재는 게이트라 경합이 곧 판정을 흔든다.**
#   다른 게이트와 CPU·디스크를 나눠 쓰면 렌더 시간이 늘고, 그 red 는 **검사 대상이 아니라
#   배선이 낸 red** 다. 그것을 통과로도 실패로도 셀 수 없다(`preview-tile-slot-selftest` 와 같은 사유).
#   자원 충돌이 없어서가 아니라 **측정값이 흔들리기 때문에** serial 이다 — 눈금을 늘려
#   green 을 만들지 않는다.
"render-latency"            = "serial"

# `frontend-test` — **`serial` 이다.** 자원 충돌이 아니라 **부하** 가 이유다.
#   `vitest run` 은 시험 파일 24개를 **워커 여럿으로 동시에** 돌린다 — 이 게이트 하나가
#   이미 호스트의 CPU 를 전부 쓴다. 다른 게이트와 겹치면 ⑴ 저쪽이 느려지고 ⑵ 시간을 재는
#   `render-latency` 와 같은 사유로 **판정이 흔들릴 수 있다.** 파일 쓰기는 0(읽기 전용 ·
#   산출물 없음)이고 DB·포트·잠금도 잡지 않으므로 **격리 요구는 없다** — 그런데도 serial 인
#   것은 `render-latency` 와 같은 배치다(경합이 곧 판정을 흔드는 자리).
#   ⚠ 이 값을 `parallel` 로 바꾸려면 **실측**이 필요하다 — `-j 2` 이상에서 이 게이트와 다른
#     게이트의 판정이 단독 실행과 같은지 두 번 이상 재고 그 근거를 여기에 적는다.
"frontend-test"             = "serial"

# `frontend-test-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
#   설정 파일만 복사하고 시험은 **자기가 지어 넣는다**(통과 1건 · 실패 1건 · 0건). 진짜
#   `frontend/test` 446건을 돌리지 않으므로 부하가 작고, `node_modules` 는 링크로 빌려
#   **읽는다.** 진짜 `frontend/` 에는 한 글자도 쓰지 않는다. DB·도커·포트를 잡지 않는다.
"frontend-test-selftest"    = "parallel"

# ── 서비스 pytest 묶음 (2026-09-03 코드리뷰 #6) ─────────────────────────────
# `service-tests-*` — **넷 다 `serial` 이다.** 자원 충돌이 아니라 **부하**가 이유이고,
#   `frontend-test` 를 serial 로 둔 것과 같은 배치다. 한 묶음이 수백 건(core-api 552 ·
#   pipeline-worker 200 · viz-render 199 · ai-service 119)을 돌아 호스트 CPU 를 통째로 쓴다.
#   겹치면 ⑴ 저쪽이 느려지고 ⑵ 시간을 재는 `render-latency` 와 같은 사유로 **판정이 흔들린다.**
#   `service-tests-core-api` 는 더해서 **일회용 postgres 슬롯을 하나 잡는다**(`_pg.sh`) —
#   `preview-tile-slot-selftest` 를 serial 로 만든 슬롯 고갈(2026-08-30 실측)에 기여하는 쪽이다.
#   ⚠ 이 값을 `parallel` 로 바꾸려면 **실측**이 필요하다 — `-j 2` 이상에서 이 게이트와 다른
#     게이트의 판정이 단독 실행과 같은지 두 번 이상 재고 그 근거를 여기에 적는다.
"service-tests-core-api"        = "serial"
"service-tests-ai-service"      = "serial"
"service-tests-viz-render"      = "serial"
"service-tests-pipeline-worker" = "serial"

# `service-tests-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
#   픽스처 트리(`gates/fixtures/service-tests/`)를 복사해 거기서 돌고, 서비스 묶음은
#   한 건도 돌리지 않는다(케이스당 시험 0~2건). 서비스 venv 의 파이썬은 **읽기**로만 빌린다.
#   `services/**` 에도 `gates/config` 에도 한 글자도 쓰지 않는다. DB·도커·포트를 잡지 않는다.
"service-tests-selftest"        = "parallel"

# `render-latency-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
#   junit XML 과 선언 파일을 직접 지어 판정부에 먹인다. 실제 렌더를 돌리지 않으므로
#   시간도 원천도 DB 도 도커도 쓰지 않는다. 레포의 `gates/config` 에는 한 글자도 쓰지 않는다.
"render-latency-selftest"   = "parallel"

# `backup-cron-streak` — 실측 근거: **파일 하나를 읽기만 한다.**
#   `gates/tools/backup-cron-streak.sh` 는 `~/colab-v2-backups/staging-backup.log` 를
#   `grep`·`sed`·`tail` 로 읽는 것이 전부다. 쓰기 0 · DB 0 · 도커 0 · 포트 0 · 잠금 0.
#   **크론 회차를 재실행하지 않으므로**(설계 의도 · `〈286〉` ①) 백업 스크립트와도 경합하지 않는다.
#   ⚠ **pg 슬롯을 쓰지 않는다** — `preview-tile-slot-selftest` 를 serial 로 만든 슬롯 고갈
#     (2026-08-30 실측)에 이 게이트는 기여하지 않는다.
#   실행 순서가 판정을 바꾸지 않는다 — 판정 입력은 이미 04:40 에 확정돼 파일에 적혀 있다.
"backup-cron-streak"        = "parallel"

# `backup-cron-streak-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
#   로그 파일을 직접 지어 판정부에 먹인다. 실제 백업도 크론도 돌리지 않으므로 보관처도
#   DB 도 도커도 쓰지 않는다. `~/colab-v2-backups` 에는 **한 글자도 쓰지 않는다**
#   (`COLAB_BACKUP_STATE_DIR` 를 자기 임시 자리로 물린다). 기준 시각도 고정 주입이라
#   실행 시점이 판정을 바꾸지 않는다.
"backup-cron-streak-selftest" = "parallel"

# `exec-bit` — 실측 근거: **인덱스를 읽기만 한다.**
#   판정 입력은 `git ls-files -s -- '*.sh'` 한 줄이고 파일 내용도 열지 않는다.
#   쓰기 0 · DB 0 · 도커 0 · 포트 0 · 잠금 0 · pg 슬롯 0. 실행 순서가 판정을 바꾸지 않는다.
"exec-bit"                  = "parallel"

# `exec-bit-selftest` — 실측 근거: **자기 `mktemp -d` 안의 일회용 레포에서만** 산다.
#   케이스마다 `git init` 으로 픽스처 레포를 세우고 게이트에 `COLAB_EXEC_BIT_ROOT` 로 물린다.
#   이 레포의 인덱스에는 **한 글자도 쓰지 않는다**(`git update-index` 대상이 전부 픽스처 안).
#   DB·도커·포트·pg 슬롯을 잡지 않는다.
"exec-bit-selftest"         = "parallel"

# `migration-drift` — 실측 근거: **오라클마다 자기 일회용 컨테이너를 띄운다.**
#   이름은 `s1db_drift_$$_$RANDOM` 이라 겹치지 않고 **호스트 포트를 하나도 열지 않는다.**
#   그런데 12벌이 각각 postgres 를 세우고 DB 를 여러 개 만든다 — 다른 게이트와 동시에 돌면
#   도커 데몬·메모리를 함께 밟고, 그때 나는 red 는 **판정이 아니라 배선이 낸 red** 다
#   (`db-selftest` 를 병렬에서 뺀 것과 같은 뿌리). 안전한 쪽을 고른다.
"migration-drift"           = "serial"

# `migration-drift-selftest` — 실측 근거: **자기 `mktemp -d` 안의 가짜 오라클에서만** 산다.
#   `db/**` 에는 한 글자도 쓰지 않고 컨테이너를 하나도 띄우지 않는다(도구 확인용 stub 만 둔다).
#   DB·도커·포트·pg 슬롯 0.
"migration-drift-selftest"  = "parallel"

# `harness-eval` — **`serial` 이다.** 실행 모드(`COLAB_HARNESS_EVAL=1`)에서 과제마다
#   `claude -p` 를 2회씩 부르고 **시간과 달러를 상한으로 잰다**(`COLAB_EVAL_TIMEOUT` ·
#   `COLAB_EVAL_BUDGET`). 다른 게이트와 CPU·네트워크를 나눠 쓰면 한 회차가 상한을 넘고,
#   그 red 는 **검사 대상이 아니라 배선이 낸 red** 다 — `render-latency` 를 serial 로 둔 것과
#   같은 사유(경합이 곧 판정을 흔드는 자리)이고, 그것을 통과로도 실패로도 셀 수 없다.
#   상한을 늘려 green 을 만들지 않는다 — 상한의 근거는 첫 실측 p95×2 다(intent Q7).
#   ⚠ 면제 모드(`COLAB_HARNESS_EVAL_EXEMPT=1`)는 디렉터리만 세므로 경합이 없다. 그런데도
#     serial 인 것은 **선언이 모드마다 갈리면 안 되기 때문**이다 — 값 하나가 두 뜻을 갖지 않는다.
"harness-eval"              = "serial"

# ── ⟨2026-09-17 · 이슈 #56⟩ 미선언 10건 선언 ────────────────────────────────
# 지금까지 이 10건은 선언이 없어 실행기가 매 전수마다 「안전한 쪽(단독)」으로 접고
# 「미선언 N건」 경고를 찍었다(`gates/run.sh:796-797`). 상시 출력은 신호가 아니다.
# 아래 근거는 전부 **레인이 이번에 스크립트를 직접 열어 읽은** `file:line` 이다.
# 읽고도 parallel 을 확신하지 못한 것은 `serial` 로 적었다.

# `agent-bridge` — **`serial` 이다.** 격리 요구가 아니라 **벽시계**가 이유다.
#   `gates/run.sh:206` 이 도는 6모듈의 격리 자체는 문제가 없다(`tempfile.TemporaryDirectory()` ·
#   docker·psycopg·포트·`_pg.sh` 히트 0건). 그런데 그중 두 모듈이 **자식 프로세스 기동을
#   벽시계 상한 아래에서 단언**한다 — `scripts/tests/test_deploy_release.py:136-138`
#   (`deadline=time.monotonic()+5` 뒤 `assertTrue((self.root/'ready').exists())` ·
#   `proc.wait(timeout=3)`) 와 `scripts/tests/test_agent_bridge.py:211-213`
#   (`deadline = time.monotonic() + 10`). 경합에서 인터프리터 기동이 밀리면 그 red 는
#   **판정이 아니라 배선이 낸 red** 다 — `render-latency`·`harness-eval` 을 serial 로 둔 것과
#   같은 사유다. 격리 요구의 유무가 아니라 **측정값이 흔들리는가**가 이 레포의 기준이다.
"agent-bridge"              = "serial"

# `seed-plan-drift` — 실측 근거: **커밋된 등재표와 정본 md 를 읽기만 한다.**
#   `gates/tools/seed-plan-drift.sh:62` 가 생성기를 `--check-manifest` 로 부르고,
#   `dev-package/tools/dev-seed/build_plan.py:445-446` 이 그 갈래에서 대조 결과를 **그대로 반환**한다 —
#   등재표를 쓰는 자리(`:505-507` `manifest_out.write_text`)는 이 갈래에 닿지 않는다.
#   실물 대조도 `seed-plan-drift.sh:79` `--dry-run --ref-root` 로 읽기뿐이다.
#   `mktemp`·`docker`·`_pg.sh`·`_lock.sh` 히트 0건이고 `COLAB_REF_ROOT`(`:72`)는 읽기 입력이다 —
#   미선언이면 `:104` 에서 red(준비)로 서며 이는 실행 순서가 아니라 환경이 정한다.
"seed-plan-drift"           = "parallel"

# `seed-plan-drift-selftest` — 실측 근거: **자기 `mktemp -d` 안에서만** 산다.
