"seed-plan-drift-selftest"  = "parallel"

# `harness-eval-selftest` — **`serial` 이다. 벽시계가 판정에 들어간다.**
#   `gates/tools/harness-eval-selftest.sh:79-81` 이 `COLAB_EVAL_TIMEOUT=1 STUB_SLEEP=4` 로 상한 초과를,
