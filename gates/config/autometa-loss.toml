# 자동 정보 되쓰기 유실 감지 — **면제 선언의 유일한 정본**.
#
# 이 파일이 하는 일은 하나다: **「반영되지 않았는데 그래도 통과」인 대상을 이름으로 고정한다.**
# 조건문으로 넓히지 않는다 — 조건은 언젠가 관대해지고, 관대해진 조건은 아무 말도 안 한다.
# 여기 적힌 것은 게이트 출력에 **건수와 함께 반드시 드러난다.**
#
# 세 상태 (`CLAUDE.md §4`):
#   · 대상이 있으면        → 검사한다
#   · 여기 적혀 있으면      → 건수를 드러낸 채 넘어간다
#   · 아무 말도 없으면      → **red**. 「대상 0건」도 red 다
#
# ⚠ **`enabled` 같은 스위치를 두지 않는다.** 게이트를 끄는 값은 이 파일에 존재하지 않는다.

[exempt]
# 등록 시점에 소비자가 아직 없었던 데이터셋 — **소급 반영은 별건**이다(원장 되쓰기라 판정이
# 필요하고, 대상 목록을 고정한 뒤에만 집행한다). 그때까지 이 목록이 그 사실을 드러낸다.
#
# **비어 있는 것은 「면제 없음」이다** — 「검사 안 함」이 아니다.
datasets = []
reason = "미작성 — 소급 반영 대상이 정해지면 그 데이터셋 id 를 여기 적는다"
