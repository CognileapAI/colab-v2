# rls-coverage 게이트의 **유일한 정의처**. 스크립트는 목록을 갖지 않는다 — 두 곳에 적으면 갈라진다.
#
# 근거: CLAUDE.md §3-5 (모든 조회에 연구실 경계가 자동 주입된다)
#       PLAN-SoT §9-㉖ · PERMISSION-PRINCIPLES P-34 (잠금 시행은 두 층 — 경계는 RLS, 본체도 RLS)
#
# 규칙
#   - allow_no_rls 에 없는 테이블이 RLS 없이 존재하면 **red**
#   - allow_no_rls 에 적었으나 실제 DB 에 없는 테이블도 **red** (낡은 면제는 조용한 구멍이다)
#   - RLS 는 ENABLE 만으로 부족하다. **FORCE 까지** 켜야 한다 (테이블 소유자에게도 정책이 걸린다)
#   - 정책 이름 관례로 "무슨 정책인지"를 판정한다. 필수 이름이 없으면 red.
#     그 밖의 정책이 더 걸려 있는 것은 red 가 아니지만 출력에 찍는다 (사람이 보라고)

[policy_naming]
# 연구실 경계 정책 — 모든 테넌시 대상 테이블에 필수 (CLAUDE.md §3-5).
lab_boundary = "lab_boundary"
# 파일 본체 접근 정책 — 허용자 목록 + 만료일 (P-34 · §9-㉖). 본체 테이블에만 추가로 필수.
body_access  = "body_access"

[platform]
# 파일 **본체** 테이블 — 경계 정책 + 본체 정책 **둘 다** 걸려야 한다 (P-34 ③).
# 데이터셋 메타(이름·요약)에는 본체 정책을 걸지 않는다 — 걸면 P-13 이 깨지고 E-06 승인 흐름이 죽는다.
body_tables = [
  "d3_file",          # 파일 본체 (다운로드·원본)
  # "d5_upload_file", # **등록 전** 임시 원장의 파일. `0004` 이 만들었고 RLS 경계 정책은 걸려 있다
  #                   # (ENABLE + FORCE + lab_boundary — 면제가 아니다). 여기 **없는** 이유는
  #                   # `body_access` 를 걸 대상이 없기 때문이다: 그 정책은 `d2_dataset_access`·
  #                   # `d1_lab_profile` 을 `dataset_id` 로 조회하는데 등록 전 업로드에는
  #                   # **데이터셋이 아직 없다** (`〈64〉-ⓓ` — `upload.ready` 에 `datasetId` 가 없다).
  #                   # 대신 지켜야 할 것은 「올린 사람 말고는 못 본다」이고, 그 판정 재료(`uploader_account_id`)
  #                   # 는 표 안에 있다. **누가 그것을 강제하는가는 아직 열려 있다** —
  #                   # 현재는 `ports/ingestion.py`(P2-api 소관) 이고, DB 층으로 내리려면
  #                   # `d5_upload_file` 전용 RESTRICTIVE 정책을 새로 써야 한다.
  #                   # **P2-db 가 관례로 정하지 않고 남긴다** — W2 `P2-api` 가 닫을 자리다.
  # "d7_viz_source",  # 시각화 소스 — D7 저장 형태는 P3 이 정한다(DataModel v1.8 범위 밖).
  #                   # 테이블이 없는데 여기 적어 두면 게이트가 "낡은 면제"로 red 를 낸다.
  #                   # **P3 에서 테이블을 만들 때 이 줄을 되살린다** — 지우지 않고 주석으로 남기는 이유가 그것이다.
]
# RLS 가 없어도 되는 테이블. **참조 테이블·전역 테이블만.** 연구실 데이터를 담으면 여기 올 수 없다.
allow_no_rls = [
  "alembic_version_platform",  # 마이그레이션 체인 상태. 연구실 데이터가 아니다
  "d1_lab",                    # 테넌트 루트 그 자체 — 자기가 경계다 (DATAMODEL-BASELINE §1 D1)
]

[ai]
body_tables = []
allow_no_rls = [
  "alembic_version_ai",
  # D9 온톨로지는 연구실 공통 지식이다 — 테넌트별로 갈리지 않는다 (DOMAINS.md D9).
  # 접두사가 아니라 이름을 하나씩 적는다. 접두사 면제는 나중에 아무 테이블이나 숨는 문이 된다.
  #
  # K1 시드 테이블 3종 (PLAN-SoT §9-㊸-④-4 · ONTOLOGY-SCOPE §④-4).
  # 세 표 모두 lab_id 컬럼이 없다 — **담을 연구실 데이터가 없다**는 것이 면제의 근거다.
  # 값의 출처는 기획 정본 인용뿐이고(K2 시드), 사람이 쓴 문장은 이 표로 되돌아오지 않는다
  # (ONTOLOGY-SCOPE §2.6-⑷ — 학습 루프를 1차에 만들지 않는다).
  # 연구실 데이터가 한 줄이라도 들어오게 되는 날, 그 줄은 이 목록에서 내려가고 RLS 를 받는다.
  "d9_method_term",     # 가공 방식 후보 어휘. 정본 자유 문자열을 닫지 않는 제안용 후보 (§2.6)
  "d9_topic_synonym",   # 질의어 → 주제 4값 매핑. 주제 목록 자체가 전역 고정 목록이다 (`P04 §5`)
  "d9_place_alias",     # 지명 별칭. 정본이 쓴 지명뿐이고 위계·좌표는 담지 않는다 (§2.4)
  #
  # K1b 개념 그래프 2종 (Ted 판정 2026-08-25 · PLAN-SoT §9-〈86〉 · ONTOLOGY-SCOPE §⑦).
  # 위 셋과 같은 근거다 — lab_id 컬럼이 없고, **담을 연구실 데이터가 없다.**
  # 들어오는 값은 기획 정본 인용과 SEED-DATA 실측 어휘뿐이고, kind 4값(방법·주제·지명·원천표기)이
  # 「데이터셋에 대한 사실」이 들어올 자리를 스키마에서 아예 막는다 (CLAUDE.md §3-2).
  # 연구실 데이터가 한 줄이라도 들어오게 되는 날, 그 줄은 이 목록에서 내려가고 RLS 를 받는다.
  "d9_concept",         # 개념 노드 49 — 방법·주제·지명·원천표기. 등급 ⑥ 노드는 0 건이다
  "d9_concept_edge",    # 개념 엣지 19 — 같은 말이다 11 · ~의 한 가지다 7 · 안에 있다 1
]
