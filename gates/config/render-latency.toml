# 미리보기 렌더 성능 합격선 — **기계가 읽는 유일한 자리**.
#
# 값의 정본은 정본 문서 `Policy_데이터셋_상세` v2.6 `§8` 「확대(줌)」 조건 ⑺ 이고,
# 그 결정과 근거는 `dev-package/PLAN-SoT.md §9 〈233〉` 이다. 이 파일은 **그 값의 집행부**다.
#
# ⚠ **`enabled` 같은 스위치를 두지 않는다.** 게이트를 끄는 값은 이 파일에 존재하지 않는다.
#
# 세 상태 (`CLAUDE.md §4`):
#   · 표본이 있으면 → 판정한다 (p95 초과 또는 상한 초과 하나라도 있으면 red)
#   · 표본이 0건이면 → **red**. 「못 쟀다」는 통과가 아니다
#   · 선언이 없으면 → red

["합격선"]
# ── 미리보기 최초 표시 ────────────────────────────────────────────────────────
# ⓐ p95 = 10 초. **실측 p95 는 2.081 초**(2026-08-30 · 표본 35 · 포맷 5종 실원천)이고,
#    이 눈금은 그 위에 다음 넷의 몫을 얹은 값이다 — core-api 중계 왕복 · 화면 조회 주기
#    (`pollMs` 기본 1,000 ms) · 그림 내려받기 · 계약이 허용하는 상한 크기(500 MB)까지의 여유.
#    **코퍼스에서 가장 큰 본체**(53 MB `.npy` ＋ 214 MB 격자)도 중앙값 0.855 초였다.
# ⓑ 상한 = 60 초. 하나라도 넘으면 그 건은 **실패**다 (Ted 판정 · PoC 「한 파일 해석 60초」 선례).
#
# ⚠ 여기서 재는 것은 **렌더 시간**이고 화면 왕복이 아니다. 시험 머리말이 「재지 않은 넷」을
#    이름으로 적는다 — 재지 않은 것을 잰 것처럼 쓰지 않는다 (`DATA-REFERENCE §0`).
"미리보기_p95_초" = 10.0
"미리보기_상한_초" = 60.0

# 표본이 이보다 적으면 red — p95 라는 말이 성립하지 않는 표본으로 통과를 찍지 않는다.
"최소_표본" = 10
# 포맷이 이보다 적으면 red — 한 포맷만 빠르면 통과가 되는 것을 막는다.
"최소_포맷" = 5
