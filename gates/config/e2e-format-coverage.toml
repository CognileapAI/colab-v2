# 실데이터 포맷 완주 커버리지 — **필수 목록과 면제 선언의 유일한 정본**.
#
# 이 파일이 하는 일은 둘이다.
#   ① 지원 포맷 목록을 **이름으로** 고정한다 (숫자가 아니라 목록이다 — `〈51〉`·`〈77〉`)
#   ② 그중 실데이터로 그리지 않는 것을 **이름과 사유로** 고정한다
#
# 세 상태 (`CLAUDE.md §4`):
#   · 그 포맷의 실데이터 케이스가 있으면 → 검사한다 (하나라도 실패면 red)
#   · 여기 `[면제]` 에 적혀 있으면        → 건수를 드러낸 채 넘어간다
#   · 아무 말도 없으면                   → **red**. 「케이스 0건」도 red 다
#
# ⚠ **`enabled` 같은 스위치를 두지 않는다.** 게이트를 끄는 값은 이 파일에 존재하지 않는다.

[required]
# 정본 = `WORK-UNITS §7` `S3` 행 축자 —
#   「⚠ 다만 지원 포맷 목록은 `〈77〉` 로 `NetCDF · Binary · HDF4 · GeoTIFF · NumPy` 가 된다
#     — S3 이 열릴 때 그 목록으로 판정한다」
# **이름이 「4종」인 것과 목록이 다섯인 것은 어긋난 채로 등재돼 있다**(대장 `S3` 의 `note`).
# 여기서 그 갈림을 고르지 않는다 — 정본이 「그 목록으로 판정한다」고 적은 쪽을 그대로 옮긴다.
#
# ⭑⭑ **`#58`(파서 4→6 · `PLAN-SoT §9 〈271〉-㉯`) 회차의 재대조 — 값은 안 바뀐다.**
#   `#58` 이 채운 것은 **처리**(`d5/parse.py` 의 분기)이고 그 상대는
#   `SUPPORTED_FORMATS`(**6종 · GRIB 포함**)다. 그런데 **이 파일이 재는 것은
#   「실데이터가 화면에 그려지는가」**이므로 상대는 `RENDERABLE_FORMATS`(**5종**)다.
#   `GRIB` 은 **지원하되 그릴 수 없는** 포맷이라(`〈134〉` 결정 2-3 — 「5종이어도 grib 은
#   미리보기 대상이 아니다」) 여기 넣으면 **영원히 못 채우는 필수 항**이 된다.
#   ⟹ **다섯 그대로 둔다.** 여섯으로 맞추지 않는 것이 판정이다.
#   이 규칙은 주석이 아니라 시험이 지킨다 —
#   `services/pipeline-worker/tests/test_format_declaration_parity.py`
#   가 `[required] ∪ [면제] == RENDERABLE_FORMATS` 를 기계로 대조한다(갈리면 red).
formats = ["GeoTIFF", "NetCDF", "Binary", "HDF4", "NumPy"]

["면제"]
# 실데이터 케이스를 요구하지 않는 포맷 — **이름과 사유를 함께** 적는다.
# 여기 적힌 것은 게이트 출력에 **건수와 함께 반드시 드러난다.**
#
# **비어 있는 것은 「면제 없음」이다** — 「검사 안 함」이 아니다.
formats = []
reason = "미작성 — 면제할 포맷이 생기면 그 이름과 사유를 여기 적는다"
