# 실데이터 포맷 완주 커버리지 — **필수 목록과 면제 선언의 유일한 정본**.
#
# 이 파일이 하는 일은 둘이다.
#   ① 지원 포맷 목록을 **이름으로** 고정한다 (숫자가 아니라 목록이다 — `〈51〉`·`〈77〉`)
#   ② 그중 실데이터로 그리지 않는 것을 **이름과 사유로** 고정한다
#
# 세 상태 (`CLAUDE.md §4`):
#   · 그 포맷의 실데이터 케이스가 있으면 → 검사한다 (하나라도 실패면 red)
#   · 여기 `[면제]` 에 적혀 있으면        → 건수를 드러낸 채 넘어간다
#   · 아무 말도 없으면                   → **red**. 「케이스 0건」도 red 다
#
# ⚠ **`enabled` 같은 스위치를 두지 않는다.** 게이트를 끄는 값은 이 파일에 존재하지 않는다.

[required]
# 정본 = `RENDERABLE_FORMATS`와 이 목록의 이름 집합이다. GRIB과 일반 HDF5를 포함한
# 일곱 포맷 모두 실데이터 렌더 케이스가 있어야 한다. 이 규칙은 주석이 아니라 시험이 지킨다 —
#   `services/pipeline-worker/tests/test_format_declaration_parity.py`
#   가 `[required] ∪ [면제] == RENDERABLE_FORMATS` 를 기계로 대조한다(갈리면 red).
formats = ["GeoTIFF", "NetCDF", "Binary", "HDF4", "NumPy", "GRIB", "HDF5"]

["면제"]
# 실데이터 케이스를 요구하지 않는 포맷 — **이름과 사유를 함께** 적는다.
# 여기 적힌 것은 게이트 출력에 **건수와 함께 반드시 드러난다.**
#
# **비어 있는 것은 「면제 없음」이다** — 「검사 안 함」이 아니다.
formats = []
reason = "미작성 — 면제할 포맷이 생기면 그 이름과 사유를 여기 적는다"
