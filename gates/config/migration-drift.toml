# migration-drift 게이트의 **판정 대상과 기대 건수의 정본** (WU-C6 · 질의 3·4·30).
#
# 왜 파일로 두나: 기대 건수를 스크립트 안에 박으면 오라클이 한 벌 사라졌을 때
# 스크립트를 함께 고쳐야 하고, 그러면 「줄었다」가 **수정으로 위장**된다.
# 건수는 여기에 **선언**되고 게이트는 실측을 그 선언과 견준다.
#
# 규칙
#   - `min` 은 **최소**다. 실측이 `min` 보다 적으면 red — 오라클이 사라진 것이다.
#     실측이 더 많으면 green 이다(마이그레이션이 늘면 오라클도 는다).
#   - `min = 0` 은 쓰지 않는다. **대상 0건은 통과가 아니다**(CLAUDE.md §4 green-by-skip).
#   - 실측은 `<dir>/*-drift.sh` 를 센다. 이름 규칙이 정본이다.
#
# 2026-09-08 실측 — db/platform 11벌(0004~0019) · db/ai 1벌(0004-0005).
# 2026-09-08 WU-C7 — db/platform +3벌(0020·0021·0022) → 14 · db/ai +1벌(0006) → 2.
# ⚠ **db/ai 를 뺄 이유가 없다.** 라운드 파일의 「11벌」은 platform 체인의 수이고,
#   ai 체인의 오라클도 어느 게이트에도 안 걸려 있었다 — 두 체인 다 센다.
#   요약줄은 체인별로 따로 내고 합계를 함께 낸다(어느 체인이 줄었는지가 한 줄에 보여야 한다).
# 2026-09-08 WU-C13 — db/ai +1벌(`0007-drift.sh` · 두 순서 수렴) → **3**. platform 무변(14).
# 2026-09-18 develop 동기화 — db/platform +1벌(`0032-private-owner-drift.sh`) → **26**.
#   재부모화한 `0032_private_owner_access` 가 `0033_admin_body_access` 의 관리자 갈래를
