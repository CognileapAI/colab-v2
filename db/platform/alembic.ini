# db/platform/alembic.ini — platform 체인의 alembic 설정.
#
# **version_table 이 체인마다 다른 것이 체인 분리의 실물이다** (CLAUDE.md §3-3).
# 기본값(alembic_version)을 두 체인이 공유하면 한쪽 upgrade 가 다른 쪽 head 를 덮어써
# 체인이 갈라져 있다는 사실 자체가 사라진다. ai-no-lineage-write ⑪ 이 이 값을 본다.
#
# head 는 하나다 — 분기가 생기면 merge 리비전으로 합친다 (migration-single-head 게이트).
# 접속 URL 은 여기 적지 않는다. 환경변수로 넘긴다 (문서·설정에 절대경로·비밀을 적지 않는다).

[alembic]
script_location = .
version_locations = %(here)s/versions
version_table = alembic_version_platform
version_path_separator = os
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
