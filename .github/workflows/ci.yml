name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 어떤 경로가 바뀌었는지 판정한다. 모노레포지만 배포는 5개 단위로 독립이므로
  # 영향받은 것만 빌드·검증한다. contracts 변경은 전체를 깨울 수 있는 유일한 경로다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      core-api: ${{ steps.filter.outputs.core-api }}
      pipeline-worker: ${{ steps.filter.outputs.pipeline-worker }}
      viz-render: ${{ steps.filter.outputs.viz-render }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      db: ${{ steps.filter.outputs.db }}
      dev-package: ${{ steps.filter.outputs.dev-package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'gates/**'
            core-api:
              - 'services/core-api/**'
              - 'contracts/**'
              - 'db/platform/**'
            pipeline-worker:
              - 'services/pipeline-worker/**'
              - 'contracts/**'
            viz-render:
              - 'services/viz-render/**'
              - 'contracts/**'
            ai-service:
              - 'services/ai-service/**'
              - 'contracts/**'
              - 'db/ai/**'
            frontend:
              - 'frontend/**'
              - 'contracts/**'
            infra:
              - 'infra/**'
            db:
              - 'db/**'
            # 상태 대장과 그 반영본(산문). 게이트 자체가 바뀌어도 다시 판정한다 —
            # 판정기를 고치고 대상을 안 보는 것이 이 레포의 대표 실패형이다.
            dev-package:
              - 'dev-package/**'
              - 'gates/**'

  # ─────────────────────────────────────────────────────────────
  # 게이트. WU-D3에서 실제 검사를 채운다.
  # 지금은 골격이며, 각 스텝은 "아직 없음"을 명시적으로 알린다 —
  # 조용히 green이 되는 게이트는 게이트가 아니다.
  # ─────────────────────────────────────────────────────────────

  contract-gates:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 도구는 lock 파일이 **정확히** 고정한다. 캐시 키도 그 lock 의 해시다 —
      # lock 이 한 글자라도 바뀌면 키가 바뀌어 낡은 도구가 재사용될 수 없다.
      # (게이트 스크립트는 캐시 적중 여부와 무관하게 도구 부재를 red 로 낸다. 캐시는 속도만 바꾼다.)
      - uses: actions/cache@v4
        with:
          path: contracts/node_modules
          key: ${{ runner.os }}-node20-contracts-${{ hashFiles('contracts/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: gates/tools/node/node_modules
          key: ${{ runner.os }}-node20-gatetools-${{ hashFiles('gates/tools/node/package-lock.json') }}
      # ⭑ **캐시는 설치가 아니다.** 위 두 `cache` 스텝은 복원만 하고, 캐시가 비면
      #   `node_modules` 가 없는 채로 게이트가 돈다. `contract-lint`·`event-lint` 는
      #   부재를 보고 스스로 `npm ci` 하지만 **`generated-up-to-date` 는 하지 않는다** —
      #   등기부 첫 항목이 `frontend/node_modules/.bin/openapi-typescript` 를 직접 부르고,
      #   없으면 exit 127 로 red 다. 도구 부재를 red 로 내는 것은 **옳은 동작**이다.
      #   그래서 게이트를 무르게 고치지 않고 **설치 단계를 세운다.**
      #   ⚠ `frontend/` 는 캐시 대상에도 없었다. 캐시를 먼저 붙이고 설치를 그 뒤에 둔다.
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package-lock.json') }}
      # `npm ci` 는 lock 을 정본으로 삼는다 — `npm install` 이 아니다. lock 과 어긋나면 실패한다.
      # `--ignore-scripts` 를 쓰지 않는다: 도구가 postinstall 로 바이너리를 놓는 경우가 있고,
      # 「설치했는데 바이너리가 없다」는 캐시가 빈 것과 같은 red 로 되돌아온다.
      - name: 노드 의존 설치 (contracts · gates/tools/node · frontend — lock 이 정본)
        run: |
          set -euo pipefail
          npm ci --prefix contracts --no-audit --no-fund
          npm ci --prefix gates/tools/node --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      # 설치가 「돌았다」와 「도구가 실제로 있다」는 다르다. 셋을 **존재로** 확인한다 —
      # 확인 없이 다음 스텝으로 가면 부재가 게이트 red 로 위장해 원인이 한 겹 멀어진다.
      - name: 설치 확인 (도구 3종이 실물로 있는가)
        run: |
          set -euo pipefail
          test -x contracts/node_modules/.bin/spectral
          test -d gates/tools/node/node_modules/ajv
          test -x frontend/node_modules/.bin/openapi-typescript
      - name: seam 스펙 린트
        run: ./gates/run.sh contract-lint
      - name: 파괴적 변경 탐지 (emit vs frozen seam)
        run: ./gates/run.sh contract-breaking
      - name: 이벤트 계약 린트 (ajv — 스키마 + 인스턴스 픽스처)
        run: ./gates/run.sh event-lint
      - name: 이벤트 계약 파괴적 변경 탐지 ($defs 단위)
        run: ./gates/run.sh event-breaking
      - name: seam ↔ 이벤트 정합 (G-e·G-b·㉠·㉡ — WU-D2c)
        run: ./gates/run.sh seam-consistency
      - name: 생성물 최신성
        run: ./gates/run.sh generated-up-to-date

  # ─────────────────────────────────────────────────────────────
  # 프런트 게이트. **`contracts` 필터 잡에서 떼어낸다** (2026-09-03 코드리뷰 #6).
  # 종전에는 `frontend-typecheck`·`frontend-test` 가 `contract-gates` 안에 있었고 그 잡의
  # 조건은 `contracts == 'true'`(= `contracts/**`·`gates/**`)뿐이었다. `outputs.frontend` 는
  # 선언만 돼 있고 **소비처가 0개**였다 — 그래서 `frontend/` 만 바꾼 PR 은 **게이트 잡이 0개**로
  # 병합됐다(e935db2·d0c6aa4·05a4b2e 실측). 여기서 조건을 `frontend || contracts` 로 바꾼다.
  # ⚠ 두 번 돌지 않는다 — 위 `contract-gates` 에서 같은 두 스텝을 **뺐다.**
  #   (`contract-gates` 는 `generated-up-to-date` 때문에 여전히 `npm ci --prefix frontend` 를 돈다.)
  # ─────────────────────────────────────────────────────────────
  frontend-gates:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package-lock.json') }}
      # ⭑ **캐시는 설치가 아니다.** 위 스텝은 복원만 한다 — 캐시가 비면 `node_modules` 없이
      #   게이트가 돌고 그것은 red(준비 · 78)다. 그래서 설치 단계를 세운다.
      - name: 프런트 의존 설치 (lock 이 정본)
        run: npm ci --prefix frontend --no-audit --no-fund
      # 설치가 「돌았다」와 「도구가 실제로 있다」는 다르다. 부재가 게이트 red 로 위장하면
      # 원인이 한 겹 멀어진다 — 여기서 먼저 끊는다.
      - name: 설치 확인 (tsc·vitest 가 실물로 있는가)
        run: |
          set -euo pipefail
          test -x frontend/node_modules/.bin/tsc
          test -x frontend/node_modules/.bin/vitest
      # 프런트 타입 검사 — frontend/Dockerfile 의 `npm run build` 가 도는 그 검사.
      # 2026-09-02 이전에는 이 검사가 **이미지 빌드 안에만** 있어서, 깨진 `main` 이
      # staging 배포가 트일 때까지 10시간 반 동안 전 게이트 green 이었다.
      - name: 프런트 타입 검사 (tsc --noEmit · 이미지 빌드와 같은 검사)
        run: ./gates/run.sh frontend-typecheck
      # 화면 동작 시험 — frontend/package.json 의 `test`(vitest run) 와 같은 명령.
      # 2026-09-03 이전에는 frontend/test 가 게이트 밖에 있었고, 그래서 정본과 어긋난 화면이
      # 전 게이트 green 인 채로 서 있었다(화면 검수 30행). 수집된 시험 0건도 red 다.
      - name: 프런트 화면 동작 시험 (vitest run)
        run: ./gates/run.sh frontend-test

  boundary-gates:
    needs: changes
    # ⭑ ⟨개정 2026-09-03 · 코드리뷰 #6⟩ **조건을 넓혔다.** `db-boundary` 가 여기로 들어오는데,
    #   그 게이트는 단위 7개의 Dockerfile·`src`·`tests` 와 `infra/staging/compose.i2.yml` 을
    #   전부 훑는다(`gates/config/db-boundaries.toml` 이 정본). core-api·ai-service 만 보고
    #   판정하면 viz-render·pipeline-worker·compose 쪽 위반을 아무도 안 본다.
    #   넓히는 방향이라 검사 대상이 줄지 않는다.
    if: >-
      needs.changes.outputs.core-api == 'true' ||
      needs.changes.outputs.ai-service == 'true' ||
      needs.changes.outputs.viz-render == 'true' ||
      needs.changes.outputs.pipeline-worker == 'true' ||
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # gates/.venv 의 정본은 gates/requirements.txt 다. _venv.sh 가 그 sha256 을 스탬프로
      # 들고 있어, 키가 어긋난 캐시가 들어와도 venv 를 다시 짓는다 — 캐시는 지름길일 뿐이다.
      - uses: actions/cache@v4
        with:
          path: gates/.venv
          key: ${{ runner.os }}-py312-gatevenv-${{ hashFiles('gates/requirements.txt') }}
      # `db-boundary` 는 compose 를 읽으려고 pyyaml 을 쓴다. 없으면 **red 를 낸다**(옳은 동작).
      # 핀은 gates/requirements.txt 하나다 — 여기에 판을 다시 적지 않는다(`planning-gates` 와 같은 배치).
      - name: pyyaml 설치 (핀 = gates/requirements.txt)
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            "$(grep -iE '^PyYAML==' gates/requirements.txt)"
      - name: 설치 확인 (pyyaml 이 실물로 있는가)
        run: python -c 'import yaml'
      - name: 도메인 import 경계
        run: ./gates/run.sh import-boundary
      - name: core-api geo 라이브러리 금지
        run: ./gates/run.sh banned-import
      - name: D10 → D4 쓰기 경로 부재 (음성)
        run: ./gates/run.sh ai-no-lineage-write
      # ⭑ **2026-09-03 이전에는 이 게이트를 어느 잡도 돌리지 않았다** — `db-boundary-selftest`
      #   만 `gate-selftest` 잡에 실려 「red 를 낼 수 있다」를 증명했고 **판정 자체는 CI 에 없었다**
      #   (`work-item-consistency` 가 겪은 것과 같은 모양). 증명만 있고 판정이 없으면
      #   횡단 접속이 그대로 `main` 에 들어간다 — 2026-08-25 에 실제로 그랬다.
      - name: 배포 단위별 DB 체인 경계 (정본 = gates/config/db-boundaries.toml)
        run: ./gates/run.sh db-boundary

  schema-gates:
    needs: changes
    if: needs.changes.outputs.db == 'true' || needs.changes.outputs.core-api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # gates/.venv 의 정본은 gates/requirements.txt 다. _venv.sh 가 그 sha256 을 스탬프로
      # 들고 있어, 키가 어긋난 캐시가 들어와도 venv 를 다시 짓는다 — 캐시는 지름길일 뿐이다.
      - uses: actions/cache@v4
        with:
          path: gates/.venv
          key: ${{ runner.os }}-py312-gatevenv-${{ hashFiles('gates/requirements.txt') }}
      - name: 마이그레이션 single-head (platform / ai 각각)
        run: ./gates/run.sh migration-single-head
      - name: 선언 스키마 ↔ 적용 DB diff
        run: ./gates/run.sh schema-diff
      - name: RLS 커버리지
        run: ./gates/run.sh rls-coverage
      - name: RLS 실효 (본체 음성 · 메타 양성 · cross-tenant)
        run: ./gates/run.sh rls-effect

  # 휴면(`stage2` 대기) 모듈의 시험 실행 경로.
  # 〈71〉-㉰ — 휴면은 배포 단위·화면·완료 정의에서 빠지는 것이고, 시험은 CI 에서 계속 돈다.
  # 안 돌리면 휴면은 부식한다. 수집 0 건 · skipped · failed 는 전부 red.
  dormant-tests:
    needs: changes
    if: needs.changes.outputs.pipeline-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/pipeline-worker/requirements.txt
      - name: pipeline-worker 런타임 설치 (핀 = requirements.txt)
        working-directory: services/pipeline-worker
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
          ./.venv/bin/pip install -q --disable-pip-version-check -e .
      - name: 게이트가 skip 을 통과로 세지 않음을 증명 (0건 · skip · fail)
        run: ./gates/run.sh stage2-markers-selftest
      - name: stage2 마커 시험 실행
        run: ./gates/run.sh stage2-markers

  # ─────────────────────────────────────────────────────────────
  # 서비스 pytest 묶음. **2026-09-03 이전에는 이 잡이 없었다** (코드리뷰 #6).
  # `grep -rn pytest .github/` = 0 이었고, CI 가 도는 pytest 는 위 `dormant-tests` 의
  # `stage2 and not e2e` 부분 집합 하나뿐이었다 — 서비스 측 시험 함수 1102 중 **871 이
  # CI 에서 한 번도 실행되지 않았다.** 시험이 레포에 있는 것과 CI 가 그것을 판정하는 것은
  # 다른 사실이다(`frontend-test` 가 닫은 것과 같은 계열).
  #
  # 판정은 게이트가 한다 — 잡이 pytest 를 직접 부르지 않는다. 선택자·red 조건이 잡과
  # 게이트 두 곳에 적히면 갈리고, 갈린 쪽이 조용히 이긴다(`gates/run.sh` 가 정본).
  #
  # ⚠ **면제를 드러낸다** — 이 회차에서 대상이 아닌 단위는 첫 스텝이 그 사실을 이름으로 찍는다.
  #   조용히 건너뛴 것과 「이 회차 대상이 아니다」는 로그에서 구분돼야 한다 (`CLAUDE.md §4`).
  # ─────────────────────────────────────────────────────────────
  service-tests:
    needs: changes
    if: >-
      needs.changes.outputs.core-api == 'true' ||
      needs.changes.outputs.ai-service == 'true' ||
      needs.changes.outputs.viz-render == 'true' ||
      needs.changes.outputs.pipeline-worker == 'true' ||
      needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, ai-service, viz-render, pipeline-worker]
    env:
      # 이 단위가 이 회차의 판정 대상인가. `contracts` 필터는 `contracts/**` ＋ `gates/**` 라
      # **게이트를 고치면 네 단위가 전부 다시 판정된다** — 판정기를 고치고 대상을 안 보는 것이
      # 이 레포의 대표 실패형이다.
      RUN: ${{ needs.changes.outputs[matrix.service] == 'true' || needs.changes.outputs.contracts == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: 이 회차의 판정 대상인가 (건너뛴 것을 드러낸다)
        run: |
          if [ "${RUN}" = "true" ]; then
            echo "판정 대상 — ${{ matrix.service }}"
          else
            echo "::notice::${{ matrix.service }} 는 이 회차의 변경 대상이 아니다 (판정 대상 0건). 건너뛴 사실을 숨기지 않는다."
          fi
      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      # 핀은 각 단위의 requirements*.txt 다 — 여기에 판을 다시 적지 않는다.
      # pipeline-worker 만 requirements-dev.txt 가 없다(pytest 가 requirements.txt 에 있다).
      - name: ${{ matrix.service }} 런타임·시험 의존 설치 (핀 = requirements*.txt)
        if: env.RUN == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m venv .venv
          ./.venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            ./.venv/bin/pip install -q --disable-pip-version-check -r requirements-dev.txt
          fi
          ./.venv/bin/pip install -q --disable-pip-version-check -e .
      # 설치가 「돌았다」와 「pytest 가 실제로 있다」는 다르다. 부재가 게이트 red(준비)로
      # 위장하면 원인이 한 겹 멀어진다 — 여기서 먼저 끊는다.
      - name: 설치 확인 (pytest 가 실물로 있는가)
        if: env.RUN == 'true'
        run: services/${{ matrix.service }}/.venv/bin/python -c 'import pytest'
      # 증명이 먼저, 판정이 다음 — `dormant-tests` 와 같은 배치다.
      # 「전부 green」과 「전부 무력」을 구분하는 것이 이 스텝이다.
      - name: 게이트가 수집 0건·실행 0건·실패를 red 로 냄을 증명
        if: env.RUN == 'true'
        run: ./gates/run.sh service-tests-selftest
      # core-api 는 게이트가 **일회용 Postgres 를 스스로 세운다**(`_pg.sh` ＋
      # `services/core-api/tests/fixtures/setup-db.sh`). ubuntu-latest 러너에는 도커가 있고
      # 같은 배치를 `schema-gates` 의 `rls-effect` 가 이미 쓰고 있다. 포트는 하나도 공개하지
      # 않고 PGDATA 는 tmpfs 이며 `--rm` ＋ trap 으로 지운다. 접속 문자열은 출력하지 않는다.
      - name: ${{ matrix.service }} 시험 묶음 판정
        if: env.RUN == 'true'
        run: ./gates/run.sh service-tests-${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────
  # 문서 게이트. **상태 판정을 사람 기억이 아니라 여기서 한다.**
  # 종전에 이 둘은 로컬에서만 돌았고 CI 에는 없었다 — `work-item-selftest` 는
  # `gate-selftest` 잡에 실려 「판정기가 red 를 낼 수 있다」만 증명하고 있었고,
  # **정작 판정 자체는 아무 잡도 돌리지 않았다.** 증명만 CI 에 있고 판정이 없으면
  # 상태 드리프트가 그대로 `main` 에 들어간다.
  # ─────────────────────────────────────────────────────────────
  planning-gates:
    needs: changes
    if: needs.changes.outputs.dev-package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 핀은 gates/requirements.txt 하나다 — 여기에 판을 다시 적지 않는다.
      # 적어 두면 두 곳이 갈리고, 갈린 쪽이 조용히 이긴다.
      - name: pyyaml 설치 (핀 = gates/requirements.txt)
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            "$(grep -iE '^PyYAML==' gates/requirements.txt)"
      # 설치가 「돌았다」와 「모듈이 실제로 있다」는 다르다. 부재가 게이트 red 로
      # 위장하면 원인이 한 겹 멀어진다 — 여기서 먼저 끊는다.
      - name: 설치 확인 (pyyaml 이 실물로 있는가)
        run: python -c 'import yaml'
      - name: 항목 상태 대장 ↔ 산문 정합 (정본 = dev-package/work-items.yaml)
        run: ./gates/run.sh work-item-consistency
      - name: 기획 패키지 임베드 최신성
        run: ./gates/run.sh planning-freshness

  # 게이트가 실제로 red를 낼 수 있는지 증명한다.
  # 이 잡이 없으면 "전부 green"이 "전부 무력"과 구분되지 않는다.
  gate-selftest:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 도구는 lock 파일이 **정확히** 고정한다. 캐시 키도 그 lock 의 해시다 —
      # lock 이 한 글자라도 바뀌면 키가 바뀌어 낡은 도구가 재사용될 수 없다.
      # (게이트 스크립트는 캐시 적중 여부와 무관하게 도구 부재를 red 로 낸다. 캐시는 속도만 바꾼다.)
      - uses: actions/cache@v4
        with:
          path: contracts/node_modules
          key: ${{ runner.os }}-node20-contracts-${{ hashFiles('contracts/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: gates/tools/node/node_modules
          key: ${{ runner.os }}-node20-gatetools-${{ hashFiles('gates/tools/node/package-lock.json') }}
      # ⭑ **캐시는 설치가 아니다.** 위 두 `cache` 스텝은 복원만 하고, 캐시가 비면
      #   `node_modules` 가 없는 채로 게이트가 돈다. `contract-lint`·`event-lint` 는
      #   부재를 보고 스스로 `npm ci` 하지만 **`generated-up-to-date` 는 하지 않는다** —
      #   등기부 첫 항목이 `frontend/node_modules/.bin/openapi-typescript` 를 직접 부르고,
      #   없으면 exit 127 로 red 다. 도구 부재를 red 로 내는 것은 **옳은 동작**이다.
      #   그래서 게이트를 무르게 고치지 않고 **설치 단계를 세운다.**
      #   ⚠ `frontend/` 는 캐시 대상에도 없었다. 캐시를 먼저 붙이고 설치를 그 뒤에 둔다.
      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node20-frontend-${{ hashFiles('frontend/package-lock.json') }}
      # `npm ci` 는 lock 을 정본으로 삼는다 — `npm install` 이 아니다. lock 과 어긋나면 실패한다.
      # `--ignore-scripts` 를 쓰지 않는다: 도구가 postinstall 로 바이너리를 놓는 경우가 있고,
      # 「설치했는데 바이너리가 없다」는 캐시가 빈 것과 같은 red 로 되돌아온다.
      - name: 노드 의존 설치 (contracts · gates/tools/node · frontend — lock 이 정본)
        run: |
          set -euo pipefail
          npm ci --prefix contracts --no-audit --no-fund
          npm ci --prefix gates/tools/node --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      # 설치가 「돌았다」와 「도구가 실제로 있다」는 다르다. 셋을 **존재로** 확인한다 —
      # 확인 없이 다음 스텝으로 가면 부재가 게이트 red 로 위장해 원인이 한 겹 멀어진다.
      - name: 설치 확인 (도구 3종이 실물로 있는가)
        run: |
          set -euo pipefail
          test -x contracts/node_modules/.bin/spectral
          test -d gates/tools/node/node_modules/ajv
          test -x frontend/node_modules/.bin/openapi-typescript
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # gates/.venv 의 정본은 gates/requirements.txt 다. _venv.sh 가 그 sha256 을 스탬프로
      # 들고 있어, 키가 어긋난 캐시가 들어와도 venv 를 다시 짓는다 — 캐시는 지름길일 뿐이다.
      - uses: actions/cache@v4
        with:
          path: gates/.venv
          key: ${{ runner.os }}-py312-gatevenv-${{ hashFiles('gates/requirements.txt') }}
      - name: 전 게이트 fail-closed 증명
        run: ./gates/run.sh selftest
