# codegen manifest — 생성물 등기부 (SSoT)
#
# `generated-up-to-date` 게이트가 읽는 유일한 정본이다. 엔트리마다
# 「계약(source) → 생성 명령(command) → 커밋된 산출물(output)」을 못 박고,
# 게이트가 command 를 실제로 다시 돌려 임시 파일과 커밋본을 byte-diff 한다.
#
# 규칙 (contracts/README.md §규칙 3·4):
#   - 생성물은 커밋한다. 손으로 고치지 않는다 (CLAUDE.md 규칙 7).
#   - 여기 등재되지 않은 파일이 「generated」 마커를 달고 레포에 있으면 red 다 —
#     codegen 통제 밖에서 생성물을 자칭하는 파일은 드리프트의 발원지다.
#   - **엔트리 0건은 red 다.** "생성물이 없다"와 "등기부를 비웠다"는 구분되지 않으므로
#     빈 등기부를 green 으로 세지 않는다 (gates/README.md — 대상 0건 = red 원칙 그대로).
#
# command 는 레포 루트에서 실행되고, {OUT} 이 임시 산출 경로로 치환된다.
# 도구 버전은 레포에 고정된 것만 쓴다 (frontend/package.json 의 openapi-typescript 7.13.0) —
# npx 로 최신을 끌어오면 게이트가 조용히 바뀐다 (contracts/package.json 과 같은 이유).

[[output]]
id = "fe-core-ts"
source = "contracts/seams/fe-core.yaml"
output = "frontend/src/generated/fe-core.ts"
command = "frontend/node_modules/.bin/openapi-typescript contracts/seams/fe-core.yaml -o {OUT}"
# 재생성 = cd frontend && npm run generate (package.json scripts.generate 와 같은 도구·같은 입력)

# ── 저장 배치 규약 (`WU-V1` · `03-HANDOFF §4 #20`).
#
# 「같은 규칙이 두 곳에 적혀 있다는 사실 자체가 갈라질 자리다」를 core-api·pipeline-worker
# 두 파일의 주석이 나란히 경고하고 있었는데, **세 번째 자리(viz-render)가 조용히 세 번째
# 규칙을 쓰고 있었다** — 그래서 사람이 올린 격자가 렌더러에 영영 닿지 않았다.
# 이제 규칙은 layout.json 한 곳에만 있고 세 단위는 **같은 바이트**를 받는다.
# 셋의 산출물이 byte-identical 이라는 사실 자체가 「단위마다 다른 규칙」을 불가능하게 한다.
[[output]]
id = "storage-layout-core"
source = "contracts/storage/layout.json"
output = "services/core-api/src/colab_core/kernel/storage_layout.py"
command = "python3 contracts/codegen/gen_storage_layout.py {OUT}"

[[output]]
id = "storage-layout-pipeline"
source = "contracts/storage/layout.json"
output = "services/pipeline-worker/src/colab_pipeline/kernel/storage_layout.py"
command = "python3 contracts/codegen/gen_storage_layout.py {OUT}"

[[output]]
id = "storage-layout-viz"
source = "contracts/storage/layout.json"
output = "services/viz-render/src/colab_viz/kernel/storage_layout.py"
command = "python3 contracts/codegen/gen_storage_layout.py {OUT}"

# ── S3 커널 복제 등기 — source 가 계약이 아니라 core-api 커널이다.
#
# `kernel/{sigv4,aws_credentials,s3}.py`(SigV4 자작 서명기 · 자격증명 사슬 · S3 컨트롤 플레인
# 클라이언트)는 core-api 가 정본이고 pipeline-worker·viz-render 도 같은 것을 쓴다.
# 단위 간 import 가 금지(`gates/config/importlinter.ini` units-independent)라 같은 정본을 옮겨
# 적고(`ids.py`·`env_file.py` 와 같은 방식), 이 등기가 드리프트를 막는다 — 세 단위의 파일이
# byte-identical 이어야 `generated-up-to-date` 가 green 이다. 복제본 안의 형제 모듈 참조는
# 상대 import 라 어느 단위에 놓여도 그 단위의 kernel 을 가리킨다.
# core 커널을 고치면 같은 커밋에 재생성한다: `cp <source> <output>` 여섯 번, 또는 게이트 red 의
# 지시대로.
[[output]]
id = "s3-kernel-sigv4-pipeline"
source = "services/core-api/src/colab_core/kernel/sigv4.py"
output = "services/pipeline-worker/src/colab_pipeline/kernel/sigv4.py"
command = "cp services/core-api/src/colab_core/kernel/sigv4.py {OUT}"

[[output]]
id = "s3-kernel-sigv4-viz"
source = "services/core-api/src/colab_core/kernel/sigv4.py"
output = "services/viz-render/src/colab_viz/kernel/sigv4.py"
command = "cp services/core-api/src/colab_core/kernel/sigv4.py {OUT}"

[[output]]
id = "s3-kernel-aws-credentials-pipeline"
source = "services/core-api/src/colab_core/kernel/aws_credentials.py"
output = "services/pipeline-worker/src/colab_pipeline/kernel/aws_credentials.py"
command = "cp services/core-api/src/colab_core/kernel/aws_credentials.py {OUT}"

[[output]]
id = "s3-kernel-aws-credentials-viz"
source = "services/core-api/src/colab_core/kernel/aws_credentials.py"
output = "services/viz-render/src/colab_viz/kernel/aws_credentials.py"
command = "cp services/core-api/src/colab_core/kernel/aws_credentials.py {OUT}"

[[output]]
id = "s3-kernel-s3-pipeline"
source = "services/core-api/src/colab_core/kernel/s3.py"
output = "services/pipeline-worker/src/colab_pipeline/kernel/s3.py"
command = "cp services/core-api/src/colab_core/kernel/s3.py {OUT}"

[[output]]
id = "s3-kernel-s3-viz"
source = "services/core-api/src/colab_core/kernel/s3.py"
output = "services/viz-render/src/colab_viz/kernel/s3.py"
command = "cp services/core-api/src/colab_core/kernel/s3.py {OUT}"
