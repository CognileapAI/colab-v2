# ==============================================================================
# seam: core-api  →  ai-service (D9 Ontology&KG + D10 AI Services)
#
# 경계 — 이 파일에 절대 들어오지 않는 것
#   1) **계보를 확정(커밋)하는 오퍼레이션을 두지 않는다.**
#      제안은 D10 안에서 태어나 D10 안에서 죽는다. 확정은 사람이 core-api 를 통해
#      D4(Lineage) 에 한다. 이 스펙에 쓰기 오퍼레이션이 없다는 사실 자체가
#      `CLAUDE.md §3-2`(D10 → D4 쓰기 경로가 존재하지 않는다) 의 계약 쪽 표현이다.
#      "편의상" `POST /lineage` · `PUT /suggestions/{id}/confirm` 류를 여기 추가하면
#      규칙이 관례로 내려앉는다. 필요해 보이면 추가하지 말고 멈추고 보고한다
#      (`CLAUDE.md §4 — 경계를 넘어야 할 때`).
#   2) **[모두 승인] 개념이 없다.** 배치 승인 엔드포인트도, `approveAll` 류 필드도,
#      제안 묶음에 대한 일괄 상태 필드도 없다. 확인은 항목마다 사람이 한다
#      (`Policy_업로드와_계보_확정 §1.3-7 · §8 제안 카드 행동 — 일괄 버튼 없음`).
#   3) **확신도에 숫자·퍼센트가 없다.** `AiConfidence` 3값 enum 뿐이다
#      (`Policy_업로드와_계보_확정 §4 용어(확신도) — 퍼센트 금지`).
#   4) **근거는 nullable 이 아니다.** 모든 제안·모든 검색 결과에 `AiRationale` 이
#      `required` 다. 근거 없는 결과는 내놓지 않는 것이 전제다
#      (`PRD_업로드와_계보_확정 §10 · PRD_데이터_찾기 §7`).
#   5) **빈 결과는 에러가 아니다.** 0건은 200 이고, 뒤진 범위(`AiSearchScope`)를
#      먼저 밝힌다 (`Policy_데이터_찾기 §3.3 · §8 범위 표시줄`).
#
# 연구실 경계 — 호출자가 명시적으로 넘긴다 (판단)
#   `CLAUDE.md §3-5` 의 "서버 주입"은 core-api 안의 스코프 커널 + RLS 를 말한다.
#   ai-service 는 별도 배포 단위(`DOMAINS §4`)이고 플랫폼 DB 세션을 갖지 않으므로
#   그 커널의 사정권 밖이다. 따라서 경계를 **추론하게 두지 않고 요청에 실어 보낸다** —
#   추론하게 두면 경계가 두 곳(core 커널·AI 휴리스틱)에서 정해져 갈라진다.
#   대신 응답이 `scope` 를 **되돌려 준다**. core-api 는 보낸 값과 받은 값이 다르면
#   응답을 버린다(fail-closed). 경계는 넘겨주되 검증은 core 가 한다.
#
# degraded — AI 장애가 제품을 멈추면 안 된다 (`contracts/README.md` · `PLAN-SoT §3.1`)
#   모든 성공 응답에 `degraded` 가 required 다. AI 가 제 몫을 못 했어도 core 는
#   200 + `degraded: true` + 빈 결과를 받고 화면을 계속 그린다.
# ==============================================================================
openapi: 3.1.0

info:
  title: core-api ↔ ai-service seam
  version: 0.1.0
  contact:
    name: CoLAB v2 · 플랫폼 개발
    url: https://github.com/CognileapAI/colab-v2
  description: |
    ai-service(D9·D10)가 core-api 에 제공하는 표면. **두 지점뿐이다.**
    ① 계보 제안(E-04 업로드와 계보 확정) ② 자연어 검색(E-02 데이터 찾기).
    v2 정본이 AI 를 이 두 지점에만 얇게 얹었다 — AI 없이도 v2 는 완결된 제품이다.

servers:
  - url: /ai/v1
    description: ai-service 내부 표면. 외부에 노출하지 않는다 — 소비자는 core-api 뿐이다.

tags:
  - name: lineage-suggestion
    description: E-04 계보 제안. **제안만 한다. 저장하지 않는다.**
  - name: search
    description: E-02 자연어 검색. 질의 해석 → 관련도 순서 + 근거 한 줄.

# 서비스 간 인증 — 레포 결정(정본에 항목 없음). ai-service 는 내부 표면이고 소비자는 core-api 뿐이라
# 호출자 신원만 확인한다. **이 토큰이 연구실 경계를 정하지 않는다** — 경계는 요청의 `scope` 다(상단 주석).
security:
  - serviceToken: []

paths:
  /lineage-suggestions:
    post:
      tags: [lineage-suggestion]
      operationId: suggestLineage
      summary: 업로드된 파일의 계보를 제안한다 (제안만 — 저장하지 않는다)
      description: |
        업로드된 파일에서 읽은 메타(헤더 자동 추출값)와 D9 지식 그래프 조회를 근거로
        **가공 전 데이터 후보**와 **가공 방식**을 제안한다.

        이 오퍼레이션은 **읽기다.** `POST` 인 이유는 파일 메타가 본문에 실리기 때문이고,
        ai-service 쪽에 계보가 만들어지지 않는다. 반환된 `suggestionId` 는 화면이 항목을
        구분하려고 쓰는 값일 뿐, 저장된 계보 관계의 ID 가 아니다.

        빈 연구실의 첫 업로드는 **정상 응답**이다 — `suggestions: []` + `rawDataLikely`
        + `scope.searchedCount: 0`. 억지 제안을 만들지 않는다
        (`Policy_업로드와_계보_확정 §3.2 · §8 AI 제안 영역 — 정직한 빈 상태`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageSuggestionRequest" }
      responses:
        "200":
          description: 제안 결과. **0건도 여기로 온다.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageSuggestionResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /searches:
    post:
      tags: [search]
      operationId: searchDatasets
      summary: 자연어 질의를 **검색어·주제 필터로 해석**해 돌려준다 (찾고 매기는 것은 core-api)
      description: |
        **⟨동결 3회 해제 · `PLAN-SoT §9-〈87〉`⟩ 이 산문은 반대 방향으로 낡아 있었다.**
        아래는 `〈72〉-㉮`(Ted 판정 2026-08-25 ㈎)가 그은 실제 역할 분담이다.

        **이 표면이 하는 일은 해석 하나다.** 자연어 한 문장을 **검색어(`terms`)와
        주제 필터(`topic`)** 로 바꾼다. 그게 전부다.

        **찾고 매기는 일은 core-api 가 한다.** 후보 선정·순위·근거 한 줄은 D3 의
        `tsvector`(+ 온톨로지 사전으로 넓힌 검색어)로 **core-api 안에서** 만들어진다.
        D3 는 core-api 의 자기 도메인이고, `K4-a` 까지 이 단위가 `tsvector` 를 직접 던지던
        것은 **D10 → D3 직접 접속** 이라 `CLAUDE.md §3-1` 위반이었다.

        **그래서 core-api 가 이 응답에서 읽는 것은 `interpretation` 하나다.**
        `results.items` 에 무엇이 실려 오든 **읽지 않는다** — 읽는 순간 순서가 모델의 것이
        되고, 같은 질의가 때마다 다른 답을 내며, 근거 한 줄이 사후 정당화로 전락한다.
        `results` 는 계약 하위 호환을 위해 남은 **빈 봉투**다 (`SearchHit` 참고).

        **정렬 판단도 core 가 한다.** `Verified 우선`은 D2 의 값이다
        (`Policy_데이터_찾기 §5 기본 정렬`). AI 에 권한 정책을 얹지 않는다.

        **잠긴 데이터를 결과에서 빼지 않는다** (`Policy_데이터_찾기 §1.3-6`).
        AI 는 잠김 여부를 아예 모르고, 잠김 표시는 core 가 D2 에서 붙인다.

        0건은 **정상 응답**이다 — `scope`(뒤진 연구실·개수)를 먼저 밝힌다.

        ⚠ **이 표면에 못 닿는 것은 0건이 아니다.** core-api 가 여기 못 닿거나
        `interpretation` 을 못 읽으면 **뒤지지도 못한 것**이라, FE 중계
        (`fe-core.yaml#searchDatasets`)는 200 + 빈 결과가 아니라 **503** 을 낸다
        (`PLAN-SoT §9-〈87〉-㉯` Ted 판정 2026-08-25).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: 검색 결과. **0건도 여기로 온다.**
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:

  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: 배포 단위 사이의 서비스 자격 증명. 사람의 세션이 아니다.

  responses:
    Error:
      description: 모든 4xx/5xx 는 한 형태다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

  schemas:

    # ---- 공통 ---------------------------------------------------------------

    Degradable:
      type: object
      description: |
        AI 장애가 제품을 멈추면 안 된다. AI 가 제 몫을 못 하면 5xx 로 끝내지 않고
        **빈 결과 + `degraded: true`** 로 돌려준다 — core 는 화면을 계속 그리고
        카탈로그·업로드는 그대로 돈다 (`DOMAINS §4` · `contracts/README.md`).
      required: [degraded]
      properties:
        degraded:
          type: boolean
          description: true 면 결과가 온전하지 않다. 이때 결과 배열은 비어 있거나 부분적이다.
        degradedReason:
          type: string
          description: 사람이 읽을 한 줄. 화면 문구는 core 가 정한다 — 여기 문구를 그대로 쓰지 않는다.
          minLength: 1

    # ---- ① 계보 제안 --------------------------------------------------------

    LineageSuggestionRequest:
      type: object
      description: |
        업로드된 파일에서 **이미 읽은** 값만 넘긴다. ai-service 는 파일 바이트를 받지 않는다 —
        파일 파싱은 D5(pipeline-worker) 의 일이고, 여기 두면 배포 단위가 섞인다.
      required: [scope, file]
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/RequestedScope"
        datasetNameDraft:
          type: string
          description: 등록 폼의 데이터셋 이름 초안(파일명에서 생성된 값). 해석 단서로만 쓴다.
          minLength: 1
          maxLength: 80
        subject:
          type: string
          description: 고정 목록에서 고른 주제(`Policy_업로드와_계보_확정 §5`). 아직 안 골랐으면 생략한다.
          minLength: 1
        file:
          $ref: "#/components/schemas/UploadedFileMeta"

    UploadedFileMeta:
      type: object
      description: |
        `① 자동 메타데이터 확인` 에 뜨는 값과 같은 자리에서 온다
        (`Policy_업로드와_계보_확정 §8 자동 메타 칸`). 헤더를 못 읽은 항목은 **생략한다** —
        빈 문자열로 채우면 "못 읽음"과 "값 없음"이 갈리지 않는다.
      required: [fileName, kind]
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          description: 조각 묶음이면 묶음 이름.
        kind:
          $ref: "../schemas/common.json#/$defs/FileKind"
        format:
          type: string
          description: 헤더에서 판정한 포맷(예 `NetCDF`). 판정 실패면 생략한다.
          minLength: 1
        variables:
          type: array
          description: 헤더에서 읽은 변수 이름들.
          items: { type: string, minLength: 1 }
        crs:
          type: string
          description: 좌표계 표기.
          minLength: 1
        gridDescription:
          type: string
          description: 격자 정보 한 줄. 구조를 쪼개지 않는다 — 해석 단서일 뿐이고 저장되지 않는다.
          minLength: 1
        periodStart:
          $ref: "../schemas/common.json#/$defs/Timestamp"
        periodEnd:
          $ref: "../schemas/common.json#/$defs/Timestamp"
        partCount:
          type: integer
          description: 조각 수. 1 이면 단일 파일.
          minimum: 1
        sourceNoteDraft:
          type: string
          description: 헤더에서 뽑은 원천 표기 초안. **데이터셋이 아니라 표기다**(`§4 용어`).
          maxLength: 60

    LineageSuggestionResponse:
      allOf:
        - $ref: "#/components/schemas/Degradable"
        - type: object
          required: [scope, rawDataLikely, suggestions]
          properties:
            scope:
              allOf: [{ $ref: "../schemas/common.json#/$defs/AiSearchScope" }]
              description: |
                **먼저 밝히는 범위.** 무엇을 근거로 삼았는지(연구실·살펴본 데이터 개수)를
                제안보다 앞에 둔다. 빈 연구실이면 `searchedCount: 0` 이고, 그 자체가
                "제안할 근거가 없다"의 정직한 형태다.
                요청의 `scope` 와 다르면 core-api 는 응답을 버린다.
            rawDataLikely:
              type: boolean
              description: |
                가공 흔적이 없어 원자료로 보이는가. true 면 화면은 원천 표기만 남기고
                등록하도록 안내한다 (`Policy_업로드와_계보_확정 §8 가공 단계 칸 · AI 제안 영역`).
                **가공 단계 Lv 를 여기서 계산해 보내지 않는다** — Lv 는 확정된 계보에서
                core 가 계산하는 파생값이다 (`common.json#ProcessingLevel` · `PLAN-SoT §9-⑳`).
            suggestions:
              type: array
              description: |
                **빈 배열이 정상이다.** 억지 제안을 만들지 않는다.
                묶음 단위의 상태·승인 필드를 두지 않는다 — 확인은 항목마다 사람이 한다.
              items: { $ref: "#/components/schemas/LineageSuggestion" }

    AiSuggestionBase:
      type: object
      description: 모든 제안이 지고 가는 두 값 — 확신도와 근거. 둘 다 required 다.
      required: [suggestionId, kind, confidence, rationale]
      properties:
        suggestionId:
          $ref: "../schemas/common.json#/$defs/Ulid"
          description: |
            **한 응답 안에서 항목을 구분하는 값일 뿐이다.** 저장된 계보 관계의 ID 가 아니고,
            이 ID 로 무언가를 확정하는 오퍼레이션은 이 스펙에 없다.
        kind:
          type: string
          description: 제안 종류. 화면의 카드 종류와 1:1 이다.
          enum: ["가공 전 데이터", "가공 방식"]
        confidence:
          allOf: [{ $ref: "../schemas/common.json#/$defs/AiConfidence" }]
          description: 3값 enum. **퍼센트·점수 필드를 이 스키마에 추가하지 않는다.**
        rationale:
          allOf: [{ $ref: "../schemas/common.json#/$defs/AiRationale" }]
          description: 왜 이 제안인지 한 줄. nullable 이 아니다.

    LineageSuggestion:
      description: |
        제안 카드 한 장. `kind` 로 갈린다.
      oneOf:
        - $ref: "#/components/schemas/ParentCandidateSuggestion"
        - $ref: "#/components/schemas/ProcessingMethodSuggestion"
      discriminator:
        propertyName: kind
        mapping:
          "가공 전 데이터": "#/components/schemas/ParentCandidateSuggestion"
          "가공 방식": "#/components/schemas/ProcessingMethodSuggestion"

    ParentCandidateSuggestion:
      allOf:
        - $ref: "#/components/schemas/AiSuggestionBase"
        - type: object
          required: [parentDatasetId, parentDatasetName, suggestedParentRole]
          properties:
            kind: { const: "가공 전 데이터" }
            parentDatasetId:
              $ref: "../schemas/common.json#/$defs/Ulid"
            parentDatasetName:
              type: string
              minLength: 1
              description: 화면 대조용 표시 이름. 정본값은 D3 에 있고 core 가 다시 붙인다.
            suggestedParentRole:
              allOf: [{ $ref: "../schemas/common.json#/$defs/ParentRole" }]
              description: |
                제안값이다. 사람이 확인할 때 바꿀 수 있고, 바꾸지 않으면 기본값 `주입력` 이다
                (`Policy_업로드와_계보_확정 §5 부모 역할`).

    ProcessingMethodSuggestion:
      allOf:
        - $ref: "#/components/schemas/AiSuggestionBase"
        - type: object
          required: [methodText]
          properties:
            kind: { const: "가공 방식" }
            methodText:
              type: string
              description: |
                "어떻게 만들었는지" 한 줄. 사람이 고쳐 쓸 수 있고, 고친 문장이 화살표 라벨이 된다.
                길이 상한은 입력 규칙(`Policy_업로드와_계보_확정 §5 가공 방식 문장 — 1~120자`)과 맞춘다.
                **어휘를 enum 으로 닫지 않는다** — 가공 방식 어휘는 수문학 도메인 소유자(HYD) 협의
                사항이고 정본에 열거값이 없다 (`DOMAINS §3-③` · `PLAN-SoT §9-㉚`).
              minLength: 1
              maxLength: 120
            appliesToParentDatasetId:
              $ref: "../schemas/common.json#/$defs/Ulid"
              description: |
                가공 방식은 계보 **관계**에 붙는 값이라 어느 부모와의 관계인지를 가리킨다
                (`DOMAINS §2 D4`). 어느 부모인지 모르면 생략한다 — 지어내지 않는다.

    # ---- ② 자연어 검색 ------------------------------------------------------

    SearchRequest:
      type: object
      required: [scope, query]
      additionalProperties: false
      properties:
        scope:
          $ref: "#/components/schemas/RequestedScope"
        query:
          type: string
          description: 자연어 한 문장 (`Policy_데이터_찾기 §5 검색 질문 — 1~200자`).
          minLength: 1
          maxLength: 200
        limit:
          type: integer
          description: 돌려받을 최대 건수. 화면의 `+N건 더 보기` 를 core 가 감당하는 폭이다.
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          allOf: [{ $ref: "../schemas/common.json#/$defs/Cursor" }]
          description: 이어보기 토큰. 첫 요청에서는 생략한다.

    SearchResponse:
      allOf:
        - $ref: "#/components/schemas/Degradable"
        - type: object
          required: [scope, isDataQuery, results]
          properties:
            scope:
              allOf: [{ $ref: "../schemas/common.json#/$defs/AiSearchScope" }]
              description: |
                **뒤진 범위를 먼저 밝힌다.** 0건이어도 어디를 몇 개 뒤졌는지가 먼저다
                (`Policy_데이터_찾기 §3.3` — "우리 연구실 데이터 128개를 뒤졌지만…").
                요청의 `scope` 와 다르면 core-api 는 응답을 버린다.
            isDataQuery:
              type: boolean
              description: |
                질의가 **데이터를 찾는 질문**인가. false 면 `results.items` 는 비어 있고,
                화면은 "데이터를 찾는 질문에 답해요" + 예시로 안내한다
                (`Policy_데이터_찾기 §9`). 오류가 아니라 정상 응답이다.
            results:
              allOf: [{ $ref: "../schemas/common.json#/$defs/ListEnvelope" }]
              description: |
                **`〈72〉-㉮` 이후 이 봉투는 언제나 비어 있다.** 후보를 뽑는 것은 core-api 의
                `tsvector` 이고 이 단위는 D3 를 읽지 않는다. 필수로 남는 것은 하위 호환
                때문이고, **core-api 는 `items` 를 읽지 않는다.**
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/SearchHit" }
            interpretation:
              allOf: [{ $ref: "#/components/schemas/SearchInterpretation" }]
              description: |
                **core-api 가 이 응답에서 읽는 유일한 값이다** (`〈72〉-㉮`).
                선택 속성이다 — **없으면 지어내지 않는다.** 해석을 못 받았다는 것은
                「뒤졌는데 없다」가 아니라 **「뒤지지도 못했다」**이므로, core-api 는
                0건이 아니라 「지금 동작하지 않는다」로 답한다 (`〈87〉-㉯`).

    SearchInterpretation:
      type: object
      description: |
        **질의 해석 결과 — 이 표면의 산출물 전부.** 자연어 한 문장을 검색어와 주제 필터로
        바꾼 것이고, **후보·순위·근거는 여기 없다** (`Policy_데이터_찾기 §4 용어(관련도)` —
        순서가 이미 관련도이고 그 순서는 core-api 의 `tsvector` 가 낸다 · `〈72〉-㉮`).
      required: [terms, source]
      additionalProperties: false
      properties:
        terms:
          type: array
          description: |
            찾을 말. 질문에 실제로 있는 말과 그 표기 변형, 그리고 온톨로지 사전이 넓힌 말이다.
            **없는 말을 지어내지 않는다.** 비어 있으면 core-api 는 뒤지지 않는다.
          items:
            type: string
            minLength: 1
        topic:
          type: ["string", "null"]
          description: |
            주제 필터 한 개 또는 없음. 값 집합은 온톨로지의 주제 표기 그대로다
            (`Policy_데이터_찾기 §5 조건`). **core-api 가 이 값으로 좁혀 뒤진다.**
        source:
          type: string
          enum: ["llm", "literal"]
          description: |
            해석이 **어디서 왔는가.** `literal` 은 모델 없이 질문을 낱말로 자른 것이다 —
            결과는 진짜 결과이지만 놓친 것이 있을 수 있고, **근거 한 줄이 그 사실을 밝힌다**
            (`Policy_데이터_찾기 §4 한계 표시`). `Degradable.degraded` 와 짝으로 온다.
        expansions:
          type: array
          description: |
            **온톨로지 그래프가 데려온 말과 그 엣지** (`K4-b` · `PLAN-SoT §9-〈90〉-㉱`).
            `terms` 중 그래프가 붙인 것만 여기 한 번 더 서고, **질문에 있던 말과 사전이
            붙인 말은 여기 없다.** 선택 속성이다 — 그래프가 한 일이 없으면 아예 오지 않는다.

            **왜 계약에 서는가.** 「확장으로 걸린 결과는 근거 한 줄에 그 엣지를 이름으로
            적을 수 있어야 한다」가 확장 경계의 다섯째 안전장치이고
            (`sessions/K1b-ONTOLOGY-CONTENT §D-6`), 근거를 만드는 것은 core-api 다.
            이 세 값이 없으면 core-api 는 「‘재격자화’의 한 가지인 ‘Nearest’가 맞았다」를
            말할 수 없고, 그러면 확장이 **사람이 눈으로 검사할 수 없는 것**이 된다.

            **순위는 여기서 나오지 않는다.** 점수도 확신도도 없다 — 순서는 core-api 의
            `ts_rank_cd` 가 낸다 (`〈72〉-㉮`).
          items:
            type: object
            required: [term, relation, parent]
            additionalProperties: false
            properties:
              term:
                type: string
                minLength: 1
                description: 그래프가 붙인 말. **반드시 `terms` 안에 있다.**
              relation:
                type: string
                enum: ["같은 말이다", "~의 한 가지다", "안에 있다"]
                description: |
                  일한 엣지의 관계. 값 집합은 `d9_concept_edge.relation` CHECK 그대로다 —
                  **여기서 새로 정하지 않는다.**
              parent:
                type: string
                minLength: 1
                description: |
                  **질문 쪽에 있던 말**(상위). 확장은 하향 전용이므로 이 값이 언제나
                  사용자가 실제로 쓴 쪽이다.

    SearchHit:
      type: object
      description: |
        검색 결과 한 건. **`〈72〉-㉮` 이후 이 단위는 이것을 만들지 않는다** —
        `SearchResponse.results.items` 는 언제나 빈 배열이고 core-api 는 읽지 않는다.
        스키마를 지우지 않는 것은 계약 하위 호환 때문이며, **세 값이 required 인 것은
        그대로 옳다**: 실려 온다면 셋이 다 있어야 하고, 셋이 다 있어도 읽히지 않는다.
      required: [datasetId, relevanceBar, rationale]
      additionalProperties: false
      properties:
        datasetId:
          $ref: "../schemas/common.json#/$defs/Ulid"
        relevanceBar:
          type: number
          description: |
            **관련도 막대의 길이**다. 화면은 막대 하나로만 그리고 **퍼센트도 등급 텍스트도
            쓰지 않는다** (`Policy_데이터_찾기 §4 용어(관련도)`). 순서가 이미 관련도이고
            이 값은 막대의 강도만 거든다. 사용자에게 숫자로 보이는 순간 정본 위반이다.
            확신도(`AiConfidence`)와 **다른 개념이다** — 확신도에는 숫자가 없다.
          minimum: 0
          maximum: 1
        rationale:
          allOf: [{ $ref: "../schemas/common.json#/$defs/AiRationale" }]
          description: |
            카드의 "왜 이 결과?" 한 줄. **한계도 이 한 줄 안에서 함께 밝힌다** —
            별도 필드를 두지 않는다. 별도 줄을 두면 카드 높이가 제각각이 되고,
            좋은 점만 적는 필드가 따로 생긴다 (`Policy_데이터_찾기 §4 한계 표시 · §8 AI 근거 블록`).

    # ---- 스코프 -------------------------------------------------------------

    RequestedScope:
      type: object
      description: |
        호출자(core-api)가 **명시적으로** 넘기는 연구실 경계. 파일 상단 주석의 판단 근거 참고.
        `labName` 을 함께 넘기는 이유는 응답의 `AiSearchScope.labName`(화면의 범위 표시줄에
        그대로 서는 값)이 정본값을 그대로 되비추게 하려는 것이다 — AI 가 이름을 지어내지 않는다.
      required: [labId, labName]
      additionalProperties: false
      properties:
        labId:
          $ref: "../schemas/common.json#/$defs/Ulid"
        labName:
          type: string
          minLength: 1
