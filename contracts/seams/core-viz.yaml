# ==============================================================================
# seam: core-api  →  viz-render (D7 Visualization)
#
# 이 seam 이 존재하는 이유
#   `CLAUDE.md §3-4` — **core-api 에 geo 라이브러리를 import 하지 않는다**
#   (rasterio·GDAL·xarray 등). geo 는 viz-render 에만 들어간다 (`DOMAINS §2 D7 · §4`).
#   그래서 이 계약은 다음을 지킨다:
#     · core 는 **식별자와 렌더 파라미터만** 넘긴다. 좌표·래스터를 해석하지 않는다.
#     · 요청에 좌표계 변환·격자 구조·픽셀·밴드·NoData 같은 값이 없다.
#       그런 값이 요청에 필요해지면 그건 core 가 파일을 해석하고 있다는 뜻이다 — 멈추고 보고한다.
#     · bbox·타일 좌표는 **지도 위젯이 이미 아는 값**만 오간다(웹 메르카토르 타일 z/x/y,
#       WGS84 경계). core 가 원본 좌표계를 알아야 하는 자리는 없다.
#     · 렌더 결과는 **타일 URL 과 범례**로만 돌아온다. 래스터 배열이 core 를 통과하지 않는다.
#
# 미리보기는 서버가 그린다 (`Policy_데이터셋_상세 §8` · `Policy_업로드와_계보_확정 §8`)
#   수백 MB~GB 파일이 흔해 브라우저가 파싱할 수 없다. 서버 왕복이 수 초~수십 초라
#   **동기 응답으로 두지 않고 작업(job)으로 만든다** — 그래야 진행을 단계로 말할 수 있다
#   (`파일 읽는 중 → 지도 그리는 중 → 범례 만드는 중`).
#
# 층(겹쳐 보기)은 작업 하나 = 층 하나다
#   층마다 시각·팔레트를 따로 고르므로(`Policy_데이터셋_상세 §8 층의 시각·층 색상`)
#   합성 파라미터를 한 요청에 묶지 않는다. 켜기/끄기·불투명도는 지도 위젯이 하는 일이라
#   이 계약에 없다. 다만 **스크린샷만은 합성이 필요해** 장면을 통째로 받는다.
# ==============================================================================
openapi: 3.1.0

info:
  title: core-api ↔ viz-render seam
  version: 0.1.0
  contact:
    name: CoLAB v2 · 플랫폼 개발
    url: https://github.com/CognileapAI/colab-v2
  description: |
    viz-render(D7)가 core-api 에 제공하는 표면 — 2D 렌더(격자·경계·점) · 타일 서빙 ·
    색상/간격 · 스크린샷. 대응 화면은 E-03 데이터셋 상세의 미리보기와
    E-04 업로드 모달·미등록 파일 미리보기(S-08)다.

servers:
  - url: /viz/v1
    description: viz-render 내부 표면. 타일 경로만 CDN 뒤에 선다.

tags:
  - name: render
    description: 렌더 작업 생성·조회
  - name: tile
    description: 타일 서빙
  - name: style
    description: 색상(팔레트)과 간격(구간 수)
  - name: screenshot
    description: 지금 장면을 이미지로

# 서비스 간 인증 — 레포 결정(정본에 항목 없음). 호출자 신원만 확인한다.
# 타일 경로는 CDN 뒤에 서므로 서명된 URL 로 대신할 수 있다 — 배포 판단은 WU-I1.
security:
  - serviceToken: []

paths:
  /renders:
    post:
      tags: [render]
      operationId: createRender
      summary: 층 하나의 렌더 작업을 만든다
      description: |
        **무엇으로 그릴지는 사람이 고르지 않는다.** 격자·경계·점 중 어느 표현인지는
        포맷이 정하고 viz-render 가 판정한다 (`Policy_데이터셋_상세 §8 지도 표현`).
        요청에 표현 종류를 넣지 않는 이유다 — 넣으면 core 가 포맷을 해석하게 된다.

        등록된 데이터셋과 **아직 등록하지 않은 업로드**(S-08) 둘 다 대상이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenderRequest" }
      responses:
        "202":
          description: 작업이 접수됐다. 진행은 조회로 확인한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJob" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: |
            대상이 렌더 상한을 넘었다 (`Policy_데이터셋_상세 §8 — 미리보기는 500MB까지` [가정]).
            화면은 "조각 하나를 골라 그린다"로 안내한다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "415":
          description: |
            어느 표현으로도 그릴 수 없는 포맷. **등록·다운로드·계보 확정은 그대로 된다** —
            그릴 수 없는 것과 등록할 수 없는 것은 다르다.
            `details.renderableFormats` 에 지금 그릴 수 있는 형식을 담는다. 안 되는 것만
            말하면 무엇을 올려야 하는지 모른 채 떠난다 (`Policy_데이터셋_상세 §8`).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /renders/{renderId}:
    parameters:
      - $ref: "#/components/parameters/RenderId"
    get:
      tags: [render]
      operationId: getRender
      summary: 렌더 작업의 진행·결과를 조회한다
      description: |
        진행 중이면 **어느 단계인지**를 말한다. 한 덩어리 "로딩 중"으로 두면 멈춘 것인지
        구분되지 않는다 (`Policy_데이터셋_상세 §8`).
      responses:
        "200":
          description: 작업 상태. 실패도 200 이고 `failure` 에 이유가 담긴다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RenderJob" }
        "404": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /renders/{renderId}/tiles/{z}/{x}/{y}.png:
    parameters:
      - $ref: "#/components/parameters/RenderId"
      - name: z
        in: path
        required: true
        description: 타일 줌 레벨.
        schema: { type: integer, minimum: 0, maximum: 22 }
      - name: x
        in: path
        required: true
        description: 타일 열.
        schema: { type: integer, minimum: 0 }
      - name: y
        in: path
        required: true
        description: 타일 행.
        schema: { type: integer, minimum: 0 }
    get:
      tags: [tile]
      operationId: getRenderTile
      summary: 렌더된 층의 타일 한 장
      description: |
        **core-api 를 통과하지 않는 유일한 경로다.** 지도 위젯이 CDN 을 통해 직접 부른다 —
        타일 바이트가 core 를 지나가면 core 가 래스터를 다루게 되고, 그것이 §3-4 가 막는 것이다.
        빈 타일(값 없음)도 200 + 투명 PNG 다. 404 로 두면 지도 위젯이 재시도를 반복한다.
      responses:
        "200":
          description: PNG 타일.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: 아직 그리는 중이거나 실패한 작업이다. 상태는 `getRender` 로 확인한다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "410":
          description: |
            수명이 다한 렌더다. 등록하지 않은 파일의 미리보기 결과는 서버에 임시로만 둔다
            (`Policy_데이터셋_상세 §8` — 서버 렌더가 화면에 남기는 것 ③).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

  /palettes:
    get:
      tags: [style]
      operationId: listPalettes
      summary: 쓸 수 있는 팔레트 목록
      description: |
        팔레트는 **viz-render 가 소유한다.** 정본은 "팔레트 3종"이라고만 하고 이름을
        열거하지 않으므로(`Policy_데이터셋_상세 §8 시각화 컨트롤`) 계약에 이름을 박아
        지어내지 않고 목록으로 서빙한다. core·FE 는 하드코딩하지 않는다.
      responses:
        "200":
          description: 팔레트 목록.
          content:
            application/json:
              schema:
                allOf: [{ $ref: "../schemas/common.json#/$defs/ListEnvelope" }]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PaletteOption" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /screenshots:
    post:
      tags: [screenshot]
      operationId: createScreenshot
      summary: 지금 장면을 이미지로 뽑는다
      description: |
        시각화 설정은 저장하지 않으므로 **남길 장면은 여기서 뽑는다**
        (`Policy_데이터셋_상세 §8 스크린샷`). 층이 여럿이면 합성이 필요해 장면을 통째로 받는다 —
        층 목록·순서·불투명도·화면 크기는 지도 위젯만 아는 값이라 요청에 실린다.
        권한(`업로드·편집`) 판정은 core-api 가 하고, 이 seam 은 판정하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreenshotRequest" }
      responses:
        "200":
          description: PNG 이미지.
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: 장면에 담긴 층 중 아직 완료되지 않은 것이 있다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Error" }

components:

  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: 배포 단위 사이의 서비스 자격 증명. 사람의 세션이 아니다.

  parameters:
    RenderId:
      name: renderId
      in: path
      required: true
      description: 렌더 작업 식별자.
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

  responses:
    Error:
      description: 모든 4xx/5xx 는 한 형태다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

  schemas:

    RenderTarget:
      type: object
      description: |
        무엇을 그릴 것인가. **식별자만 넘긴다.** 등록된 데이터셋이면 `datasetId`(+ 조각 선택),
        아직 등록하지 않은 업로드면 `uploadId` 다 (S-08). 둘 중 정확히 하나를 넣는다.
      additionalProperties: false
      properties:
        datasetId:
          $ref: "../schemas/common.json#/$defs/Ulid"
        uploadId:
          $ref: "../schemas/common.json#/$defs/Ulid"
          description: 등록 전 임시 업로드. 결과에 수명이 있다.
        fileIds:
          type: array
          description: |
            그릴 조각(본체 파일)들. 생략하면 대상 전체다. 조각 하나만 골라 그리는 복구 경로가
            여기로 온다 (`Policy_데이터셋_상세 §8 — 파일이 너무 큼`).
          items: { $ref: "../schemas/common.json#/$defs/Ulid" }
          minItems: 1
      oneOf:
        - required: [datasetId]
        - required: [uploadId]

    RenderRequest:
      type: object
      required: [target, style]
      additionalProperties: false
      properties:
        target:
          $ref: "#/components/schemas/RenderTarget"
        variable:
          type: string
          description: |
            그릴 값 **하나**. 한 번에 값 하나만 그린다 (`Policy_데이터셋_상세 §1.3-5`).
            생략하면 viz-render 가 기본값을 고른다 — core 가 파일의 변수 목록을 해석해
            고르지 않는다.
          minLength: 1
        instant:
          allOf: [{ $ref: "../schemas/common.json#/$defs/Timestamp" }]
          description: |
            그릴 시각. **층마다 따로 고른다** — 데이터마다 시간 간격이 달라 하나로 묶으면
            없는 시각을 있는 것처럼 그린다 (`Policy_데이터셋_상세 §8 층의 시각`).
            생략하면 첫 시각이다.
        style:
          $ref: "#/components/schemas/RenderStyle"
        withoutReferenceGrid:
          type: boolean
          default: false
          description: |
            기준 격자 파일(위경도 짝 파일) 없이 그려 본다. 파일 안에 위경도가 들어 있는
            경우가 있어 미리 막으면 그릴 수 있는 것까지 못 그린다
            (`Policy_업로드와_계보_확정 §8 기준 격자 파일`).
            ⚠ 실측 — NetCDF·GeoTIFF·HDF4 는 파일 내부 정보로 격자가 계산되므로 이 옵션이
            실제로 통한다. **Binary(HSR) 는 통하지 않는다** — 헤더의 투영 파라미터 자리가
            전부 0 이라 재현 불가(오차 5.9 km)이고, 이 경우 **합성 격자를 만들지 않고
            그리기를 실패로 끝낸다**(`DR-9`). `DATA-REFERENCE §1.1` ·
            `DATA-PIPELINE-MEASUREMENT.md`.

    RenderStyle:
      type: object
      description: 색상과 간격. 정본이 준 컨트롤은 이 둘뿐이다.
      required: [palette]
      additionalProperties: false
      properties:
        palette:
          type: string
          description: "`listPalettes` 가 돌려준 값. **ULID 가 아니라 viz-render 소유의 불투명 스타일 키다** — 그래서 `Id` 어휘를 쓰지 않는다. 이름을 계약에 박지 않는다."
          minLength: 1
        classCount:
          type: integer
          description: 구간 수 (`Policy_데이터셋_상세 §5 시각화 구간 수 — 3~9 단계, 기본 6`).
          minimum: 3
          maximum: 9
          default: 6

    RenderStage:
      type: string
      description: |
        진행 단계. 값은 정본 문구를 그대로 쓴다
        (`Policy_업로드와_계보_확정 §8 미리보기 그리기` — 파일 읽는 중 → 지도 그리는 중 → 범례 만드는 중).
      enum: ["파일 읽는 중", "지도 그리는 중", "범례 만드는 중"]

    RenderStatus:
      type: string
      description: 렌더 작업 상태. 3값이며 취소를 두지 않는다 — 정본에 취소 화면이 없다.
      enum: ["그리는 중", "완료", "실패"]

    RenderJob:
      type: object
      required: [renderId, status]
      additionalProperties: false
      properties:
        renderId:
          $ref: "../schemas/common.json#/$defs/Ulid"
        status:
          $ref: "#/components/schemas/RenderStatus"
        stage:
          allOf: [{ $ref: "#/components/schemas/RenderStage" }]
          description: "`status` 가 `그리는 중` 일 때만 있다."
        expiresAt:
          allOf: [{ $ref: "../schemas/common.json#/$defs/Timestamp" }]
          description: 렌더 결과의 수명. 등록 전 업로드의 미리보기는 임시로만 둔다.
        result:
          allOf: [{ $ref: "#/components/schemas/RenderResult" }]
          description: "`status` 가 `완료` 일 때만 있다."
        failure:
          allOf: [{ $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }]
          description: |
            `status` 가 `실패` 일 때만 있다. `code` 로 정본의 실패 종류를 구분한다 —
            그리는 서버 연결 불가 · 시간 초과 · 알 수 없는 오류
            (`Policy_데이터셋_상세 §8 미리보기를 그릴 수 없을 때`).
            **부분 실패는 여기가 아니다** — 아래 `RenderResult.partialFailure` 를 쓴다.
        partialFailure:
          allOf: [{ $ref: "#/components/schemas/PartialFailure" }]
          description: |
            조각 일부를 못 읽었을 때. **`status` 는 `완료` 로 남는다.**
            부분 실패는 전부 실패와 다르게 다룬다 — 읽힌 조각으로 그린다.
        gridRejection:
          allOf: [{ $ref: "#/components/schemas/GridRejection" }]
          description: |
            **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 2⟩**
            붙인 기준 격자 파일을 **왜** 쓸 수 없었는가. 선택 속성이다 — 격자를 안 붙였거나
            잘 붙은 렌더에는 없다.

            **왜 `failure` 안이 아닌가** — 격자 거절은 `status` 를 `실패` 로 만들지 않을 수
            있다. ②비지도형은 격자 없이도 완료로 나가고, 그때도 「왜 지도형이 안 떴는가」를
            화면이 말해야 한다(`PREVIEW-IMPLEMENTATION §5.5` — 실패가 아니라 보류).
            그래서 `RenderJob` 바로 아래에 둔다.

            ⚠ **이 필드가 생기기 전에는 이 사실이 `ErrorEnvelope.details` 의 한국어 문장으로만
            나갔고, FE 가 정규식으로 갈랐다** — 복합 문장에서 이미 오분류했다
            (`sessions/S1-CONTRACT-GAP-SWEEP.md` `C-1`). 화면은 이제 이 필드만 읽는다.

    GridRejection:
      type: object
      description: |
        **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 2⟩**
        기준 격자 파일을 쓸 수 없다고 판정한 사실. **사유는 enum, 형상은 숫자다** —
        둘 다 `../schemas/common.json` 이 정의하고 이 파일은 재선언하지 않는다
        (`CLAUDE.md §3-6`). `UploadStatus.gridRejections`(`fe-core.yaml`)와
        `UploadReadyPayload.gridResolution`(`../events/core-pipeline.json`)이 **같은 값 집합**을
        쓴다 — 네 표면 중 하나라도 문장으로 말하면 다시 갈라진다.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          $ref: "../schemas/common.json#/$defs/GridRejectionReason"
        shapes:
          allOf: [{ $ref: "../schemas/common.json#/$defs/GridShapes" }]
          description: |
            판정에 쓰인 형상들. **화면이 「데이터는 (a,b), 격자는 (c,d)」를 말하려면 필요하다.**
            알 수 없는 형상은 넣지 않는다 — 지어내지 않는다.
        fileName:
          description: 거절당한 격자 파일의 이름. 화면이 어느 파일인지 지목하는 데 쓴다.
          type: string
          minLength: 1

    RenderResult:
      type: object
      description: |
        **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 1(`K-1`)·4(`K-4`)⟩**

        완성된 렌더가 무엇으로 소비되는가. **두 형태가 택일(`oneOf`)이다.**
        - **단일 이미지** (`imageUrl` ＋ 사이드카) — stage 1 미리보기 3층이 내는 형태다
          (`〈74〉-㉮` — ①썸네일 128 px WEBP · ②비지도형 1024 px PNG · ③지도형 1024 px PNG).
        - **타일** (`tileUrlTemplate`) — **지우지 않는다.** stage 2 확대 뷰가 그 자리를 쓰고
          `〈68〉` 은 유효한 채 stage 2 에서 깨어난다 (`〈80〉-㉯ 1`).

        **왜 `oneOf` 인가** — 개정 전에는 `required: [tileUrlTemplate, …]` ＋
        `additionalProperties: false` 라 **단일 이미지 + bbox 를 낼 자리가 없었다.**
        둘 다 선택으로 풀어 두면 「무엇을 그릴지 안 적힌 완료」가 성립한다 — 택일로 못 박는다.

        **래스터 배열은 여전히 core 를 통과하지 않는다** — 오가는 것은 URL 과 경계뿐이다
        (파일 상단 주석 · `PREVIEW-IMPLEMENTATION §10-14` — FE 에는 bbox 네 숫자와 이미지 크기만).

        **⟨동결 2회 해제 · `PLAN-SoT §9-〈85〉` · Ted 2026-08-24 판정 ㈎⟩ `bounds` 는
        지도형에만 필수다.** 개정 전에는 `required: [bounds, …]` 라 **②비지도형을
        「완료」로 낼 자리가 없었다** — `〈74〉-㉮` 가 「①②는 좌표계도 격자도 요구하지
        않는다」로 stage 1 에 넣은 층인데, 결과 스키마가 두 갈래 **모두**에 WGS84 경계를
        요구했다. 그 사이를 집행은 `실패(REFERENCE_GRID_MISSING)` ＋ `failure.details` 로
        메웠고, 그것은 **화면에 「실패」라고 말하면서 그림을 주는 상태**였다(`〈83〉-㉮`).
        `〈80〉` 묶음이 ②의 존재를 세지 못해 이 항을 놓쳤다.

        **지금의 형태** — `legend` 만 무조건 필수다. `bounds` 는 **좌표를 쓰는 산출물이
        실제로 있을 때** 따라 붙는다(`dependentRequired`): 사이드카·월드파일(③지도형)
        또는 타일 갈래가 있으면 경계가 있어야 한다. **`imageUrl` 만 있는 결과 = ②비지도형**
        이고 경계가 없는 것이 정상이다 — 없는 좌표를 지어내지 않는다(`DR-9`).
      additionalProperties: false
      required: [legend]
      oneOf:
        - required: [imageUrl]
        - required: [tileUrlTemplate]
      dependentRequired:
        sidecarUrl: [bounds]
        worldFileUrl: [bounds]
        tileUrlTemplate: [bounds]
      properties:
        imageUrl:
          type: string
          description: |
            그려진 이미지 한 장의 URL. core 는 이 문자열을 해석하지 않고 전달만 한다.
            **원값을 여기서 읽으려 하지 마라** — 8비트로 양자화돼 되돌릴 수 없다
            (`PREVIEW-IMPLEMENTATION §10-20`). 값 조회는 stage 1 밖이다.
          minLength: 1
        thumbnailUrl:
          type: string
          description: |
            **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 3⟩**
            ①썸네일(128 px WEBP)의 URL. **선택 속성이다** — 타일 갈래에는 없다.

            ⚠ **이 필드가 없어서 ①이 성공 응답에 실릴 자리가 없었다.** viz-render 는 ①과 ②를
            **항상 함께 굽는데**(`d7_visualization/jobs.py` `build_value_layers`) 성공 응답에는
            `imageUrl` 한 자리뿐이라, ①의 URL 이 **실패 봉투의 `details.thumbnailUrl` 로만**
            나갔다. 즉 **렌더가 성공할수록 썸네일이 안 보였다** — `〈83〉-㉮` 가 닫았다고
            선언한 「성공 산출물이 실패 봉투로 나가는」 모양이 한 필드 옆에 남아 있었다
            (`sessions/S1-CONTRACT-GAP-SWEEP.md` `A-1`).

            `imageUrl` 의 `oneOf` 는 손대지 않는다 — 「무엇을 주 화면에 그릴 것인가」와
            「어떤 층들이 함께 구워졌는가」는 다른 질문이다.
          minLength: 1
        valuePreviewUrl:
          type: string
          description: |
            **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 3⟩**
            ②비지도형(1024 px PNG)의 URL. **선택 속성이다.**
            ③지도형이 있을 때 `imageUrl` 은 ③을 가리키므로, 그때 ②가 갈 자리가 이 필드다 —
            ①②③ 세 층이 함께 구워지는데(`〈74〉-㉮`) 응답이 한 층만 실어 나르면 나머지가 버려진다.
          minLength: 1
        sidecarUrl:
          type: string
          description: |
            지도형(③)에만 있는 **bbox 사이드카 JSON** 의 URL (약 400 B ·
            `PREVIEW-IMPLEMENTATION §3.3`). 비지도형(②)·썸네일(①)에는 **없다** —
            좌표계가 「없음」인 산출물에 좌표 파일을 붙이지 않는다.
            ⚠ **위경도 배열을 내려보내는 자리가 아니다**(53 MB ↔ 400 B, `§10-3`).
          minLength: 1
        worldFileUrl:
          type: string
          description: |
            지도형(③)의 `.pgw` 월드파일 URL. ⚠ **`sidecarUrl` 의 `bbox_3857`(이미지 바깥 모서리)과
            반 픽셀 어긋나는 것이 정상이다**(월드파일 5·6행은 픽셀 **중심**).
            **같게 만들려고 고치지 마라**(`PREVIEW-IMPLEMENTATION §3.4`).
          minLength: 1
        tileUrlTemplate:
          type: string
          description: |
            지도 위젯이 그대로 쓰는 타일 URL 틀 (`{z}`·`{x}`·`{y}` 치환).
            core 는 이 문자열을 해석하지 않고 전달만 한다.
            **stage 1 은 이 형태를 내지 않는다** — 타일 서빙은 stage 1 밖이다(`〈74〉-㉳`).
          minLength: 1
        bounds:
          $ref: "#/components/schemas/Bounds"
        legend:
          $ref: "#/components/schemas/Legend"
        precisionBadge:
          allOf: [{ $ref: "../schemas/common.json#/$defs/GridPrecisionBadge" }]
          description: |
            **`K-4` 정밀도 배지** — 이 그림의 좌표가 어디서 왔는가를 화면이 **말하게** 한다
            (`〈80〉-㉯ 4`). 지도형(③)을 낸 결과에는 있어야 하고, ②비지도형에는
            **`격자 없음 — 지도형 보류` 를 싣는다** — 좌표를 쓰지 않았다는 사실 자체를
            화면이 말해야 격자를 올리면 켜진다는 것이 전해진다.
            **그 값은 실패가 아니라 상태다**
            (`PREVIEW-IMPLEMENTATION §5.5` — 「실패가 아니라 보류」 · `〈85〉`).
        colorRangeStage:
          allOf: [{ $ref: "../schemas/common.json#/$defs/ColorRangeStage" }]
          description: |
            **`K-4` 색 범위 단계** — 이 그림의 2–98 % 공통 스케일이 `잠정`(그 업로드의 파일
            집합)인가 `확정`(데이터셋 전체)인가 (`〈74〉-㉴` · `〈80〉-㉯ 4`).
            ⚠ **라벨이 없으면 그 산출물은 범위 밖이다** — `S1-PLAN-REFOUND §C.2 Q4` 의
            「범위 표기 의무」가 이 필드다. 파일이 1장이면 잠정 범위는 프레임별 스트레치와
            수학적으로 같고, 금지(`§10-7`)와 갈리는 근거 셋 중 하나가 **이 라벨**이다.

    Bounds:
      type: object
      description: |
        지도를 맞출 경계. **WGS84 경위도 고정**이라 요청·응답 어디에도 좌표계 인자가 없다 —
        원본 좌표계 해석은 viz-render 안에서 끝난다 (§3-4).
      required: [west, south, east, north]
      additionalProperties: false
      properties:
        west: { type: number, minimum: -180, maximum: 180 }
        south: { type: number, minimum: -90, maximum: 90 }
        east: { type: number, minimum: -180, maximum: 180 }
        north: { type: number, minimum: -90, maximum: 90 }

    Legend:
      type: object
      description: |
        범례. 구간마다 색과 값 범위를 준다. **층마다 따로 세운다** — 같은 팔레트로 겹치면
        어느 색이 어느 층 값인지 알 수 없다 (`Policy_데이터셋_상세 §8 층 색상`).
      required: [palette, classes]
      additionalProperties: false
      properties:
        palette: { type: string, minLength: 1 }
        variable:
          type: string
          description: 실제로 그린 값의 이름.
          minLength: 1
        unit:
          type: string
          description: 단위. 파일에 없으면 생략한다 — 지어내지 않는다.
          minLength: 1
        classes:
          type: array
          minItems: 3
          maxItems: 9
          items: { $ref: "#/components/schemas/LegendClass" }

    LegendClass:
      type: object
      required: [color, min, max]
      additionalProperties: false
      properties:
        color:
          type: string
          description: "`#rrggbb`."
          pattern: "^#[0-9a-fA-F]{6}$"
        min: { type: number }
        max: { type: number }

    PartialFailure:
      type: object
      description: |
        조각 묶음에서만 생기는 상태. 몇 개를 못 읽었다고 미리보기를 통째로 막지 않는다.
        **무엇이 빠졌는지를 시각으로 정확히 말한다** — 지도에서 비어 보이는 자리를
        데이터가 없는 것으로 잘못 읽지 않게 한다 (`Policy_데이터셋_상세 §8`).
      required: [totalParts, renderedParts, missingParts]
      additionalProperties: false
      properties:
        totalParts: { type: integer, minimum: 1 }
        renderedParts: { type: integer, minimum: 0 }
        missingParts:
          type: array
          description: 못 읽은 조각. 화면은 이름과 시각을 그대로 밝힌다.
          items:
            type: object
            required: [fileName]
            additionalProperties: false
            properties:
              fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
              fileName: { type: string, minLength: 1 }
              instant: { $ref: "../schemas/common.json#/$defs/Timestamp" }

    PaletteOption:
      type: object
      required: [palette, label]
      additionalProperties: false
      properties:
        palette: { type: string, minLength: 1 }
        label:
          type: string
          description: 화면에 서는 이름. viz-render 가 소유한다.
          minLength: 1
        sampleColors:
          type: array
          description: 고르는 자리에 보여줄 색 견본.
          items:
            type: string
            pattern: "^#[0-9a-fA-F]{6}$"

    ScreenshotRequest:
      type: object
      description: |
        지금 장면. 층 순서는 배열 순서이고 **첫 항목이 맨 아래 층**이다 —
        `이 데이터` 층은 맨 아래로 고정되고 끄거나 뺄 수 없다 (`Policy_데이터셋_상세 §8`).
        그 고정 자체는 화면 규칙이라 이 계약이 강제하지 않는다.
      required: [layers, viewport]
      additionalProperties: false
      properties:
        layers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ScreenshotLayer" }
        viewport:
          $ref: "#/components/schemas/Viewport"

    ScreenshotLayer:
      type: object
      required: [renderId]
      additionalProperties: false
      properties:
        renderId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        opacity:
          type: number
          description: |
            불투명도. 얹은 층의 기본은 0.55 다 — 아래층을 비춰 봐야 비교가 된다
            (`Policy_데이터셋_상세 §8 얹은 층`). 맨 아래 층은 1 로 보낸다.
          minimum: 0
          maximum: 1
          default: 0.55

    Viewport:
      type: object
      description: 지도 위젯이 지금 보여주는 화면. 픽셀 크기와 경계만 넘긴다.
      required: [width, height, bounds]
      additionalProperties: false
      properties:
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        bounds: { $ref: "#/components/schemas/Bounds" }
