openapi: 3.1.0

info:
  title: CoLAB v2 — FE ↔ core-api seam
  version: 0.1.0
  contact:
    name: CoLAB v2 · 플랫폼 개발
    url: https://github.com/CognileapAI/colab-v2
  description: |
    프런트엔드와 core-api(D1 Identity&Lab · D2 Access&Policy · D3 Catalog · D4 Lineage ·
    D6 Project · D8 Insight) 사이의 손작성 계약. 근거: `DOMAINS.md §4` 배포 단위 표.

    **판정 기준 — 이 seam 에 없다고 적으려면, 그것을 받는 곳에 FE 가 도달할 수 있어야 한다**
    (`〈54〉` · `sessions/SEAM-AUDIT.md` I-02 — 이 기준이 없어 위임 세 줄이 전부 오배정됐었다).
    그 기준으로 판정한 위임 —
    - 자연어 검색(S-06)·계보 제안: 만드는 것은 D10 이지만 `core-ai` 는 내부 표면이라
      FE 가 직접 도달할 수 없다 (소비자는 core-api 뿐 — `core-ai.yaml` servers 주석).
      **FE 는 이 파일의 중계 op 으로만 도달한다.** 계보 제안 조회는 `listUploadLineageSuggestions`(이 파일)가
      중계하고, **검색은 `searchDatasets`(이 파일 `POST /dataset-searches`)가 중계한다** —
      ⚠ 경로가 `core-ai.yaml` 의 `POST /searches` 와 **일부러 다르다**(그 이유는 op 설명에) —
      ⭑ 「아직 없다 — P4 가 연다」로 비워 뒀던 자리를 `〈80〉-㉯ 5`(승인된 1회 동결 해제)가 열었다.
    - 업로드(E-04): 동기 절반 — HTTP 입구·상태 조회·등록 전환
      (`createUpload`·`getUploadStatus`·`createDataset`) — 은 **이 파일**이고,
      파싱·변환의 **비동기 절반만** `../events/core-pipeline.json` 이다.
      프로젝트 연결 생성도 **이 파일**(`linkProjectDataset`)이다 — 이벤트 봉투는
      `datasetId`·`projectId` 를 싣지 않는다 (`../events/envelope.json` 경계 주석).
    - 미리보기 렌더: 렌더 작업 **생성·조회는 이 파일의 중계 op**
      (`createPreviewRender`·`getPreviewRender`)이고, **타일 URL 소비만 FE 직결**이다 —
      viz-render 는 내부 표면이며 타일 경로만 CDN 뒤에 선다 (`core-viz.yaml` 상단 주석).
      geo 해석은 여전히 D7 의 것이다 (`CLAUDE.md §3-4` 는 geo 라이브러리 import 금지이지 중계 op 금지가 아니다).

    표기 규칙 —
    - 경로는 소문자 kebab-case, 경로 파라미터·쿼리·응답 속성은 **camelCase**(영문 기술 어휘).
    - enum **값**은 정본 한국어 표기 그대로이며 `../schemas/common.json` 에서만 정의된다
      (`CLAUDE.md §3-6` · `sessions/D2.md §1`). 이 파일은 값 집합을 다시 선언하지 않는다.
    - **연구실 경계는 요청에 실리지 않는다.** 서버가 인증 주체에서 주입한다
      (`CLAUDE.md §3-5` · `PERMISSION-PRINCIPLES` P-9·P-10). `labId` 쿼리 파라미터가 없는 이유다.
    - 파생값(`계보 상태`·`가공 단계 Lv`)은 응답에만 있다 (`PLAN-SoT §9-⑳`).
    - **배치 승인 엔드포인트가 없다** (`CLAUDE.md §3` · `Policy_승인_처리` — 요청 1건 = 처리 1건).
    - 잠긴 데이터는 목록·상세에서 **사라지지 않는다.** 이름·요약은 200 으로 내려가고
      `bodyAccessible: false` 가 본체 차단을 말한다 (P-13·P-34).

servers:
  - url: /api/v1

security:
  - sessionSubject: []

tags:
  - name: identity
    description: D1 — 현재 사용자 · 연구실 정보
  - name: access
    description: D2 — 권한 스위치 · 접근 요청 · Verified
  - name: catalog
    description: D3 — 데이터셋 조회 · 파일 · 삭제
  - name: lineage
    description: D4 — 계보 그래프 · 관계 편집 · 재확인
  - name: project
    description: D6 — 프로젝트 CRUD · 소속 데이터셋
  - name: insight
    description: D8 — 홈 대시보드 집계
  - name: ingestion
    description: |
      D5 중계 — 업로드 HTTP 입구 · 상태 조회 · 파일 후주입. 파싱·변환의 비동기 절반은
      `../events/core-pipeline.json` 이 맡고, 여기는 그 파이프라인의 동기 입구다
      (`〈54〉-②` · `sessions/D2c.md §2-2` — 경계는 tag·라우터가 지킨다).
  - name: visualization
    description: |
      D7 중계 — 렌더 작업 생성·조회. viz-render 는 내부 표면이라 FE 는 여기로만 도달하고,
      타일 URL 소비만 FE 직결이다 (`core-viz.yaml` — 타일 경로만 CDN 뒤 · `sessions/D2c.md §2-9`).
  - name: search
    description: |
      D10 중계 — 자연어 검색 진입점. `core-ai` 는 내부 표면이라 FE 는 여기로만 도달한다.
      **AI 는 자연어를 검색어·주제 필터로 해석할 뿐이고, 찾고 매기는 일은 core-api 가
      D3 의 `tsvector` 로 한다** (`core-ai.yaml` `searchDatasets` · `PLAN-SoT §9-〈87〉-㉮`).
      카탈로그 값(이름·Lv·업로더·Verified·잠김)도 core 가 붙인다.
      ⭑ 이전 판은 「AI 는 **식별자·관련도·근거 한 줄**만 낸다」였다 — `〈87〉` 이 그 문장을
      op 안에서만 정정하고 **tag·info 를 세지 않아** 여기 그대로 살아 있었다.
      `PLAN-SoT §9-〈88〉` 묶음 11 이 닫는다.

paths:

  # ─────────────────────────────── D1 세션 (로그인·로그아웃) ────────────────────────
  #
  # ⭑ **5차 동결 해제** — `PLAN-SoT §9 〈90〉`(Ted 2026-08-26 지시). 신설 2 op 뿐이고
  #   기존 op 의 요청·응답·`security` 는 한 글자도 바뀌지 않는다.
  #   정본은 로그인 화면(A-01)을 **P1 로 보류**했고(`IA_사이트맵 §0` · `README_P1` · P-17),
  #   그래서 이 두 op 의 근거는 정본이 아니라 `〈90〉` 이다. 인증 **수단**은
  #   `〈90〉-㉮` 가 교체 가능한 경계 뒤에 둔다 — 정본이 정한 구글 로그인(`PRD_계정과_연구실_소속 §5.1`)이
  #   인가되면 그 경계 안의 어댑터만 바뀌고 이 계약은 그대로다.

  /sessions:
    post:
      tags: [identity]
      operationId: createSession
      summary: 로그인 — 심어 둔 접속 코드를 세션으로 바꾼다
      security: []          # 로그인 자체는 주체를 요구하지 않는다. 이 seam 에서 유일한 예외다.
      description: |
        **회원가입이 아니다.** 계정은 개발자가 심고(P-17 · `Policy_역할과_권한 §3`), 이 op 은
        심어 둔 계정의 접속 코드를 **세션 토큰**으로 바꾸기만 한다. 계정을 만들지 않는다.

        **연구실 경계는 여기서도 요청에 실리지 않는다** — 응답 토큰이 주체를 담고, 경계는
        서버가 그 주체에서 뽑는다 (`CLAUDE.md §3-5` · P-9·P-10).

        인증 수단은 `PLAN-SoT §9 〈90〉-㉮` 의 교체 가능한 경계 뒤에 있다. 세션 수명·갱신·
        조기 회수는 **[정본 무근거]** 이며 `〈90〉-㉲` 가 운영 설정으로 둔 값이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCredentials" }
      responses:
        "201":
          description: 세션 발급
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "500": { $ref: "#/components/responses/ServerError" }

  /sessions/current:
    delete:
      tags: [identity]
      operationId: endSession
      summary: 로그아웃 — 지금 세션을 버린다
      description: |
        화면이 토큰을 버리는 것이 로그아웃의 실체다. 서버는 **무상태 서명 세션**이라 만료 전
        조기 회수를 하지 않는다 — 회수하려면 세션 표가 필요하고, 그 스키마는 이 회차가 만들지
        않았다 (`PLAN-SoT §9 〈90〉-㉳`, **[정본 무근거]**). 이 op 은 그 사실을 감추지 않고
        **204** 만 낸다.
      responses:
        "204": { description: 세션을 버렸다 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D1 Identity & Lab ───────────────────────────────

  /me:
    get:
      tags: [identity]
      operationId: getCurrentAccount
      summary: 현재 사용자 · 역할 · 권한 스위치
      description: |
        GNB 아바타(`IA_사이트맵 §3`)와 화면별 권한 분기가 읽는다. 권한 판정은 언제나 스위치 기준이다
        (P-6). 소속 연구실은 서버가 정하며 클라이언트가 고르지 않는다.
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /lab:
    get:
      tags: [identity]
      operationId: getLab
      summary: 연구실 정보 읽기
      description: |
        `우리 연구실` 읽기 모달(E-07 §8)과 `연구실 설정 > 연구실 정보`가 같은 값을 읽는다.
        **읽기는 전 구성원**이고 편집 버튼만 권한자에게 보인다 (`Policy_홈_대시보드 §6`).
      responses:
        "200":
          description: 연구실 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [identity]
      operationId: updateLab
      summary: 연구실 정보 편집
      description: |
        `연구실 설정` 스위치가 켜진 사람만(P-2 행동표). 여기 적은 **이름**을 연구실 전환기와
        업로드 모달 헤더가 읽는다 (`DataModel §2`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabUpdate" }
      responses:
        "200":
          description: 갱신된 연구실 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lab" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /lab/members:
    get:
      tags: [access]
      operationId: listLabMembers
      summary: 구성원 · 권한 격자
      description: |
        `연구실 설정 > 구성원 · 권한` — 권한 스위치를 고치는 **유일한 자리**(P-18).
        행마다 `editablePermissions` 가 함께 내려간다. **재위임 금지(P-31)를 서버가 말한다** —
        `연구실 설정` 위임자에게는 `업로드·편집`·`프로젝트 생성` 두 값만 담기고, 교수 행은 빈 배열이다
        (교수 행 고정 P-5). 편집 불가 열도 값은 보이므로 표 구조가 깨지지 않는다.
      responses:
        "200":
          description: 구성원 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/LabMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /lab/members/permissions:
    put:
      tags: [access]
      operationId: saveLabMemberPermissions
      summary: 권한 스위치 저장 (확인 모달 1회 = 요청 1회)
      description: |
        권한은 **실시간 저장이 아니다** — `편집 → 체크 → 저장 → 확인 모달` 세 단(P-19).
        확인 모달 한 번에 여러 칸이 바뀌므로 한 요청에 변경분을 모아 보낸다.
        저장은 스위치 하나당 한 줄로 이력에 남는다 — append-only (P-33).
        **재위임 금지 위반은 403 이다** — 화면에서 막은 것을 서버도 같은 기준으로 막는다 (P-11·P-31).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermissionSaveRequest" }
      responses:
        "200":
          description: 저장 후 구성원 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/LabMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────── D5 Ingestion 중계 (E-04) ───────────────────────────

  /uploads:
    post:
      tags: [ingestion]
      operationId: createUpload
      summary: 업로드 진입점 — 등록 전 임시 업로드를 만든다
      description: |
        **`upload.accepted` 를 발행하는 유일한 자리다** — 이벤트 계약이 `source` 를 `core-api`
        상수로 못 박았고(`../events/core-pipeline.json` 이벤트 ① · `envelope.json` source 주석),
        그 능력을 행사하는 HTTP 입구가 이 op 이다 (`〈54〉` · `sessions/D2c.md §2-4`).
        여러 파일을 한 번에 받는다 — 본체 1건 이상 + 기준 격자 파일
        (`PRD_업로드와_계보_확정 §5.1 여러 파일 받기` · `Policy_업로드와_계보_확정 §8 파일 놓기`).
        **저장되는 것은 없다** — 등록 전 세계는 사람이 `데이터셋 만들기`를 눌러야 D3 가 된다
        (`Policy_업로드와_계보_확정 §7.1` — 열어보는 중 = 저장 안 됨).
        조각(part) 단위 이어올리기 상태는 계약에 없다 — 정본이 범위 밖으로 뒀다 (`Policy §9`).
        파일 바이트가 이 op 으로 들어온다는 전송 형태는 `[정본 무근거]` 레포 결정이다 —
        정본은 `파일을 끌어다 놓는다 → 업로드한다`(`Policy §2` 규칙 맵)까지만 말한다.
        core-api ↔ 스토리지 사이가 presigned multipart 인 것은 배포 내부 사정이며 이 seam 의 것이 아니다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              additionalProperties: false
              properties:
                files:
                  description: 파일 바이트 파트들. 순서가 `fileKinds` 와 짝이다.
                  type: array
                  minItems: 1
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                fileKinds:
                  description: |
                    `files` 와 같은 순서의 파일 종류. 생략하면 전부 `본체` 다.
                    이벤트의 `FileRef.kind` 가 required 라 접수 시점에 종류가 정해져 있어야 한다
                    (`../events/core-pipeline.json` FileRef · `DataModel §4.3`).
                  type: array
                  items: { $ref: "../schemas/common.json#/$defs/FileKind" }
      responses:
        "201":
          description: |
            접수됨. 이 응답이 FE 표면에 `uploadId`·`fileId` 를 내리는 자리다
            (`sessions/SEAM-AUDIT.md` I-01·I-06 — 소비만 있고 생산이 없던 두 식별자).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }


  # ──────────────── 프리사인드 전송 (동결 해제 8차 · 저장 모드 s3 전용) ────────────────
  # 로컬 개발의 정문은 여전히 `createUpload` 다 — 저장 모드 local 에서 아래 9 op 은
  # 전부 501 을 내고, FE 는 그 신호로 form-data 경로에 폴백한다.

  /uploads/transfers:
    post:
      tags: [ingestion]
      operationId: initiateUploadTransfer
      summary: 프리사인드 전송 계획 — 바이트 없이 접수 초안을 세운다
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 전송 형태는
        `[정본 무근거]` 레포 결정이다 — 정본은 `파일을 끌어다 놓는다 → 업로드한다`
        (`Policy §2`)까지만 말한다. 파일 바이트는 이 op 으로 들어오지 않는다 —
        브라우저가 프리사인드 URL 로 S3 에 직접 놓고, 서버는 계획(전략·파트 크기)과
        수명(이어올리기 창 72시간)만 만든다. 완결(`completeUploadTransfer`) 전에는
        `d5_upload` 도 `upload.accepted` 도 없다 — 접수는 그때 일어난다.
        폴더째 업로드의 상대 경로는 `relativePath` 메타로 보존한다 — 세 배포 단위가
        공유하는 저장 키 규약은 손대지 않는다 (`PLAN-SoT §9 〈173〉`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadTransferDraft" }
      responses:
        "201":
          description: 전송 계획. 파일마다 전략(단일/멀티파트)과 파트 크기가 정해져 있다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTransferPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/incomplete:
    get:
      tags: [ingestion]
      operationId: listIncompleteUploadTransfers
      summary: 내 미완결 전송 — 이어올리기 배너의 데이터
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 본인 것만 온다 —
        배너가 남의 미완료를 보여 줄 이유가 없다 (연구실 경계는 RLS 가 먼저 긋는다).
        만료(이어올리기 창 72시간)된 전송은 지연 정리로 사라지고 목록에 오르지 않는다.
      responses:
        "200":
          description: 미완결 전송 목록 (최신순).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncompleteUploadTransfers" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [ingestion]
      operationId: getUploadTransfer
      summary: 전송 상태 — 재개에 필요한 실측 사실
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). **파트의 정본은
        S3 ListParts 다** — `uploadedParts` 는 서버가 실측해 온 값이고, 클라이언트의
        자기 보고를 믿지 않는다. 재개는 이 값에서 빠진 파트만 다시 올린다.
      responses:
        "200":
          description: 전송 계획 + 파일별 결과와 올라간 파트 실측.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTransferStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [ingestion]
      operationId: abortUploadTransfer
      summary: 전송 중단 — S3 의 파트·객체까지 치운다
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 미완 멀티파트를
        Abort 하고 올라간 객체를 지운 뒤 원장 행을 지운다. 완결된 전송은 중단할 수
        없다(409) — 그것은 이미 접수다.
      responses:
        "204": { description: 중단·정리됨. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}/put-urls:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [ingestion]
      operationId: issueUploadUrls
      summary: 단일 PUT 프리사인드 URL 발급
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). URL 수명은 짧다
        (자격증명 만료 안쪽으로 클램프) — 소진되면 다시 발급받는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileIds]
              additionalProperties: false
              properties:
                fileIds:
                  description: 전략이 `단일` 인 파일들. 1~50개.
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: "../schemas/common.json#/$defs/Ulid" }
      responses:
        "200":
          description: 파일별 프리사인드 PUT URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPutUrls" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}/files/{fileId}/multipart:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [ingestion]
      operationId: initUploadFileMultipart
      summary: 멀티파트 시작 — 멱등
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 이미 시작됐으면
        같은 계획을 다시 돌려준다 — 재개가 이 멱등성 위에 선다.
      responses:
        "200":
          description: 파트 크기·개수 계획.
          content:
            application/json:
              schema:
                type: object
                required: [partSize, partCount]
                additionalProperties: false
                properties:
                  partSize: { type: integer, minimum: 1 }
                  partCount: { type: integer, minimum: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}/files/{fileId}/part-urls:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [ingestion]
      operationId: issueUploadPartUrls
      summary: 파트 PUT 프리사인드 URL 발급 (배치)
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 한 번에 1~16개 —
        URL 수명(짧다)과 왕복 수의 절충이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partNumbers]
              additionalProperties: false
              properties:
                partNumbers:
                  description: 1~10000 (S3 파트 번호 하드 리밋).
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: 파트별 프리사인드 PUT URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPartUrls" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}/files/{fileId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [ingestion]
      operationId: completeUploadFile
      summary: 파일 완료 — 서버가 S3 실측으로 검증한다
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 멀티파트면
        ListParts → Complete, 이어서 HeadObject 로 크기를 신고값과 대조한다.
        불일치는 `실패` 로 남고 다시 올려야 한다 — 자기 보고를 믿지 않는다. 멱등.
      responses:
        "200":
          description: 실측 결과.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFileOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/transfers/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [ingestion]
      operationId: completeUploadTransfer
      summary: 전송 완결 — 이때 접수(`upload.accepted`)가 일어난다
      description: |
        [사용자 승인 2026-08-28] 동결 해제 8차 (`PLAN-SoT §9 〈174〉`). 모든 파일이
        실측으로 확인된 뒤에만 성립한다(아니면 409). 같은 ULID 로 `d5_upload` 가 서고
        `upload.accepted` 가 발행된다 — 이벤트 계약의 `source: core-api` 능력을
        행사하는 두 번째 HTTP 입구다 (`createUpload` 와 같은 능력 · `〈54〉`).
        응답은 `UploadReceipt` 와 같은 모양이다 — 이 지점부터 두 전송 경로의 구분 없이
        같은 상태 조회(`getUploadStatus`)로 간다.
      responses:
        "201":
          description: 접수됨 — `createUpload` 201 과 같은 자리다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/{uploadId}/files:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [ingestion]
      operationId: addUploadFile
      summary: 등록 전 업로드에 파일 하나를 더한다 — `addDatasetFile` 의 **등록 전 짝**
      description: |
        **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 5⟩**
        `addDatasetFile`(등록 뒤)과 **같은 모양**이고, 다른 것은 대상 세계뿐이다 —
        등록 전 업로드 vs 등록된 데이터셋. 두 세계가 갈라져 있는 것은 `〈79〉-㈎` 가 이미
        세운 사실이다.

        ⚠ **없어서 무엇이 깨졌나** (`sessions/S1-CONTRACT-GAP-SWEEP.md` `D-2`)
        「업로드에 파일을 더한다」는 op 이 **등록 뒤에만** 있어서, 화면이 격자를 붙일 때마다
        `createUpload` 를 **다시** 불렀다. 그 결과 —
        - **본체 전체가 다시 올라갔다.** 화면은 「격자 파일을 받는 중입니다」라고 말하는데
          실제로는 본체를 재전송한다 — **화면이 하는 말이 사실이 아니다.**
          HSR 격자 한 장이 실측 26,562,948 B 이고 본체는 조각 묶음이면 훨씬 크다.
        - **`uploadId` 가 바뀌었다.** 앞 업로드에 붙어 있던 계보 제안 화면 상태와 이미 그린
          미리보기(`renderId`)가 **전부 무효가 된다.**

        기각한 대안 = `createUpload` 를 여러 번 부르되 `uploadId` 를 요청에 싣기 —
        「접수 = 새 집계 루트」라는 이벤트 계약의 성질(`../events/envelope.json`)을 흐린다.

        새 파일도 파이프라인을 지난다 — 그 비동기 절반은 이벤트 seam 의 것이다.
        판정은 `업로드·편집` 스위치가 한다 (`〈59〉-②`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                kind:
                  $ref: "../schemas/common.json#/$defs/FileKind"
      responses:
        "202":
          description: |
            받았다. **`201 + UploadFileRef` 로 답하지 않는다** — 기준 격자 파일의 축은
            서버가 파일을 읽어야 정해지고(`〈63〉-㉰`) 그 판별은 pipeline-worker 소관이라,
            응답 시점에 `gridAxis` 를 말할 자격이 없다. 확정 결과는 `getUploadStatus` 의
            `files[].gridAxis` · `gridRejections` 에 나타난다 (`〈88〉` 묶음 7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFileRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/{uploadId}/files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/FileId"
    put:
      tags: [ingestion]
      operationId: replaceUploadGridFile
      summary: 등록 전 기준 격자 파일 교체 · 축 뒤집기 — `replaceDatasetGridFile` 의 등록 전 짝
      description: |
        **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 6⟩**
        요청 스키마를 `replaceDatasetGridFile` 과 **공유한다**(`GridFileReplacement`) —
        같은 조작이고 대상 세계만 다르다.

        ⚠ **없어서 무엇이 깨졌나** (`sessions/S1-CONTRACT-GAP-SWEEP.md` `D-4`)
        `flipAxes` 가 `replaceDatasetGridFile` **안에만** 있고 그것은 `datasetId` 를
        요구하므로 **등록 전에는 부를 수 없었다.** `S1-PLAN-REFOUND §E.2-⑤` 는 그 자리에
        **[맞습니다] [위도·경도 뒤집기]** 두 버튼을 규정하고 `§E.3` 사다리 **6단(사람의 눈)**
        이 이것 없이 성립하지 않는데, 화면은 **없는 길을 버튼으로 만들지 않으려고** 버튼을
        아예 세우지 않았다(`GridUploadBlock.tsx`). 축이 뒤바뀐 격자를 올린 사람은
        **엉뚱한 지도를 본 채 등록하고** 나서 상세에서 고쳐야 했다.

        ⚠ **`〈80〉-㉯ 3` 이 기각한 `flipGridAxes` 신설과 다르다.** 그 기각의 근거는
        「축을 바꾸는 길이 둘이 되어 정본 경로가 흐려진다」였는데, 여기서는 **대상 세계가
        다르다**(등록 전 업로드 vs 등록된 데이터셋). `addDatasetFile` ↔ `addUploadFile` 과
        같은 짝 관계이고, 두 세계가 갈라져 있는 것은 `〈79〉-㈎` 가 이미 세운 사실이다.

        `flipAxes` 의 규칙은 등록 뒤와 **같다** — 한쪽만 바꾸면 축별 부분 유니크의
        중간 상태가 제약을 깨므로 **맞바꿈은 한 트랜잭션 안에서 끝난다.** 그래서 그 업로드의
        기준 격자 파일이 2건이 아니면 409 다. 대상이 `본체` 면 409 다 (`〈59〉-③`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/GridFileReplacement" }
      responses:
        "202":
          description: |
            받았다. **`200 + UploadFileRef` 로 답하지 않는다** — 파일을 갈아 끼운 경우 새 축
            판별이 다시 돌아야 하고, 그 결과는 `getUploadStatus` 가 말한다 (`〈88〉` 묶음 7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadFileRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            대상이 본체 파일이다 (`〈59〉-③`). **또는** `flipAxes` 인데 그 업로드의 기준 격자
            파일이 2건이 아니다 — 바꿀 짝이 없다. `replaceDatasetGridFile` 과 같은 규칙이다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [ingestion]
      operationId: getUploadStatus
      summary: 업로드 상태 조회 — 실패 사유 8값이 화면에 가는 자리
      description: |
        파이프라인 이벤트(②~⑦)의 결과를 FE 가 소비하는 동기 창구다
        (`sessions/SEAM-AUDIT.md` I-18·C-5 — 실패 사유가 화면에 갈 자리가 없었다).
        필드는 이벤트 페이로드의 사실을 그대로 비춘다 — 새 값 집합을 만들지 않는다.
      responses:
        "200":
          description: 업로드 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 없는 업로드이거나 수명이 다해 사라졌다 (`Policy §7.1` — 등록되지 않은 업로드는 남지 않는다).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /uploads/{uploadId}/lineage-suggestions:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [ingestion]
      operationId: listUploadLineageSuggestions
      summary: AI 계보 제안 조회 (중계) — 제안만, 저장 없음
      description: |
        `core-ai` 는 내부 표면이라(소비자는 core-api 뿐 — `core-ai.yaml`) FE 는 이 중계로만
        제안에 도달한다 (`Policy_업로드와_계보_확정 §2` 규칙 맵 — AI 제안을 확인한다 ·
        `sessions/D2c.md 추기-2` — 범위 확장 1건, 사용자 승인 2026-08-23).
        요청의 파일 메타·범위는 core-api 가 파이프라인 결과에서 만든다 — FE 는 해석 단서만 보탠다.
        **확정 오퍼레이션이 아니다** — 확인된 제안은 `createDataset` 의 계보 관계로만 저장된다
        (`CLAUDE.md §3-2` — D10 은 제안만, 사람이 확인한 것만 커밋).
        스키마는 중계라 재선언하지 않고 `core-ai.yaml` 정의를 그대로 참조한다 — 같은 모양의
        두 번째 선언은 갈라질 표면이다.
      parameters:
        - name: datasetNameDraft
          in: query
          required: false
          description: 등록 폼의 데이터셋 이름 초안. 해석 단서로만 쓴다 (`core-ai.yaml` LineageSuggestionRequest).
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: subject
          in: query
          required: false
          description: 고른 주제. 아직 안 골랐으면 생략한다 (`Policy §5`).
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: 제안 결과. **0건도 여기로 온다** — 정직한 빈 상태 (`Policy §8` AI 제안 영역).
          content:
            application/json:
              schema: { $ref: "core-ai.yaml#/components/schemas/LineageSuggestionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D3 Catalog ───────────────────────────────

  /datasets:
    get:
      tags: [catalog]
      operationId: listDatasets
      summary: 카탈로그 목록 (S-03)
      description: |
        표 헤더가 조건과 정렬의 유일한 자리다 — 조건 툴바도 패싯 사이드바도 없다
        (`Policy_데이터_찾기 §1.3-9`). 조건을 걸 수 있는 열은 주제 · Level · 업로더 · 계보 · Verified
        다섯이고 한 열에서 값을 여러 개 고른다(§5). 기본 정렬은 **수정일 최신순**.
        **잠긴 데이터는 빠지지 않는다** — 자물쇠·`잠김` 칩으로 표시될 뿐이다 (P-13).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CatalogSortColumn"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/FilterTopic"
        - $ref: "#/components/parameters/FilterProcessingLevel"
        - $ref: "#/components/parameters/FilterUploader"
        - $ref: "#/components/parameters/FilterLineageState"
        - $ref: "#/components/parameters/FilterVerified"
      responses:
        "200":
          description: |
            `totalCount` 는 조건을 걸 때마다 갱신되는 표시값이다 (`Policy_데이터_찾기 §결과 헤드`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DatasetRow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [ingestion]
      operationId: createDataset
      summary: 데이터셋 만들기 — 업로드의 등록 전환 (계보 확정)
      description: |
        의미는 「새 데이터셋을 만든다」가 아니라 **「업로드 세계의 `uploadId` 를 D3 데이터셋으로
        등록 전환한다」** 다 — 사람이 `데이터셋 만들기`를 눌러야 데이터셋이 생기고
        (`Policy_업로드와_계보_확정 §7.2` · `../events/envelope.json` uploadId 주석),
        등록 전에는 아무것도 저장되지 않는다 (`Policy §7.1`).
        확정된 계보 관계·소속 프로젝트 지정이 이 요청에 함께 실린다 — 등록 폼 한 화면이
        한 번에 제출하는 값이다 (`Policy §5` 입력값 규칙).
        **`fileId` 동일성** — 등록 시 D3 파일 레코드는 업로드 세계의 `fileId` ULID 를 자기 PK 로
        그대로 쓴다. 새로 만들지 않는다. `[정본 무근거 — 계약 구조 연역(sessions/D2c.md §2-10) ·
        Ted 승인 2026-08-23 (본인 확인) — ㉢ 제출 목록 유지]`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetCreate" }
      responses:
        "201":
          description: 등록된 데이터셋. 화면은 상세로 이동한다 (`Policy §7.2`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: 없는(또는 수명이 다한) 업로드다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "409":
          description: 이미 등록 전환된 업로드다 — 같은 업로드로 데이터셋을 두 번 만들지 않는다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/facets:
    get:
      tags: [catalog]
      operationId: listDatasetFacets
      summary: 열 메뉴의 값별 건수
      description: |
        열 메뉴는 값마다 지금 조건 기준의 건수를 함께 적는다. **다른 열에 걸린 조건을 먼저 적용한 뒤
        센다** — 그래서 요청은 목록과 같은 조건을 그대로 싣는다. 0건인 값은 흐리게 두어
        빈 결과로 보내지 않는다 (`Policy_데이터_찾기 §5 값별 건수`).
      parameters:
        - $ref: "#/components/parameters/FilterTopic"
        - $ref: "#/components/parameters/FilterProcessingLevel"
        - $ref: "#/components/parameters/FilterUploader"
        - $ref: "#/components/parameters/FilterLineageState"
        - $ref: "#/components/parameters/FilterVerified"
      responses:
        "200":
          description: 조건을 걸 수 있는 다섯 열의 값별 건수
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacetSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /dataset-searches:
    post:
      tags: [search]
      operationId: searchDatasets
      summary: 자연어 검색 (중계) — S-01 검색 히어로 · S-06 검색 결과
      description: |
        **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 5⟩**
        이 파일 상단이 「검색 진입점 op 은 아직 없다 — P4 가 연다」로 비워 둔 자리다.
        `core-ai` 는 내부 표면이라 FE 가 직접 도달할 수 없고, **이 중계로만 도달한다**
        (`listUploadLineageSuggestions` 와 같은 모양 · `SEAM-AUDIT I-08`).

        ⚠ **경로가 `core-ai.yaml` 의 `POST /searches` 와 일부러 다르다.** 두 seam 이 같은
        경로를 쓰면 `contract-breaking` 게이트(oasdiff `-c` 합성 비교)가 **같은 엔드포인트로
        합쳐 버려** 비교 자체를 못 한다 — 실제로 red 를 보고 고쳤다. 두 표면은 소비자도
        모양도 다르므로(이쪽은 카탈로그 값이 붙은 카드, 저쪽은 식별자·관련도·근거) 경로가
        갈리는 것이 사실에 더 맞다.

        **역할 분담** — AI 는 **자연어를 검색어·주제 필터로 해석할 뿐**이고, 후보·순위·근거
        한 줄은 **core-api 가 D3 의 `tsvector` 로** 만든다 (`core-ai.yaml#searchDatasets` ·
        `〈72〉-㉮`). 카드에 실리는 값(이름·Lv·주제·업로더·Verified·잠김)도 **core-api 가
        D3·D2 에서 붙인다** — AI 가 카탈로그 값을 다시 말하지 않는다(두 곳에서 말하면
        갈라진다). 그래서 응답 스키마를 `core-ai.yaml` 에서 참조하지 **않고** 여기서 세운다.

        정본이 못 박은 것 넷 —
        - **뒤진 범위를 먼저 밝힌다** (`scope`). 0건이어도 어디를 몇 개 뒤졌는지가 먼저다
          (`Policy_데이터_찾기 §3.3`). **0건은 정상 응답이다** — 오류로 만들지 않는다.
        - **관련도는 막대 하나다.** `relevanceBar` 를 퍼센트·등급 텍스트로 그리지 않는다(§4).
          확신도(`AiConfidence`)와 **다른 개념**이고, 확신도에는 숫자가 없다.
        - **근거는 한 줄 고정**이고 **한계도 그 한 줄 안에서** 밝힌다 — 별도 필드를 두지 않는다.
        - **잠긴 데이터가 결과에서 빠지지 않는다** (§1.3-6). 잠김 표시는 core 가 붙인다.

        **`Verified 우선` 정렬은 core 가 세운다** — D2 의 값이라 AI 에 권한 정책을 얹지 않는다.
        (⭑ 위 두 문단은 `PLAN-SoT §9-〈87〉-㉮` 로 정정된 판이다. `〈88〉` 묶음 11 이 낡은 원문을
        **지웠다** — 정정문을 덧붙이기만 하면 계약 안에 서로 반대인 두 문장이 공존하고,
        그때 어느 쪽이 정본인지가 없다.)

        **「제 몫을 못 함」이 두 가지고, 화면이 둘을 다르게 그린다** (`〈87〉-㉯` Ted 판정) —
        - **해석만 무너짐 (`degraded: true` + 200)** — 모델이 없거나 답을 못 읽어 **낱말 그대로**
          찾았다. **결과는 진짜 결과다.** 화면은 결과를 그대로 그리고 한계를 함께 말한다.
          여기서 `CLAUDE.md §3`(AI 없이도 v2 는 완결된 제품)이 지켜진다.
        - **검색에 못 닿음 (`503` + `SEARCH_UNAVAILABLE`)** — ai-service 가 죽었거나 응답의
          범위가 달라 버렸거나 해석을 못 읽었다. **한 건도 뒤지지 않았다.** 이때 200 + 0건을
          내면 화면이 「찾아봤는데 없다」고 말하는데 사실은 **「찾아보지도 못했다」**이다.
          **폴백을 두지 않는다** — 죽으면 「동작하지 않음」이 드러나야 하고, 그래야 감시가 잡는다.
          카탈로그·업로드는 그대로 도므로 화면은 카탈로그로 안내한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchQuery" }
      responses:
        "200":
          description: 검색 결과. **0건도 여기로 온다** — 정직한 빈 상태.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            **검색에 닿지 못했다 — 0건이 아니다** (`ErrorEnvelope.code = SEARCH_UNAVAILABLE`).
            한 건도 뒤지지 않은 상태라 「없다」고 말할 자격이 없다 (`〈87〉-㉯`).
            화면은 「검색이 지금 동작하지 않아요… 없다는 뜻이 아니에요」 + 카탈로그 링크를 세운다.
            `createPreviewRender` 의 `RENDER_UNAVAILABLE` 과 같은 모양이다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [catalog]
      operationId: getDataset
      summary: 데이터셋 상세 (S-05) — 헤더 · 기본 정보 · 계보 요약 · 활용 프로젝트
      description: |
        한 페이지 스크롤 화면이 읽는 값 전부. **잠긴 데이터도 200 이다** —
        이름·요약·헤더 태그(주제·Lv·Verified)까지 내려가고 `basicInfo` 는 `null` 이 된다
        (`Policy_승인_처리 §8` 상세 잠긴 상태 · P-13). 403 을 쓰면 접근 요청 흐름이 죽는다.
        묘비(삭제된 데이터셋)는 상세 화면이 없으므로 404 다 (`Policy_데이터셋_상세 §7`).
      responses:
        "200":
          description: 데이터셋 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [catalog]
      operationId: updateDataset
      summary: 데이터셋 정보 수정 — 사람이 적는 정보
      description: |
        **「사람이 적는 정보」를 고친다** (`DATAMODEL-BASELINE.md` D3 · `sessions/D2c.md §2-7`
        — 이 U 가 통째로 없어 `〈55〉` 의 주제를 고칠 길이 없었다).

        ⭑ **2026-08-27 개정 (`PLAN-SoT §9 〈138〉`·`〈140〉`).** 종전 서술은 「이름·주제·한 줄
        요약만」이고 「자동으로 읽은 정보(변수·기간·좌표계·격자·포맷)는 이 op 의 대상이
        아니다」였다. **정본이 자동 추출을 포맷·용량으로 줄이면서**(`POLICY` 핵심규칙 1 ·
        `VAL-006`) **변수·기간·좌표계가 사람이 적는 값이 됐다.** 원천 표기·가공 단계·대표
        조각도 여기서 고친다. 대상은 `DatasetUpdate` 가 정본이다.

        **`format`·`grid` 는 여전히 대상이 아니다** — 자동이고 사람이 고칠 수 없다 (`VAL-003`).

        `업로드·편집` 스위치가 판정한다 (`〈59〉-②` — 소유자를 별도 관문으로 만들지 않는다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatasetUpdate" }
      responses:
        "200":
          description: 갱신된 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [catalog]
      operationId: deleteDataset
      summary: 데이터셋 삭제 (묘비)
      description: |
        **소유자 또는 교수만.** 파일·미리보기만 지우고 이름·주제·Lv·계보 관계·프로젝트 연결·
        Verified 는 남긴다 (`DataModel §4.1` 삭제 기록 · `Policy_데이터셋_상세 §8`).
        되돌리는 전이가 없다. 대기 중인 접근 요청은 자동으로 닫힌다 (§9).
      responses:
        "204":
          description: 묘비로 전환됨
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /dataset-field-suggestions:
    get:
      tags: [catalog]
      operationId: listDatasetFieldSuggestions
      summary: 자유 입력 칸의 자동완성 후보 — 이미 쓰인 말을 돌려준다
      description: |
        **파편화를 입력 단계에서 막는다** (결정 2-10 · `PLAN-SoT §9 〈138〉`).

        정본이 변수·좌표계·원천 표기를 **자유 입력**으로 두었으므로(`VAL-006`·`VAL-009`)
        같은 것을 두 사람이 다르게 적는 일이 생긴다 — `ERA5` / `era5` / `ECMWF ERA5` /
        `ERA-5`. 결정 2-10 이 그 대가를 적어 뒀다: **「데이터가 쌓인 뒤의 소급 정리는
        사람이 하나씩 묶어야 하므로 입력 단계 차단과 비용 차이가 크다」**, 그리고
        원천은 **계보 그래프의 뿌리 노드**라 파편화되면 그래프 상단이 통째로 갈라진다.

        **통제 어휘로 고정하지 않는다** — 연구실에 어떤 자료가 들어올지 미리 알 수 없다.
        제안하되 목록에 없는 값은 직접 칠 수 있다.

        **이 연구실 안에서 이미 쓰인 값만 돌려준다** — 경계는 스코프 커널이 주입한다.
        빈 목록은 정상이다(첫 사람은 후보가 없다). **억지로 채우지 않는다.**

        ⚠ **`가공 방식` 은 여기 없다.** 그 어휘는 D9 온톨로지 시드가 소유하고
        (`d9_method_term`, 결정 2-11) **core-api 는 그 저장소에 붙지 않는다**
        (`CLAUDE.md §3-1`·`§3-3`). 그쪽은 ai-service 의 사전 표면으로 간다.
      parameters:
        - name: field
          in: query
          required: true
          description: |
            후보를 받을 칸. **D3 이 소유한 자유 입력 칸만** 값으로 온다.
            계약 층 enum 을 만들지 않는다 (`NB-E`) — 서버가 모르는 값이면 400 이다.
          schema: { type: string, minLength: 1 }
        - name: q
          in: query
          required: false
          description: 입력 중인 글자. 비면 많이 쓰인 순으로 앞쪽을 돌려준다.
          schema: { type: string, maxLength: 60 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: 후보 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSuggestions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/deletion-impact:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [catalog]
      operationId: getDatasetDeletionImpact
      summary: 삭제 확인 모달이 말해야 하는 파급
      description: |
        확인 모달은 무엇이 지워지고 무엇이 남는지, 파생 N건 · Verified 여부 ·
        **대기 중인 접근 요청 N건**을 말한다 (`Policy_데이터셋_상세 §8·§9`).
        앞의 둘은 상세 화면에 이미 있으나 접근 요청 건수는 이 화면에 없는 값이라 따로 내준다.
      responses:
        "200":
          description: 파급 요약
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionImpact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/files:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [catalog]
      operationId: listDatasetFiles
      summary: 파일(조각) 목록 — `보기`를 눌렀을 때만
      description: |
        기본 정보의 `파일` 칸은 조각 수와 용량 합계만 말하고, 목록은 사람이 눌렀을 때 연다
        (`DataModel §4.3` · `Policy_데이터셋_상세 §5`). 본체 조각들과 기준 격자 파일 유무를
        함께 보여주고, 없으면 없다고 적는다.
      responses:
        "200":
          description: 파일 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DatasetFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            잠김 + 허용 목록 밖. 메타는 상세에서 보이지만 파일 목록은 본체 쪽이라 막힌다 (P-34).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      tags: [ingestion]
      operationId: addDatasetFile
      summary: 파일 추가 (후주입) — 기준 격자 파일은 나중에 와도 된다
      description: |
        **`〈58〉-②` 가 요구한 후주입 경로다** — 기준 격자 파일은 나중에 구해서 더할 수 있어야
        하고, 없으면 좌표를 구한 사람이 다시 올리는 수밖에 없어 계보가 끊긴다.
        추가는 정상 동작이다 (`〈59〉-①`). 판정은 `업로드·편집` 스위치가 한다 (`〈59〉-②`).
        후주입은 계보를 접지 않고 활동 기록(D8)에 남는다 (`〈60〉`).
        새 파일도 파이프라인(파싱·변환)을 지난다 — 그 비동기 절반은 이벤트 seam 의 것이다.

        **⟨Ted 2026-08-25 판정(사용자 관점 우선) — 격자 후주입의 집행 경로는 이 op 이 아니다⟩**
        `〈88〉` 묶음 10 이 여기에 `202` 를 열었으나 **그 응답을 낼 수 있는 집행이 없었다**:
        축이 정해지기 전의 격자 파일을 둘 자리가 저장 형태에 없고(`d3_file` CHECK ㈎),
        파이프라인 이벤트는 `upload_id` 가 NOT NULL 이라 데이터셋 단위 판별을 태울 봉투가 없다.

        **격자 후주입은 `attachUploadGridFiles` 가 집행한다.** 사람에게 그 조작은 **파일
        업로드**이므로 기존 업로드 흐름(`createUpload` → `getUploadStatus` → 판별 사다리)을
        그대로 쓰고, 판별이 끝난 뒤 그 op 이 `uploadId` 와 `datasetId` 를 한 요청에서 받는다.
        그래서 `〈58〉-②`·`§E.2-⑨` 의 약속이 실제 경로를 얻는다.

        ⭑ **`202` 는 철회됐다 (Ted 판정 2026-08-27 · 여섯 번째 동결 해제 · `〈151〉`).**
        `〈98〉` 이 「다음 회차의 진입조건」이라 적었고 그 회차가 왔다. 소비자 0건이고
        집행도 0건이었다 — **실현 안 되는 약속을 계약이 들고 있으면 다음 사람이 그것을
        구현하려 든다.** 격자 후주입의 경로는 `attachUploadGridFiles` 하나다.

        ⚠ **이 op 에 남는 집행은 `본체` 뿐이고, 본체 후주입은 `〈59〉-③` 이 금지한 조작이다.**
        집행은 `kind = 기준 격자 파일` 을 **400 으로 거절하고 `attachUploadGridFiles` 를 가리킨다.**
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              additionalProperties: false
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                kind:
                  $ref: "../schemas/common.json#/$defs/FileKind"
      responses:
        "201":
          description: |
            추가된 파일. **`kind` 가 `본체` 일 때만 이 응답이다** — 축 판별이 필요 없어
            그 자리에서 완결된다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/grid-files:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [ingestion]
      operationId: attachUploadGridFiles
      summary: 기준 격자 후주입 확정 — 판별이 끝난 업로드를 이 데이터셋에 반영한다
      description: |
        **정본 근거 = `〈58〉-②`(후주입 경로가 없으면 계보가 끊긴다) · `〈75〉-㉰`(격자는 지도형의
        전제이고 등록은 격자에 인질이 아니다) · `Policy_데이터셋_상세 §5`(파일 칸) ·
        Ted 2026-08-25 판정(사용자 관점 우선 — 「격자를 나중에 붙이는 행위」 = 파일 업로드).**

        **사람에게 이 조작은 업로드다.** 그래서 새 개념을 만들지 않고 **기존 업로드 흐름을
        그대로 재사용한다** — `createUpload` 로 격자 파일을 접수하고, `getUploadStatus` 로
        판별 사다리의 결과(`gridAxis` · `gridRejections`)를 본 뒤, 사람이 「이 데이터셋에
        반영」을 누르면 이 op 이 `uploadId` 와 `datasetId` 를 **한 요청 안에서** 받는다.

        **짝(데이터셋 ↔ 업로드)을 저장하지 않는다.** 화면이 들고 있다가 이 요청에 동봉한다 —
        `d5_upload` 는 `datasetId` 를 의도적으로 갖지 않고(불변규칙 1), 그 자리를 만들면
        D5 가 D3 를 가리키게 된다. 등록 전환(`createDataset`)이 성립하는 이유와 같은 이유로
        이 op 도 성립한다: **`datasetId` 와 격자 파일이 한 트랜잭션 안에 함께 있는 순간**이다.

        **`〈79〉-㈎` 가 그대로 지켜진다** — 원장의 격자 행은 워커가 축을 확정한 뒤에 서고,
        이 op 은 그 **이미 축이 확정된 행**을 `d3_file` 로 옮긴다. 축이 빈 격자 행을 만들지
        않으며, `0004` 의 CHECK 도 이벤트 계약도 건드리지 않는다.

        판정은 `업로드·편집` 스위치가 한다 (`〈59〉-②`). 후주입은 계보를 접지 않고 활동
        기록(D8)에 남는다 (`〈60〉`).

        **거절되는 자리**
        - 그 업로드에 **축이 확정된 기준 격자 파일이 하나도 없다** → `400`.
          판별에 실패했거나 형상이 어긋난 격자는 원장에 행이 없다 (`〈66〉`) —
          사유는 `getUploadStatus` 의 `gridRejections` 가 말한다.
        - 그 업로드에 **본체 파일이 섞여 있다** → `400`. 본체가 든 묶음은 등록 전환의
          대상이지 후주입의 대상이 아니다 (`〈59〉-③` — 본체 후주입은 금지된 조작이다).
        - 이미 그 축을 쓰는 격자 파일이 데이터셋에 있다 → `409`.
          데이터셋당 기준 격자 파일은 **0~2 건**이고 축마다 하나다 (`〈58〉` · `0004` 축별 부분 유니크).
        - 그 업로드가 이미 반영·등록됐다 → `409`. 같은 업로드를 두 번 소비하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                `uploadId` = `createUpload` 가 발급하고 판별이 끝난 업로드.
                **화면이 들고 있다가 여기서 동봉한다** — 어디에도 저장되지 않는다.
              type: object
              required: [uploadId]
              additionalProperties: false
              properties:
                uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
      responses:
        "201":
          description: |
            반영된 기준 격자 파일들. **축이 확정된 것만 들어 있다** — 지어낸 축이 없다.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/DatasetFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
      - $ref: "#/components/parameters/FileId"
    put:
      tags: [ingestion]
      operationId: replaceDatasetGridFile
      summary: 기준 격자 파일 교체 · 축 뒤집기 — 둘 다 정상 동작
      description: |
        교체는 정상 동작이다 (`〈59〉-①` — 열린 결정 ⑳ 해소). 판정은 `업로드·편집` 스위치
        (`〈59〉-②`). **본체 파일은 이 경로의 대상이 아니다** — 본체를 갈아 끼우는 것은
        다른 데이터다 (`〈59〉-③`). 대상 파일의 `kind` 가 `본체` 면 409 다.

        **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 3(`K-3`) — 축 뒤집기가 이 op 안에 든다⟩**
        서버가 축을 잘못 판별했을 때 사람이 바로잡는 길이다
        (`PREVIEW-IMPLEMENTATION §10-16` — 사용자에게 묻지 않고 **보여주고 뒤집기 버튼을 준다**).
        **새 op 을 만들지 않는다** — 뒤집기 = **같은 두 파일의 축 배정을 바꾸는 것**이고
        그것이 정확히 `〈59〉` 가 말한 「잘못 붙인 격자를 바로잡는」 정상 동작이다.
        **파일을 다시 올리지 않는다.** 기각한 대안 = `flipGridAxes` 신설 — 501 이 24 → 25 가 되고
        축을 바꾸는 길이 둘이 되어 **어느 것이 정본 경로인지 흐려진다**(`〈80〉-㉯ 3`).

        요청은 **택일(`oneOf`)** 이다.
        - `file` — 파일을 갈아 끼운다. 축 배정은 그대로 둔다.
        - `flipAxes: true` — **파일은 그대로 두고 그 데이터셋의 두 기준 격자 파일의 축 배정을
          맞바꾼다.** ⚠ **한 파일만 고치는 형태가 아닌 이유** — `0004:192-195` 의
          축별 부분 유니크가 「위도 둘」을 막으므로 **한쪽만 바꾸면 중간 상태가 제약을 깬다.**
          맞바꿈은 한 트랜잭션 안에서 끝난다.
          그래서 **격자 파일이 2건이 아니면 409** 다 — 짝이 없으면 바꿀 배정이 없다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/GridFileReplacement" }
      responses:
        "200":
          description: 교체된 파일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            대상이 본체 파일이다 — 교체·삭제는 기준 격자 파일만 (`〈59〉-③`).
            **또는** `flipAxes` 인데 그 데이터셋의 기준 격자 파일이 2건이 아니다 — 바꿀 짝이 없다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [ingestion]
      operationId: deleteDatasetGridFile
      summary: 기준 격자 파일 삭제 — 정상 동작
      description: |
        삭제는 정상 동작이다 (`〈59〉-①`). 판정은 `업로드·편집` 스위치 (`〈59〉-②`).
        **본체 파일은 지우지 않는다** — 대상의 `kind` 가 `본체` 면 409 (`〈59〉-③`).
        격자를 지우면 그릴 수 없게 될 수 있을 뿐이다 — 그릴 수 없는 것과 등록할 수 없는 것은
        다르다 (`Policy_업로드와_계보_확정 §8 기준 격자 파일`).
      responses:
        "204":
          description: 지워짐
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 대상이 본체 파일이다 (`〈59〉-③`).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/download:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [catalog]
      operationId: downloadDataset
      summary: 원본 다운로드 (조각 묶음은 묶어서 한 번에)
      description: |
        원본 파일을 그대로 내려받는다. 부분 다운로드는 없고, 조각 묶음이면 묶어서 한 번에 받는다
        (`Policy_데이터셋_상세 §2·§8`). **누가 언제 받았는지 기록에 남는다**(`DataModel §6.2`) —
        그 기록이 D8 소유라 프런트가 스토리지를 직접 부르지 않고 core 를 거친다.
        받은 횟수는 어느 화면에도 내리지 않는다.
      responses:
        "302":
          description: 실제 바이트를 받는 곳으로 보낸다. 이 응답 시점에 다운로드 이력이 쌓인다.
          headers:
            Location:
              required: true
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D4 Lineage ───────────────────────────────

  /datasets/{datasetId}/lineage:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags: [lineage]
      operationId: getDatasetLineage
      summary: 계보 그래프와 상세 행
      description: |
        가로축에 데이터만 세운다 — 원천(점선 표기) → 가공 전 → 이 데이터 → 파생.
        프로젝트는 노드가 아니라 활용 배지다 (`Policy_데이터셋_상세 §8`).
        **확정된 관계만 그린다.** 제안 상태가 이 응답에 없는 것은 D10→D4 쓰기 경로가 없기 때문이다
        (`CLAUDE.md §3-2` · `DataModel §4.2`). 잠긴 노드·묘비 노드는 사라지지 않는다.
      responses:
        "200":
          description: 계보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/lineage/parents:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [lineage]
      operationId: addLineageParent
      summary: 부모 관계 추가 (계보 수정)
      description: |
        상세 화면의 `계보 수정·추가`. **여기서 붙인 관계는 `manual` 로 저장된다** —
        만들어진 경로를 요청이 고르지 않는다 (`Policy_데이터셋_상세 §8` · `DataModel §4.2`).
        `기록 없음` 표시는 관계가 붙으면 사라진다.
        파생(자식) 관계는 자식 상세에서 고친다 — 이 엔드포인트로 자식을 붙이지 않는다 (§3.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineageParentCreate" }
      responses:
        "201":
          description: 추가 후 계보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageGraph" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/lineage/parents/{parentDatasetId}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
      - name: parentDatasetId
        in: path
        required: true
        schema: { $ref: "../schemas/common.json#/$defs/Ulid" }
    delete:
      tags: [lineage]
      operationId: removeLineageParent
      summary: 부모 관계 끊기 (계보 수정)
      description: "`업로드·편집`이 켜진 사람만. 관계 한 쌍만 지운다 — 데이터셋은 지워지지 않는다."
      responses:
        "204":
          description: 관계가 지워짐
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/lineage/confirmation:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [lineage]
      operationId: confirmLineage
      summary: 계보 다시 확인
      description: |
        사람이 다시 확인하면 **계보 확정일이 갱신되고 `이후 수정됨` 표시가 사라진다**
        (`Policy_데이터셋_상세 §2·§8`). 확인 기록은 지우지 않고 쌓는다 (`DataModel §4.1`).
        계보 상태는 이 호출의 결과로 계산될 뿐 요청이 값을 싣지 않는다 (`PLAN-SoT §9-⑳`).
      responses:
        "200":
          description: 확인 후 계보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LineageGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D2 Access & Policy ───────────────────────────────

  /datasets/{datasetId}/access-requests:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [access]
      operationId: createAccessRequest
      summary: 접근 요청 보내기
      description: |
        잠긴 데이터를 만난 자리에서 요청한다. 사유는 0~300자 **선택**
        (`Policy_승인_처리 §5`). 요청 뒤 상세·검색 카드의 안내 줄이 `검토 대기` 칩으로 바뀐다 —
        그 상태는 `DatasetDetail.accessRequestPending` 이 말한다.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRequestCreate" }
      responses:
        "201":
          description: 요청이 접수됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 검토 대기 중이거나 이미 볼 수 있는 데이터다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /access-requests/pending:
    get:
      tags: [access]
      operationId: listPendingAccessRequests
      summary: 받은 접근 요청 (할 일 함 그룹)
      description: |
        교수와 `승인 위임` 연구원만 받는다 (`Policy_승인_처리 §6`). 처리 대기만 모이므로
        전용 목록 화면이 없다. **오래된 순**으로 내려간다 — 방치를 막기 위해서다
        (`Policy_홈_대시보드 §8` 승인 계열 두 그룹). 화면 상한(5건 + `+N건 더 보기`)은 화면이 정한다.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 검토 대기 중인 접근 요청
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AccessRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /access-requests/{requestId}/approval:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [access]
      operationId: approveAccessRequest
      summary: 접근 요청 승인 (요청 1건)
      description: |
        요청자를 허용 목록에 넣고 **만료일 = 승인일 + 6개월**을 기록한다
        (P-25 · `Policy_승인_처리 §7.2`). 승인의 단위는 데이터 한 건이다 —
        **사람 단위·연구실 단위 일괄 승인 엔드포인트를 두지 않는다** (`CLAUDE.md §3`).
      responses:
        "200":
          description: 승인 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 처리된 요청이다 (`Policy_승인_처리 §9`).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /access-requests/{requestId}/rejection:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [access]
      operationId: rejectAccessRequest
      summary: 접근 요청 거절 (사유 필수)
      description: |
        **거절 사유는 1~300자 필수이고 요청자에게 그대로 전달된다** (P-26 · `Policy_승인_처리 §5`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRejection" }
      responses:
        "204":
          description: 거절 처리됨
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 처리된 요청이다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/verification-request:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [access]
      operationId: requestVerification
      summary: Verified 승인 요청 (올린 사람 · 소유자)
      description: |
        **자동으로 검토 대기에 들어가지 않는다** — 올린 사람·소유자가 상세 헤더에서 직접 누른다
        (`Policy_승인_처리 §1.2·§7.1`). 누르면 교수 할 일 함에 검토 대기가 생긴다.
      responses:
        "202":
          description: 검토 대기가 만들어짐
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 검토 대기이거나 이미 승인된 데이터다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /verification-requests/pending:
    get:
      tags: [access]
      operationId: listPendingVerificationRequests
      summary: Verified 검토 대기 (교수 할 일 함 그룹)
      description: |
        **교수만.** `승인 위임`으로 위임되지 않는다 (P-5·P-22).
        항목은 링크만 갖는다 — **할 일 함에서 바로 승인하지 않는다**(`Policy_승인_처리 §1.3-2`).
        오래된 순.
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 검토 대기 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/VerificationRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/verification:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [access]
      operationId: approveVerification
      summary: Verified 승인 (교수만 · 상세에서)
      description: |
        **교수 전용이고 위임되지 않는다** (P-5·P-22). 승인자·승인 시각이 기록된다
        (`DataModel §4.1` Verified 기록). 데이터 한 건씩만 — 배치 승인이 없다.
      responses:
        "200":
          description: 승인 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 이미 승인된 데이터다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /datasets/{datasetId}/verification-cancellation:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    post:
      tags: [access]
      operationId: cancelVerification
      summary: Verified 승인 취소 (교수가 직접 시작)
      description: |
        **막지 않는다.** 파급(정렬 하락 · 활용 프로젝트 표시 · 파생 데이터 건수)을 화면이 먼저 보여준 뒤
        확인하면 그대로 취소한다 (P-28 · `Policy_승인_처리 §7.1`). 데이터와 계보는 남고 배지만 사라지며,
        취소한 사람·시각·사유가 남는다. 취소 사유는 0~120자 선택 (§5).
        파생 데이터에는 표시하지 않는다.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationCancellation" }
      responses:
        "200":
          description: 취소 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D6 Project ───────────────────────────────

  /projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: 프로젝트 목록 (S-02)
      description: |
        조건 컨트롤은 목록 위 **툴바** 한 벌이다 — 카드/표 두 보기가 같은 거른 결과를 그린다
        (`Policy_프로젝트 §1.3-8·§8`). 기본값은 상태 `진행 중` · 유형 전체 · 정렬 `최근 시작 순`.
        숨은 닫힘 건수는 같은 조건에 상태만 `닫힘`으로 바꿔 부른 `totalCount` 로 읽는다 —
        목록 봉투에 별도 필드를 만들지 않는다.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: 비우면 전체. 정본 기본값은 `진행 중` 이며 그 기본은 화면이 건다.
          required: false
          schema: { $ref: "../schemas/common.json#/$defs/ProjectStatus" }
        - name: type
          in: query
          description: 비우면 전체.
          required: false
          schema: { $ref: "../schemas/common.json#/$defs/ProjectType" }
        - name: sort
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ProjectSort" }
      responses:
        "200":
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ProjectRow" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [project]
      operationId: createProject
      summary: 새 프로젝트
      description: |
        **필수는 유형·이름뿐**이고 설명·기간·연결 주소는 나중에 채운다 (`Policy_프로젝트 §5`).
        `프로젝트 생성` 스위치가 켜진 사람만 (§6). 프로젝트 1건 = 국가과제 또는 논문 1건.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "201":
          description: 만들어진 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [project]
      operationId: getProject
      summary: 프로젝트 상세 (S-02b)
      description: |
        개요(설명·기간) · 연결 주소 · **소속 데이터셋 전부**를 순서대로 내려준다.
        소속 데이터셋 표는 자르지 않는다 — 더 보기·페이지 나누기를 두지 않는다
        (`Policy_프로젝트 §5` 소속 데이터셋 표 범위).
      responses:
        "200":
          description: 프로젝트 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [project]
      operationId: updateProject
      summary: 정보 수정
      description: "이름·설명·기간·연결 주소를 고친다. **유형은 고치지 않는다** (`Policy_프로젝트 §2`)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectUpdate" }
      responses:
        "200":
          description: 갱신된 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [project]
      operationId: deleteProject
      summary: 프로젝트 삭제 (데이터셋 0건일 때만)
      description: |
        업로드 중 빠른 생성으로 잘못 만든 프로젝트를 지우기 위한 **예외**다.
        데이터셋이 한 건이라도 붙으면 409 — 데이터를 잃는 경로를 만들지 않는다
        (`Policy_프로젝트 §1.3-6`). 평소 정리 수단은 닫기다.
      responses:
        "204":
          description: 지워짐
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 소속 데이터셋이 1건 이상이다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /projects/{projectId}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      tags: [project]
      operationId: setProjectStatus
      summary: 닫기 · 다시 열기
      description: |
        **닫기는 정리이지 삭제가 아니다** — 소속 데이터셋은 카탈로그에 그대로 남는다
        (`Policy_프로젝트 §1.3-5·§7`). 다시 열면 되돌아간다. 상태를 따로 뗀 이유는
        정보 수정과 권한·확인 절차가 같지 않아서다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectStatusChange" }
      responses:
        "200":
          description: 갱신된 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /projects/{projectId}/datasets/{datasetId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DatasetId"
    put:
      tags: [project]
      operationId: linkProjectDataset
      summary: 소속 연결 (본문 있는 op — 활용 의미 문장을 채운다)
      description: |
        프로젝트:데이터셋은 N:N 이고 **연결마다 활용 의미 문장이 붙는다**
        (`DATAMODEL-BASELINE.md` D6 연결 · `DataModel §5`). 이 op 이 `ProjectDatasetRow.usageNote`
        (required 로 읽히는 값)를 쓰는 유일한 수단이다 — 끊는 길(`unlinkProjectDataset`)만 있고
        잇는 길이 없던 비대칭을 닫는다 (`sessions/SEAM-AUDIT.md` I-03·I-10 · `sessions/D2c.md §2-8`).
        이미 있는 연결이면 `usageNote` 를 고친다(멱등 PUT). 최초 등록 시점의 연결은
        `createDataset` 요청의 `projectIds` 가 만들고, 이 op 은 등록 후 연결·의미 문장 편집이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectDatasetLinkCreate" }
      responses:
        "204":
          description: 연결됨(또는 의미 문장이 갱신됨)
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [project]
      operationId: unlinkProjectDataset
      summary: 소속 해제 (연결만 끊는다)
      description: |
        연결 기록만 지운다 — 데이터셋은 카탈로그·검색에 그대로 있고, 다른 프로젝트의 연결도 남는다
        (`Policy_프로젝트 §7`). 담는 동작은 같은 경로의 `linkProjectDataset`(PUT)과
        `createDataset.projectIds` 다 — 이전 산문의 「이 seam 에 없다」는 오배정이었다
        (`sessions/SEAM-AUDIT.md` I-03 · `〈54〉`).
      responses:
        "204":
          description: 연결이 끊어짐
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────── D7 Visualization 중계 ───────────────────────────

  /preview-palettes:
    get:
      tags: [visualization]
      operationId: listPalettes
      summary: 쓸 수 있는 팔레트 목록 (중계)
      description: |
        **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 4 — 이 묶음의 최우선 항⟩**

        ⚠ **경로가 `core-viz.yaml` 의 `GET /palettes` 와 일부러 다르다.** 두 seam 이 같은
        경로를 쓰면 `contract-breaking` 게이트(oasdiff 합성 비교)가 **같은 엔드포인트로
        합쳐 버려** 비교 자체를 못 한다 — `searchDatasets`(`/dataset-searches` vs
        `core-ai.yaml` 의 `/searches`)가 같은 이유로 갈렸고, 여기서도 **실제로 red 를 보고
        고쳤다.** 두 표면은 소비자가 다르다(이쪽은 사람의 세션, 저쪽은 서비스 토큰).

        `core-viz.yaml#listPalettes` 를 그대로 중계한다. **팔레트는 viz-render 가 소유한다** —
        정본은 「팔레트 3종」이라고만 하고 이름을 열거하지 않으므로(`Policy_데이터셋_상세 §8`
        시각화 컨트롤) 계약에 이름을 박지 않고 목록으로 서빙한다. **core·FE 는 하드코딩하지
        않는다.**

        ⚠ **없어서 무엇이 깨졌나** (`sessions/S1-CONTRACT-GAP-SWEEP.md` `D-1`)
        `core-viz.yaml` 의 `RenderStyle.required` 가 `[palette]` 인데 **FE 가 팔레트 값을 얻을
        계약 경로가 없었다.** 그래서 실서버 구현은 항상 예외를 던졌고(`previewSource.ts`),
        `PreviewPanel` 은 `palette` 가 빈 문자열이라 `createRender` 를 **한 번도 부르지
        않았다.** 즉 **실서버에서 미리보기 렌더가 단 한 번도 시작되지 않았다.**
        `S1-PLAN-REFOUND §F` 완료 정의 **2·15·16·18** 이 통째로, `§E` 의 11 상태 중
        **일곱**이 도달 불가였다.

        ⚠ **시험이 왜 못 잡았나** — 프런트 시험은 전부 픽스처 소스를 주입한다.
        **실서버 구현만 죽어 있었고 시험은 그 파일을 지나지 않았다.**

        기각한 대안 = 팔레트 키를 계약에 박기 — `core-viz.yaml` 이 「이름을 계약에 박지
        않는다」로 못 박았고, 박으면 팔레트 정본이 화면으로 옮겨 앉는다.
      responses:
        "200":
          description: 팔레트 목록.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "core-viz.yaml#/components/schemas/PaletteOption" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            **그리는 서버에 닿지 못했다** (`ErrorEnvelope.code = RENDER_UNAVAILABLE`).
            목록을 지어내지 않는다 — 화면은 팔레트를 못 고른다고 정직하게 말하고
            **등록은 그대로 진행한다.** `createPreviewRender` 의 503 과 같은 모양이다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /previews:
    post:
      tags: [visualization]
      operationId: createPreviewRender
      summary: 미리보기 렌더 작업 생성 (중계)
      description: |
        viz-render 는 내부 표면이라 FE 는 이 중계로만 렌더를 시작한다
        (`core-viz.yaml` — 소비자는 core-api 뿐 · `sessions/SEAM-AUDIT.md` I-06·I-07·C-4 —
        등록 데이터셋(E-03)·미등록 업로드(S-08) 둘 다 계약상 도달 불가였다).
        대상은 `datasetId`(등록 후) 또는 `uploadId`(등록 전, S-08) 정확히 하나다
        (`core-viz.yaml` RenderTarget). **타일 URL 은 중계하지 않는다** — 결과의
        `tileUrlTemplate` 을 FE 가 직접 소비한다 (타일 경로만 CDN 뒤 — `core-viz.yaml` 상단 주석).
        스키마는 중계라 재선언하지 않고 `core-viz.yaml` 정의를 그대로 참조한다.
        `style.palette` 값 집합의 FE 도달 경로는 **`GET /preview-palettes`(`listPalettes` 중계)** 다 —
        `PLAN-SoT §9-〈88〉` 묶음 4 가 열었다. 이전 판은 여기에 「이 개정이 열지 않는다 —
        열린 항목으로 보고한다」라고 적혀 있었고, **그 열린 항목이 실서버에서 렌더를 통째로
        막고 있었다**(`sessions/S1-CONTRACT-GAP-SWEEP.md` `D-1`).

        ⚠ **stage 1 은 `RenderResult` 의 타일 갈래를 내지 않는다** (`core-viz.yaml` ·
        `〈74〉-㉳`). 위의 「타일 URL 을 중계하지 않는다」는 **stage 2 에 그대로 살아나는
        문장**이라 지우지 않는다 — 지금은 그 갈래가 비활성이라는 사실만 여기 적는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "core-viz.yaml#/components/schemas/RenderRequest" }
      responses:
        "202":
          description: 렌더 작업이 잡혔다. 진행·결과는 `getPreviewRender` 로 본다.
          content:
            application/json:
              schema: { $ref: "core-viz.yaml#/components/schemas/RenderJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: |
            **그리는 서버에 닿지 못했다 — 실패한 렌더가 아니다**
            (`ErrorEnvelope.code = RENDER_UNAVAILABLE`).
            ⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 9⟩ 코드는 **네 자리에서** 이 상태를
            내고 실동작 시험까지 있었는데(`services/core-api/.../routes/preview.py` ·
            `tests/test_preview_relay.py`) **계약 어디에도 없었다** — `DR-7` 의 정확한 모양이다.
            ⚠ 게다가 `searchDatasets` 의 503 설명이 이 없는 표면을 「같은 모양이다」라고
            **선례로 인용까지 했다**(`sessions/S1-CONTRACT-GAP-SWEEP.md` `B-1`).
            **그릴 수 없는 것과 등록할 수 없는 것은 다르다** — 여기서 실패해도 등록·다운로드·
            계보 확정은 그대로 된다. 화면은 「미리보기를 만드는 서버에 닿지 못했습니다 /
            등록은 그대로 진행할 수 있습니다」를 세운다 (`S1-PLAN-REFOUND §E.2-⑩`).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /previews/{renderId}:
    parameters:
      - $ref: "#/components/parameters/RenderId"
    get:
      tags: [visualization]
      operationId: getPreviewRender
      summary: 렌더 작업 조회 (중계)
      description: |
        진행 단계·완료 결과·실패를 한 형태로 본다 (`core-viz.yaml` RenderJob — 단계·실패 문구는
        정본 표기 그대로: `Policy_데이터셋_상세 §8`).

        실패 종류의 `code` 값 라벨은 `[정본 무근거]` 이고 **`ErrorEnvelope.code` 가 enum 없는
        자유 문자열**이라 계약 개정 없이 표현된다 — viz-render 가 소유한다
        (`services/viz-render/.../d7_visualization/failures.py`).
        ⭑ 이전 판은 「아직 신설하지 않았다 — Ted 답 대기」였는데 **그것이 사실이 아니었다** —
        FE 는 이미 그 코드 3값에 하드 의존하고 있었다. `PLAN-SoT §9-〈88〉` 묶음 11 이 지운다.
        **격자 거절의 갈래는 이제 코드가 아니라 `RenderJob.gridRejection` 이 말한다**
        (`〈88〉` 묶음 2) — 한 코드가 다섯 상태를 나르던 자리가 닫혔다.
      responses:
        "200":
          description: 렌더 작업 상태
          content:
            application/json:
              schema: { $ref: "core-viz.yaml#/components/schemas/RenderJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: |
            **그리는 서버에 닿지 못했다 — 실패한 렌더가 아니다**
            (`ErrorEnvelope.code = RENDER_UNAVAILABLE`).
            ⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 9⟩ 코드는 **네 자리에서** 이 상태를
            내고 실동작 시험까지 있었는데(`services/core-api/.../routes/preview.py` ·
            `tests/test_preview_relay.py`) **계약 어디에도 없었다** — `DR-7` 의 정확한 모양이다.
            ⚠ 게다가 `searchDatasets` 의 503 설명이 이 없는 표면을 「같은 모양이다」라고
            **선례로 인용까지 했다**(`sessions/S1-CONTRACT-GAP-SWEEP.md` `B-1`).
            **그릴 수 없는 것과 등록할 수 없는 것은 다르다** — 여기서 실패해도 등록·다운로드·
            계보 확정은 그대로 된다. 화면은 「미리보기를 만드는 서버에 닿지 못했습니다 /
            등록은 그대로 진행할 수 있습니다」를 세운다 (`S1-PLAN-REFOUND §E.2-⑩`).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /preview-screenshots:
    post:
      tags: [visualization]
      operationId: createPreviewScreenshot
      summary: 지금 장면을 이미지로 뽑는다 (중계)
      description: |
        **⟨동결 11회 해제 · `PLAN-SoT §9 〈231〉` — Ted 승인 2026-08-30 · 등급 ㉯(op 신설)⟩**

        정본은 데이터셋 상세에 **스크린샷을 편집 권한자 컨트롤로 요구한다** —
        `Policy_데이터셋_상세 §8 스크린샷` 축자 「지금 장면을 PNG로 저장. **설정을 저장하지
        않으므로 남길 장면은 여기서 뽑는다**」 · `§6` 축자 「`업로드·편집` 켜짐 ｜ 시각화 편집·
        **스크린샷**·계보 수정」 · `§2` 축자 「스크린샷을 누른다 ｜ 지금 장면을 이미지로 저장한다」.

        ⚠ **없어서 무엇이 깨져 있었나** (`sessions/P3-DETAIL-PREVIEW-20260830.md` 남은 차단 ㈎)
        서버쪽 `core-viz.yaml#createScreenshot` 은 **이미 서 있는데**(viz-render 구현·시험 존재)
        이 seam 에 중계 op 이 **0건**이라 **화면이 그 op 에 닿을 계약 경로가 없었다.**
        `listPalettes` 가 없어 렌더가 한 번도 시작되지 않았던 것(`〈88〉` 묶음 4)과 **같은 모양**이고,
        같은 이유로 게이트가 못 잡는다 — **없는 것은 diff 에 안 나온다**(`sessions/X2-FREEZE-PROTOCOL.md §4-2`).

        **중계만 한다.** 요청 스키마는 `core-viz.yaml#ScreenshotRequest` 를 그대로 참조하고
        **재선언하지 않는다** — 같은 모양의 두 번째 선언은 갈라질 표면이다. 층 목록·순서·
        불투명도·화면 크기는 지도 위젯만 아는 값이라 요청에 실린다.

        **core-api 가 하는 판정은 둘이다** — ⑴ **편집 권한**(`업로드·편집`). `core-viz.yaml` 이
        「권한 판정은 core-api 가 하고 이 seam 은 판정하지 않는다」로 그 자리를 여기에 넘겼다.
        ⑵ **연구실 경계** — 장면에 담긴 렌더가 이 연구실 것인가. 그 확인 없이 중계하면
        남의 연구실 그림을 뽑아 준다. **그리는 일은 한 줄도 하지 않는다**
        (`CLAUDE.md §3-4` — core-api 에 geo 라이브러리를 import 하지 않는다).

        ⚠ **경로가 `core-viz.yaml` 의 `POST /screenshots` 와 일부러 다르다** — 두 seam 이 같은
        경로를 쓰면 `contract-breaking` 의 합성 비교가 같은 엔드포인트로 합쳐 버린다.
        `listPalettes`(`/preview-palettes` vs `/palettes`)가 같은 이유로 갈렸다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "core-viz.yaml#/components/schemas/ScreenshotRequest" }
      responses:
        "200":
          description: |
            PNG 이미지. **설정을 저장하지 않으므로 남길 장면은 이것뿐이다**
            (`Policy_데이터셋_상세 §8 시각화 컨트롤`).
          content:
            image/png:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            **`업로드·편집` 이 꺼져 있다.** 정본이 스크린샷을 편집 권한자 컨트롤로 두므로
            (`Policy_데이터셋_상세 §6`) 화면에서 숨긴 것을 서버가 같은 기준으로 막는다
            (`§3.3` 축자 「화면에서 숨긴 것은 서버도 같은 기준으로 막는다」).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            장면에 담긴 층 중 **아직 완료되지 않은 렌더**가 있다
            (`core-viz.yaml#createScreenshot` 의 409 를 그대로 옮긴다).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "503":
          description: |
            **그리는 서버에 닿지 못했다 — 실패한 스크린샷이 아니다**
            (`ErrorEnvelope.code = RENDER_UNAVAILABLE`). `createPreviewRender` 의 503 과 같은
            모양이다. **빈 이미지를 지어내지 않는다** — 0바이트 PNG 는 「장면이 비었다」로 읽힌다.
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ─────────────────────────────── D8 Insight ───────────────────────────────

  /dashboard/summary:
    get:
      tags: [insight]
      operationId: getDashboardSummary
      summary: 요약 지표 (네 개를 넘기지 않는다)
      description: |
        프로젝트 건수 · 데이터셋 개수 · **계보 확정 개수** · Verified 개수
        (`Policy_홈_대시보드 §5`). 계보 확정 = 확정 + 원천이고, 아직 확인이 필요한 건수를
        함께 내린다. **퍼센트로 바꾸지 않는다.**
      responses:
        "200":
          description: 요약 지표
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

  /dashboard/data-map:
    get:
      tags: [insight]
      operationId: getDataMap
      summary: 데이터 맵 — 계보 상태별 · 주제별
      description: |
        두 묶음을 다 내리고 계보 상태별이 위에 온다. 각 묶음은 이름 · 건수로 이뤄지고,
        비율 막대는 `totalCount` 로 화면이 계산한다 (`Policy_홈_대시보드 §5`).
        묶는 기준은 카탈로그 조건과 같아야 하므로 값은 `LineageState` 를 그대로 쓴다.
      responses:
        "200":
          description: 데이터 맵
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataMap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: |
            집계를 불러오지 못했다. 화면은 "카탈로그에서는 볼 수 있어요"로 안내한다 (§9).
          content:
            application/json:
              schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/ServerError" }

  /dashboard/activities:
    get:
      tags: [insight]
      operationId: listActivities
      summary: 최근 활동 (연구실 구성원의 **바꾼 일**만)
      description: |
        올림 · 계보 고침 · 승인 · 프로젝트 만듦 · 지움만 쌓인다.
        **열람은 서버에 남기지 않는다** — "내가 열어 본 것"은 브라우저에만 있고 화면이 이 목록과
        섞어 보여준다 (`DataModel §6.1` · `Policy_홈_대시보드 §10`).
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 최근 활동
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../schemas/common.json#/$defs/ListEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }

components:

  securitySchemes:
    sessionSubject:
      type: http
      scheme: bearer
      description: |
        **모든 오퍼레이션이 인증 주체를 요구한다.** 연구실 경계와 권한 스위치 판정이 전부 이 주체에서
        나오기 때문이다 (`CLAUDE.md §3-5` · P-9·P-10) — 그래서 `labId` 를 요청 파라미터로 받지 않는다.

        **자격증명의 발급 방식은 정본에 없다.** 로그인·초대·프로필 화면은 P1 보류이고 v2 1차에서는
        개발자가 계정을 심어 제공한다 (P-17). 여기 적은 `bearer` 는 "주체가 실린다"를 표현하기 위한
        레포 결정이며, 실제 수단은 P1 에서 정한다.

  parameters:

    DatasetId:
      name: datasetId
      in: path
      required: true
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    RequestId:
      name: requestId
      in: path
      required: true
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    UploadId:
      name: uploadId
      in: path
      required: true
      description: 등록 전 임시 업로드. 이벤트 seam 의 집계 루트와 같은 값이다 (`../events/envelope.json` uploadId).
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    FileId:
      name: fileId
      in: path
      required: true
      description: |
        파일(조각) 하나. 업로드 시 발급된 ULID 가 등록 후에도 그대로다 — `fileId` 동일성
        (`sessions/D2c.md §2-10` — `[정본 무근거]` · 사용자 승인 2026-08-23).
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    RenderId:
      name: renderId
      in: path
      required: true
      description: 렌더 작업 식별자 (`core-viz.yaml` RenderId 와 같은 값 — 중계라 새 식별자를 만들지 않는다).
      schema: { $ref: "../schemas/common.json#/$defs/Ulid" }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        이어보기 토큰. 페이지 크기는 서버가 정한다 — 정본은 `+N건 더 보기`만 요구하고
        페이지 크기 값을 주지 않는다 (`sessions/D2.md §3-②`).
      schema: { $ref: "../schemas/common.json#/$defs/Cursor" }

    CatalogSortColumn:
      name: sortColumn
      in: query
      required: false
      description: "기본은 `수정일` 최신순 (`Policy_데이터_찾기 §5` 기본 정렬)."
      schema: { $ref: "#/components/schemas/CatalogColumn" }

    SortOrder:
      name: sortOrder
      in: query
      required: false
      description: "열 메뉴의 정렬(오름/내림) (`Policy_데이터_찾기 §8` 열 메뉴)."
      schema: { $ref: "#/components/schemas/SortOrder" }

    FilterTopic:
      name: topic
      in: query
      required: false
      description: 주제 열 조건. 한 열에서 값을 여러 개 고른다.
      schema:
        type: array
        items: { type: string, minLength: 1 }

    FilterProcessingLevel:
      name: processingLevel
      in: query
      required: false
      description: Level 열 조건. 파생값이지만 조건으로는 걸 수 있다 — 쓰기 바디에는 없다.
      schema:
        type: array
        items:
          type: integer
          minimum: 0

    FilterUploader:
      name: uploader
      in: query
      required: false
      description: 업로더 열 조건. 계정 ID 로 건다.
      schema:
        type: array
        items: { $ref: "../schemas/common.json#/$defs/Ulid" }

    FilterLineageState:
      name: lineageState
      in: query
      required: false
      description: 계보 열 조건. 값은 `LineageState` 넷뿐이고 숫자를 붙이지 않는다.
      schema:
        type: array
        items: { $ref: "../schemas/common.json#/$defs/LineageState" }

    FilterVerified:
      name: verified
      in: query
      required: false
      description: |
        Verified 열 조건. 검색의 `Verified만 보기` 토글이 카탈로그에서는 이 열 조건으로 흡수된다
        (`Policy_데이터_찾기 §8`).
      schema: { type: boolean }

  responses:

    BadRequest:
      description: 요청 값이 규칙에 맞지 않는다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    Unauthorized:
      description: 인증되지 않았다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    Forbidden:
      description: |
        권한 스위치가 꺼져 있거나 위임 범위 밖이다. 화면에서 숨긴 것을 서버가 같은 기준으로 막는다 (P-11).
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    NotFound:
      description: |
        없거나 연구실 경계 밖이다. **경계 밖은 존재를 알리지 않는다** — 403 이 아니라 404 다
        (P-9·P-10). 잠김은 여기 해당하지 않는다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    Conflict:
      description: 지금 상태에서 할 수 없는 동작이다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    TooManyAttempts:
      description: |
        로그인 시도가 창 안에서 너무 잦다 (`PLAN-SoT §9 〈108〉-㉰`). 사전 추측을 느리게 만드는
        최소 보완이며, 시행 범위의 한계는 그 판정문이 적어 두었다.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

    ServerError:
      description: 서버 오류.
      content:
        application/json:
          schema: { $ref: "../schemas/common.json#/$defs/ErrorEnvelope" }

  schemas:

    # ── 세션 (`PLAN-SoT §9 〈90〉`) ──

    SessionCredentials:
      description: |
        로그인 입력. **두 형태 중 하나**이며 **정확히 하나만** 채운다 (`PLAN-SoT §9 〈107〉` ·
        `〈108〉`). 둘 다 개발자가 심어 둔 자격이고 **회원가입 경로가 아니다** (P-17).

        ㈎ `accountName` ＋ `password` — 사람이 쓰는 형태 (Ted 2026-08-26).
        ㈏ `accessCode` — 심어 둔 접속 코드. 도구·시험이 쓰는 형태.

        ⚠ **정본은 「구글 외의 로그인 방법 (비밀번호 · 다른 소셜 계정)」을 명시적으로 뺐다**
        (`PRD_계정과_연구실_소속 §5.2`). ㈎ 는 그 문장과 어긋나며, 어긋남을 감추지 않고
        `〈108〉-㉮` 에 Ted 판정 사안으로 등재해 두었다. 구글 어댑터가 서면 ㈎ 는 걷힌다.

        **비밀번호는 어디에도 평문으로 저장되지 않는다** — 자격 파일에 표준 KDF 해시만 있다
        (`〈108〉-㉯`).
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        accountName:
          description: 심어 둔 계정 이름. `password` 와 짝으로만 쓴다.
          type: string
          minLength: 1
          maxLength: 128
        password:
          description: 비밀번호. **응답·로그 어디에도 되비치지 않는다** (`〈108〉-㉯`).
          type: string
          minLength: 1
          maxLength: 512
        accessCode:
          description: 심어 둔 접속 코드. 값의 출처는 배포 설정이며 계약이 형식을 규정하지 않는다.
          type: string
          minLength: 1
          maxLength: 512

    Session:
      description: |
        발급된 세션. **무상태 서명 토큰**이라 서버에 세션 표가 없다
        (`PLAN-SoT §9 〈90〉-㉯` — 마이그레이션 0 으로 성립시킨 결정).
        `token` 은 이후 모든 op 의 `sessionSubject` bearer 값이다.
      type: object
      required: [token, expiresAt]
      additionalProperties: false
      properties:
        token:
          description: bearer 값. 화면이 내용을 해석하지 않는다.
          type: string
        expiresAt:
          description: 만료 시각. 수명은 **[정본 무근거]** 이며 운영 설정이다 (`〈90〉-㉲`).
          type: string
          format: date-time

    # ── 값 집합 (seam 전용 · common.json 과 겹치지 않는 것만) ──

    CatalogColumn:
      description: |
        카탈로그 표의 열. 값은 `Policy_데이터_찾기 §5` 의 열 구성 표기를 그대로 쓴다
        (`데이터셋 · 주제 · Level · 프로젝트 · 업로더 · 수정일 · 계보 · Verified`).
        조건을 걸 수 있는 열은 다섯이고 나머지는 정렬만 갖는다.
      type: string
      enum: ["데이터셋", "주제", "Level", "프로젝트", "업로더", "수정일", "계보", "Verified"]

    SortOrder:
      description: "열 메뉴의 정렬 방향. 정본 표기는 `오름`·`내림` 이다."
      type: string
      enum: ["오름", "내림"]

    ProjectSort:
      description: |
        프로젝트 목록 정렬. 네 값은 `Policy_프로젝트 §5` 목록 정렬 행의 표기 그대로다.
        기간 정렬의 기준은 시작일이다.
      type: string
      enum: ["최근 시작 순", "먼저 시작한 순", "최근 종료 순", "데이터셋 많은 순"]
      default: "최근 시작 순"

    # ── 공통 조각 ──

    AccountRef:
      description: 사람을 가리키는 최소 표기. 역할은 `Role`, 받은 위임은 권한 스위치가 말한다 (P-23).
      type: object
      required: [accountId, name]
      additionalProperties: false
      properties:
        accountId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }

    DatasetRef:
      type: object
      required: [datasetId, name]
      additionalProperties: false
      properties:
        datasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }

    ProjectRef:
      type: object
      required: [projectId, name]
      additionalProperties: false
      properties:
        projectId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }

    DataPeriod:
      description: |
        데이터가 다루는 시간 범위. **레코드 시점 3종과 축이 다르다**(`DataModel §4.1`).
        조각이 여럿이면 합집합이다 (§4.3).
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    ProjectPeriod:
      description: |
        프로젝트 기간. 시작·종료 각각 **연·월까지**이고, 진행 중이면 종료가 비어 있다
        (`Policy_프로젝트 §5`).
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        end:
          type: [string, "null"]
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"

    # ── D1 ──

    CurrentAccount:
      type: object
      required: [accountId, name, email, role, permissions, labId, labName]
      additionalProperties: false
      properties:
        accountId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { $ref: "../schemas/common.json#/$defs/Role" }
        permissions:
          description: |
            교수는 네 스위치가 항상 켜진 것으로 내려간다 — 화면이 역할로 다시 판정하지 않는다 (P-5·P-6).
          $ref: "../schemas/common.json#/$defs/PermissionSwitchSet"
        labId:
          description: 서버가 정한 현재 연구실. 요청으로 바꿀 수 없다 (P-9·P-10).
          $ref: "../schemas/common.json#/$defs/Ulid"
        labName: { type: string, minLength: 1 }

    Lab:
      description: "연구실 정보 — 연구실을 정의하는 유일한 자리 (`DataModel §2`)."
      type: object
      required:
        [labId, name, university, department, principalInvestigator,
         researchField, introduction, defaultVisibility, memberCount, openedAt]
      additionalProperties: false
      properties:
        labId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }
        university: { type: [string, "null"] }
        department: { type: [string, "null"] }
        principalInvestigator: { type: [string, "null"] }
        researchField: { type: [string, "null"] }
        introduction:
          description: 한 줄 소개.
          type: [string, "null"]
        defaultVisibility:
          description: |
            `데이터 공개 범위` 기본값. **데이터셋이 따로 정했으면 그쪽이 이긴다** (P-27).
          $ref: "../schemas/common.json#/$defs/LabDefaultVisibility"
        memberCount:
          description: 연구실 정보 모달이 읽는 파생값. 편집 대상이 아니다.
          type: integer
          minimum: 0
          readOnly: true
        openedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }

    LabUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        university: { type: [string, "null"] }
        department: { type: [string, "null"] }
        principalInvestigator: { type: [string, "null"] }
        researchField: { type: [string, "null"] }
        introduction: { type: [string, "null"] }
        defaultVisibility: { $ref: "../schemas/common.json#/$defs/LabDefaultVisibility" }

    # ── D2 ──

    LabMember:
      type: object
      required: [accountId, name, email, role, permissions, editablePermissions]
      additionalProperties: false
      properties:
        accountId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { $ref: "../schemas/common.json#/$defs/Role" }
        permissions: { $ref: "../schemas/common.json#/$defs/PermissionSwitchSet" }
        editablePermissions:
          description: |
            **이 요청자가 이 행에서 고칠 수 있는 열.** 재위임 금지의 계약 쪽 표현이다 (P-31) —
            `연구실 설정` 위임자에게는 `업로드·편집`·`프로젝트 생성` 둘만 담기고,
            교수 행에는 빈 배열이 담긴다(교수 행 고정, P-5).
            나머지 열은 **값은 보이되 편집 불가**로 그린다 — 열을 지우면 표 구조가 깨진다.
          type: array
          uniqueItems: true
          items: { $ref: "../schemas/common.json#/$defs/PermissionSwitch" }

    PermissionSaveRequest:
      description: |
        확인 모달 한 번 = 요청 한 번. 스위치 하나가 이력 한 줄이 된다 (P-33).
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [accountId, changes]
            additionalProperties: false
            properties:
              accountId: { $ref: "../schemas/common.json#/$defs/Ulid" }
              changes:
                description: 바꾼 칸만 싣는다. 손대지 않은 스위치는 키가 없다.
                type: object
                minProperties: 1
                propertyNames: { $ref: "../schemas/common.json#/$defs/PermissionSwitch" }
                additionalProperties: { type: boolean }

    AccessRequestCreate:
      type: object
      additionalProperties: false
      properties:
        reason:
          description: 요청 사유 0~300자. 선택 (`Policy_승인_처리 §5`).
          type: string
          maxLength: 300

    AccessRequest:
      type: object
      required: [requestId, dataset, requester, requestedAt, reason]
      additionalProperties: false
      properties:
        requestId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        dataset: { $ref: "#/components/schemas/DatasetRef" }
        requester: { $ref: "#/components/schemas/AccountRef" }
        requestedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
        reason: { type: [string, "null"], maxLength: 300 }

    AccessRejection:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          description: |
            **1~300자 필수.** 요청자에게 그대로 전달된다 (P-26).
          type: string
          minLength: 1
          maxLength: 300

    AccessGrant:
      description: "허용 목록 한 줄. 만료일 = 승인일 + 6개월 (P-25)."
      type: object
      required: [dataset, grantee, approver, approvedAt, expiresAt]
      additionalProperties: false
      properties:
        dataset: { $ref: "#/components/schemas/DatasetRef" }
        grantee: { $ref: "#/components/schemas/AccountRef" }
        approver: { $ref: "#/components/schemas/AccountRef" }
        approvedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
        expiresAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }

    VerificationRequest:
      type: object
      required: [dataset, requester, requestedAt]
      additionalProperties: false
      properties:
        dataset: { $ref: "#/components/schemas/DatasetRef" }
        requester: { $ref: "#/components/schemas/AccountRef" }
        requestedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }

    VerificationRecord:
      description: |
        Verified 기록 (`DataModel §4.1`). 배지는 1종이고 **표시 전용이다** — 누르는 곳이 아니다.
        취소해도 데이터와 계보는 남고 배지만 사라진다.
      type: object
      required: [verified, approver, approvedAt, cancelledBy, cancelledAt, cancellationReason]
      additionalProperties: false
      properties:
        verified: { type: boolean }
        approver:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - type: "null"
        approvedAt:
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        cancelledBy:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - type: "null"
        cancelledAt:
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        cancellationReason: { type: [string, "null"], maxLength: 120 }

    VerificationCancellation:
      type: object
      additionalProperties: false
      properties:
        reason:
          description: 취소 사유 0~120자. 선택 (`Policy_승인_처리 §5`).
          type: string
          maxLength: 120

    # ── D5 중계 (E-04 업로드 세계) ──

    GridFileReplacement:
      description: |
        기준 격자 파일 교체 요청. **`replaceDatasetGridFile`(등록 뒤)과
        `replaceUploadGridFile`(등록 전)이 이 한 스키마를 공유한다**
        (`PLAN-SoT §9-〈88〉` 묶음 6) — 같은 조작이고 대상 세계만 다르다. 두 벌로 선언하면
        갈라질 표면이 하나 더 생긴다.

        요청은 **택일(`oneOf`)** 이다.
        - `file` — 파일을 갈아 끼운다. 축 배정은 그대로 둔다.
        - `flipAxes: true` — **파일은 그대로 두고 두 기준 격자 파일의 축 배정을 맞바꾼다.**
          ⚠ **한 파일만 고치는 형태가 아닌 이유** — `0004:192-195` 의 축별 부분 유니크가
          「위도 둘」을 막으므로 **한쪽만 바꾸면 중간 상태가 제약을 깬다.**
          맞바꿈은 한 트랜잭션 안에서 끝난다. 그래서 **격자 파일이 2건이 아니면 409** 다.
      type: object
      additionalProperties: false
      oneOf:
        - required: [file]
        - required: [flipAxes]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
        flipAxes:
          type: boolean
          description: |
            `true` 면 축 뒤집기다 — 이 파일과 짝 파일의 축 배정을 맞바꾼다.
            `false` 를 보내는 것은 **아무것도 안 하는 요청**이므로 400 이다.

    UploadFileRef:
      description: |
        업로드 안의 파일 하나. 이벤트 seam 의 `FileRef`(`../events/core-pipeline.json`)와 같은
        네 값이다 — 동기 응답과 비동기 페이로드가 같은 사실을 말하게 둔다.
        `fileId` 는 등록 전환 후 D3 파일 레코드의 PK 로 그대로 이어진다 — `fileId` 동일성
        (`sessions/D2c.md §2-10` `[정본 무근거]` · Ted 승인 2026-08-23 (본인 확인)).
      type: object
      required: [fileId, fileName, kind, byteSize]
      additionalProperties: false
      properties:
        fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        kind: { $ref: "../schemas/common.json#/$defs/FileKind" }
        byteSize: { type: integer, minimum: 0 }
        gridAxis:
          allOf: [{ $ref: "../schemas/common.json#/$defs/GridAxisAssignment" }]
          description: |
            **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 7⟩**
            **`kind` 가 `기준 격자 파일` 이고 축이 확정된 뒤에만 있다.** 아직 판별 중이거나
            본체면 없다. 모양은 등록 뒤의 `DatasetFile.gridAxis` 와 **같은 것을 쓴다** —
            새 스키마를 만들지 않는다.

            ⚠ **등록 전 세계에 이 값이 없어서 `S1-PLAN-REFOUND §E.2` 의 ③격자 확인 중 ·
            ⑤위치 확인 상태가 seam 에 근거가 없었다.** 화면이 그 상태를 만드는 유일한 근거가
            **viz-render 의 렌더 실패 문장**이었고, 즉 판정자(pipeline-worker)와 화면이
            인용하는 근거(viz-render)가 다른 기계였다
            (`sessions/S1-CONTRACT-GAP-SWEEP.md` `B-2`).


    # ── 프리사인드 전송 (동결 해제 8차 · `PLAN-SoT §9 〈174〉`) ──
    UploadTransferDraft:
      description: |
        [사용자 승인 2026-08-28] 전송 계획 요청 — 바이트 없이 파일의 사실(이름·크기·종류·
        상대 경로)만 신고한다 (`PLAN-SoT §9 〈174〉`).
      type: object
      required: [files]
      additionalProperties: false
      properties:
        sourceLabel:
          description: 배너·목록에 보일 묶음 이름. 생략하면 서버가 채운다.
          type: string
          maxLength: 255
        files:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [fileName, byteSize]
            additionalProperties: false
            properties:
              fileName:
                description: 경로 없는 이름 1~255자. 경로는 `relativePath` 로.
                type: string
                minLength: 1
                maxLength: 255
              byteSize: { type: integer, minimum: 0 }
              kind: { $ref: "../schemas/common.json#/$defs/FileKind" }
              relativePath:
                description: |
                  폴더째 업로드의 `폴더/이름` 상대 경로 — 원장 메타로만 보존된다
                  (`PLAN-SoT §9 〈173〉`). 저장 키 규약은 손대지 않는다.
                type: string
                minLength: 1
                maxLength: 1024

    UploadTransferPlan:
      description: |
        [사용자 승인 2026-08-28] 전송 계획 — 파일마다 전략과 파트 크기가 정해져 있다
        (`PLAN-SoT §9 〈174〉`). 받아들일 수 없던 파일은 `rejected` 에 사유와 함께 남는다 —
        조용히 빼지 않는다.
      type: object
      required: [uploadId, expiresAt, files, rejected]
      additionalProperties: false
      properties:
        uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        expiresAt: { type: string, format: date-time }
        files:
          type: array
          items: { $ref: "#/components/schemas/UploadTransferPlanFile" }
        rejected:
          type: array
          items:
            type: object
            required: [fileName, reason]
            additionalProperties: false
            properties:
              fileName: { type: string }
              reason: { type: string }

    UploadTransferPlanFile:
      description: |
        [사용자 승인 2026-08-28] 계획 속 파일 하나 (`PLAN-SoT §9 〈174〉`). `fileId` 는
        완결 시 `d5_upload_file.id` 로 그대로 간다 (`NB-A` 동일성의 전송 단계 소급).
      type: object
      required: [fileId, fileName, kind, byteSize, strategy, partSize, partCount]
      additionalProperties: false
      properties:
        fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        fileName: { type: string }
        kind: { $ref: "../schemas/common.json#/$defs/FileKind" }
        byteSize: { type: integer, minimum: 0 }
        relativePath: { type: string }
        strategy:
          type: string
          enum: [단일, 멀티파트]
        partSize: { type: [integer, "null"], minimum: 1 }
        partCount: { type: [integer, "null"], minimum: 1 }

    UploadTransferStatus:
      description: |
        [사용자 승인 2026-08-28] 전송 상태 (`PLAN-SoT §9 〈174〉`). `uploadedParts` 는
        서버가 S3 ListParts 로 실측한 값이다 — 파트의 정본은 S3 다.
      type: object
      required: [uploadId, expiresAt, files]
      additionalProperties: false
      properties:
        uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        expiresAt: { type: string, format: date-time }
        files:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/UploadTransferPlanFile"
              - type: object
                required: [outcome]
                properties:
                  outcome:
                    type: string
                    enum: [대기, 올라감, 실패]
                  uploadedParts:
                    description: 올라간 파트 번호 실측. 실측 불가면 null — 지어내지 않는다.
                    type: [array, "null"]
                    items: { type: integer, minimum: 1 }

    IncompleteUploadTransfers:
      description: |
        [사용자 승인 2026-08-28] 내 미완결 전송 목록 (`PLAN-SoT §9 〈174〉`) — 이어올리기
        배너의 데이터. 본인 것만 온다.
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            required: [uploadId, sourceLabel, uploadedFiles, plannedFiles,
                       uploadedBytes, plannedBytes, createdAt, expiresAt]
            additionalProperties: false
            properties:
              uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
              sourceLabel: { type: string }
              uploadedFiles: { type: integer, minimum: 0 }
              plannedFiles: { type: integer, minimum: 1 }
              uploadedBytes: { type: integer, minimum: 0 }
              plannedBytes: { type: integer, minimum: 0 }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: string, format: date-time }

    UploadPutUrls:
      description: |
        [사용자 승인 2026-08-28] 단일 PUT 프리사인드 URL 묶음 (`PLAN-SoT §9 〈174〉`).
        수명이 짧다 — 소진되면 다시 발급받는다.
      type: object
      required: [urls]
      additionalProperties: false
      properties:
        urls:
          type: array
          items:
            type: object
            required: [fileId, url, expiresAt]
            additionalProperties: false
            properties:
              fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
              url: { type: string }
              expiresAt: { type: string, format: date-time }

    UploadPartUrls:
      description: |
        [사용자 승인 2026-08-28] 파트 PUT 프리사인드 URL 묶음 (`PLAN-SoT §9 〈174〉`).
      type: object
      required: [urls, expiresAt]
      additionalProperties: false
      properties:
        urls:
          type: array
          items:
            type: object
            required: [partNumber, url]
            additionalProperties: false
            properties:
              partNumber: { type: integer, minimum: 1 }
              url: { type: string }
        expiresAt: { type: string, format: date-time }

    UploadFileOutcome:
      description: |
        [사용자 승인 2026-08-28] 파일 실측 결과 (`PLAN-SoT §9 〈174〉`) — 서버가 S3 에
        직접 물은 값만 적는다. 실패면 사유가 `detail` 에 있다.
      type: object
      required: [fileId, outcome, detail]
      additionalProperties: false
      properties:
        fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        outcome:
          type: string
          enum: [올라감, 실패]
        detail: { type: [string, "null"] }

    UploadReceipt:
      description: |
        업로드 접수 결과. `uploadId` 는 이벤트 seam 의 집계 루트와 같은 값이고
        (`../events/envelope.json`), `core-viz` 의 `RenderTarget.uploadId`(S-08)도 같은 값을 쓴다.
      type: object
      required: [uploadId, files]
      additionalProperties: false
      properties:
        uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UploadFileRef" }

    UploadStatus:
      description: |
        파이프라인 이벤트(②~⑦)의 결과를 FE 가 읽는 형태. **필드마다 원천 이벤트가 있다** —
        새 사실을 만들지 않는다 (`../events/core-pipeline.json`).
        조각(part) 단위 상태는 없다 — 정본이 이어올리기를 범위 밖으로 뒀다 (`Policy §9`).
      type: object
      required: [uploadId, files, ready, failure]
      additionalProperties: false
      properties:
        uploadId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/UploadFileRef" }
        ready:
          description: "`upload.ready`(⑥) 가 왔는가 — 등록 결정 게이트를 볼 수 있는 상태 (`Policy §7.1`·`§8`)."
          type: boolean
        renderable:
          description: "미리보기를 그릴 수 있는가 (`upload.ready.renderable`). 아직 모르면 null. false 여도 등록은 막지 않는다."
          type: [boolean, "null"]
        metadataComplete:
          description: |
            자동 메타 다섯 값을 모두 읽었는가 (`upload.ready.metadataComplete`). 아직 모르면 null.
            ⚠ **stage 1 에서 이 값은 언제나 `false` 이고, 그 `false` 는 「읽어 보고 아니었다」가
            아니라 「안 읽었다」의 뜻이다** — 헤더 파싱(`file.header-parsed`)이 stage 1 에
            켜져 있지 않다(`〈73〉` · `sessions/S1-CONTRACT-GAP-SWEEP.md` `B-3`).
            화면 동작(자동 칸 → 입력 칸)은 그대로 옳다. 값 집합을 3값으로 넓히는 것은
            헤더 파싱이 켜지는 **stage 2 의 일**이다.
          type: [boolean, "null"]
        gridRejections:
          description: |
            **⟨동결 4회 해제 · `PLAN-SoT §9-〈88〉` 묶음 7⟩**
            함께 올라온 기준 격자 파일 중 **쓸 수 없다고 판정된 것들.** 없으면 빈 배열이다 —
            `null` 로 「모른다」를 말하지 않는다(그 뜻은 `ready: false` 가 이미 말한다).

            ⚠ **거절된 격자 파일은 `files` 에서 사라진다.** 축을 못 정한 격자는 원장에 행을
            만들지 않기 때문이다(`0004` 축 CHECK · `〈63〉-ⓒ`·`〈79〉-⑵`). 그래서 접수 201
            (`UploadReceipt.files`)에 있던 파일이 조회 200 에서 안 보이는 일이 생기는데,
            **이 배열이 그 자리를 말한다** — 조용히 사라지지 않는다
            (`sessions/S1-CONTRACT-GAP-SWEEP.md` `B-2`).

            사유·형상은 `core-viz.yaml#GridRejection` 과 **같은 값 집합**이다 — 판정자가
            누구든 화면이 같은 것을 읽는다.
          type: array
          items:
            type: object
            required: [fileName, reason]
            additionalProperties: false
            properties:
              fileName: { type: string, minLength: 1, maxLength: 255 }
              reason: { $ref: "../schemas/common.json#/$defs/GridRejectionReason" }
              shapes: { $ref: "../schemas/common.json#/$defs/GridShapes" }
        expiresAt:
          description: "임시 업로드의 수명 (`upload.ready.expiresAt` — 이 화면을 벗어나면 사라진다, `Policy §7.1`)."
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        failure:
          description: |
            `upload.failed`(⑦) 가 왔으면 그 사유. 사유 값 집합은 이벤트 계약의 것을 그대로 쓴다 —
            재선언하지 않는다 (`../events/envelope.json` FailureReason — 정본 §9 표와 1:1).
            화면 문구는 정본 §9 가 소유하고 화면이 그린다.
          oneOf:
            - type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { $ref: "../events/envelope.json#/$defs/FailureReason" }
            - type: "null"

    UploadLineageParent:
      description: |
        등록 전환에 싣는 확정 계보 관계 한 건. **사람이 확인한 것만 온다** — AI 제안은 저장되지
        않았고, 확인·수정·거절은 화면(클라이언트 상태)에서 일어난다 (`Policy §7.1` — 등록 중 = 저장 안 됨).
      type: object
      required: [parentDatasetId, origin]
      additionalProperties: false
      properties:
        parentDatasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        parentRole:
          allOf: [{ $ref: "../schemas/common.json#/$defs/ParentRole" }]
          description: "생략하면 기본값 `주입력` (`Policy §5 부모 역할`)."
        method:
          description: 가공 방식 한 줄. 자유 문장이다 (`Policy §5`).
          type: [string, "null"]
        origin:
          allOf: [{ $ref: "../schemas/common.json#/$defs/LineageOrigin" }]
          description: |
            만들어진 경로 — `ai`(**AI 가 제안하고 사람이 확인**했다. 「AI 가 만들었다」가 아니다)
            인가 `manual`(사람이 손으로 이었다)인가 (`DataModel §4.2` · `LineageOrigin`).
            `processed`(가공으로 자동 생성)는 **이 요청이 실을 수 있는 값이 아니다** — 생산 경로가 아직 없다.
            상세 화면의 수동 추가(`addLineageParent`)와 달리 업로드 화면엔 두 경로가 다 있어
            요청이 실어야 서버가 안다.
        confirmedMethodText:
          description: |
            `가공 방식` 제안을 확인·수정한 결과 문장. `method` 와 같은 자리로 접힌다 —
            둘 다 오면 400. `[정본 무근거 — 제안 확인 결과가 등록 요청의 어느 필드로 실리는지
            정본이 형태를 주지 않아 레포 결정]`
          type: [string, "null"]

    FieldSuggestions:
      description: |
        자동완성 후보 (`listDatasetFieldSuggestions`). 근거 = `_결정_업로드계보_260826.md §2-10`
        (원천 표기 = 자동완성 ＋ 정규화 병기) · `PLAN-SoT §9 〈138〉` · `VAL-006`·`VAL-009`.
        **이미 쓰인 말만 담는다** — 만들어 낸 값이 섞이면 사용자가 그것을
        「연구실에서 쓰는 표기」로 믿는다.
      type: object
      required: [field, items]
      additionalProperties: false
      properties:
        field: { type: string, minLength: 1 }
        items:
          type: array
          items:
            type: object
            required: [value, useCount]
            additionalProperties: false
            properties:
              value: { type: string, minLength: 1 }
              useCount:
                description: |
                  이 연구실에서 이 값이 쓰인 건수. **고르는 근거로 보여준다** —
                  「이미 8건이 이렇게 적었다」가 표기를 모으는 가장 싼 장치다.
                type: integer
                minimum: 1

    DatasetCreate:
      description: |
        등록 전환 요청 — 업로드 폼 한 화면이 한 번에 제출하는 값 (`Policy §5` 입력값 규칙 ·
        `§7.2` 등록 중 → 등록됨).

        ⭑ **2026-08-27 개정 (`PLAN-SoT §9 〈138〉`·`〈140〉`).** 종전 서술은 「자동으로 읽은
        정보(변수·기간·좌표계·격자·포맷)는 싣지 않는다」였다. **정본이 자동 추출을 줄였다** —
        `POLICY-20260825-001` 핵심규칙 1 = 「자동으로 읽는 값은 **포맷과 용량뿐**」,
        `VAL-006` = 「변수·기간·좌표계는 **자유 입력 · 선택 입력**」.
        그래서 그 셋이 **사람이 적는 값으로 옮겨 왔다.**

        **`format`·`grid` 는 그대로 자동이라 여기 없다.** `format` 은 `VAL-003`(자동·수정
        불가)이고, `grid` 는 업로드 폼이 읽는 값이 아니라 **격자 파일을 붙인 뒤 서버가 세는
        값**이라 층이 다르다 (`〈74〉`).
      type: object
      required: [uploadId, name]
      additionalProperties: false
      properties:
        uploadId:
          # 등록 전환할 업로드. 이 값이 업로드 세계와 D3 세계를 잇는 유일한 입력이다.
          $ref: "../schemas/common.json#/$defs/Ulid"
        name:
          description: 사람이 적는 묶음 이름 (`DataModel §4.3`).
          type: string
          minLength: 1
        topic:
          description: |
            주제. 값 집합은 DB CHECK 4값이 지킨다 (`〈55〉`) — 계약 층 enum 은 이 개정이
            임의로 만들지 않는다 (`sessions/D2c.md §9 NB-E`).
          type: [string, "null"]
        summary:
          description: 한 줄 요약.
          type: [string, "null"]
        sourceLabel:
          description: 원천 표기 — 데이터셋이 아니라 표기다 (`Policy §4 용어` · 계보 그래프의 점선 노드).
          type: [string, "null"]
          maxLength: 60
        lineageParents:
          description: |
            확정된 계보 관계들. **비어 있으면 `기록 없음`으로 등록된다** — 등록을 막지 않는다
            (`Policy §3.3`). 일괄 승인 필드가 아니다 — 항목마다 사람이 확인한 결과다 (`CLAUDE.md §3`).
          type: array
          items: { $ref: "#/components/schemas/UploadLineageParent" }
        processingLevel:
          description: |
            가공 단계 — **사람이 고르는 칸**이다 (`VAL-005` · 스펙 17 · `PLAN-SoT §9 〈140〉`).
            **생략하면 계보에서 파생한다** (`POL-020`). 값을 실으면 「사람이 골랐다」로
            기록되어 **자동 보정이 그 값을 덮지 않는다** (`POL-020` 예외 · `TC-W-001`).

            ⚠ **폼 기본값을 그대로 통과시킨 것은 「골랐다」가 아니다** — 실으면 나중에
            부모를 연결해도 값이 안 움직여 스펙 33(가공 단계 자동 보정 알림)이 죽는다.
            **사용자가 실제로 컨트롤을 바꿨을 때만 싣는다.**

            계보를 안 적은 경우의 값은 **`0`(가공 안 함) / `1`(가공함)** 이다
            (Ted 2026-08-27). `2` 는 계보가 있을 때 파생으로 나온다.
          type: [integer, "null"]
          minimum: 0
          maximum: 2
        variables:
          description: |
            구성(변수 목록) — **자유 입력**이다 (`VAL-006`). 형식 검사를 하지 않는다.
            비우면 `null` 이고 그것이 정상이다 — 필수는 이름 하나다 (`VAL-001`).
          type: [array, "null"]
          items: { type: string, minLength: 1 }
        crs:
          description: 좌표계 — **자유 입력** (`VAL-006`). 검사하지 않는다.
          type: [string, "null"]
        period:
          description: 기간 — **자유 입력** (`VAL-006`).
          oneOf:
            - $ref: "#/components/schemas/DataPeriod"
            - type: "null"
        projectIds:
          description: |
            소속 프로젝트 복수 지정 (`Policy §5` 소속 프로젝트 — 0건 이상). 등록 폼이 한 번에
            제출하므로 등록 후 `linkProjectDataset` N 회 호출이 아니라 여기 실린다 —
            연결의 `usageNote` 는 여기 없다: 업로드 화면이 그 문장을 받는 자리가 정본에 없어
            (`[정본 무근거]` — E04-step-op-map Q2) 등록 후 `linkProjectDataset` 으로 적는다.
          type: array
          items: { $ref: "../schemas/common.json#/$defs/Ulid" }

    DatasetUpdate:
      description: |
        사람이 적는 정보만 (`DATAMODEL-BASELINE.md` D3 · `sessions/D2c.md §2-7`).

        ⭑ **2026-08-27 개정 — 「고치는 길」을 연다** (`PLAN-SoT §9 〈138〉`·`〈140〉` ·
        Ted 판정 ㈏ 「올리고 고친다를 한 벌로」).

        **왜 넓히는가.** 종전에는 올린 뒤 고칠 수 있는 것이 **이름·주제·요약 셋뿐**이었다.
        Lv 도 원천 표기도 변수·좌표계·기간도 못 고쳤고, `deleteDataset` 도 아직 없어
        **잘못 올리면 되돌릴 길이 없었다.** 되돌릴 수 없는 제품은 사람이 조심하느라
        안 쓰게 된다 — 그것이 「졸업하면 데이터가 사라진다」를 막겠다는 목적과 어긋난다.

        **여전히 없는 것 = `format`·`grid`·파일 자체.** 앞 둘은 자동이고(`VAL-003` ·
        격자는 서버가 센다), 파일은 이 op 의 일이 아니다.

        **보내지 않은 열쇠는 안 건드린다** — 부분 수정이다. `null` 을 명시적으로 보내는
        것은 **비우라는 뜻**이고, 열쇠를 생략한 것은 **그대로 두라는 뜻**이다. 둘이 다르다.
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        topic:
          description: "값 집합은 DB CHECK 4값 (`〈55〉`). 계약 층 enum 은 만들지 않는다 (NB-E)."
          type: [string, "null"]
        summary: { type: [string, "null"] }
        sourceLabel:
          description: |
            원천 표기 (`VAL-009`). **`DatasetCreate` 에는 있는데 여기 없어서 고칠 길이
            없던 값이다.** 연구실 밖 출처의 이름이며 계보 그래프의 점선 노드가 된다.
          type: [string, "null"]
          maxLength: 60
        processingLevel:
          description: |
            가공 단계 — **사람이 고르는 칸** (`VAL-005` · `〈140〉`). `null` 을 보내면
            **사람의 선택을 지우고 계보에서 파생하는 상태로 되돌린다.**
            생략하면 지금 상태를 그대로 둔다.
          type: [integer, "null"]
          minimum: 0
          maximum: 2
        representativeFileId:
          description: |
            대표 조각 — 상세에 들어갔을 때 미리보기에 그려지는 조각 (결정 2-4).
            **기본은 자동**(파일명 오름차순 자연 정렬로 첫 번째, 결정 2-8)이고,
            의도한 조각을 보여주고 싶을 때 여기서 바꾼다.
            `null` 을 보내면 자동으로 되돌린다.

            ⚠ **자동인지 사람이 고른 것인지를 구분한다** — 자동이면 렌더 결과가 바뀔 때
            따라 움직이고, **사람이 고른 값은 덮지 않는다** (결정 2-4 · `〈140〉` 과 같은 패턴).
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Ulid"
            - type: "null"
        variables:
          description: 구성(변수 목록) — **자유 입력** (`VAL-006` · `〈138〉`).
          type: [array, "null"]
          items: { type: string, minLength: 1 }
        crs:
          description: 좌표계 — **자유 입력** (`VAL-006` · `〈138〉`).
          type: [string, "null"]
        period:
          description: 기간 — **자유 입력** (`VAL-006` · `〈138〉`).
          oneOf:
            - $ref: "#/components/schemas/DataPeriod"
            - type: "null"

    # ── D3 ──

    DatasetRow:
      description: |
        카탈로그 표 한 행. 8열 + 빠른 작업 자리를 그리는 데 필요한 값만 담는다.
        **잠긴 행도 이 형태로 내려간다** — 업로더까지 표시한다(요청할 상대가 누구인지가
        잠김 상태에서 더 필요하다, `Policy_데이터_찾기 §5`).
      type: object
      required:
        [datasetId, name, fileCount, topic, processingLevel, projects, uploader,
         lastModifiedAt, lineageState, lineageConfirmedAt, verified, accessState, bodyAccessible]
      additionalProperties: false
      properties:
        datasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name:
          description: 사람이 적은 **묶음 이름**. 조각 하나를 대표로 세우지 않는다 (`DataModel §4.3`).
          type: string
          minLength: 1
        fileCount:
          description: |
            **본체 파일 건수.** 기준 격자 파일은 세지 않는다 — 데이터셋은 관측 자료의 묶음이고
            격자는 좌표를 붙이기 위한 부속이다. 2 이상이면 화면이 `조각 N` 칩을 붙인다.
            파일 **목록**(`listDatasetFiles`)은 격자를 그대로 담는다 — 줄어드는 것은 이 요약 숫자뿐이다.
          type: integer
          minimum: 1
        topic: { type: [string, "null"] }
        processingLevel: { $ref: "../schemas/common.json#/$defs/ProcessingLevel" }
        projects:
          description: |
            **대표 1건 + `외 N`** (`Policy_데이터_찾기 §5` 프로젝트 열). 대표는 가장 먼저 연결된 것이다.
            0건이면 `representative` 가 null 이고 화면은 빈 칸으로 둔다. 정확한 목록은 상세가 보여준다.
          type: object
          required: [representative, moreCount, names]
          additionalProperties: false
          properties:
            representative:
              oneOf:
                - $ref: "#/components/schemas/ProjectRef"
                - type: "null"
            moreCount: { type: integer, minimum: 0 }
            names:
              description: 마우스를 올렸을 때 보여줄 전체 이름.
              type: array
              items: { type: string, minLength: 1 }
        uploader: { $ref: "#/components/schemas/AccountRef" }
        lastModifiedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
        lineageState: { $ref: "../schemas/common.json#/$defs/LineageState" }
        lineageConfirmedAt:
          description: |
            계보 확정일. `확인 필요` 행에서 확정한 날과 바뀐 날을 나란히 보여줄 때 쓴다
            (`Policy_데이터_찾기 §8` 계보 열).
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        verified: { type: boolean }
        accessState: { $ref: "../schemas/common.json#/$defs/AccessState" }
        bodyAccessible:
          description: |
            본체(다운로드·미리보기)에 닿을 수 있는가. `false` 면 화면이 자물쇠와 `잠김` 칩을 붙이고
            **빠른 작업을 두지 않는다.** 행 자체는 사라지지 않는다 (P-13·P-34).
          type: boolean
        thumbnailUrl:
          description: |
            **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 2(`K-2`)⟩**
            목록 썸네일(①, 128 px WEBP)의 URL. **사전 생성된 정적 자산이다** —
            행마다 렌더 작업을 거는 물건이 아니다(`〈80〉-㉯ 2`).
            **없을 수 있다** — 아직 안 구워졌거나, 본체를 못 읽었거나, `bodyAccessible: false` 인
            잠긴 행이다. 없으면 화면은 **빈 자리로 둔다** — 대체 그림을 지어내지 않는다.
          oneOf:
            - type: string
              minLength: 1
            - type: "null"

    SearchQuery:
      description: |
        **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 5⟩** 자연어 검색 요청.
        **연구실 경계는 실리지 않는다** — 서버가 인증 주체에서 주입한다 (`CLAUDE.md §3-5` ·
        P-9·P-10). `core-ai.yaml` 의 `SearchRequest.scope` 를 FE 가 채우지 않는 이유가 이것이다.
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          description: 자연어 한 문장 (`Policy_데이터_찾기 §5 검색 질문 — 1~200자`).
          type: string
          minLength: 1
          maxLength: 200
        limit:
          description: 돌려받을 최대 건수. 화면의 `+N건 더 보기` 가 쓰는 폭이다.
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        cursor:
          allOf: [{ $ref: "../schemas/common.json#/$defs/Cursor" }]
          description: 이어보기 토큰. 첫 요청에서는 생략한다.

    SearchResults:
      description: |
        검색 응답. **뒤진 범위를 먼저 밝히고**(`scope`), 결과는 관련도 순이며,
        **0건이 정상**이다 (`Policy_데이터_찾기 §1.3-7`·§3.3).
      allOf:
        - $ref: "../schemas/common.json#/$defs/ListEnvelope"
        - type: object
          required: [scope, isDataQuery, degraded, items]
          properties:
            scope:
              allOf: [{ $ref: "../schemas/common.json#/$defs/AiSearchScope" }]
              description: |
                「우리 연구실 데이터 128개를 뒤졌지만…」 의 그 값. **0건이어도 이것이 먼저다.**
            isDataQuery:
              description: |
                질의가 **데이터를 찾는 질문**인가. `false` 면 `items` 는 비어 있고 화면은
                「데이터를 찾는 질문에 답해요」 + 예시로 안내한다 (`§9`). **오류가 아니다.**
              type: boolean
            degraded:
              description: |
                AI 가 제 몫을 못 했다. `true` 면 결과가 비었거나 부분적이다 —
                **5xx 로 끝내지 않는다.** 카탈로그·업로드는 그대로 돈다
                (`core-ai.yaml` Degradable · `CLAUDE.md §3` — AI 없이도 v2 는 완결된 제품이다).
              type: boolean
            degradedReason:
              description: 사람이 읽을 한 줄. **화면 문구는 core 가 정한다** — AI 문구를 그대로 쓰지 않는다.
              type: string
              minLength: 1
            items:
              type: array
              items: { $ref: "#/components/schemas/SearchResultRow" }

    SearchResultRow:
      description: |
        검색 결과 카드 한 장 = **카탈로그 행 그대로 + AI 가 보탠 두 값.**
        `DatasetRow` 를 다시 선언하지 않고 합성한다 — 같은 모양의 두 번째 선언은 갈라질 표면이다.
        **잠긴 데이터도 이 형태로 내려간다** (`§1.3-6` — 결과에서 빼지 않는다).
      allOf:
        - $ref: "#/components/schemas/DatasetRow"
        - type: object
          required: [relevanceBar, rationale]
          properties:
            relevanceBar:
              description: |
                **막대 하나의 길이**다. **퍼센트도 등급 텍스트도 쓰지 않는다**
                (`Policy_데이터_찾기 §4 용어(관련도)`). 순서가 이미 관련도이고 이 값은 강도만 거든다.
                **사용자에게 숫자로 보이는 순간 정본 위반이다.**
              type: number
              minimum: 0
              maximum: 1
            rationale:
              allOf: [{ $ref: "../schemas/common.json#/$defs/AiRationale" }]
              description: |
                「왜 이 결과?」 **한 줄.** 한계도 이 한 줄 안에서 함께 밝힌다 —
                별도 필드를 두지 않는다 (`§4 한계 표시` · `§8 AI 근거 블록`).

    FacetSet:
      description: 조건을 걸 수 있는 다섯 열의 값별 건수.
      type: object
      required: [columns]
      additionalProperties: false
      properties:
        columns:
          type: array
          items:
            type: object
            required: [column, values]
            additionalProperties: false
            properties:
              column: { $ref: "#/components/schemas/CatalogColumn" }
              values:
                type: array
                items:
                  type: object
                  required: [value, count]
                  additionalProperties: false
                  properties:
                    value:
                      description: 열에 따라 문자열·정수·불리언이다(주제/업로더·Level·Verified).
                      type: [string, integer, boolean]
                    count: { type: integer, minimum: 0 }

    DatasetBasicInfo:
      description: |
        기본 정보 **아홉 칸** — 구성 · 좌표계 · 기간 · 격자 · 포맷 · 파일 · 원천 표기 · 소유자 · 올린 사람
        (`Policy_데이터셋_상세 §5`). 공간 범위 칸은 두지 않는다(이름과 지도가 이미 말한다).
        조각이 여럿이면 §4.3 합치는 규칙의 결과가 담긴다.
      type: object
      required: [variables, crs, period, grid, format, files, sourceLabel, owner, uploader]
      additionalProperties: false
      properties:
        variables:
          description: 구성(변수 목록). 파일에서 자동으로 읽는다 — 사람이 타이핑하지 않는다.
          type: array
          items: { type: string, minLength: 1 }
        crs: { type: [string, "null"] }
        period:
          oneOf:
            - $ref: "#/components/schemas/DataPeriod"
            - type: "null"
        grid: { type: [string, "null"] }
        format: { type: [string, "null"] }
        files:
          description: "`파일` 칸 — 조각 수와 용량 **합계**만 말한다 (`조각 4개 · 합계 148 MB`)."
          type: object
          required: [count, totalSizeBytes, hasReferenceGridFile]
          additionalProperties: false
          properties:
            count:
              description: |
                **본체 파일 건수** — 기준 격자 파일 제외 (`DatasetRow.fileCount` 와 같은 정의).
                격자의 유무는 바로 아래 `hasReferenceGridFile` 이 따로 말한다.
              type: integer
              minimum: 1
            totalSizeBytes: { type: integer, minimum: 0 }
            hasReferenceGridFile:
              description: |
                기준 격자 파일 유무. 없으면 없다고 적는다 — 짝 파일이 없어 못 그리는 것인지
                원래 필요 없는 포맷인지가 갈린다 (`Policy_데이터셋_상세 §5`).
              type: boolean
        sourceLabel:
          description: 원천 표기. 연구실 밖 출처의 이름이며 계보 그래프의 점선 노드가 이 값이다.
          type: [string, "null"]
        owner:
          description: 소유자. **빈 값 불가** (P-29).
          $ref: "#/components/schemas/AccountRef"
        uploader:
          description: 올린 사람. 바뀌지 않는다 — 소유자와 별개 기록이다 (P-30).
          $ref: "#/components/schemas/AccountRef"

    DatasetProjectUse:
      description: |
        활용 프로젝트 한 건. **의미 문장은 연결마다 따로다** — 같은 데이터라도 과제마다 쓰임이 다르다
        (`DataModel §5` · `Policy_데이터셋_상세 §5`).
      type: object
      required: [projectId, name, type, period, usageNote]
      additionalProperties: false
      properties:
        projectId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }
        type: { $ref: "../schemas/common.json#/$defs/ProjectType" }
        period:
          oneOf:
            - $ref: "#/components/schemas/ProjectPeriod"
            - type: "null"
        usageNote: { type: [string, "null"] }

    DatasetDetail:
      description: |
        상세 화면(S-05)이 읽는 값. **잠긴 데이터도 이 형태로 200 이다** —
        `bodyAccessible: false` 이면 `basicInfo`·`projects` 가 null 이고 화면은 그 자리에
        잠김 안내와 접근 요청 버튼을 세운다 (`Policy_승인_처리 §8` · P-13).
      type: object
      required:
        [datasetId, name, fileName, summary, topic, processingLevel, lineageState,
         verification, accessState, bodyAccessible, accessRequestPending,
         uploadedAt, lastModifiedAt, lineageConfirmedAt, basicInfo, projects, actions]
      additionalProperties: false
      properties:
        datasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name:
          description: 제목 = 사람이 붙인 이름 (`Policy_데이터셋_상세 §8` 상세 헤더).
          type: string
          minLength: 1
        fileName:
          description: 제목 아래 작게 서는 파일명(묶음 이름).
          type: [string, "null"]
        summary:
          description: 한 줄 요약. 잠김이어도 내려간다 (P-13).
          type: [string, "null"]
        topic: { type: [string, "null"] }
        processingLevel: { $ref: "../schemas/common.json#/$defs/ProcessingLevel" }
        lineageState: { $ref: "../schemas/common.json#/$defs/LineageState" }
        verification: { $ref: "#/components/schemas/VerificationRecord" }
        accessState: { $ref: "../schemas/common.json#/$defs/AccessState" }
        bodyAccessible: { type: boolean }
        accessRequestPending:
          description: |
            보는 사람이 이미 요청을 보냈는가. `검토 대기` 칩과 "결과가 정해지면 알려드려요"가
            이 값으로 갈린다 (`Policy_데이터_찾기 §8` 잠긴 카드 상태 칩).
          type: boolean
        uploadedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
        lastModifiedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
        lineageConfirmedAt:
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        basicInfo:
          oneOf:
            - $ref: "#/components/schemas/DatasetBasicInfo"
            - type: "null"
        projects:
          description: |
            활용 프로젝트를 **여러 건 전부** 나열한다. 0건이면 빈 배열이고 화면이 빈 상태를 세운다.
            잠김이면 null.
          oneOf:
            - type: array
              items: { $ref: "#/components/schemas/DatasetProjectUse" }
            - type: "null"
        actions:
          description: |
            **화면이 조건을 임의로 정하지 않는다** (P-7). 헤더 우측 한 자리가 상태 × 보는 사람에 따라
            갈리는 것(`✓ 승인 요청` / `승인` / `⋯ 승인 취소`)과 편집 컨트롤 노출을 서버가 판정해 내린다.
            꺼진 것은 화면에서 **숨긴다**(P-12).
          type: object
          required:
            [canRequestVerification, canApproveVerification, canCancelVerification,
             canEditLineage, canDelete, canDownload, canRequestAccess]
          additionalProperties: false
          properties:
            canRequestVerification: { type: boolean }
            canApproveVerification: { type: boolean }
            canCancelVerification: { type: boolean }
            canEditLineage: { type: boolean }
            canDelete: { type: boolean }
            canDownload: { type: boolean }
            canRequestAccess: { type: boolean }

    DatasetFile:
      type: object
      required: [fileId, fileName, kind]
      additionalProperties: false
      properties:
        fileId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        fileName:
          description: 조각의 실제 파일명. 목록을 펼쳐야 보인다 (`DataModel §4.3`).
          type: string
          minLength: 1
        kind: { $ref: "../schemas/common.json#/$defs/FileKind" }
        gridAxis:
          allOf: [{ $ref: "../schemas/common.json#/$defs/GridAxisAssignment" }]
          description: |
            **⟨동결 1회 해제 · `PLAN-SoT §9-〈80〉-㉯` 묶음 3(`K-3`)⟩**
            **`kind` 가 `기준 격자 파일` 일 때만 있다.** 본체에는 없다 — 축이 붙은 본체는
            `0004` 의 CHECK 가 애초에 만들지 않는다.
            **화면이 뒤집기 버튼을 그리려면 지금 배정이 무엇인지 알아야 한다** —
            그 값이 이것이다 (`PREVIEW-IMPLEMENTATION §10-16` — 사용자에게 「위도냐 경도냐」를
            묻지 않는다. **서버가 판별하고 보여주고 뒤집기 버튼을 준다**).

    DeletionImpact:
      type: object
      required: [derivedDatasetCount, verified, pendingAccessRequestCount]
      additionalProperties: false
      properties:
        derivedDatasetCount:
          description: "\"이 데이터로 만든 데이터 N건의 계보에 자리가 남아요\"."
          type: integer
          minimum: 0
        verified:
          description: "\"교수 승인이 붙은 데이터예요\" 경고를 더할지."
          type: boolean
        pendingAccessRequestCount:
          description: "\"대기 중인 접근 요청 N건이 자동으로 닫혀요\"."
          type: integer
          minimum: 0

    # ── D4 ──

    LineageNode:
      description: |
        계보 그래프의 노드. **원천·묘비 노드는 열 화면이 없어 이동하지 않는다**
        (`Policy_데이터셋_상세 §8`). 잠긴 노드는 사라지지 않고 눌리면 잠긴 상세로 간다.
      type: object
      required: [kind, datasetId, name, processingLevel, verified, navigable, bodyAccessible, deletedAt]
      additionalProperties: false
      properties:
        kind:
          description: |
            그래프에서의 자리. `원천`은 연구실 데이터셋이 아니라 표기이고, `묘비`는 지워진 데이터다
            (`DataModel §4.1·§4.2`).
          type: string
          enum: ["원천", "가공 전", "이 데이터", "파생", "묘비"]
        datasetId:
          description: "`원천`은 데이터셋이 아니므로 null 이다."
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Ulid"
            - type: "null"
        name: { type: string, minLength: 1 }
        processingLevel:
          oneOf:
            - $ref: "../schemas/common.json#/$defs/ProcessingLevel"
            - type: "null"
        verified: { type: boolean }
        navigable:
          description: 눌러서 그 데이터셋 상세로 갈 수 있는가. 원천·묘비는 false 다.
          type: boolean
        bodyAccessible: { type: boolean }
        deletedAt:
          description: 묘비 노드의 지운 시각. 마우스를 올렸을 때 알린다.
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"

    LineageEdge:
      description: |
        관계 하나 = "자식 ← 부모" 한 쌍. **가공 방식은 관계에 붙는다** — 화살표 라벨이 되는 값이라서다
        (`DataModel §4.2`).
      type: object
      required: [childDatasetId, parentDatasetId, parentRole, method, origin, confirmedBy, confirmedAt]
      additionalProperties: false
      properties:
        childDatasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        parentDatasetId:
          description: 원천 표기가 부모 자리인 관계는 데이터셋이 아니므로 null 이다.
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Ulid"
            - type: "null"
        parentRole: { $ref: "../schemas/common.json#/$defs/ParentRole" }
        method:
          description: |
            가공 방식 — 어떻게 만들었는지 **한 줄**(자유 문장). 정본이 열거값을 주지 않았고
            어휘 확정은 수문학 도메인 소유자 몫이라 enum 을 만들지 않는다
            (`sessions/D2.md §3-①` · `PLAN-SoT §9-㉚`).
          type: [string, "null"]
        origin: { $ref: "../schemas/common.json#/$defs/LineageOrigin" }
        confirmedBy: { $ref: "#/components/schemas/AccountRef" }
        confirmedAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }

    LineageGraph:
      type: object
      required: [datasetId, lineageState, lineageConfirmedAt, unknownParents, nodes, edges, projectUseCount, canEdit]
      additionalProperties: false
      properties:
        datasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        lineageState: { $ref: "../schemas/common.json#/$defs/LineageState" }
        lineageConfirmedAt:
          oneOf:
            - $ref: "../schemas/common.json#/$defs/Timestamp"
            - type: "null"
        unknownParents:
          description: |
            `기록 없음` 표시. 부모를 모르는 채 등록했다는 뜻이고 관계가 붙으면 사라진다
            (`DataModel §4.2`). 빈 상태 화면이 이 값으로 갈린다.
          type: boolean
        nodes:
          type: array
          items: { $ref: "#/components/schemas/LineageNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/LineageEdge" }
        projectUseCount:
          description: |
            활용 배지 숫자. **활용 프로젝트 목록 건수와 같은 값이어야 한다**
            (`Policy_데이터셋_상세 §8`).
          type: integer
          minimum: 0
        canEdit:
          description: "`업로드·편집`이 켜졌는가. 꺼졌으면 수정 컨트롤을 숨긴다 (P-12)."
          type: boolean

    LineageParentCreate:
      description: |
        만들어진 경로(`LineageOrigin`)·확인 기록·계보 상태·Lv 는 요청에 없다 —
        서버가 `manual` 로 기록하고 파생값은 계산한다 (`PLAN-SoT §9-⑳` · `CLAUDE.md §3-2`).
      type: object
      required: [parentDatasetId]
      additionalProperties: false
      properties:
        parentDatasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        parentRole: { $ref: "../schemas/common.json#/$defs/ParentRole" }
        method:
          description: 가공 방식 한 줄. 자유 문장이다.
          type: [string, "null"]

    # ── D6 ──

    ProjectRow:
      description: |
        목록 카드·표가 같은 값을 쓴다 — 필터·정렬이 한 벌이라 두 보기가 같은 목록을 본다
        (`Policy_프로젝트 §5`). 표 열: 이름 · 유형 · 데이터셋 수 · 기간 · 기록 없음 수 · 승인 수.
      type: object
      required: [projectId, name, type, status, period, description, datasetCount, verifiedCount, unknownLineageCount]
      additionalProperties: false
      properties:
        projectId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "../schemas/common.json#/$defs/ProjectType" }
        status: { $ref: "../schemas/common.json#/$defs/ProjectStatus" }
        period:
          oneOf:
            - $ref: "#/components/schemas/ProjectPeriod"
            - type: "null"
        description:
          description: 카드에 두 줄로 선다. 비어 있으면 화면이 채우기 유도를 세운다.
          type: [string, "null"]
          maxLength: 500
        datasetCount:
          description: "지표 타일·이동 안내(`데이터셋 N개 보기 →`)가 같은 값을 쓴다."
          type: integer
          minimum: 0
        verifiedCount:
          description: "승인 수. 화면은 `승인 / 전체`로 적으므로 분모는 `datasetCount` 다."
          type: integer
          minimum: 0
        unknownLineageCount:
          description: "기록 없음 수. 1건부터 강조색 (`Policy_프로젝트 §5` 지표 타일)."
          type: integer
          minimum: 0

    ProjectDatasetRow:
      description: |
        소속 데이터셋 표 한 행 — 이름 · 가공 단계 · 기간 · 계보 · Verified · 소속 해제.
        **행에서 판단이 끝나도록 싣는다** (`Policy_프로젝트 §5`).
      type: object
      required: [datasetId, name, fileCount, processingLevel, period, lineageState, verified, accessState, bodyAccessible, usageNote]
      additionalProperties: false
      properties:
        datasetId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1 }
        fileCount:
          description: |
            **본체 파일 건수** — 기준 격자 파일 제외 (`DatasetRow.fileCount` 와 같은 정의).
            2 이상이면 이름 뒤에 `조각 N` 칩 (E-02 와 같은 규칙).
          type: integer
          minimum: 1
        processingLevel: { $ref: "../schemas/common.json#/$defs/ProcessingLevel" }
        period:
          oneOf:
            - $ref: "#/components/schemas/DataPeriod"
            - type: "null"
        lineageState: { $ref: "../schemas/common.json#/$defs/LineageState" }
        verified: { type: boolean }
        accessState: { $ref: "../schemas/common.json#/$defs/AccessState" }
        bodyAccessible:
          description: "잠긴 데이터셋은 이름까지만 보이고 그 자리가 접근 요청이 된다 (`Policy_승인_처리 §8`)."
          type: boolean
        usageNote:
          description: 이 연결의 활용 의미 문장.
          type: [string, "null"]

    ProjectDetail:
      type: object
      required: [projectId, name, type, status, period, description, link, datasets, canManage]
      additionalProperties: false
      properties:
        projectId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: "../schemas/common.json#/$defs/ProjectType" }
        status: { $ref: "../schemas/common.json#/$defs/ProjectStatus" }
        period:
          oneOf:
            - $ref: "#/components/schemas/ProjectPeriod"
            - type: "null"
        description: { type: [string, "null"], maxLength: 500 }
        link:
          description: |
            연결 주소 — 설명·기간과 **다른 묶음**이다(계보 항목). 받아 적은 값을 그대로 저장하고
            링크로만 보여준다. 형식·생존 여부를 확인하지 않는다 (`Policy_프로젝트 §5`).
          type: [string, "null"]
          maxLength: 500
        datasets:
          description: "**전부** 담는다. 자르지 않는다 (`Policy_프로젝트 §5`)."
          type: array
          items: { $ref: "#/components/schemas/ProjectDatasetRow" }
        canManage:
          description: "`프로젝트 생성` 스위치. 꺼졌으면 만들기·수정·닫기 버튼을 숨긴다 (§6·P-12)."
          type: boolean

    ProjectDatasetLinkCreate:
      description: |
        연결 한 건의 본문 — 맨 PUT 이 아니다 (`sessions/D2c.md §2-8`). 연결마다 활용 의미 문장이
        붙는다 (`DATAMODEL-BASELINE.md` · `DataModel §5`). 아직 못 적었으면 null 로 명시한다 —
        필드를 빼먹은 요청과 구분하기 위해 required 다.
      type: object
      required: [usageNote]
      additionalProperties: false
      properties:
        usageNote:
          description: 이 연결의 활용 의미 문장. `ProjectDatasetRow.usageNote` 가 읽는 값이다.
          type: [string, "null"]

    ProjectCreate:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type: { $ref: "../schemas/common.json#/$defs/ProjectType" }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        period:
          oneOf:
            - $ref: "#/components/schemas/ProjectPeriod"
            - type: "null"
        link: { type: [string, "null"], maxLength: 500 }

    ProjectUpdate:
      description: "유형은 없다 — 만든 뒤에는 바꾸지 않는다."
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, "null"], maxLength: 500 }
        period:
          oneOf:
            - $ref: "#/components/schemas/ProjectPeriod"
            - type: "null"
        link: { type: [string, "null"], maxLength: 500 }

    ProjectStatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: "../schemas/common.json#/$defs/ProjectStatus" }

    # ── D8 ──

    DashboardSummary:
      type: object
      required: [projectCount, datasetCount, lineageSettledCount, lineageUnsettledCount, verifiedCount]
      additionalProperties: false
      properties:
        projectCount: { type: integer, minimum: 0 }
        datasetCount: { type: integer, minimum: 0 }
        lineageSettledCount:
          description: |
            계보 확정 = `확정` + `원천`. 원천은 가공 전 데이터가 없는 것이 정상이라 미확정으로 세지 않는다
            (`Policy_홈_대시보드 §4·§5`).
          type: integer
          minimum: 0
        lineageUnsettledCount:
          description: "확인이 필요한 수 = `확인 필요` + `기록 없음`. 퍼센트로 바꾸지 않는다."
          type: integer
          minimum: 0
        verifiedCount: { type: integer, minimum: 0 }

    DataMap:
      type: object
      required: [totalCount, byLineageState, byTopic]
      additionalProperties: false
      properties:
        totalCount:
          description: 비율 막대의 분모.
          type: integer
          minimum: 0
        byLineageState:
          description: "네 값 전부 담는다 — 0이어도 줄을 지우지 않는다."
          type: array
          items:
            type: object
            required: [value, count]
            additionalProperties: false
            properties:
              value: { $ref: "../schemas/common.json#/$defs/LineageState" }
              count: { type: integer, minimum: 0 }
        byTopic:
          type: array
          items:
            type: object
            required: [value, count]
            additionalProperties: false
            properties:
              value: { type: string, minLength: 1 }
              count: { type: integer, minimum: 0 }

    Activity:
      description: |
        활동 기록 한 줄 — 누가 · 무엇을 · 언제 · 어떤 일 (`DataModel §6.1`).
        **바꾼 일만** 쌓인다(올림 · 계보 고침 · 승인 · 프로젝트 만듦 · 지움).
      type: object
      required: [activityId, actor, action, target, occurredAt]
      additionalProperties: false
      properties:
        activityId: { $ref: "../schemas/common.json#/$defs/Ulid" }
        actor: { $ref: "#/components/schemas/AccountRef" }
        action:
          description: |
            무슨 일을 했는가. 정본(`DataModel §6.1`)은 다섯 가지를 **예시로 열거**할 뿐
            값 집합으로 닫지 않았고 `common.json` 에도 정의가 없다.
            여기서 enum 을 만들면 정본에 없는 값 집합을 seam 이 새로 여는 것이라 문자열로 둔다.
          type: string
          minLength: 1
        target:
          description: 누르면 가는 곳. 데이터셋 또는 프로젝트다.
          type: object
          required: [kind, id, name]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: ["데이터셋", "프로젝트"]
            id: { $ref: "../schemas/common.json#/$defs/Ulid" }
            name: { type: string, minLength: 1 }
        occurredAt: { $ref: "../schemas/common.json#/$defs/Timestamp" }
