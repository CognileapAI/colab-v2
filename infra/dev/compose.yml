# infra/dev — AWS dev 환경의 EC2 한 대 위 compose (`PLAN-SoT §9 〈176〉·〈178〉-㉮`).
#
# staging(`../staging/compose.i2.yml`)과 다른 점 — 그리고 왜
#   · `build:` 가 없다. EC2 에는 레포가 없고 이미지는 개발 기계에서 `build.sh`(buildx arm64) 로 만들어
#     `ship.sh` 로 실어 `docker load` 한다. 태그 `${COLAB_IMAGE_TAG}` 로 되돌린다(`:dev-<sha>` 불변 태그).
#   · postgres 가 없다 — RDS 다. nginx·cloudflared·frontend 컨테이너도 없다 — 라우팅은 CloudFront,
#     정적 번들은 웹 버킷(`ops/deploy_web.py`), 미리보기는 데이터 버킷 `previews/`(viz 싱크).
#   · 업로드 볼륨이 없다 — 저장 모드가 s3 다. 작업 디렉터리(`work`)만 있고 그것은 **캐시이지 상태가 아니다**.
#   · 서비스 이름은 staging 과 **같다** — `gates/config/db-boundaries.toml` 의 `compose_service` 키가 그 이름이고
#     `db-boundary` 게이트가 이 파일도 본다.
#   · **AWS 액세스 키 변수가 없다.** 자격증명은 EC2 인스턴스 프로파일(IMDSv2, hop limit 2)이 준다 —
#     env 에 `AWS_ACCESS_KEY_ID` 를 두면 공급자 순서(env→ECS→IMDS)상 키가 먼저 잡혀 역할이 무의미해진다.
#   · 저장 모드·버킷·리전은 **리터럴**이다 — 치환으로 두면 빠뜨렸을 때 기본 `local` 이 이겨 EC2 디스크에 쌓이고
#     전송 op 가 501 을 내며 FE 가 폴백해 「성공처럼」 보인다.
#   · 비밀은 값이 아니라 **`_FILE` 경로**다(`〈121〉-㉯` — `docker inspect` 유출 사고). 실파일은 EC2 `/etc/colab/`
#     아래 0600 · uid 10001 이고 경로는 env 로 받는다(레포에 절대경로를 적지 않는다 — `CLAUDE.md §3-8`).
#
# 올리기 · 되돌리기 · 확인 · 진단 = `README.md`(이 디렉터리 — 배포 런북 정본).
name: colab-v2-dev

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

services:
  # 작업 디렉터리 주인 맞추기 — 컨테이너 유저(uid 10001)가 쓰는 자리. 없으면 워커·viz 가 EACCES 로 죽는다.
  volume-init:
    image: alpine:3.20
    container_name: colab_v2_dev_volume_init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/colab/work/worker /var/lib/colab/work/viz /var/lib/colab/work/viz-previews && chown -R 10001:10001 /var/lib/colab/work && chmod 0755 /var/lib/colab/work"]
    volumes:
      - work:/var/lib/colab/work
    restart: "no"

  core-api:
    image: colab-v2/core-api:${COLAB_IMAGE_TAG:-dev}
    container_name: colab_v2_dev_core_api
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COLAB_MEM_CORE:-512m}
    cpus: ${COLAB_CPUS_CORE:-1.0}
    ports:
      # CloudFront 오리진 B 가 여기로 온다. 보안그룹이 CloudFront 관리형 프리픽스 리스트로 8000 을 제한한다.
      - "0.0.0.0:8000:8000"
    environment:
      COLAB_CORE_DATABASE_URL_FILE: /etc/colab/core-database.url
      COLAB_CORE_SUBJECTS_FILE: /etc/colab/subjects.json
      COLAB_CORE_CREDENTIALS_FILE: /etc/colab/credentials.json
      COLAB_CORE_SESSION_SECRET: ${COLAB_CORE_SESSION_SECRET:?COLAB_CORE_SESSION_SECRET 이 필요하다 — 없으면 로그인과 다운로드가 서지 않는다}
      # ── 저장 모드 s3 — 리터럴. 이 셋은 env 치환으로 두지 않는다(머리 주석).
      COLAB_CORE_STORAGE_MODE: s3
      COLAB_CORE_S3_BUCKET: colab-platform-data-dev
      COLAB_CORE_S3_REGION: ap-northeast-2
      # 미리보기 중계 — 주소와 토큰 **둘 다** 있어야 relay 가 선다(staging 과 같은 함정).
      COLAB_CORE_VIZ_BASE_URL: http://viz-render:8100/viz/v1
      COLAB_CORE_VIZ_SERVICE_TOKEN: ${COLAB_VIZ_SERVICE_TOKEN:?COLAB_VIZ_SERVICE_TOKEN 이 필요하다 — 없으면 미리보기가 전량 503 이다}
      COLAB_CORE_AI_BASE_URL: ${COLAB_CORE_AI_BASE_URL:-http://ai-service:8200}
    volumes:
      - ${COLAB_DEV_SECRETS_DIR:?COLAB_DEV_SECRETS_DIR 이 필요하다 — EC2 의 시크릿 디렉터리(0600·uid 10001)}/core-database.url:/etc/colab/core-database.url:ro
      - ${COLAB_DEV_SECRETS_DIR}/subjects.json:/etc/colab/subjects.json:ro
      - ${COLAB_DEV_SECRETS_DIR}/credentials.json:/etc/colab/credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline-worker:
    image: colab-v2/pipeline-worker:${COLAB_IMAGE_TAG:-dev}
    container_name: colab_v2_dev_pipeline_worker
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COLAB_MEM_WORKER:-768m}
    cpus: ${COLAB_CPUS_WORKER:-1.0}
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      COLAB_PIPELINE_DB_URL_FILE: /etc/colab/pipeline-db.url
      # ── 저장 모드 s3 — 바이트를 버킷에서 작업 디렉터리로 내려받아 읽는다(`〈178〉-㉴`). 업로드 볼륨 불요.
      COLAB_WORKER_STORAGE_MODE: s3
      COLAB_WORKER_S3_BUCKET: colab-platform-data-dev
      COLAB_WORKER_S3_REGION: ap-northeast-2
      COLAB_WORKER_WORKDIR: /var/lib/colab/work/worker
      # `COLAB_WORKER_LAB_ID` 를 걸지 않는다 — 연구실마다 제 스코프로 돈다(Ted 2026-08-26 ㈑).
    volumes:
      - work:/var/lib/colab/work
      - ${COLAB_DEV_SECRETS_DIR}/pipeline-db.url:/etc/colab/pipeline-db.url:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  viz-render:
    image: colab-v2/viz-render:${COLAB_IMAGE_TAG:-dev}
    container_name: colab_v2_dev_viz_render
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COLAB_MEM_VIZ:-768m}
    cpus: ${COLAB_CPUS_VIZ:-1.0}
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      COLAB_VIZ_SERVICE_TOKEN: ${COLAB_VIZ_SERVICE_TOKEN:?COLAB_VIZ_SERVICE_TOKEN 이 필요하다}
      COLAB_VIZ_TILE_SIGNING_SECRET: ${COLAB_VIZ_TILE_SIGNING_SECRET:?COLAB_VIZ_TILE_SIGNING_SECRET 이 필요하다}
      # ── 소스 s3 — 목록으로 판정하고 작업 디렉터리로 내려받아 그린다. 상한은 3상태(숫자·none·미설정=거부).
      COLAB_VIZ_SOURCE_MODE: s3
      COLAB_VIZ_S3_BUCKET: colab-platform-data-dev
      COLAB_VIZ_S3_REGION: ap-northeast-2
      COLAB_VIZ_WORKDIR: /var/lib/colab/work/viz
      COLAB_VIZ_WORK_MAX_BYTES: ${COLAB_VIZ_WORK_MAX_BYTES:?COLAB_VIZ_WORK_MAX_BYTES 가 필요하다 — 바이트 수 또는 none(명시 무제한)}
      # ── 미리보기 싱크 s3 — 산출물을 데이터 버킷 previews/ 로. URL 은 그대로 /previews(CloudFront 오리진 C).
      COLAB_VIZ_PREVIEW_SINK: s3
      COLAB_VIZ_PREVIEW_S3_PREFIX: previews
      COLAB_VIZ_PREVIEW_DIR: /var/lib/colab/work/viz-previews
      COLAB_VIZ_PREVIEW_URL_BASE: /previews
    volumes:
      - work:/var/lib/colab/work
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    image: colab-v2/ai-service:${COLAB_IMAGE_TAG:-dev}
    container_name: colab_v2_dev_ai_service
    restart: unless-stopped
    logging: *logging
    mem_limit: ${COLAB_MEM_AI:-384m}
    cpus: ${COLAB_CPUS_AI:-0.5}
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      COLAB_AI_DB_URL_FILE: /etc/colab/ai-db.url
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COLAB_MODEL_HELPER: ${COLAB_MODEL_HELPER:-gpt-5.6-luna}
      COLAB_MODEL_ORCHESTRATOR: ${COLAB_MODEL_ORCHESTRATOR:-gpt-5.6-terra}
      COLAB_AI_QUERY_INTERPRETATION: ${COLAB_AI_QUERY_INTERPRETATION:-literal}
    volumes:
      - ${COLAB_DEV_SECRETS_DIR}/ai-db.url:/etc/colab/ai-db.url:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 일회성 러너. profile 뒤에 둔다 — `up -d` 가 마이그레이션을 몰래 돌리지 않는다. `up.sh` 가 명시적으로 부른다.
  #    체인은 이미지 안에 있다(`migrator/Dockerfile` — EC2 에 레포가 없다). **소유자 롤**로 돈다.
  migrate-platform:
    profiles: ["migrate"]
    image: colab-v2/migrator:${COLAB_IMAGE_TAG:-dev}
    working_dir: /chain/platform
    environment:
      COLAB_PLATFORM_DB_URL_FILE: /etc/colab/platform-owner-db.url
    volumes:
      - ${COLAB_DEV_SECRETS_DIR}/platform-owner-db.url:/etc/colab/platform-owner-db.url:ro

  migrate-ai:
    profiles: ["migrate"]
    image: colab-v2/migrator:${COLAB_IMAGE_TAG:-dev}
    working_dir: /chain/ai
    environment:
      COLAB_AI_DB_URL_FILE: /etc/colab/ai-owner-db.url
    volumes:
      - ${COLAB_DEV_SECRETS_DIR}/ai-owner-db.url:/etc/colab/ai-owner-db.url:ro

# 작업 디렉터리 — 워커·viz 가 버킷에서 내려받은 바이트와 viz 산출물의 자리. **캐시다**(`〈176〉`):
# 워커는 처리 뒤 제 디렉터리를 지우고, viz 는 상한(LRU)으로 자른다. 인스턴스를 갈아도 잃을 것이 없다.
volumes:
  work: {}
