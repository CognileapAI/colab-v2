# WU-I2 walking skeleton — 엣지 라우터.
#
# 터널 ingress 는 www.colab-hydro.com → http://nginx:80 하나다(IaC 정본 = tunnel/tunnel.tf).
# 그 규칙을 바꾸지 않기 위해, 5개 배포 단위를 가르는 일을 **여기 오리진 안에서** 한다.
# 덕분에 이번 WU 는 터널 선언을 한 글자도 고치지 않는다 — terraform plan 이 "No changes." 로 남는다.
#
# proxy_pass 를 변수로 쓴다: 이름을 기동 시점에 굳히지 않기 위해서다.
# 상수로 쓰면 뒷단 하나가 안 떠 있을 때 nginx 자체가 기동에 실패하고,
# 그러면 "어느 단위가 죽었나" 를 물어볼 창구까지 같이 사라진다.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    # ── 엣지 자신의 생존. 터널·오리진이 붙어 있는지의 단일 지표다(IS1 이 쓰던 그 경로).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── 배포 단위별 liveness. 5개가 각자 대답한다.
    location = /healthz/core-api {
        set $u core-api:8000;
        proxy_pass http://$u/healthz;
    }
    location = /healthz/pipeline-worker {
        set $u pipeline-worker:8000;
        proxy_pass http://$u/healthz;
    }
    location = /healthz/viz-render {
        set $u viz-render:8100;
        proxy_pass http://$u/healthz;
    }
    location = /healthz/ai-service {
        set $u ai-service:8200;
        proxy_pass http://$u/healthz;
    }
    location = /healthz/frontend {
        set $u frontend:8080;
        proxy_pass http://$u/healthz;
    }

    # ── API. 계약(fe-core.yaml)의 서버 경로 그대로 core-api 로 넘긴다.
    location /api/v1/ {
        set $u core-api:8000;
        proxy_pass http://$u;
        # ⭑ **업로드가 여기서 죽었다.** nginx 기본 `client_max_body_size` 는 **1m** 이고,
        #   실파일은 그 자리에서 **413** 이 된다 — core-api 는 요청을 구경도 못 한다.
        #   즉 「업로드가 안 된다」의 실물이 앱이 아니라 엣지였다. 값은 운영 설정이고
        #   `DR-11` 의 50 GB 는 [가정]이라 그 숫자를 여기 박지 않는다. 8g 는 레포 결정.
        client_max_body_size 8g;
        # 큰 본문을 디스크에 다 받고 나서 넘기지 않는다 — 그러면 엣지가 업로드 지연의
        # 두 배를 만들고, 임시 파일이 엣지 컨테이너 디스크를 먹는다.
        proxy_request_buffering off;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 미리보기 3층 산출물. **정적 자산이다**(`〈80〉-㉯ 2`) — viz-render 가 한 번 그려
    #    볼륨에 두고, 엣지가 그대로 낸다. `imageUrl` 은 계약이 **불투명 문자열**로 둔 자리라
    #    core 도 해석하지 않는다 — 그 문자열의 접두사가 `COLAB_VIZ_PREVIEW_URL_BASE` 이고
    #    기본값이 `/previews` 다. 두 값이 갈라지면 그림이 404 가 된다.
    location /previews/ {
        alias /srv/viz-previews/;
        access_log off;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ── 나머지 전부 frontend. 정문은 역할별 구조화 화면이다(CLAUDE.md §0).
    location / {
        set $u frontend:8080;
        proxy_pass http://$u;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
