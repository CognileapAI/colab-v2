# CoLAB v2 staging — WU-I2 walking skeleton.
#
# compose.yml (자리표시 오리진) 의 **다음 릴리스**다. 프로젝트명과 nginx/cloudflared 컨테이너명을
# 그대로 이어받는다 — 그래서 두 파일이 같은 자리를 두고 앞뒤로 교체된다:
#
#   배포:  docker compose -f compose.i2.yml ... up -d --remove-orphans
#   롤백:  docker compose -f compose.yml    ... up -d --remove-orphans
#
# 이 대칭이 이 WU 의 롤백 증명이다. 터널·DNS 는 어느 쪽에서도 건드리지 않는다.
#
# 호스트 노출은 127.0.0.1:3000 하나뿐이다. postgres 를 포함해 나머지는 **포트를 열지 않는다**
# (PoC 에서 5432 가 0.0.0.0 에 열려 있던 실패를 반복하지 않는다).
name: colab-v2-staging

services:
  # ── 엣지 라우터. 터널 ingress 가 http://nginx:80 을 가리키므로 서비스명은 nginx 로 고정.
  nginx:
    image: nginx:1.27-alpine
    container_name: colab_v2_staging_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.i2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      frontend:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: colab_v2_staging_cloudflared
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN 이 필요하다}
    command: ["tunnel", "--no-autoupdate", "run"]

  # ── 기록 저장소. 두 체인이 **같은 클러스터의 다른 데이터베이스**다.
  #    한 데이터베이스에 둘을 합치면 CLAUDE.md §3-3(체인 분리)이 스키마 이름 규칙으로만 남는다.
  postgres:
    image: postgres:16-alpine
    container_name: colab_v2_staging_pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${COLAB_PG_SUPER_PASSWORD:?COLAB_PG_SUPER_PASSWORD 가 필요하다}
      POSTGRES_DB: postgres
      # 볼륨 마운트 지점 **아래** 하위 디렉터리를 PGDATA 로 쓴다.
      # 이 호스트(WSL2)에서는 마운트 지점 자체의 퍼미션을 initdb 가 바꾸지 못해 기동이 무한 재시작한다.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # **named volume 을 쓰지 않는다.** 이 호스트의 docker root 가 Windows 드라이브(9p/drvfs)라
      # POSIX 퍼미션이 없고, initdb 가 데이터 디렉터리 권한을 바꾸지 못해 무한 재시작한다.
      # 그래서 WSL 쪽 ext4 경로에 바인드한다. 값은 홈의 0600 env 파일에만 있다 —
      # 문서·레포에 절대경로를 적지 않는다 (CLAUDE.md §5).
      - ${COLAB_STAGING_PGDATA_DIR:?COLAB_STAGING_PGDATA_DIR 이 필요하다 — WSL ext4 쪽 경로여야 한다}:/var/lib/postgresql/data
    # 포트를 열지 않는다. 접근은 compose 네트워크와 docker exec 뿐이다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── 실체가 있는 단위 — P0 골격(34 라우트 · 실질의 5 · 501 두 종).
  core-api:
    build:
      context: ../../services/core-api
    image: colab-v2/core-api:i2
    container_name: colab_v2_staging_core_api
    restart: unless-stopped
    environment:
      # 앱은 **비소유자 · NOBYPASSRLS 롤**로만 붙는다 (services/core-api/ops/app-role.sql).
      COLAB_CORE_DATABASE_URL: postgresql+psycopg://colab_app:${COLAB_APP_PASSWORD:?COLAB_APP_PASSWORD 가 필요하다}@postgres:5432/colab_platform
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 아직 비어 있는 세 단위. liveness 만 대답한다 — 도메인 로직은 각자의 WU 가 채운다.
  pipeline-worker:
    build:
      context: ../../services/pipeline-worker
    image: colab-v2/pipeline-worker:i2
    container_name: colab_v2_staging_pipeline_worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  viz-render:
    build:
      context: ../../services/viz-render
    image: colab-v2/viz-render:i2
    container_name: colab_v2_staging_viz_render
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../../services/ai-service
    image: colab-v2/ai-service:i2
    container_name: colab_v2_staging_ai_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
    image: colab-v2/frontend:i2
    container_name: colab_v2_staging_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 일회성 러너. profile 뒤에 둔다 — `up -d` 가 마이그레이션을 몰래 돌리지 않는다.
  #    배포 절차가 명시적으로 부른다 (deploy.sh).
  migrate-platform:
    profiles: ["migrate"]
    build:
      context: ./migrator
    image: colab-v2/migrator:i2
    volumes:
      - ../../db/platform:/chain:ro
    environment:
      # 마이그레이션은 **소유자 롤**로 돈다. 앱 롤에는 DDL 권한이 없다.
      COLAB_PLATFORM_DB_URL: postgresql+psycopg://colab_owner:${COLAB_OWNER_PASSWORD:?COLAB_OWNER_PASSWORD 가 필요하다}@postgres:5432/colab_platform
    depends_on:
      postgres:
        condition: service_healthy

  migrate-ai:
    profiles: ["migrate"]
    build:
      context: ./migrator
    image: colab-v2/migrator:i2
    volumes:
      - ../../db/ai:/chain:ro
    environment:
      COLAB_AI_DB_URL: postgresql+psycopg://colab_owner:${COLAB_OWNER_PASSWORD:?COLAB_OWNER_PASSWORD 가 필요하다}@postgres:5432/colab_ai
    depends_on:
      postgres:
        condition: service_healthy
