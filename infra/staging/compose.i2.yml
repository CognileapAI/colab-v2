# CoLAB v2 staging — WU-I2 walking skeleton.
#
# compose.yml (자리표시 오리진) 의 **다음 릴리스**다. 프로젝트명과 nginx/cloudflared 컨테이너명을
# 그대로 이어받는다 — 그래서 두 파일이 같은 자리를 두고 앞뒤로 교체된다:
#
#   배포:  docker compose -f compose.i2.yml ... up -d --remove-orphans
#   롤백:  docker compose -f compose.yml    ... up -d --remove-orphans
#
# 이 대칭이 이 WU 의 롤백 증명이다. 터널·DNS 는 어느 쪽에서도 건드리지 않는다.
#
# ⭑ **롤백 대상은 두 종류다** (`I3` 결정 3). 위의 `compose.yml` 은 **자리표시**로 가는 손잡이이고,
#   「직전 릴리스로 되돌린다」는 `rollback.sh --to-last-green` 이 릴리스 원장에서 태그를 읽어 한다.
#   릴리스가 둘 이상 쌓인 뒤에도 `compose.yml` 로 가면 그건 N-1 이 아니라 **0** 으로 가는 것이다.
#
# ⭑ **이미지 태그는 릴리스 태그다** (`I3 §2-4` DR-5). 종전에는 전부 `:i2` 고정이었고,
#   그래서 ⑴ 돌고 있는 컨테이너가 어느 커밋의 산출인지 이름으로 알 수 없었고
#   ⑵ 이전 이미지가 **이름을 잃은 dangling** 이 되어 되돌릴 손잡이가 없었다.
#   `COLAB_RELEASE_TAG` 는 **`:?` 로 요구한다** — 기본값 `i2` 로 떨어지면 그 결함이 그대로 살아난다.
#   `deploy.sh` · `rollback.sh` 가 값을 넣는다. 손으로 부를 때는 앞에 붙인다:
#       COLAB_RELEASE_TAG=i2 docker compose -f compose.i2.yml --env-file ... ps
#
# 호스트 노출은 127.0.0.1:3000 하나뿐이다. postgres 를 포함해 나머지는 **포트를 열지 않는다**
# (PoC 에서 5432 가 0.0.0.0 에 열려 있던 실패를 반복하지 않는다).
name: colab-v2-staging

services:
  # ── 엣지 라우터. 터널 ingress 가 http://nginx:80 을 가리키므로 서비스명은 nginx 로 고정.
  nginx:
    image: nginx:1.27-alpine
    container_name: colab_v2_staging_nginx
    restart: unless-stopped
    # ⭑ **⟨2026-08-31 · `PLAN-SoT §9 〈240〉`⟩ 설정 해시를 환경에 실어 재생성을 강제한다.**
    #   `nginx.i2.conf` 는 **바인드 마운트**라 파일을 고쳐도 컨테이너 안이 저절로 바뀌지
    #   않고, `deploy.sh` ⑩ 은 `up -d` 뿐이다. 이미지·환경이 그대로면 compose 는 nginx 를
    #   **재생성 대상으로 보지 않는다** — 그러면 **파일은 고쳤는데 도는 설정은 옛것**이
    #   된다(직전 회차가 `[미확인]` 으로 남긴 자리 · `sessions/P3-EDGE-TILE-20260831.md §3`).
    #   해시를 환경 변수로 실으면 **설정이 바뀐 회차에만** 컨테이너가 다시 만들어진다.
    #   ⚠ 값은 `deploy.sh` 가 파일에서 계산해 넣는다. **비밀이 아니다** — 설정 파일의
    #     sha256 앞 16자리이고, 안 넣으면 `미배선` 이라 판정기가 red 를 낸다.
    environment:
      COLAB_EDGE_CONF_SHA: ${COLAB_EDGE_CONF_SHA:-미배선}
    volumes:
      - ./nginx.i2.conf:/etc/nginx/conf.d/default.conf:ro
      # 미리보기 산출물은 **정적 파일**이라 앱을 거치지 않고 엣지가 그대로 낸다.
      # 읽기 전용 — 엣지가 렌더 산출물을 고칠 수 있으면 그건 엣지가 아니다.
      - previews:/srv/viz-previews:ro
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      frontend:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: colab_v2_staging_cloudflared
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN 이 필요하다}
    # ⭑ `--metrics` 를 **명시로 못박는다.** 기본값 `0.0.0.0:0` 은 20241~20245 중 「비어 있는 것」을
    #   집으므로 포트가 기동마다 달라질 수 있고, 그러면 아래 헬스체크가 고정 주소를 못 쓴다.
    #   loopback 에 묶는다 — 판정 주체가 **이 컨테이너 자신**이라 compose 네트워크에 낼 이유가 없다.
    #   (`--management-diagnostics` 기본값이 true 라 이 주소에는 /debug/pprof·/metrics 도 붙는다.)
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    # ⭑ 이 컨테이너만 헬스체크가 **없었다**. 8개 중 7개가 `healthy` 인데 이것만 「선언없음」이라
    #   `verify-deploy.sh` ② 가 구조적으로 RED 를 냈다. **판정에서 빼지 않는다** — 터널이 죽으면
    #   사이트가 외부에서 통째로 안 보이는데, 빼면 그것이 안 보이는 채로 green 이 난다.
    #
    # ⚠ 이 이미지는 **distroless 다 — 셸도 curl 도 wget 도 없다.** 그래서 다른 단위가 쓰는
    #   `CMD-SHELL` 이 여기서는 통째로 안 먹는다(`exec: "sh": executable file not found`).
    #   대신 cloudflared 바이너리 자신의 `tunnel ready` 를 쓴다 — /ready 를 호출해 종료코드로 답한다.
    #
    # ⚠ **`--metrics` 는 `ready` 앞에 와야 한다**(`cloudflared tunnel [옵션] ready`).
    #   뒤에 놓으면 `Incorrect Usage: flag provided but not defined` 를 내면서 **종료코드 0** 이다 —
    #   즉 아무것도 안 보고 영원히 통과하는 헬스체크가 된다. 실측으로 확인한 함정이다.
    #
    # 실측(2026-08-28, 가동 중인 컨테이너) — 살아 있는 주소에서 exit 0,
    # 아무도 안 듣는 주소(20242~20245 · 29999)에서 exit 1. 양방향 모두 확인했다.
    # /ready 본문은 `{"status":200,"readyConnections":4,...}` 로 **실제 연결 수**를 낸다 —
    # 프로세스가 살아 있다는 뜻이 아니라 터널이 붙어 있다는 뜻이다.
    #
    # `start_period` 는 기동 직후 연결이 붙기 전의 실패를 계수하지 않을 뿐이고,
    # 최종 판정은 그대로 진짜 통과를 요구한다 — 건너뛰기가 아니다.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 기록 저장소. 두 체인이 **같은 클러스터의 다른 데이터베이스**다.
  #    한 데이터베이스에 둘을 합치면 CLAUDE.md §3-3(체인 분리)이 스키마 이름 규칙으로만 남는다.
  postgres:
    image: postgres:16-alpine
    container_name: colab_v2_staging_pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${COLAB_PG_SUPER_PASSWORD:?COLAB_PG_SUPER_PASSWORD 가 필요하다}
      POSTGRES_DB: postgres
      # 볼륨 마운트 지점 **아래** 하위 디렉터리를 PGDATA 로 쓴다.
      # 이 호스트(WSL2)에서는 마운트 지점 자체의 퍼미션을 initdb 가 바꾸지 못해 기동이 무한 재시작한다.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # **named volume 을 쓰지 않는다.** 이 호스트의 docker root 가 Windows 드라이브(9p/drvfs)라
      # POSIX 퍼미션이 없고, initdb 가 데이터 디렉터리 권한을 바꾸지 못해 무한 재시작한다.
      # 그래서 WSL 쪽 ext4 경로에 바인드한다. 값은 홈의 0600 env 파일에만 있다 —
      # 문서·레포에 절대경로를 적지 않는다 (CLAUDE.md §5).
      - ${COLAB_STAGING_PGDATA_DIR:?COLAB_STAGING_PGDATA_DIR 이 필요하다 — WSL ext4 쪽 경로여야 한다}:/var/lib/postgresql/data
    # 쓰기 문장을 남긴다 (2026-08-26 Ted ① 채택).
    # 2026-08-25 소실에서 **성공한 쓰기가 로그에 없어** 삭제 주체를 재지 못했다
    # (dev-package/sessions/S2-BLOCKER-INVESTIGATION.md §1.4).
    # 현재 가동 인스턴스에는 ALTER SYSTEM 으로 이미 걸려 있고 그 값은 PGDATA 에 남는다.
    # 이 줄은 레포 측 정본이다 — 다음 recreate 부터 compose 가 같은 값을 준다.
    command: ["postgres", "-c", "log_statement=mod"]
    # 로그 상한. 상향 후 실측 증가량 = 유휴 상태 6.80 KB/분(약 9.6 MB/일).
    # 상한이 없으면 json 로그가 무한히 자란다 — 50m x 5 = 250 MB 로 막는다(약 26일치).
    # ⚠ 이 옵션은 **컨테이너 recreate 시점에** 적용된다. 적용 전까지는 상한이 없다.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # 포트를 열지 않는다. 접근은 compose 네트워크와 docker exec 뿐이다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── ⭑ 볼륨 주인 맞추기. **이것이 없으면 업로드가 통째로 500 이다.**
  #    named volume 의 마운트 지점은 root 소유로 만들어지는데 세 단위는 전부 uid 10001 로
  #    돈다(각 Dockerfile `USER colab`). 그래서 접수한 바이트를 쓰는 첫 줄에서
  #    `PermissionError` 가 나고, 그 실패는 **500** 으로만 보인다 — 「업로드가 안 된다」의
  #    실물이 코드가 아니라 소유권이었다는 것을 상태코드가 감춘다.
  #    compose 는 named volume 소유자를 선언으로 못 바꾼다. 그래서 일회성 root 컨테이너로 맞춘다.
  volume-init:
    image: alpine:3.20
    container_name: colab_v2_staging_volume_init
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/colab/uploads /srv/viz-previews /srv/viz-events && chmod 0755 /var/lib/colab/uploads /srv/viz-previews /srv/viz-events"]
    volumes:
      - uploads:/var/lib/colab/uploads
      - previews:/srv/viz-previews
      - events:/srv/viz-events
    restart: "no"

  # ── 실체가 있는 단위 — P0 골격(34 라우트 · 실질의 5 · 501 두 종).
  core-api:
    build:
      context: ../../services/core-api
    image: colab-v2/core-api:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다 — 릴리스 태그는 커밋 SHA 다 (deploy.sh 가 넣는다)}
    container_name: colab_v2_staging_core_api
    restart: unless-stopped
    environment:
      # 앱은 **비소유자 · NOBYPASSRLS 롤**로만 붙는다 (services/core-api/ops/app-role.sql).
      # ⭑ **값이 아니라 경로다** (`PLAN-SoT §9 〈121〉-㉯`). 예전에는 접속 문자열을 통째로
      #   여기 박았고, 그래서 `docker inspect` 의 환경변수 목록에 비밀번호가 그대로 나와
      #   **작업 기록에 남았다**(`03-HANDOFF §4 #34`). 자격 파일을 `0600` 으로 두고
      #   경로만 넘긴다 — `〈93〉`(주체 표) · `〈108〉-㉯`(자격 파일) 과 같은 방식이다.
      #   ⚠ 접미사는 **정확히 `_FILE`** 이다. `kernel/config.py` 가 이 이름을 읽는다 —
      #     한 글자만 어긋나도 배선은 있는데 아무도 안 읽는 상태가 되고 에러가 안 난다.
      COLAB_CORE_DATABASE_URL_FILE: /etc/colab/core-database.url
      # 접수한 바이트를 두는 자리. **없으면 접수를 거절한다**(kernel/config.py) —
      # 바이트를 버리고 201 을 내리는 것은 거짓말이다. worker 와 **같은 볼륨**이어야 한다.
      COLAB_CORE_UPLOAD_DIR: /var/lib/colab/uploads
      # ⭑ 렌더 표면. **이 변수가 없어서 미리보기가 전량 503 이었다**(`〈70〉-㉰` 실측 · `〈74〉`).
      # compose 에 viz 블록이 있어도 core-api 가 이 값을 못 읽으면 `HttpPreviewRelay` 자체를
      # 만들지 않는다(app/main.py) — 블록이 있는 것과 배선이 된 것은 다르다.
      COLAB_CORE_VIZ_BASE_URL: http://viz-render:8100/viz/v1
      # ⭑ **주소만으로는 부족하다.** `main.py` 는 base_url **과** service_token 이 **둘 다**
      # 있을 때만 `HttpPreviewRelay` 를 만든다. 토큰이 없으면 relay 가 None 이고 미리보기는
      # 다시 503 이다 — `〈74〉` 가 주소만 꽂아 둔 자리가 여기다. 값은 viz-render 쪽
      # `COLAB_VIZ_SERVICE_TOKEN` 과 **같은 문자열**이어야 한다(같은 env 키를 쓴다).
      COLAB_CORE_VIZ_SERVICE_TOKEN: ${COLAB_VIZ_SERVICE_TOKEN:?COLAB_VIZ_SERVICE_TOKEN 이 필요하다 — 없으면 미리보기가 전량 503 이다}
      # ai-service 중계(계보 제안 · 자연어 검색). **주소가 없어도 뜬다** — 그쪽이
      # 0건 + degraded 를 만들어 낸다. AI 없이도 v2 는 완결된 제품이다 (CLAUDE.md §3).
      # 같은 compose 안에 실물이 있으므로 기본값으로 그것을 가리킨다.
      COLAB_CORE_AI_BASE_URL: ${COLAB_CORE_AI_BASE_URL:-http://ai-service:8200}
      # ⭑ 심어 둔 계정 표 (`P-17` · `kernel/auth.py`). **이것이 없으면 표가 비고
      # 인증이 필요한 모든 op 이 401 이다** — 헬스만 200 인 채로 제품 전체가 잠긴다.
      COLAB_CORE_SUBJECTS_FILE: /etc/colab/subjects.json
      # ⭑ 세션 서명 비밀값 (`〈107〉-㉯`). **없으면 로그인이 서지 않는다** —
      # `kernel/authn.py::build` 가 서명자를 만들지 못하고 `POST /sessions` 가 500 이다.
      # 서명 없는 세션은 아무나 위조할 수 있으므로 기본값을 코드에도 여기에도 두지 않는다.
      COLAB_CORE_SESSION_SECRET: ${COLAB_CORE_SESSION_SECRET:?COLAB_CORE_SESSION_SECRET 이 필요하다 — 없으면 로그인이 서지 않는다}
      # ⭑ 자격 파일 = 계정 이름 → 주체 ＋ **scrypt 해시** (`〈108〉-㉯`). 주체 표와 갈라 둔다.
      # 값이 없으면 비밀번호 어댑터가 서지 않고 접속 코드 경로만 남는다.
      # ⚠ **경로가 틀리면 기동이 실패한다** — `CredentialStore.from_file` 이 없는 파일을 빈 표로
      #    넘기지 않는다. 「비밀번호 로그인이 조용히 사라진 배포」를 만들지 않기 위해서다.
      COLAB_CORE_CREDENTIALS_FILE: /etc/colab/credentials.json
    volumes:
      - uploads:/var/lib/colab/uploads
      # ⭑ **이것은 비밀이다.** 표의 키 문자열이 곧 베어러 토큰이라, 레포 픽스처
      # (`tests/fixtures/subjects.json`)의 값을 그대로 올리면 **레포를 읽는 누구나
      # 공개 staging 에 인증된다.** 실제로 그렇게 배포된 적이 있다.
      # 그래서 실파일은 **0600 · 소유자 uid 10001**(컨테이너 유저)로 홈에 둔다.
      # 0600 에서 PermissionError 가 나면 답은 권한 완화가 아니라 **소유권 정렬**이다 —
      # 위 volume-init 이 named volume 에 하는 `chown 10001` 과 같은 일이다.
      # 레포에 절대경로를 적지 않으려고 경로를 env 로 받는다 (CLAUDE.md §3-8 · RESTART.md ②-1).
      - ${COLAB_STAGING_SUBJECTS_FILE:?COLAB_STAGING_SUBJECTS_FILE 이 필요하다}:/etc/colab/subjects.json:ro
      # ⭑ **이것도 비밀이다.** 값은 해시뿐이라 토큰 표만큼 직접적이지 않지만, 사전 추측의
      # 재료가 되므로 같은 규약을 쓴다 — `0600` · 소유자 uid `10001`(컨테이너 유저) · 홈 보관.
      # ⚠ **회전은 inode 를 바꾼다.** `ops/set-password.py` 는 임시 파일 → `rename` 으로 쓰는데
      #    파일 바인드 마운트는 **inode 에 붙는다** — 회전 뒤 컨테이너는 옛 파일을 계속 읽는다.
      #    그래서 회전 절차에 **core-api 재기동이 포함된다**(`〈93〉-㉰` 와 같은 성질).
      - ${COLAB_STAGING_CREDENTIALS_FILE:?COLAB_STAGING_CREDENTIALS_FILE 이 필요하다}:/etc/colab/credentials.json:ro
      # ⭑ **접속 문자열도 비밀이다** (`〈121〉-㉯`). 위 둘과 **같은 규약** — `0600` ·
      # 소유자 uid `10001`(컨테이너 유저) · 홈 보관 · 레포에 절대경로를 적지 않으려고 env 로 받는다.
      # ⚠ 회전은 **제자리 덮어쓰기** 후 컨테이너 재기동이다. 바인드 마운트는 inode 에 붙어서
      #   새 파일을 `mv` 하면 컨테이너가 옛 파일을 계속 읽는다(자격 파일과 같은 성질).
      - ${COLAB_STAGING_CORE_DB_URL_FILE:?COLAB_STAGING_CORE_DB_URL_FILE 이 필요하다}:/etc/colab/core-database.url:ro
    depends_on:
      # 볼륨 주인이 맞춰진 **뒤에** 뜬다 — 순서가 아니라 조건이다.
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ⭑ 더 이상 「빈 단위」가 아니다 (`〈73〉`).
  #    이 블록에 환경변수가 0건이라 워커가 **기동조차 못 했고**, 그래서 `upload.ready` 가
  #    영원히 false 였으며 FE 가 1초마다 무한 폴링했다. Ted 가 말한 「대기」의 실물이 이것이다 —
  #    가공 코드가 아니라 **가공을 기다리는 형태**였다.
  pipeline-worker:
    build:
      context: ../../services/pipeline-worker
    image: colab-v2/pipeline-worker:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    container_name: colab_v2_staging_pipeline_worker
    restart: unless-stopped
    environment:
      # 앱 롤로 붙는다 — core-api 와 같은 규칙이다(비소유자 · NOBYPASSRLS).
      # ⭑ **값이 아니라 경로다** (`〈121〉-㉯`) — core-api 와 같은 이유·같은 규약이다.
      COLAB_PIPELINE_DB_URL_FILE: /etc/colab/pipeline-db.url
      # ⭑ **`COLAB_WORKER_LAB_ID` 를 걸지 않는다** (Ted 판정 2026-08-26 ㈑ · `03-HANDOFF §4 #32`).
      #   이 값이 픽스처 연구실 하나를 가리키고 있어, 다른 연구실의 접수분이 **한 건도 감지되지
      #   않았다** — 실측이 그 연구실의 `d5_pipeline_event` 12건 전부 `published_at` NULL 이었다.
      #   워커는 이제 대상 연구실을 원장에서 읽고 **연구실마다 제 트랜잭션 · 제 스코프**로 돈다.
      #   한 번에 하나의 연구실 스코프만 갖는다 — 사고가 나도 범위가 그 한 바퀴다.
      #   면제는 새로 만들지 않았다: 접속 주체는 그대로 비소유자 · NOBYPASSRLS 인 `colab_app` 이고,
      #   스코프 없이 읽는 표는 RLS 대상이 아닌 `d1_lab`(테넌트 루트) 하나뿐이다.
      #   **값을 되걸면 그 연구실 하나로 다시 좁혀진다** — 좁히고 싶을 때만 건다.
      # **core-api 의 COLAB_CORE_UPLOAD_DIR 과 같은 자리여야 한다.** 바이트를 못 열면
      # 감지가 통째로 실패하고, 그 실패는 「형식 인식 실패」로 위장한다.
      COLAB_WORKER_UPLOAD_DIR: /var/lib/colab/uploads
      # ⭑ **stage 2 선언** (`PV-1` · 완료 정의 ⑴ 「사건 경유」). 이 두 줄이 **둘 다 없어서**
      #   워커가 stage 1 만 돌았고, `file.header-parsed`·`file.crs-normalized`·
      #   `preview.cog-built` 가 **한 건도 발행되지 않았다** — 그 침묵을 게이트
      #   `autometa-loss`(대조 대상 0건)가 red 로 받고 있었다(`RESTART §2-④-㉯` 실측).
      #   ⚠ **무언은 면제가 아니다**(`app/worker.py stage2_declaration`) — `on` 을 말해야 돈다.
      COLAB_WORKER_STAGE2: "on"
      # ⭑ **지도 타일이 놓이는 자리.** `on` 인데 이 값이 없으면 워커는 **뜨지 않는다** —
      #   자리를 모른 채 구우면 임시 자리에 떨어뜨리고 성공을 보고한다(`app/worker.py`).
      #   **viz-render 의 `COLAB_VIZ_PREVIEW_DIR` 과 같은 값이어야 한다** — 미리보기 루트는
      #   규약상 하나다(`contracts/storage/layout.json previewsRoot`). 굽는 쪽과 찾아 쓰는
      #   쪽이 갈리면 재사용이 영영 성립하지 않고, 그 실패는 에러가 아니라 「매번 다시
      #   굽는다」로 조용히 나온다 — 접수분 루트에서 한 번 일어난 그 무늬다(`§4 #20`).
      COLAB_WORKER_PREVIEW_DIR: /srv/viz-previews
      # ⭑ **⟨신설 2026-08-31 · 12차 동결 해제 · `PLAN-SoT §9 〈253〉` · Ted RULING ㉗⟩
      #   이벤트 버스 — D5 가 낸 「미리보기가 낡았다」 3종이 여기로 나간다**(`Y-1`).
      #   **viz-render 의 `COLAB_VIZ_TRIGGER_SPOOL` 과 같은 값이어야 한다** — 내는 쪽과
      #   받는 쪽이 다른 자리를 보면 트리거는 영영 안 닿고, 그 실패는 에러가 아니라
      #   「자동 무효화가 그냥 안 된다」로 조용히 나온다. 미리보기 루트에서 한 번 일어난
      #   그 무늬다(`§4 #20`·`#49`). 시험이 두 값을 대조한다.
      #   ⚠ **`d5_pipeline_event`(outbox)가 아니다** — outbox 는 D5 의 표이고 D7 이 읽으면
      #     불변규칙 1 위반이다. 이 자리에 놓이는 것은 **이미 발행된 것**뿐이다.
      #   ⚠ 값을 안 주면 워커는 뜨되 트리거를 버스로 내지 않는다(원장·표준출력에는 남는다).
      COLAB_WORKER_EVENT_SPOOL: /srv/viz-events
    volumes:
      - uploads:/var/lib/colab/uploads
      # 굽는 쪽은 **쓰기**다 — viz-render 쪽 `:ro` 와 다른 이유가 여기 있다.
      - previews:/srv/viz-previews
      # 버스는 **내는 쪽도 받는 쪽도 쓴다** — 받는 쪽이 집행을 마친 알림을 걷기 때문이다.
      - events:/srv/viz-events
      # ⭑ 접속 문자열 파일 — core-api 와 **같은 규약**(`0600` · uid `10001` · 홈 보관 · 경로는 env).
      - ${COLAB_STAGING_PIPELINE_DB_URL_FILE:?COLAB_STAGING_PIPELINE_DB_URL_FILE 이 필요하다}:/etc/colab/pipeline-db.url:ro
    depends_on:
      # 볼륨 주인이 맞춰진 **뒤에** 뜬다 — 순서가 아니라 조건이다.
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ⭑ 이 블록에 환경변수가 **0건**이었다. 헬스는 200 인데 **렌더 표면이 전량 503** 이고,
  #    그래서 「미리보기가 안 된다」가 「미리보기를 안 만들었다」로 오래 오독됐다
  #    (`〈70〉-㉰` · `〈74〉`). 셋 다 없으면 `config.py` 가 열어 두는 대신 503 을 낸다 —
  #    조용히 인증을 끄지 않는 설계라, **배선이 유일한 해법**이다.
  viz-render:
    build:
      context: ../../services/viz-render
    image: colab-v2/viz-render:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    container_name: colab_v2_staging_viz_render
    restart: unless-stopped
    environment:
      # core-api 가 `Authorization: Bearer` 로 실어 보내는 것과 **같은 문자열**.
      COLAB_VIZ_SERVICE_TOKEN: ${COLAB_VIZ_SERVICE_TOKEN:?COLAB_VIZ_SERVICE_TOKEN 이 필요하다}
      # 타일 URL 서명 비밀 (`〈68〉`). 코드에 기본값이 없다 — 있으면 모든 배포가 같은 비밀이다.
      COLAB_VIZ_TILE_SIGNING_SECRET: ${COLAB_VIZ_TILE_SIGNING_SECRET:?COLAB_VIZ_TILE_SIGNING_SECRET 이 필요하다}
      # ⭑ ⟨신설 2026-08-31 · `PLAN-SoT §9 〈241〉`⟩ **미리보기 갈래 스위치**(`〈240〉`-㉲).
      #   비면 「한 장」이다 — 정본 문면(`Policy_데이터셋_상세` v2.7 `§8`)이 기본값이고,
      #   **레포에 켜진 값을 박지 않는다.** 켜는 자리는 홈 env 한 곳뿐이다.
      #   ⚠ 이 줄이 없으면 홈 env 에 무엇을 적어도 컨테이너는 **영영 꺼짐**이었다 —
      #   `--env-file` 은 compose 의 `${...}` 치환에만 쓰이고 컨테이너 환경으로 흐르지 않는다.
      #   `#20`(접수분 루트) · `#49`(미리보기 자리)와 같은 무늬라 시험이 회귀를 진다
      #   (`services/viz-render/tests/test_tile_branch_deployment_declaration.py`).
      COLAB_VIZ_TILE_BRANCH: ${COLAB_VIZ_TILE_BRANCH:-}
      # ⭑ 바이트를 어디서 여는가 — **core-api·워커와 똑같은 저장소 루트**다.
      #   예전에는 여기에 `/uploads` 를 한 번 더 붙여 「한 층 아래」를 배포 설정이 손으로
      #   세고 있었다. 층은 맞췄지만 **격자 배치는 못 맞췄고**(`grid/` 를 만드는 코드가
      #   트리에 없었다) 그래서 지도형이 영영 안 떴다 — `03-HANDOFF §4 #20`.
      #   이제 층수도 `grid/` 도 `contracts/storage/layout.json` 한 곳이 정한다.
      COLAB_VIZ_SOURCE_ROOT: /var/lib/colab/uploads
      COLAB_VIZ_PREVIEW_DIR: /srv/viz-previews
      # ⭑ **⟨신설 2026-08-31 · `〈253〉`⟩ 받는 자리** — pipeline-worker 의
      #   `COLAB_WORKER_EVENT_SPOOL` 과 **같은 값**이다. 안 주면 `app.state.triggers` 가
      #   `None` 이고 트리거는 오지 않는다 — **자리를 지어내지 않는다**(`kernel/config.py`).
      #   사람이 부르는 경로(「미리보기 다시 만들기」)는 그 상태에서도 그대로 남는다.
      COLAB_VIZ_TRIGGER_SPOOL: /srv/viz-events
    volumes:
      # **읽기 전용이다.** 렌더는 접수한 바이트를 열 뿐 고치지 않는다.
      - uploads:/var/lib/colab/uploads:ro
      - previews:/srv/viz-previews
      # 버스만 쓰기다 — 집행을 마친 **알림**을 걷는다(산출물이 아니다 · `〈247〉`).
      - events:/srv/viz-events
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../../services/ai-service
    image: colab-v2/ai-service:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    container_name: colab_v2_staging_ai_service
    restart: unless-stopped
    # ModelPort 런타임 자격증명 (PLAN-SoT §9-㊷).
    # 소비자는 K3·K4 이고 아직 없다. 지금은 통로만 열어 둔다 —
    # `:-` 로 받는 이유는 키가 없어도 staging 이 떠야 하기 때문이다.
    # 필수(`:?`)로 걸면 K3 착수 전까지 배포 전체가 죽는다.
    environment:
      # ⭑ D9 사전 3종 + 개념 그래프(`db/ai` 체인). **이 값이 없으면 온톨로지가 통째로 비고**
      #   검색의 그래프 증강이 조용히 0건이 된다 — degraded 가 아니라 「없는 것」처럼 보인다.
      #   `colab_platform` 이 아니다: D10 은 D3 에 붙지 않는다 (2026-08-25 판정 ㈎ · `db-boundary`).
      # ⭑ **값이 아니라 경로다** (`〈121〉-㉯`) — core-api 와 같은 이유·같은 규약이다.
      COLAB_AI_DB_URL_FILE: /etc/colab/ai-db.url
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COLAB_MODEL_HELPER: ${COLAB_MODEL_HELPER:-gpt-5.6-luna}
      COLAB_MODEL_ORCHESTRATOR: ${COLAB_MODEL_ORCHESTRATOR:-gpt-5.6-terra}
      # 질의 해석 — 이번 릴리즈는 **낱말 그대로**다 (`PLAN-SoT §9 〈136〉` · 정본 결정 2-5).
      # **키를 빼서 끄지 않는다.** 키는 위에 그대로 실려 있고(다른 AI 경로가 쓴다) 이 값이
      # 해석만 끈다 — 「키를 못 넣은 것」과 「안 쓰기로 한 것」이 같은 상태로 보이면 안 된다.
      # Phase 2 에서 켤 자리다: 이 값을 `llm` 으로 두면 해석이 돌아온다.
      # ⚠ 기본값에 기대지 않고 **여기 명시한다** — 안 적으면 다음 배포가 기본값에 기댄다.
      COLAB_AI_QUERY_INTERPRETATION: ${COLAB_AI_QUERY_INTERPRETATION:-literal}
    volumes:
      # ⭑ 접속 문자열 파일 — core-api 와 **같은 규약**(`0600` · uid `10001` · 홈 보관 · 경로는 env).
      # ⚠ 이 값이 없으면 온톨로지가 통째로 빈다. 그래서 `:?` 로 요구한다 —
      #   「경로를 줬는데 못 읽는 것」은 「없다」가 아니라 **「배선이 틀렸다」**다.
      - ${COLAB_STAGING_AI_DB_URL_FILE:?COLAB_STAGING_AI_DB_URL_FILE 이 필요하다}:/etc/colab/ai-db.url:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8200/healthz',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../frontend
    image: colab-v2/frontend:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    container_name: colab_v2_staging_frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 일회성 러너. profile 뒤에 둔다 — `up -d` 가 마이그레이션을 몰래 돌리지 않는다.
  #    배포 절차가 명시적으로 부른다 (deploy.sh).
  migrate-platform:
    profiles: ["migrate"]
    build:
      context: ./migrator
    image: colab-v2/migrator:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    volumes:
      - ../../db/platform:/chain:ro
      # ⭑ 접속 문자열 파일 — core-api 와 **같은 규약**(`0600` · 홈 보관 · 경로는 env).
      #   ⚠ 이 자리는 **소유자 롤**이라 값이 가장 세다. 값을 환경변수에 박으면
      #   `docker inspect` 에 그대로 나온다(`〈121〉-㉯` 의 발단).
      - ${COLAB_STAGING_PLATFORM_OWNER_DB_URL_FILE:?COLAB_STAGING_PLATFORM_OWNER_DB_URL_FILE 이 필요하다}:/etc/colab/platform-owner-db.url:ro
    environment:
      # 마이그레이션은 **소유자 롤**로 돈다. 앱 롤에는 DDL 권한이 없다.
      # ⭑ **값이 아니라 경로다** (`〈121〉-㉯`). `db/platform/env.py` 가 이 이름을 읽는다.
      COLAB_PLATFORM_DB_URL_FILE: /etc/colab/platform-owner-db.url
    depends_on:
      postgres:
        condition: service_healthy

  migrate-ai:
    profiles: ["migrate"]
    build:
      context: ./migrator
    image: colab-v2/migrator:${COLAB_RELEASE_TAG:?COLAB_RELEASE_TAG 이 필요하다}
    volumes:
      - ../../db/ai:/chain:ro
      # ⭑ 접속 문자열 파일 — platform 러너와 같은 규약. **파일은 따로 둔다**:
      #   두 체인은 마이그레이션 체인이 갈라져 있고(`CLAUDE.md §3-3`) 붙는 DB 도 다르다.
      - ${COLAB_STAGING_AI_OWNER_DB_URL_FILE:?COLAB_STAGING_AI_OWNER_DB_URL_FILE 이 필요하다}:/etc/colab/ai-owner-db.url:ro
    environment:
      # ⭑ **값이 아니라 경로다** (`〈121〉-㉯`). `db/ai/env.py` 가 이 이름을 읽는다.
      COLAB_AI_DB_URL_FILE: /etc/colab/ai-owner-db.url
    depends_on:
      postgres:
        condition: service_healthy

# ── 접수한 바이트. **core-api 와 pipeline-worker 가 같은 자리를 본다.**
#    접수는 core-api 가 하고 여는 것은 워커다 — 둘이 다른 자리를 보면 워커의 감지가
#    「파일 없음」으로 죽고, 그 실패는 「형식 인식 실패」로 위장한다.
#    ⚠ named volume 을 쓴다 — postgres 와 달리 initdb 퍼미션 문제가 없고, 호스트 경로를
#    적으면 이 파일에 절대경로가 들어온다(`CLAUDE.md §3-8`).
volumes:
  uploads: {}
  # ⭑ **⟨신설 2026-08-31 · 12차 동결 해제 · `PLAN-SoT §9 〈253〉`⟩ 이벤트 버스.**
  # D5(pipeline-worker)가 낸 「미리보기가 낡았다」 3종이 놓이고 D7(viz-render)이 집는다.
  # **순수 named volume 으로 둔다** — `previews` 와 달리 게이트가 이 자리를 읽지 않는다
  # (검사 대상은 산출물이지 알림이 아니다). 호스트 바인드를 만들 이유가 없으면 만들지 않는다.
  # ⚠ 담기는 것은 **수명이 짧은 알림**이다 — 집행되면 사라진다. 백업 대상이 아니다.
  events: {}
  # 미리보기 3층 산출물. **정적 자산이다** — 렌더 작업으로 매번 만드는 물건이 아니라
  # 한 번 그려 두고 목록 썸네일도 같은 자리에서 서빙된다(`〈80〉-㉯ 2`).
  #
  # ⭑ **⟨개정 2026-08-31 · Ted 판정 `PLAN-SoT §9 〈235〉` · `03-HANDOFF §4 #49`⟩
  #   순수 named volume 에서 **호스트 경로에 바인드된 named volume** 으로 바꿨다.**
  #   ⚠ **이름은 그대로 `previews`(실물 `colab-v2-staging_previews`) 다** — 백업이 볼륨을
  #     **이름으로** 문다(`infra/staging/backup/volume-lib.sh volume_real_name`). 이름을 갈면
  #     백업 대상이 조용히 사라지고, 그 침묵은 `V6`(최소 건수)가 뒤늦게 잡는다. 갈지 않는다.
  #   **왜 바꾸나** — 순수 named volume 의 마운트 지점은 도커 root 아래라 **게이트를 돌리는
  #   사용자가 못 읽는다**(실측 = `docker volume inspect` 가 준 자리에 `Permission denied`).
  #   그래서 게이트 `preview-tile-slot` 이 「자리를 못 봐서 검사를 못 했다」로 red 였고,
  #   그것을 통과로 세는 것이 이 레포의 대표 실패다(`CLAUDE.md §4`). **자리는 보여야 검사된다.**
  #   ⚠ 값은 **홈의 0600 env 파일에만** 있다 — postgres 의 `COLAB_STAGING_PGDATA_DIR` 과
  #     같은 관행이고 같은 이유다(레포·문서에 절대경로를 적지 않는다 · `CLAUDE.md §3-8`).
  #   ⚠ **WSL ext4 쪽 경로여야 한다** — Windows 드라이브(9p/drvfs)에는 POSIX 퍼미션이 없어
  #     `volume-init` 의 `chown 10001` 이 먹지 않는다.
  #   ⚠ 볼륨 형태를 갈 때는 **기존 볼륨을 지우고 다시 만들어야** 도커가 새 선언을 읽는다 —
  #     안에 든 산출물을 먼저 새 자리로 옮긴다. 지우기 전 이관이 절차다.
  previews:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${COLAB_STAGING_PREVIEWS_DIR:?COLAB_STAGING_PREVIEWS_DIR 이 필요하다 — WSL ext4 쪽 호스트 경로여야 한다}
