# v2 staging 자리표시 오리진 — 라우팅 최소 형태
# PoC nginx.conf 는 "라우팅 모양"의 참조일 뿐이며, 애플리케이션 프록시 블록은 계승하지 않는다.
server {
    listen 80;
    server_name _;

    # 헬스체크 — 터널·오리진 생존 확인용. 200 고정.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # 자리표시 안내 페이지. 실제 v2 서비스가 붙기 전까지 모든 경로가 여기로 온다.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
