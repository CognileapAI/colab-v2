# CoLAB v2 staging — 자리표시 오리진 + 기존 Cloudflare 터널 커넥터
#
# 데이터 저장소(postgres·minio·redis)를 두지 않는다. 빈 오리진이다.
# 토큰은 레포 밖 env 파일에서 주입한다 (README 참조).
name: colab-v2-staging

services:
  # 서비스명을 nginx 로 둔다 — 기존 터널 ingress 규칙이 http://nginx:80 을 가리키기 때문.
  nginx:
    image: nginx:1.27-alpine
    container_name: colab_v2_staging_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    # 호스트 노출은 루프백으로 제한한다 (PoC 에서 0.0.0.0 노출이 문제였다).
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: colab_v2_staging_cloudflared
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 토큰을 커맨드가 아닌 환경변수로 준다 — 프로세스 목록 평문 노출 회피.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN 이 필요하다}
    command: ["tunnel", "--no-autoupdate", "run"]
