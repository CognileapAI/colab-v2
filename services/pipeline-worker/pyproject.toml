[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-pipeline-worker"
version = "0.1.0"
description = "CoLAB v2 pipeline-worker — D5 Ingestion & Pipeline"
requires-python = "==3.12.*"
# 버전 핀의 정본은 requirements.in(직접) · requirements.txt(닫힘)다.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "e2e: 실데이터 E2E — 원천 마운트가 필요하다",
  "dbint: 실 DB 통합 — COLAB_PIPELINE_DB_URL 이 필요하다",
  "stage2: stage2 대기 모듈(parse·hsr·cog·tiff_probe·renderable·pipeline)을 단언한다 — 배포 단위·완료 정의 밖, 시험은 CI 유지(〈71〉-㉰)",
]
