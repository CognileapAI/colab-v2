[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-core-api"
version = "1.1.0"
description = "CoLAB v2 core-api — D1·D2·D3·D4·D6·D8"
requires-python = "==3.12.*"
# 버전 핀의 정본은 requirements.in(직접) · requirements.txt(닫힘)다.
# 여기에 다시 적으면 두 곳이 갈라진다.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  # `S3` 완료 정의의 계보 조항을 **실파일**로 재는 케이스에 붙는다(`tests/test_e2e_s3_real.py`).
  # 표식을 등록해 두는 이유는 하나 — **마운트 없이 돌릴 때 명시적으로 빼기 위해서**다
  # (`-m "not e2e"`). 표식이 없으면 뺄 방법이 없어 조용히 skip 하고 싶어진다.
  "e2e: 실데이터 E2E — 원천 마운트(COLAB_REFERENCE_DATA)가 필요하다",
  "search_golden: 모델 호출 없는 검색 public API 골든 회귀",
  # 측정 전용 — 기록된 모델 해석을 참조 코퍼스에 재생한다. 게이트 선택자(`search_golden`·`not e2e`)에
  # 들어가지 않으며 환경변수 둘(COLAB_K4_PROBE_INTERP·_OUT)이 없으면 skip 이 아니라 error 다.
  "k4_probe: K4 질의 해석 프로브 — 기록된 해석의 검색 절반 재생(측정 · 판정 게이트 아님)",
  # 같은 계열의 측정 표식. 환경변수 `COLAB_K3_PROBE_OUT` 이 없으면 skip 이 아니라 error 다.
  # ⚠ 정답 파일의 ID 무결성 시험에는 **이 표식을 붙이지 않는다** — 그건 환경변수 없이도
  #   매 게이트에서 돌아야 한다(`tests/test_k3_candidate_recall.py` 머리말).
  "k3_probe: K3 계보 후보 포함률(J1) 프로브 — 모델 호출 0회(측정 · 판정 게이트 아님)",
]
