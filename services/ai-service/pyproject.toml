[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-ai-service"
version = "0.1.0"
description = "CoLAB v2 ai-service — D9 Ontology · D10 AI Services"
requires-python = "==3.12.*"
# 버전 핀의 정본은 requirements.in(직접) · requirements.txt(닫힘)다.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  # D9 사전 3종 DB(`db/ai` 체인 · `COLAB_AI_TEST_DICT_DB_URL`)가 필요한 케이스에 붙인다.
  # 표식을 등록해 두는 이유는 하나 — **DB 없이 돌릴 때 명시적으로 빼기 위해서**다
  # (`-m "not dictdb"`). 표식이 없으면 뺄 방법이 없어 조용히 skip 하고 싶어진다.
  # ⚠ 이 표식은 **skip 의 근거가 아니다.** `conftest.py` 는 URL 이 없으면 여전히 fail 을 낸다
  #   (`CLAUDE.md §4` — DB 를 못 붙인 것은 통과가 아니다). 표식은 「그 DB 가 있는 실행에서만
  #   고른다」는 선택자일 뿐이고, 고른 뒤에는 skip 없이 판정한다.
  "dictdb: D9 사전 DB 필요 — COLAB_AI_TEST_DICT_DB_URL 이 있어야 한다",
]
