<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CoLAB 디자인 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ecf2;color:#21272a;font:15px/1.5 system-ui,sans-serif}header{padding:20px 24px;background:#fff;border-bottom:1px solid #bfc6cc}h1{font-size:20px;margin:0 0 4px}p{margin:0;color:#565c63;font-size:14px}.controls{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;align-items:end}label{display:grid;gap:6px;font-size:13px;font-weight:600}select,button,a{font:inherit}select,button{min-height:40px;padding:8px 12px;border:1px solid #848c94;border-radius:8px;background:#fff;color:#21272a}button{cursor:pointer}a{color:#0b4eb6}main{padding:24px;display:flex;justify-content:center}iframe{display:block;border:1px solid #bfc6cc;background:#fff;width:100%;height:1000px;max-width:100%}:focus-visible{outline:2px solid #1369e9;outline-offset:3px}@media(max-width:640px){header{padding:16px}.controls{gap:12px}label{flex:1 1 40%}main{padding:12px}select{font-size:16px}iframe{height:900px}}
</style></head><body><header><h1>CoLAB 디자인 검토</h1><p>차분한 화면, 명확한 글자 위계, 작업에 맞는 여백. 예시 데이터이며 저장은 하지 않습니다.</p>
<div class="controls"><label>화면<select id="scene"><option value="catalog">데이터셋 목록</option><option value="lab">연구실 대시보드</option><option value="empty">빈 연구실</option><option value="project-dialog">새 프로젝트 입력</option></select></label><label>디자인<select id="design"><option value="calm">제안</option><option value="before">기존 복구 화면</option></select></label><label>테마<select id="theme"><option value="light">밝게</option><option value="dark">어둡게</option></select></label><label>화면 너비<select id="width"><option value="full">현재 창에 맞춤</option><option value="1440">데스크톱 1440</option><option value="768">태블릿 768</option><option value="375">모바일 375</option></select></label><button id="reset" type="button">화면 다시 열기</button><a id="direct" target="_blank" rel="noopener">화면만 새 창에서 보기</a></div><p id="notice" role="status"></p></header><main><iframe id="screen" title="CoLAB 대표 화면 미리보기"></iframe></main><script type="module" src="/design-preview.js"></script></body></html>
