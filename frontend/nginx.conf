# frontend 배포 단위 자신의 nginx — 정적 산출물만 낸다.
# 엣지 nginx(infra/staging)와 역할이 다르다: 저쪽은 5개 단위를 가르는 라우터고, 여기는 이 단위의 서버다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # liveness — 배포 배관. SPA fallback 보다 먼저 와야 index.html 이 200 을 대신 내지 않는다.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"unit":"frontend","status":"alive","implemented":true}';
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;   # 클라이언트 라우팅 (react-router)
    }
}
